# The vanilla install the chart README gives, exactly: one person, from their own computer, over
# `kubectl port-forward`, with XiongBao's bundled database.
#
# The README has the person write the model key into a file of their own that is kept and never
# committed; this is a placeholder in its place. Nothing else is theirs to make: the chart generates
# the key encryption key, the computer token and the database password, and keeps them across
# upgrades.
config:
  singleUser: true
  # The bundled database connects the API as its superuser, which row-level security does not bind,
  # and the chart refuses that unless it is said (the README's install passes the same entry).
  extraEnv:
    - name: XIONGBAO_RLS_ENFORCE
      value: warn
postgresql:
  enabled: true
secrets:
  modelApiKey: "example-for-rendering-only"
  # CI passes a keyEncryptionKey for every target, which also renders the path where one is given;
  # tests/chart-vanilla-secrets.test.ts renders this file without one.
