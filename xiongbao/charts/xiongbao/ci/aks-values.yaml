# AKS. Azure Database, workload identity, Key Vault through external-secrets.
config:
  initialAdminEmails: admin@example.com
  auth:
    google:
      clientId: example.apps.googleusercontent.com
  publicUrl: https://xiongbao.example.com
postgresql:
  enabled: false
database:
  existingSecret: xiongbao-database
serviceAccount:
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
server:
  podLabels:
    azure.workload.identity/use: "true"
externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-key-vault
  data:
    - secretKey: key-encryption-key
      remoteRef:
        key: xiongbao-key-encryption-key
    # Sessions are signed with this. The server refuses to start when sign-in is configured and it
    # is missing, so every provider store has to carry it.
    - secretKey: better-auth-secret
      remoteRef:
        key: xiongbao-better-auth-secret
    - secretKey: google-client-secret
      remoteRef:
        key: xiongbao/google-client-secret
    - secretKey: computer-token
      remoteRef:
        key: xiongbao/computer-token
ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  hosts:
    - host: xiongbao.example.com
      paths:
        - path: /
          pathType: Prefix

computers:
  mode: shared
