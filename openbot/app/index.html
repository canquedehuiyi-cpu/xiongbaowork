<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熊宝数字员工 · xiongbao work</title>
    <link rel="icon" type="image/png" href="/src/assets/brand/xiongbao-logo-64.png" />
    <link rel="apple-touch-icon" href="/src/assets/brand/xiongbao-logo-256.png" />
    <meta name="theme-color" content="#1c1410" />
    <!-- Sets the theme before the first paint. Must stay inline and classic: `defer` or `type="module"` runs too late. -->
    <script>
      // localStorage throws in some privacy modes; a theme is not worth taking the app down for.
      try {
        // Same fallback as `readMigrated` (lib/storage-migrate.ts), duplicated because nothing can be imported here.
        const read = (key, legacy) => {
          const now = window.localStorage.getItem(key);
          if (now !== null) return now;
          const old = window.localStorage.getItem(legacy);
          if (old === null) return null;
          try {
            window.localStorage.setItem(key, old);
            window.localStorage.removeItem(legacy);
          } catch {}
          return old;
        };
        const dark = read("xiongbao-theme", "openbot-theme") === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        const skin = read("xiongbao-skin", "openbot-skin");
        // The default skin sets no attribute, under its new name and under the one the cache may still hold.
        if (skin && skin !== "xiongbao" && skin !== "openbot") document.documentElement.dataset.skin = skin;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
