[test]
# The same declaration as the bunfig.toml at the repository root, with the paths written relative to
# this directory -- the twin of app/bunfig.toml and server/bunfig.toml.
#
# Bun reads bunfig.toml from the current working directory and nowhere else, so the root one applies
# to `bun test extension/tests` run from the root and not to `bun test` run from here, which is how CI
# runs this package. Without this file nothing evaluates Base UI while a DOM exists (see
# app/tests/preload.ts): its layout effect is fixed as a no-op, every Dialog in the options, popup and
# connect pages mounts nothing, and each test that opens one fails at testing-library's one-second
# timeout, while passing from the root.
#
# tests/bunfig-preload.test.ts fails if this list stops agreeing with the root one.
preload = ["../server/scripts/test-preload.ts", "../app/tests/preload.ts"]
