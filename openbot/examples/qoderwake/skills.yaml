# 官方技能目录。`tools:` 是技能的第二用途，也是这个文件存在的理由：一个员工工具很多时，每轮只会被
# 端出"与这句话匹配的技能所声明的那些工具"——模型在十个里挑得准，在三十个里挑不准。
#
# 这里命名工具不给任何人权限：能调什么仍由该员工的 grants 决定，两端取交集。所以本文件可以写这个部署
# 还没接的连接器，而且应该写——那样人一接上就立刻能用。
skills:
  - slug: assign-work
    title: 派活
    summary: 把一句需求整理成可执行任务，交给指定员工并在看板上跟到底。
    instructions: >-
      先把需求写成一条可验收的任务（做什么、怎样算完成、什么时候要），再决定是自己做还是交给某个员工。
      交出去时说明交给了谁、为什么是他；自己不确定该谁做时先问一句，而不是猜一个。
    tools: []
  - slug: review-diff
    title: 代码审阅
    summary: 对当前差异做标准轴与规格轴两份独立判断。
    instructions: >-
      分两轴看同一份差异：规范轴（命名、结构、重复、可读性）与规格轴（是否真的实现了被要求的事）。
      两条结论不要互相稀释。每个问题给出文件与行，以及可以直接照着改的建议。
    tools: []
  - slug: run-on-my-machine
    title: 在我电脑上跑
    summary: 需要在租户自己的机器上执行的动作，走设备通道而不是服务端容器。
    instructions: >-
      需要读写本地文件、跑本地命令或打开本地浏览器时，用设备动作：机器不在时任务会被排队，
      它上线后按序续跑。不要为了立刻有结果而悄悄换到服务端环境执行——那是另一个人的机器。
    tools: []
  - slug: bot-creator
    title: 造员工
    summary: 在对话里通过访谈造出一个新员工：角色、边界、要用的技能。
    instructions: >-
      先用 mcp__staffing__list_staff 看一眼现有的员工、群和能用的技能，别招重复的人。
      一次问一个问题，把模糊的说法逼成能验收的边界：这个员工负责什么、明确不负责什么、越界时怎么回答。
      员工靠 roleDescription 和 persona 干活，所以把它的做事方式、语气和边界写进这两处，别只写一个头衔。
      写好后用 mcp__staffing__propose_employee 起草（改已有的员工用 propose_employee_change）；
      要组群就用 mcp__staffing__propose_group（改已有的群用 propose_group_change）。
      这些工具只出一张卡片：用户在卡片上点确认之前什么也没有建，所以不要说已经建好了，
      要说"已经起草好，等你在卡片上确认"。想知道结果可以用 mcp__staffing__proposal_status 查。
      不要替用户发明他没有说过的职责。
    tools:
      - staffing/list_staff
      - staffing/propose_employee
      - staffing/propose_employee_change
      - staffing/propose_group
      - staffing/propose_group_change
      - staffing/proposal_status
  - slug: skill-creator
    title: 造技能
    summary: 把一套反复要说的话固化成一个可 / 调用的技能。
    instructions: >-
      先弄清用户重复在做的那件事的固定步骤，再写成技能：什么时候用、按什么顺序做、什么算做完了。
      技能只能要求已授权的工具，声明里没有的工具不会因此获得权限。
    tools: []

  # 以下条目来自技能市场候选。文件类技能依赖本机 Python 库时，一律在主人配对的电脑上用 computer_run_command
  # 执行；缺库先问用户，不自行安装。`computer_*` 是内置电脑工具而不是连接器工具，不符合 serverId/toolName 形状，
  # 所以这些条目的 tools 留空；配合 MCP 的几条待接入后补。
  - slug: work-report
    title: 写周报日报
    summary: 把零散的工作记录整理成结构清楚、能直接发出去的日报或周报。
    instructions: >-
      用在用户要写日报、周报、月报或阶段汇报时。先问清三件事：汇报给谁（老板、团队还是客户）、周期是哪段、
      有没有固定模板；有模板就严格照模板。素材优先用用户贴来的记录、聊天或文件，不够时再问，不要编造数据和进展。
      按"完成了什么（尽量带结果和数字）、进行中的、遇到的问题与需要的支持、下周或明日计划"组织，每条一句话说清，
      先写结论再写过程。写完列出你不确定的地方（例如某项是否已完成），请用户确认后再定稿。
    tools: []

  - slug: meeting-minutes
    title: 会议纪要
    summary: 把会议录音转写、聊天记录或笔记整理成有结论、有待办的纪要。
    instructions: >-
      用在用户给出会议转写、笔记或口述，要出纪要时。先确认会议主题、时间、参会人；材料缺这些就问。
      输出固定结构：会议概要（一两句）、讨论要点、已形成的决议、待办事项（每条写清负责人、做什么、截止时间）、
      遗留问题。区分"大家说了"和"最终定了"，没有明确结论的不要写成决议。负责人或时间原文没有时标"待确认"，
      不要猜。做完的标准：任何没参会的人只看纪要就知道定了什么、谁要做什么。如果用户要把待办派给员工，再用派活流程跟进。
    tools: []

  - slug: email-draft
    title: 邮件起草
    summary: 按收件人和目的起草、改写工作邮件，语气得体、事项明确。
    instructions: >-
      用在用户要写、回复或改写邮件时。先确认：发给谁（上级、客户、同事、外部伙伴）、这封邮件要对方做什么、
      有没有截止时间、希望的语气（正式、客气、简短）。回复邮件时先读清原邮件再写，别答非所问。结构：
      主题行（能看出事由和动作）、称呼、一句话说明来意、正文要点、明确的请求与时间、结尾。篇幅宁短勿长。
      一次给一个版本，必要时再给一个更简短或更正式的备选。涉及金额、日期、承诺的地方单独提醒用户核对。
      本技能只起草，不代为发送；用户明确要求并有发送能力时，发送前先让他看过最终稿。
    tools: []

  - slug: spreadsheet-cleanup
    title: 表格整理与清洗
    summary: 清洗杂乱的 Excel 或 CSV：去重、统一格式、补全缺失、拆合列，并留下可核对的修改记录。
    instructions: >-
      用在用户给了一份凌乱的表格，要整理、去重、统一格式、拆分或合并列时。先读文件并说出你看到的问题清单
      （重复行、空值、日期与数字格式不一、同一内容多种写法、合并单元格、多余表头），让用户确认要处理哪些。
      需要批量处理时，在主人的电脑上用 computer_run_command 运行 Python（pandas、openpyxl），先在副本上操作，
      永远不覆盖原文件。每个改动规则都要可解释，例如"把 2024/1/5 与 2024-01-05 统一为 2024-01-05"。
      做完的标准：输出新文件路径，并给出改动统计（共多少行、删了多少重复、改了多少格式、仍有哪些行无法判断需人工看）。
      遇到不确定的值（例如两条很像但不完全相同的记录）列出来问用户，不要擅自合并。
    tools: []

  - slug: contract-key-points
    title: 合同要点提取
    summary: 从合同文本里提取主体、金额、期限、权责与风险条款，供业务人员快速过一遍。
    instructions: >-
      用在用户给出合同或协议，想快速了解关键内容时。逐项提取并标注出处条款号：合同双方、标的、金额与付款节点、
      履行期限、交付与验收、违约责任、解除与终止、保密与知识产权、争议解决与管辖、自动续约与通知期。
      另列"需要留意的条款"：单方权利过大、责任上限缺失、付款条件模糊、期限或金额前后不一致、条款缺失。
      每个结论必须能在原文找到，找不到就写"合同中未见"，不要推断。结尾固定声明：这是要点整理，不构成法律意见，
      重大合同请法务或律师审核。文件很长时先问用户最关心哪几类条款。
    tools: []

  - slug: competitor-research
    title: 竞品调研
    summary: 围绕指定产品做竞品对比，给出带来源的对比表和结论。
    instructions: >-
      用在用户要了解竞争对手或对比同类产品时。先问清：我们的产品或需求是什么、要比哪几家（没指定就先列 3 到 5 家候选
      请用户选）、关心哪些维度（价格、功能、目标客户、渠道、口碑）。资料只用公开可查的来源，每条关键信息记下来源链接
      和查看日期，查不到就写"未查到"，不要补全。输出：对比表（行为维度，列为产品）、各家一句话定位、
      对我们的启示与建议、信息缺口。区分事实（官网写明的）与判断（你的推断）。做完的标准：用户能拿表直接开会讨论，
      每个数据都能点开来源验证。
    tools: []

  - slug: doc-polish
    title: 文档润色与改写
    summary: 在不改变原意的前提下润色、精简或按指定语气改写文字。
    instructions: >-
      用在用户给出一段或一篇文字，要润色、缩写、扩写、换语气（正式、口语、营销、汇报）时。先确认用途、读者、
      目标篇幅和语气；没说就先按"保持原意、更通顺简洁"处理并说明。不改动事实、数字、人名、专有名词和引用。
      输出改后全文，并用简短列表说明主要改动（改了什么、为什么），让用户能挑着采纳。原文里有逻辑漏洞或事实存疑之处，
      单独提示而不是悄悄改掉。处理本地文件时，另存为新文件，不覆盖原件。
    tools: []

  - slug: ppt-outline
    title: PPT 大纲
    summary: 根据主题、听众和时长，设计演示文稿的页面结构与每页要点。
    instructions: >-
      用在用户要做汇报、培训、路演或方案演示，需要先有大纲时。先问：听众是谁、场合与时长、想让听众听完做什么、
      手头有哪些材料。给出的大纲按页列：页标题（用结论句而不是名词）、该页 2 到 4 个要点、建议的呈现形式
      （图表、对比、流程图）、需要的数据或素材。页数与时长匹配，大致每页一到两分钟。结构上先结论或目标，
      再论据，最后行动与下一步。把需要用户补充的数据单独列在末尾。用户要真正生成 .pptx 文件时，
      走"生成 PPT 文件"的技能，在主人电脑上执行。
    tools: []

  - slug: data-analysis-report
    title: 数据分析报告
    summary: 对一份数据做描述、对比与归因，写成有结论的分析报告。
    instructions: >-
      用在用户给了数据（表格、导出文件）并要分析时。先问清要回答的业务问题；没有问题就先建议两三个。
      步骤：先看数据质量（行数、缺失、异常值）并告诉用户；再做描述统计、分组对比、趋势；找到差异后试着给出归因，
      并说明哪些是数据支持的、哪些只是猜测。需要计算时在主人电脑上用 computer_run_command 运行 Python，
      把用到的口径和关键数字原样写进报告，保证可复核。报告结构：结论摘要、关键发现（每条带数字）、依据与口径、
      局限与建议下一步。样本太小或口径不明时直接说"不足以下结论"，不要硬凑。
    tools: []

  - slug: translate-proofread
    title: 翻译与校对
    summary: 中英等语言互译，并校对错别字、语病与术语一致性。
    instructions: >-
      用在用户要翻译文字，或检查一份文字有没有错别字、语病、标点和术语不一致时。翻译前确认用途与读者
      （合同、对外宣传、技术文档、日常沟通）和术语表；有专有名词先问是否有固定译法。忠实为先，再求通顺，
      数字、单位、人名、日期原样核对。校对时只列出问题和建议改法，标明位置，不直接大改；用户同意后再出修订稿。
      遇到歧义句给两种理解并问用户原意。输出里把"拿不准"的词句单独标出来。
    tools: []

  - slug: doc-coauthor
    title: 协作写长文档
    summary: 通过提问、大纲、逐节起草到通读，带用户把一篇长文档写完。
    instructions: >-
      用在用户要写方案、报告、制度、说明书等较长文档，而自己还没想清楚时。分三步：一、问清背景，
      包括读者、目的、篇幅、必须包含的内容、已有材料，一次问一两个问题；二、先给大纲请用户确认，
      再一节一节写，每节写完让用户看，改好再进下一节；三、全文写完后通读，检查前后矛盾、重复、空话，
      并站在第一次读的人角度列出读者可能会问的问题，看文中是否已回答。不要一口气写完全文再给用户。
      做完的标准：用户确认每一节，且通读发现的问题都已处理。
    tools: []

  # 思路参考 anthropics/skills（Apache-2.0）
  - slug: xlsx-formulas
    title: 生成与修改 Excel
    summary: 在主人电脑上用 Python 创建或修改 .xlsx，保留公式并检查公式错误。
    instructions: >-
      用在用户要新建、修改带公式或格式的 Excel 文件时。在主人电脑上用 computer_run_command 运行 Python：
      openpyxl 负责公式与格式，pandas 负责批量数据。先确认电脑上装了这些库，缺了就告诉用户并问是否安装，
      不要自行乱装。关键规则：写进单元格的应当是公式而不是算好的数值，这样表会随输入变化；假设与参数放在单独带标签的单元格里，
      公式引用它们，不在公式里写死数字。用 data_only 方式加载再保存会把公式永久变成数值，所以改文件前先备份副本。
      合并单元格只能写左上角；带宏的文件保存时要保留宏。交付前如果电脑上有 LibreOffice，重新计算一次并检查有没有 #REF!、
      #DIV/0! 等错误；没有就明说无法重算，请用户用 Excel 打开核对。XLOOKUP、FILTER 等新函数在 LibreOffice 里可能算不出，
      改用兼容写法或在 Python 里处理。做完给出文件路径和你核对了哪些数。
    tools: []

  # 思路参考 anthropics/skills（Apache-2.0）
  - slug: docx-edit
    title: 生成与修改 Word
    summary: 在主人电脑上读取、生成或修改 .docx，改已有文档时保留原格式。
    instructions: >-
      用在用户要新建 Word 文档，或修改、提取已有 .docx 内容时。在主人电脑上用 computer_run_command 运行 Python
      （python-docx 等）；先确认库是否可用。改已有文档要先备份，只改用户指定的部分，保留原有样式、页眉页脚和编号。
      新建文档时先和用户确认标题层级、字体字号与页边距等版式要求，没有要求就用简洁常规版式。需要修订痕迹或批注时，
      先说明这类需求用 python-docx 不一定做得到，问用户是否改用手动方式。做完用提取文字或转成 PDF 的方式查看结果，
      确认没有乱码、缺段，再交付并告知文件路径。
    tools: []

  # 思路参考 anthropics/skills（Apache-2.0）
  - slug: pdf-extract-fill
    title: 处理 PDF
    summary: 提取 PDF 文字与表格、合并拆分、填写表单；扫描件先做文字识别。
    instructions: >-
      用在用户要从 PDF 取文字或表格、合并或拆分页面、旋转、加水印、填表单时。先判断 PDF 是文字型还是扫描件：
      能选中文字的直接提取，扫描件需要文字识别（OCR），电脑上没有相关工具就告诉用户，不要硬编。
      在主人电脑上用 computer_run_command 运行 Python（pypdf、pdfplumber 等）；原文件不动，结果另存新文件。
      提取表格后要抽查几行与原 PDF 对照；填表单前先列出所有字段名与当前值，请用户确认要填的内容，
      填完再核对一遍。涉及加密文件，没有用户给的密码不要尝试破解。做完给出输出文件路径与处理了哪些页。
    tools: []

  # 思路参考 anthropics/skills（Apache-2.0）
  - slug: pptx-build
    title: 生成 PPT 文件
    summary: 在主人电脑上按大纲用 Python 生成 .pptx，或读取和修改已有演示文稿。
    instructions: >-
      用在用户要真正得到 .pptx 文件，或要读取、修改已有演示文稿时。必须先有确认过的大纲（没有就先用 PPT 大纲技能）。
      在主人电脑上用 computer_run_command 运行 Python（python-pptx 等）；先确认库可用。有模板就基于模板生成，
      沿用其版式与配色；没有模板就用简洁统一的版式：每页一个标题、不超过 5 条要点、字号足够大。
      改已有文件前先备份。生成后抽取每页文字检查有没有溢出、缺页，能转成图片或 PDF 时抽看几页版面。
      图表优先用原生图表对象而不是贴截图，方便用户后续修改。做完给出文件路径和页数。
    tools: []

  # 思路参考 anthropics/skills（Apache-2.0）
  - slug: internal-comms-3p
    title: 内部沟通稿
    summary: 按固定格式写进展汇报、领导层更新、全员通讯、FAQ 与事故复盘。
    instructions: >-
      用在用户要写团队内部的沟通材料时。先判断类型：3P 更新（进展、计划、问题）、领导层更新、项目更新、全员通讯、
      常见问题解答、事故报告。再向用户索取该类型的必要信息：对象、周期、关键事实与数字。3P 更新每部分各写 3 到 5 条，
      一条一句，先结论后补充。事故报告写清影响范围、时间线、根因、已采取措施、后续改进，不指责个人。
      用户公司有固定格式就以它为准。不确定的事实标"待确认"，不要补全。
    tools: []

  # 待 MCP 实测拿到工具名后补 tools
  - slug: amap-guide
    title: 用好高德地图
    summary: 查路线、找周边、看天气，并把结果整理成可直接用的出行建议。
    instructions: >-
      用在用户问怎么去、多久到、附近有什么、某地天气如何时。先把口语地点变成明确位置：同名地点多时，
      列出候选请用户选，不要默认第一个。问路线要确认出发地、目的地、出行方式（驾车、公交、步行、骑行）
      和出发时间；有时间要求就倒推出发时刻。周边搜索要问清中心点、半径和类型，结果只列最相关的 3 到 5 个，
      写明距离、名称和关键信息。天气只报用户要去的日期与地点，并提示是否需要带伞等。路况与营业信息可能变化，
      回答时说明数据查询时间。查不到时直接说明，不要编造路线或地址。
    tools: []

