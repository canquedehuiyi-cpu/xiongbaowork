  # 用浏览器搜索：computer_navigate、computer_read 是内置电脑工具，不是 serverId/toolName 形状，
  # 填进 tools 加载会报错（见上方「以下条目来自技能市场候选」那段说明），所以 tools 留空。
  - slug: web-search-guide
    title: 用好网页搜索
    summary: 用浏览器搜百度（必应备选），交叉核对来源，给出标明出处的结论。
    instructions: >-
      用在用户问最新信息、需要核实事实或查资料时。先把问题拆成可搜的关键词，必要时中英文各搜一次。
      搜索方法：用浏览器打开百度搜索地址 https://www.baidu.com/s?wd=关键词（关键词做 URL 编码）；
      百度打不开或结果不好时，改用必应 https://cn.bing.com/search?q=关键词。中文问题优先用百度。
      先读结果页，再打开 1 到 3 个来源页核对，不要只凭结果摘要回答。只搜公开信息，关键词只放问题需要的几个词，
      不要把对话全文、私人文件内容当关键词发出去。遇到验证码或登录墙，不要绕过，先换另一个搜索引擎再试一次；
      仍被拦，就按电脑工具的规则调用 computer_request_help 请用户接管，不要让用户把密码或验证码发给你。这个方法只用于公开网页，已连接的系统用它们自己的工具。
      优先官方网站、原始文件和权威媒体；重要结论至少用两个独立来源交叉核对。回答时先给结论，再列来源链接与日期，
      分开写"来源明确写了的"和"你的推断"。来源互相矛盾时如实说明，不要挑一个顺眼的。搜不到可靠信息就说搜不到，
      不要编造。涉及价格、政策、时间等易变信息，写明查询日期，提醒用户必要时再核对。
    tools: []
