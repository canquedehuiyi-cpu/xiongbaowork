# 官方技能目录。`tools:` 是技能的第二用途，也是这个文件存在的理由：一个员工工具很多时，每轮只会被
# 端出"与这句话匹配的技能所声明的那些工具"——模型在十个里挑得准，在三十个里挑不准。
#
# 这里命名工具不给任何人权限：能调什么仍由该员工的 grants 决定，两端取交集。所以本文件可以写这个部署
# 还没接的连接器，而且应该写——那样人一接上就立刻能用。
skills:
  - slug: assign-work
    title: 派活
    summary: 把一句需求整理成可执行任务，交给指定员工并在看板上跟到底。
    instructions: >-
      先把需求写成一条可验收的任务（做什么、怎样算完成、什么时候要），再决定是自己做还是交给某个员工。
      交出去时说明交给了谁、为什么是他；自己不确定该谁做时先问一句，而不是猜一个。
    tools: []
  - slug: review-diff
    title: 代码审阅
    summary: 对当前差异做标准轴与规格轴两份独立判断。
    instructions: >-
      分两轴看同一份差异：规范轴（命名、结构、重复、可读性）与规格轴（是否真的实现了被要求的事）。
      两条结论不要互相稀释。每个问题给出文件与行，以及可以直接照着改的建议。
    tools: []
  - slug: run-on-my-machine
    title: 在我电脑上跑
    summary: 需要在租户自己的机器上执行的动作，走设备通道而不是服务端容器。
    instructions: >-
      需要读写本地文件、跑本地命令或打开本地浏览器时，用设备动作：机器不在时任务会被排队，
      它上线后按序续跑。不要为了立刻有结果而悄悄换到服务端环境执行——那是另一个人的机器。
    tools: []
  - slug: bot-creator
    title: 造员工
    summary: 在对话里通过访谈造出一个新员工：角色、边界、要用的技能。
    instructions: >-
      一次问一个问题，把模糊的说法逼成能验收的边界：这个员工负责什么、明确不负责什么、越界时怎么回答。
      写完先复述给用户确认，再落库；不要替用户发明他没有说过的职责。
    tools: []
  - slug: skill-creator
    title: 造技能
    summary: 把一套反复要说的话固化成一个可 / 调用的技能。
    instructions: >-
      先弄清用户重复在做的那件事的固定步骤，再写成技能：什么时候用、按什么顺序做、什么算做完了。
      技能只能要求已授权的工具，声明里没有的工具不会因此获得权限。
    tools: []
