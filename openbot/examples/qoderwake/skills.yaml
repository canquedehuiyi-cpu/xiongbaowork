    summary: 写代码前先查所用库的最新官方文档，避免用过时的接口。
    instructions: >-
      用在用户让你用某个库或框架写代码、排查报错、问用法，且版本可能较新或接口常变时。先确认库名与版本，
      再去查对应版本的最新文档，不要凭记忆写接口。引用文档里的写法时，说明对应的版本；文档与用户现有代码冲突，
      以用户实际安装的版本为准并告知差异。只取与问题相关的部分，不整篇搬运。查不到就明说，并说明你的回答是基于记忆、可能过时。
