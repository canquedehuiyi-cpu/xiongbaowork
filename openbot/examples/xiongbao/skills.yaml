  - slug: hash-bound-review-loop
    title: hash-bound-review-loop
    summary: 在 Windows/PowerShell 环境下对「单组件改动」执行哈希绑定的多轮独立审查循环（实现→独立规格审查+独立质量审查→修正→重生成证据→复审），含证据树约定、新鲜度自查、变异测试与真实可复现的验证命令。当需要按「实施者不得自审…
    instructions: |-
      # 哈希绑定独立审查循环
    
      适用：一个组件只许改自己独占的文件，且每次「修正后」都必须由**与他人无关**的审查者重新出具结论。核心是**每次审查都绑定一组 sha256**，任何一次编辑都会使上一轮结论作废。
    
      ## 铁律
    
      1. **实施者不得自审**。规格审查与质量审查必须是**两个不同的**独立执行者，各自只写自己的 `reviews/<kind>-NN/` 目录。
      2. **改写就作废**。审查前冻结字节（sha256 + `git hash-object` blob），把这两个值写进给审查者的任务里，要求其自行复算。
      3. **不复述工具输出**。任何数字（diff、计数、时间）必须在**产出该字节的那个 worktree 里真跑该工具**。曾因把旧记录里的 `git --shortstat` 数字照抄，被审查判为 blocker。
      4. **每轮自查证据新鲜度**。把本轮的原始产物与**上一轮**同名文件比 sha256/字节；若逐字节相同，说明你只是复制了旧产物，headline 数字没有本轮凭据。逐文件产出一张对照表（见下节），**相同哈希必须给出「为何该内容必然相同」的理由**，否则一律当发现项处理。
      5. **不许用「假测试」宣布修好**。若某分支在生产里不可达，就**删掉它或如实记为不可达**，绝不用替身注入的测试宣称已覆盖——那是最严重的假自信。
      6. **失败证据一律保留**。旧轮次记录、`REQUEST_CHANGES`、陈旧产物都原样归档，另写 README 说明缺陷，不删除、不粉饰。
      7. **重生成前先归档**。启动新一轮之前，先把要覆盖的目标工件拷进 `round-NN/`（或删掉）。否则一次**被杀掉**的运行不会写任何东西，工件路径上会**原样留着上一轮的文件**，看上去完全有效——这是第 4 条那条「陈旧证据」缺陷的另一种形态，且更隐蔽。**缺失必须是响亮的**。
      8. **上一轮的产物字节要留档**。`source/apps-api/` 会被本轮覆盖，而「格式基线证明」需要上一轮的字节才能复算。每一轮都把当时的产物拷进 `round-NN/source/apps-api/`。
    
      ## 证据树约定
    
      ```
      <evidence-root>/
        .gitattributes            # ** -text   （避免 CRLF 污染哈希）
        contracts/                # 权威契约的副本，须与仓库副本逐字节一致
        source/apps-api/          # 产物副本，须与活文件逐字节一致（审查者的恢复源）
        implementation-evidence/
          commands.txt            # 每条命令 + 实际观测结果（含失败与事故）
          delivery.json           # 机器可读：状态/哈希/本轮修正清单/审查历史/未验证项
          delivery.md             # 人读版
          product-hashes.txt      # sha256 + 字节 + 行数 + blob + numstat + 统计口径
          focused.junit.xml / .log
          scoped-regression.junit.xml / .log
          ruff-check.log / ruff-format-check.log / ruff-format-diff.log
          format-baseline-proof.log
          git-diff-check.log
          source-integrity.log
          round-05-vs-round-04-freshness.txt   # 逐工件对照上一轮孪生哈希
          implementer-mutation-NN.log / .py    # 实现者侧变异证据与夹具
          round-01/ round-02/ ...  # 每轮原始产物归档（append-only 的修正史）
                                  # 含 round-NN/source/apps-api/（当轮产物字节）
                                  # 含 round-NN/README.txt（如实写明该轮归档的缺陷）
        reviews/
          spec-review-01/ code-quality-01/ spec-review-02/ ...
            review.json  review.md  （+ 变异 JUnit、原始日志、integrity.log）
      ```
    
      `source/apps-api/` 在**证据树根**，不在 `implementation-evidence/` 下——放错位置会让完整性检查静默报 0 字节。
    
      ## 一次循环的操作顺序
    
      1. **冻结**：算出两个产物的 sha256、字节数、行数、`git hash-object` blob、`git diff --numstat`。
      2. **实现修正**，每改一处立刻跑 focused（小步快跑，别攒）。
      3. **全量验证**：focused → scoped → `ruff check` → 格式基线证明 → `git diff --check` → 源码归档一致性。
      4. **重生成证据**：先把上一轮产物整体拷进 `round-NN/`（含产物字节与 README），**再**把本轮原始产物落到 `implementation-evidence/` 根——顺序反了就会原地覆盖，被杀的运行还不会留下任何痕迹。
      5. **写记录**：`product-hashes.txt` / `commands.txt` / `delivery.json` / `delivery.md`，逐条列出本轮修正、**明确未验证项**、记录环境事故与自我纠错；再生成 `round-NN-vs-round-(NN-1)-freshness.txt`。
      6. **派发两份独立审查**（同一消息并行，互不重叠的写范围），任务里必须包含：冻结的 sha256、可用的权威契约路径、上一轮 `review.json` 的路径、**环境坑清单**、写范围限制、要求自算哈希与自测计数、结束时复算哈希并把结果写进 `integrity.log`。
      7. 收到两份结论 → 回到第 1 步。
    
      ## 新鲜度对照表（每轮必产）
    
      逐工件列出「本轮哈希 / 上一轮同名哈希 / 判定」，只有两类判定：`DIFFERS（按本轮字节重生成）` 或 `IDENTICAL + 为何该内容必然相同`。
    
      ```python
      # 只收 round-NN/ 里存在的同名文件；同名但哈希相同 = 待解释项，不是通过项
      rows.append(f"{name}\n  round-05 {size:>7d}B  {sha(new)}\n  round-04 {size:>7d}B  {sha(old)}")
      ```
    
      三类必须写进表里的例外，否则读者会以为你在遮掩：① 本轮新出现的工件（无孪生）；② 被原地覆盖、已无法取回的上一轮工件（写明已知哈希与替代物来源）；③ 表格自身（无法自含自己的哈希）。
    
      ## 格式基线证明（防「顺手引入了格式偏差」）
    
      `ruff format --check` 在既有文件上常常本来就失败。要证明「本次改动没有新增偏差」，**不能比行号**（插入代码会移动 hunk），要比**内容**：
    
      基线优先取**上一轮归档的产物字节**（`round-NN/source/apps-api/`），因为它隔离出的正是「本轮改动」；退而求其次才是 HEAD 版本。对基线与工作树版本分别跑 `ruff format --diff`，把 `-` 行、`+` 行各收集成多重集，工作树独有的条目数即为「本次引入的偏差」。归零才算通过。抓到的偏差要**改源码**，不是改证明。
    
      ```python
      # 关键：跳过 '---' / '+++' 头，只收 ' -' / ' +' 行，用 collections.Counter 相减
      ```
    
      `ruff` 对 `apps/api` 之外的文件不会自动发现 `pyproject.toml`，会退回自带的默认行宽：跨目录比对**必须**显式 `--config`，且必须传 **Windows 绝对路径**（`D:/.../pyproject.toml`）——POSIX 形式的 `/d/...` 会被 Windows 二进制拒绝，报「does not point to a configuration file」。
    
      ## 变异测试（审查者的核心产出）
    
      只做针对**契约强制行为**的变异，不做美化型变异。固定要覆盖：每个被校验整数与正则的边界 off-by-one、每个布尔守卫取反、每个 `except` 臂删除、分支互换、故障映射的每个回退、每个沿用字段、每个状态字面量、每个 `await` 删除、把计算值换成常量。
    
      生存的变异体就是发现项：**必须点名「本该捕获它的那个测试」并说明为何没捕获**。同时**区分**「真正的覆盖缺口」与「行为等价的变异」——两者混在一起会让存活数失去意义。
    
      ### 实现者侧变异（补刀，不等于审查）
    
      审查者的 campaign 是权威的；但实施者在派发前应当自己跑一轮**「每个新测试是否真能被杀死」**，否则等于让审查者替你发现「假修」。安全做法：
    
      - 每个变异体是**一处文本替换**，替换前断言锚点在该文件中**恰好出现 1 次**（`assert original.count(old) == 1`），否则多行锚点会改错地方。
      - 先备份两个产物，逐个体施加→只跑**点名的那一个测试**→立刻还原；`finally` 里再从备份还原一次。
      - 结尾**复算两个产物的 sha256 并断言与起始值相等**，把 `WORKTREE UNCHANGED = True` 写进日志。否则一次中断就会把变异留在工作区里送审。
      - 日志要标明 **`IMPLEMENTER-RUN, NOT AN INDEPENDENT REVIEW`**——它只证明「新测试能失败」，不能替代独立 campaign。
    
      本轮 13 个变异体 13 KILLED：其中 `elif rotated is None or rotated == holding:` → `elif rotated == holding:`、`if self._provider is None or captured is None:` → `if self._provider is None:`、删掉 `_failure` 的钳制——都是上一轮审查者报的「已修却仍能存活」的项，补上后逐一被杀死。
    
      ## 环境坑（Windows + PowerShell，全部实测踩过）
    
      - Bash 工具默认是坏的（shim 让 `dirname`/`ls` 等缺失，exit 127），**但可以修好**：命令前加
        `export PATH="/c/Users/<user>/.workbuddy/binaries/PortableGit/versions/1.2.0/usr/bin:$PATH"`，之后 `ls`/`grep`/`cygpath`/`cp` 均正常。**优先用 Bash + 该 PATH**（比 PowerShell 少一半坑）；只在需要 Windows API/进程时才用 PowerShell。从 Bash 调 `powershell.exe` 会被安全策略拦截。
      - MSYS 的 `/tmp/...` 路径**Windows 版 Python 看不见**：`cygpath -w /tmp/x` 换算后再传给 Python；或把中间产物直接写到 Windows 路径。
      - PowerShell **经常在成功时返回空 stdout** → 一切输出 `| Out-File -LiteralPath <f> -Encoding utf8` 再读回。
      - 用 `$ErrorActionPreference = 'Continue'` + `try/finally`；默认一条 stderr 就会静默中止整个脚本，让你丢掉所有结果。
      - **嵌套数组会被展平**：`@(@(a,b),@(c,d))` → 4 元素扁平表，`$x[0][0]` 会去索引字符。用扁平数组 + 步长 2。
      - **`[xml]$x = Get-Content -Raw` 转换失败时，后续 `$x.SelectNodes(...)` 既不报错也不输出**（被 Continue 吞掉）。JUnit 计数改用 Python `xml.etree.ElementTree`。
      - **长前台命令会被自动转后台**；被杀的后台运行**不写 JUnit、退出码 1**，与测试失败无法区分。长跑（>2min）用显式 `run_in_background` 并等完成通知。
      - **不要把重负载并行起来**：变异检查与作用域回归同时跑会互相拖慢，导致长跑在 60~70% 处被杀且不留工件（实测踩到）。串行执行，或至少别让两者重叠。
      - `--junitxml=(Join-Path ...)` 会被字面传递 → pytest 退 4。先建变量，再 `"--junitxml=$xml"`；Bash 里则写成单个词 `--junitxml="$xml"`。
      - 命令里出现 `%` 会被 PowerShell 拒绝。
      - PowerShell 里用 here-string `@'...'@` 写配置/JSON 可避免 `$` 被插值；但长文本优先用 Write 工具。
      - Python 侧加 `PYTHONUTF8=1`；pytest 需 `PYTHONPATH=<repo>/apps/api`、cwd `<repo>/apps/api`、`PYTHONDONTWRITEBYTECODE=1`（避免旧 `.pyc` 干扰变异测试）。
      - 用 Write 工具覆盖已存在的文件前必须先 Read，否则报 `File has not been read yet`；大文件不想读时，用 Python 脚本生成内容写盘。
    
      ## 汇报口径
    
      结论只能是：`PASS` / `REQUEST_CHANGES` / `BLOCKED`，配 `{blocker, major, minor}` 计数。**永远不要**把「组件本地通过」说成父任务交付、Hosted CI、发布候选、正式部署或客户验收——这些必须由对应层级单独给出。
    tools: []
