      ## 输出目录结构
    
      PPT创作过程中在用户指定的工作目录下建立以下结构：
    
      ```
      [PPT项目名]/
      ├── STORY.md              # 内容叙事文档（叙事逻辑、章节大纲、逐页要点）
      ├── DESIGN.md             # 视觉设计文档（配色、字体、版式、密度基线）
      ├── assets/               # 页面引用的静态资源（图片等）
      ├── slides/               # 页面文件（01.slide、02.slide...）
      └── [PPT文件名].pptx       # 生成的演示文稿
      ```
    
      ---
    
      ## 使用示例
    
      ### 示例一：一句话创作商业路演PPT
    
      **用户输入：**
      > "帮我把我们的AI客服产品做成一个融资路演PPT"
    
      **执行路径：**
      1. 阶段一解析：主题种子=AI客服产品融资、价值指向=说服投资人、情感基调=激情+专业、类型暗示=商业路演
      2. 阶段二确定：商业路演类型、受众=投资人、场景=15分钟现场演讲、页数规划=18页左右
      3. 阶段三叙事架构（金字塔结构）：市场痛点→产品方案→技术壁垒→商业模式→增长数据→团队→融资需求
      4. 阶段四视觉：科技蓝+金色强调色、现代简洁字体、hero封面+数据页
      5. 阶段五数据支撑：搜索AI客服市场规模、竞品对比数据
      6. 阶段六逐页脚本：18页逐一设计
      7. 阶段七-九：调用tencent-pptx生成.pptx + 校验 + 品质审核
    
      **预期输出：** 约18页商业路演PPT（.pptx文件）+ 品质报告
    
      ### 示例二：一句话创作工作总结PPT
    
      **用户输入：**
      > "帮我做一份2026年上半年工作总结，我是市场部负责人"
    
      **执行路径：**
      1. 阶段一解析：主题种子=市场部半年总结、价值指向=展示成果+争取资源、情感基调=严谨+积极、类型暗示=工作总结
      2. 阶段二确定：工作总结类型、受众=管理层、场景=季度汇报会、页数规划=15页左右
      3. 阶段三叙事架构（时间线+金字塔）：上半年成果→关键项目→数据回顾→问题反思→下半年规划
      4. 阶段四视觉：专业蓝绿配色、数据图表为主、简洁商务风
      5. 阶段五数据支撑：引导用户提供关键KPI数据（或基于合理假设提示）
      6. 阶段六逐页脚本：15页逐一设计
      7. 阶段七-九：生成.pptx + 校验 + 品质审核
    
      **预期输出：** 约15页工作总结PPT（.pptx文件）+ 品质报告
    
      ### 示例三：一句话创作产品发布PPT
    
      **用户输入：**
      > "做一个新手机发布会的PPT，主打AI影像功能"
    
      **执行路径：**
      1. 阶段一解析：主题种子=新手机AI影像发布、价值指向=激发购买欲望、情感基调=震撼+科技感、类型暗示=产品发布
      2. 阶段二确定：产品发布类型、受众=消费者+媒体、场景=发布会大屏、页数规划=25页左右
      3. 阶段三叙事架构（起承转合）：起（悬念引入）→承（技术突破）→转（影像体验颠覆）→合（价格+上市）
      4. 阶段四视觉：极简高级风、大图大数字、深色底+高亮强调色
      5. 阶段五数据支撑：影像技术参数、样张效果
      6. 阶段六逐页脚本：25页逐一设计
      7. 阶段七-九：生成.pptx + 校验 + 品质审核
    
      **预期输出：** 约25页产品发布PPT（.pptx文件）+ 品质报告
    
