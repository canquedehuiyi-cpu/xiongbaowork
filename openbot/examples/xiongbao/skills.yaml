  - slug: mutation-driver-engineering
    title: mutation-driver-engineering
    summary: 写「变异验证驱动脚本」的工程纪律——脚本自动改源码→跑测试→判是否转红→还原。当你要证明一批测试断言不是空转、要批量做 mutation testing、或已有一个 `mutate_*.py` 驱动脚本要加固时使用。覆盖：三重判定（防假红…
    instructions: |-
      # 变异验证驱动脚本的工程纪律
    
      **变异验证**：故意把源码里的「保护」逐条拿掉，期望对应测试**转红**。
      全绿会掩盖空转 —— 只有转红才证明那条断言真的在测那件事。
    
      前端产物/断言侧的纪律见 `frontend-build-verification`；本技能只管**驱动脚本本身怎么写才不骗人**。
    
      ---
    
      ## 0. 先明确脚本的职责边界
    
      一个 `mutate_*.py` 做四件事，**每件都可能骗你**：
    
      | 阶段 | 会怎么骗你 | 对策 |
      |---|---|---|
      | 打补丁 | 源码漂移 → `str.replace` 静默替换 0 次 → 「没转红」被误读成「保护没用」 | 见 §1 |
      | 跑测试 | 退出码非 0 但不是测试失败 → 误判为「转了红」 | 见 §2 |
      | 判结果 | 红了但不是你预期的那条用例 | 见 §2 |
      | 还原 | 换行/编码被改写 → 悄悄污染工作树 | 见 §3 |
    
      ---
    
      ## 1. 打补丁：命中自检 + 唯一性
    
      ```python
      def run(m):
          original = read_raw(m.path)
          mutated = original
          for old, new in m.edits:
              if old not in mutated:
                  return "SKIP-模式已失效"      # ← 必须有
              mutated = mutated.replace(old, new, 1)
      ```
    
      - **`if old not in ...: return "SKIP-模式已失效"`** 是硬性要求。少了它，源码一漂移整批结论作废。
      - **`replace(..., 1)` 只替换第一处** → 若模式串在文件里不唯一，补丁会打到你没想到的地方，而脚本不会报错。加补丁串前先数一遍：
        ```bash
        grep -c "<模式串的关键行>" <文件>    # 要 == 1
        ```
        不够唯一就**把上下文拉长**（多带前后各 1~2 行）直到唯一。
      - **⚠️「文件里唯一」不够 —— 必须「在代码路径上唯一」**。**注释 / docstring 是头号假命中源**：
        实测踩到 —— 某函数的 docstring 里**原样引用了刚被替换掉的旧代码**（用来说明修的是什么），
        于是 `replace(..., 1)` **先命中注释**：源码没改、测试照旧全绿 → 变异报 `GREEN-变异未生效`；
        更坏的情况是文件里另有一处真命中，你会拿到**假红**。
        - 高危信号：**改完源码后顺手新增的「解释旧实现」注释**（`# 此前是 return xxx + 1 天`）。
          加变异前先搜一遍这串。
        - 廉价的严格判据：那一处命中在 `ast` 里应当是**语句**，不是字符串常量。
        - 修法：换一个只在代码里出现的锚点（用紧邻的真实语句序列），别用被引用的旧代码本身。
      - **⚠️ 改了「被历史变异覆盖的文件」⇒ 必须回归那批变异**。实测踩到：重构了某个 API 端点文件，
        上一批变异锚定的旧文本消失 ⇒ **退化成 `SKIP-模式已失效` = 静默少测两条**（脚本把 SKIP
        计入异常数所以能发现，**但前提是有人看那行输出**）。
        - 规则：`git diff --name-only` 与各批次 `Mutation.path` 求交集，非空就重跑那批。
        - 「测试全绿」**不代表**「变异防线还在」—— 这两件事要分开验。
      - **⚠️⚠️ 给代码插一层控制结构 ⇒ 锚点的缩进整段变 ⇒ 旧锚点全部静默失效。**
        实测（2026-09-16 组织域 (c)）：在 `workbench.py` 里加了分支 `if org_id is None:`，
        原本 8 空格缩进的两行下沉到 12 空格 ⇒ 上一批的 M9/M10 锚点**一个字都对不上**。
        症状仍是 `SKIP-模式已失效`（如实返回则记为 INVALID），**不是**「代码漂移了」。
        - **对策**：重构完立刻对**所有历史锚点**跑一遍 `grep -c "<锚点>" <文件>`；
        - 锚点里**务必带前导缩进** —— 否则「缩进变了但文本还在」会被 `count >= 1` 放过去，
          补丁打到别处，你会拿到假红或假绿。
      - **⚠️ 同一个表达式会在不同「缩进层级」重复出现** —— 这是最隐蔽的重复源，因为文本看上去一样。
        实测踩到：`if (problems.length > 0) {` 在 `publish`（方法体内再套一层 `try`，6 空格）与 `restore`
        （方法体内，4 空格）各出现一次，脚本按 `count != 1` 把它整条跳过 → **静默少测一条**。
        - 修法：把**前导空格一起写进锚点**（`"      if (problems.length > 0) {"`），比拉长到整段更省事。
        - 所以唯一性判据要写成 `text.count(old) != 1 → SKIP 并打印实际 count`，**不要把 `count > 1` 当成"随便打第一处也行"**。
        - 顺手记一句：`SKIP` 必须计入异常数并在汇总里**逐行打印**，否则等于没检查。
      - **⚠️ 「被抓住」有两种形态，归因时要分开说**：
        1. 断言失败（`Tests: N failed`）——常规形态。
        2. **夹具/hook 阶段就被拒**：实测变异改坏一个签名，被测服务端对**建桶请求**直接 403，
           vitest 于是把该文件的用例报成 `6 skipped` 而**文件**判 `failed`（`Test Files 2 failed`）。
           这是**有效**证据（服务端确实在校验签名），但它不是断言在起作用。
        - 只看 `Tests` 一行会误判成"没跑"；判据要同时看 `Test Files` 与 `skipped` 计数。
      - 想判断「这个失败是不是我造成的」，用**暂存对照**：`git stash push -- <文件>` → 复跑 → `git stash pop`。
    
      ---
    
      ## 2. 判定：**三重**，不能只看退出码
    
      ```python
      FAIL_RE = re.compile(r"\b\d+ (?:failed|error)")
    
      def verdict(proc, expect_test):
          out = (proc.stdout or "") + (proc.stderr or "")
          if proc.returncode == 0:
              return "GREEN-变异未生效!"                      # 断言空转
          if not FAIL_RE.search(out):
              return f"GUARD?-退出码{proc.returncode}但无失败计数"   # 假红
          if expect_test and expect_test not in out:
              return "OTHER-红了但非预期用例"                   # 红错地方
          return "RED-符合预期"
      ```
    
      **为什么必须三条**（都踩过）：
    
      1. **退出码非 0 ≠ 测试失败**。两件常见的事会让它非 0：
         - 宿主/CI 的 **atexit 守卫**抛 `SystemExit(1)`（例如本仓的 safe-delete 批量删除守卫），
           测试全绿但进程退出码是 1；
         - **语法错误** → collection error，根本没跑测试。
         只看退出码 → 这批「全红」全是假的。
      2. **`N failed` 计数**把上面两类挡掉（守卫报错和解释器崩溃不会打 `1 failed`）。
      3. **`expect_test` 必须出现在输出里** —— 挡住「红了但红错了」（例如你改 A 却把 B 测试搞崩了）。
         - pytest 要加 **`-rf`** 才稳定拿到 `FAILED ...::test_xxx` 摘要行，别假设默认有。
         - 用**测试函数名**（不含类名）做子串匹配即可，容忍 `-k` 选择器写宽。
         - **⚠️ 但 `expect_test` 本身必须是真的用例名。** 实测踩到：把用例名写成不存在的
           `test_postgres_...` 前缀 → `-k` 匹配 **0 个用例** → pytest **退出码 5
           （`no tests collected`）**、输出里没有 `N failed` ⇒ 被第 2/3 条逮住成 `GUARD?`。
           **若只判「退出码非 0」，这个什么都没测到的变异会被记成「RED-符合预期」。**
           加变异前先确认真名存在（读源码，或 `pytest --collect-only -q -k <名>`）。
           `-k` 表达式写**宽**没关系（子串匹配），写**错**才是致命的。
      4. **⚠️ 「红在哪一行」也要判准：裸 `ERROR ` 前缀不够用。**
         应用自己的日志会打印
         `ERROR    backend.app.monitoring.middleware:middleware.py:59 Request failed: ...`
         —— `ln.startswith("ERROR ")` 会把这条**应用日志**当成 pytest 的 collection error，
         于是**真红被判成 INVALID**（2026-09-16 本仓 M7 实测）。
         只认形如 `ERROR tests/unit/x.py::t - msg` 的行，例如
         `ln.split()[1].startswith("tests")`。
         > 同理：比 `N failed` 计数**更稳的判据是直接看 `FAILED ` 行**（`-x` 下至多一条）。
         > pytest 的统计行格式会随版本/插件漂移，`FAILED <node>` 行则稳定。
      5. **★ node id 会随测试改名/替换而静默失效 —— 必须有 INVALID 出口。**
         实测：某批做了「语义变更」（一条用例被替换成新的），驱动里旧 node id 指向的用例
         已不存在 ⇒ pytest 收到 0 个用例 ⇒ 输出里**既没有 `FAILED ` 也没有 `N passed`**。
         若判定器只回答「红没红」，这里就会漏判。必须显式返回 `INVALID` 并去核对用例是否还在。
         ⇒ **每次改动测试文件后，回查驱动里所有 `node` 是否仍指向存在的用例。**
      6. **★ 前端 runner（vitest/jest）不要解析文本，直接读 JSON 报告。**
         `--reporter=json --outputFile=<仓库外路径>` 给出结构化结果，判定退化成查表：
    
         ```python
         statuses = {
             c["fullName"]: c["status"]
             for s in data["testResults"] for c in s["assertionResults"]
         }
         if node not in statuses:                            return "INVALID", "node 名写错？"
         if statuses[node] == "failed":                      return "KILLED",  ...
         if any(s == "failed" for s in statuses.values()):   return "INVALID", "红的是别的用例"
         return "SURVIVED", ...
         ```
    
         比 `grep FAIL` 可靠得多：没有 ANSI 颜色码问题、没有 reporter 版本漂移、
         也不必猜 `Tests N failed` 那行长什么样。
         - **`fullName` 是用空格拼接的**（`describe` + `it`），**不是 `>`** —— 先打印一次真实值再拿它当锚。
         - **必须校验报告是「本次运行」写的**（记 `st_mtime_ns` 前后比对），否则 runner 崩了没写文件时，
           你会拿**上一次的旧报告**下结论 —— 见 §10。
    
      > 对本仓/本项目特有的已知噪声（如 safe-delete 守卫、既有 flake 用例），
      > 在脚本里**显式白名单/注释**，不要让它们混进「符合预期」里。
    
      **★ 目标套件自己有基线失败时，`expect_test` 不是可选项。**
    
      实测（x-agent bot 的 `artifacts.test.ts` 在本机恒有 2 条环境性失败：`fs.symlink` 对文件失败、
      `fs.writeFile` 的 POSIX 位不保留）：
    
      - 只按 `failed > 0` 判定 → 那两条基线失败让**每一条**指向该文件的变异都"RED"，
        包括完全没生效的变异。9 条变异里有 2 条是这么"通过"的。
      - 修法：每条变异都写 `expect_test`，并**人工核对它出现在失败列表里**。
        对这条真实数据，m5/m6 的目标用例名（`reports the sha256 …` / `refuses an id or tenant …`）
        都在列表里 —— 这时 RED 才是证据。
      - 等价但不那么强的修法是"失败数 > 基线失败数"。别用，环境性失败条数会漂移。
    
      推论：**先跑一次基线，把既有失败用例名列出来**，再决定哪些变异需要 `expect_test`。
      对所有变异都配 `expect_test` 是最省事的规则。
    
      ---
    
      ## 3. 还原：换行与编码必须**无损**
    
      **最容易踩的一脚**：`Path.read_text()` 默认做 universal-newlines 归一（`\r\n` → `\n`），
      `Path.write_text()` 又按 `os.linesep` 回写（Windows 上 → `\r\n`）。**一走一回路就会把整文件换行风格刷掉**，连 `finally` 里的还原也会刷。
    
      仓库换行常常是**混合**的（老文件 CRLF、新文件 LF），所以要逐文件判断：
    
      ```python
      def read_raw(p):                     # 不翻译换行
          return p.read_text(encoding="utf-8", newline="")
    
      def adapt(pattern, nl):              # 把模式串的 \n 适配成文件实际换行
          return pattern if nl == "\n" else pattern.replace("\n", nl)
    
      def run(m):
          original = read_raw(m.path)
          nl = "\r\n" if "\r\n" in original else "\n"
          mutated = original
          for old, new in m.edits:
              o, n = adapt(old, nl), adapt(new, nl)
              if o not in mutated: return "SKIP-模式已失效"
              mutated = mutated.replace(o, n, 1)
          try:
              m.path.write_text(mutated, encoding="utf-8", newline="")
              ...
          finally:
              m.path.write_text(original, encoding="utf-8", newline="")
              assert m.path.read_bytes() == original.encode("utf-8"), "还原后字节不一致"
      ```
    
      **先量一下换行，别猜**：
    
      ```bash
      python -c "
      import pathlib
      b = pathlib.Path('<文件>').read_bytes()
      print('CRLF=', b.count(b'\r\n'), '裸LF=', b.count(b'\n') - b.count(b'\r\n'))
      "
      ```
    
      > ⚠️ **别用 `grep -c $'\r'` 判断** —— 在不同引号上下文里 `$'\r'` 的展开不可靠，会给出与事实相反的结论。用 Python 数字节。
    
      **收尾再验一次哈希**：批前记录、批后比对，逐字节一致才算「零残留」。
    
      ```bash
      python -c "
      import hashlib,pathlib
      print(hashlib.sha256(pathlib.Path('<文件>').read_bytes()).hexdigest()[:16])
      "
      ```
    
      ---
    
      ## 4. 跑子进程：Windows 上的引号与超时
    
      ```python
      proc = subprocess.run(
          m.cmd, cwd=str(ROOT),
          capture_output=True, text=True, encoding="utf-8", errors="replace",
          shell=False,            # ← 关键
          timeout=TIMEOUT_S,      # ← 关键
      )
      ```
    
      - **`shell=False`**：Windows 下 `shell=True` 会把整个命令行交给 `cmd.exe` 二次解析，含空格的参数
        （`-k "A or B"`、`-t "some name"`）引号容易被吃掉 → 参数被切碎 → 测试报错 → **假红**。
        用绝对路径 + `shell=False` 直接传 argv 列表，彻底绕开。
        （只有 `.cmd`/`.bat` 包装器如 `npx`、`npm` 才需要 shell。）
      - **`timeout=`**：防某条变异把子进程挂死，让整轮验证无限期停住。正常耗时 ×5 左右设上限。
        ```python
        try:
            proc = subprocess.run(..., timeout=TIMEOUT_S)
        except subprocess.TimeoutExpired:
            return f"TIMEOUT?-超过{TIMEOUT_S}s"
        ```
      - **输出重定向到文件**：长跑时把结果写文件再读，避免 `> /dev/null` 后什么都看不到；
        但注意 Python 非 TTY 时 stdout 是**块缓冲**，中途读文件可能为空 —— 想实时看进度就 `flush=True` 或 `-u`。
      - **给 `subprocess.run(env=...)` 传"精简环境"会让 Node 在 Windows 上直接崩**：
    
        ```python
        # ✗ Node 起不来：Assertion failed: ncrypto::CSPRNG(nullptr, 0)（exit 134）
        env={"NODE_ENV": "test", "PATH": os.environ["PATH"]}
        # ✓ 必须合并进完整环境
        env={**os.environ, "NODE_ENV": "test"}
        ```
    
        Node 初始化 CSPRNG 依赖 `SystemRoot` 等 Windows 环境变量；缺了就是原生断言崩溃（不是 JS 异常），
        日志里只有一段 native stack。**变异的"假红"和"崩了"要分开**：驱动里应把 `returncode` 为负数/134
        与测出失败区分开，否则你会把"跑不起来"当成"抓住了"。
      - **"抓住了"的判定不要依赖 grep 测试框架的失败行**：现代 runner（vitest/jest）的日志**即使重定向到文件
        也带 ANSI 颜色码**（`\x1b[41m\x1b[1m FAIL \x1b[22m\x1b[49m`），于是 `grep -c "FAIL "` 能数出行数、
        `grep -o "FAIL  <路径>"` 却一个都取不到；而且不同 reporter/版本的失败头格式还会变。
        判定用 `returncode != 0` **再加上**摘要里的 `failed` 字样（`"failed" in output.split("Tests")[-1][:80]`），
        只在"打日志"时剥 ANSI（`re.sub(r"\x1b\[[0-9;]*m", "", out)`）好让人看懂。
    
      ---
    
      ## 5. 一条变异该怎么选（最小、单义）
    
      - **只改一个语义点**，最好一个词/一个条件，这样失败原因无歧义。
      - 覆盖**正向**与**反向**各一条：
        - 正向：拿掉保护 → 测试红（例：拿掉「检查 provider 类型」→ 诚实断言被击穿）
        - 反向：让保护恒真/恒假 → 另一条测试红（例：判别取反 → 真实现被误判）。
          **反向缺失时，一条「无条件返回失败」的假实现也能让正向全绿。**
      - **顺序/位置类保护要专门造变异**：例如「具名单段路由必须声明在同形状 `/{param}` 之前」，
        变异 = 把该路由块**搬到文件末尾**（用多 edit：先删原块，再在尾部锚点后追加）。
        这类保护写反了不会报错，只会静默 404。
      - 同一行上可以设计多条不同变异（分别跑、各自还原），不必强求一次覆盖全部。
      - ⚠️ **变异自身必须是能编译、能被收集的代码** —— 否则你造出来的是**环境噪声，不是证据**。
        实测：想表达「不再收敛异常」，写成「把 `catch` 整块删掉」→ 留下没有 catch/finally 的 `try`
        = **语法错误** → 测试收集失败 → 退出码非 0 但输出无 `N failed` → 判定 `NOCOUNT`。
        三重判定**正确地拒绝**把它算成 RED，但这样这条变异**什么也没证明**。
        改成 `throw cause`（合法语法、语义等价）后才成为有效变异。
        **结论：已知存活清单里的每条，也要确认它是「跑起来了但没红」，而不是「根本没跑起来」。**
    
        ⚠️ **更隐蔽的一种：变异值里的行内注释会吃掉锚点后面的代码。**
        实测（2026-09-16 组织域 (c) M28）：锚点所在行以 `},` 结尾，变异值写成
    
        ```
        "org_id": principal.tenant_id, "agent_id": principal.agent_id,  # MUTATED
        ```
    
        ⇒ `#` 把行尾的 `},` 一起注释掉 ⇒ **括号不闭合 ⇒ 语法错误 ⇒ 收集阶段就炸**
        ⇒ 判定 INVALID（而不是 KILLED）。三重判定**正确地**没把它算成 RED，
        但这条变异**什么也没证明**，而且第一眼看输出很像「测试没跑起来」。
    
        - 规则：给「行内字符串替换型」变异加尾注前，**先看锚点后面还有没有代码**；
          拿不准就把尾注放到**独立一行**，或干脆不加。
    
      ---
    
      ## 6. ★ 变异存活时，第一嫌疑是**测试假绿**，不是代码
    
      「变异存活」= 你的断言没在测它声称的东西。**比没有测试更糟**（给虚假信心）。
      按这个顺序排查：
    
      1. **先怀疑测试的前置条件没成立**（最常见，也最容易被忽略）：
         - 请求是否被**上游中间件**拦掉了？（例：CSRF 中间件对无凭据头的写请求返回 403，
           于是 `assert status in (401, 403)` **无条件成立**，量到的是 CSRF 门而非目标门。）
         - 参数是否放在了**错误的位置**？（例：端点的 `status` 是**查询参数**，测试放进 JSON body
           → 被静默忽略、请求降级成空操作 → 「没发生任何事」于是断言通过。）
         - 夹具/依赖注入是否真的生效？（全局单例未重置、`dependency_overrides` 没清、
           mock 用了裸 `vi.fn()` 返回 `undefined`。）
         - **环境能力是否真的具备**？测试若假设「某个系统调用**要么成功、要么抛异常**」，
           在 Windows / 沙箱下会遇到**第三种状态：不抛异常、也没有生效**。
           实测：`Path.symlink_to()` 被宿主沙箱的虚拟文件层拦下时，**既不抛 `WinError 1314`，
           也不产生真符号链接** → 测试对着一个**普通文件**断言，红绿都没有意义。
           典型症状是「**单跑绿、批量红**」——因为它随沙箱模式漂移，命令里有没有
           `Sandbox bypassed` 标记就是分界线。
           对策：**建完立刻核验**（`link.is_symlink()`、或 `link.resolve() == target.resolve()`），
           核验不过就 `skip`，或改走一条**真能生效**的通道（Windows 上 `mklink /J` 建 junction
           无需开发者模式/管理员，且 `Path.resolve()` 同样会跟随）。
           ⚠️ 推论：**跑变异前必须先确认「变异之前是绿的」**——环境漂移会把 baseline 本身弄红，
           这时「红了」并不代表变异起作用。
      2. **再怀疑断言写法**：
         - 辅助函数签名与调用不一致、断言了「键存在」而非「值」。
         - **断言只钉了「前缀」**：实测断言写 `toHaveTextContent('发送消息失败')`，而真实渲染是
           `发送消息失败：Failed to send collaboration message: 500` → **前缀匹配全绿**，
           文案里的英文机器串 + 裸状态码**一直没被发现**。**断言要钉到完整的用户可见文案**
           （或补 `not.toContain(...)`），否则等于只测了「页面上有个 alert 元素」。
      3. **或者：这条保护压根没有测试**（不是「假绿」，是「零覆盖」）。
         实测：`is_within_workspace` 内部对入参做 `resolve()`，但它的上游
         `map_virtual_to_real` 已经解析过一次 ⇒ 那条 resolve 的**行为被上游完全掩盖**，
         拿掉它**没有任何用例转红**。此时**正确处置是补一条用例钉住它，而不是删掉这一行**
         —— 它在「调用方直接把未解析路径交给这个公开入口」时是唯一防线。
         - **构造方法：绕开掩盖它的那一步**，直接以公开入口 + 未解析输入调用。
           实测补的是「workspace 内、指向 workspace 外的 junction 作入参」→ 断言必须判「不在 workspace 内」，
           补完该变异立刻转红。
         - **判别「零覆盖」vs「假绿」**：看**有没有任何用例真正走到这段代码**
           （覆盖率 / 直接搜调用点）。零覆盖 → 加测试；假绿 → 修断言。两者的补救完全不同。
         - 与上面「上游检查吞掉了下游分支」是同一现象的两面：注入方向要**改数据**，
           覆盖方向要**绕开上游**。
         - **★ 第三种归因（既不是假绿、也不是零覆盖）：断言基准与被测输出同源 ⇒ 断言结构性恒真。**
           实测（2026-09-16 组织域创建端点）：断言写
           `stored.role_template_id == body["role_template_id"]` —— 拿「落库值」比「响应体回显值」，
           而回显值就是刚写进去的那个字段。变异「创建时把 `role_template_id` 写成空串」⇒
           **两边一起变空 ⇒ 断言依然全绿 ⇒ 变异存活**。这条用例确实走到了代码、也确实执行了断言，
           所以「假绿」和「零覆盖」两档都**解释不了**它 —— 必须有第三档才不冤枉它。
           - **判别口诀**：逐行读断言，问「**右边这个期望值，是从被测代码的哪个出口拿的？**」
             若与左边同源，这行断言无论被测代码怎么错都成立。
           - **改法是换基准，不是调用例**：期望值换成**独立来源** —— 测试自己持有的常量 / 目录 /
             夹具数据（本例改为 `bundle.catalog.templates[0].role_id`），并在 docstring 里写明
             「刻意不用响应体回显值」的理由，防止后人"顺手简化"回去。
           - 高危句式（见到就重审）：`stored.x == body["x"]`、`result.id == payload.id`、
             `db_row == response.json()`、`obj.f is captured_in`。
           - 与 3 的区分：3 是「没有用例走到」；本档是「走到了、断言也执行了，但它**结构上无法为假**」。
             零覆盖 → 补用例；本档 → 换基准。
         - **★★ 第四种归因：对照组缺失 ⇒ 「不串」类断言结构性恒真。**
           实测（2026-09-16 组织域组织/部门端点）：被测对象 `OrganizationStore` 是**进程级单例**，
           而变异驱动按「单 node」跑 ⇒ store 里**只有该用例自己造的那一条数据**。
           变异「把 `list_organizations(tenant_id=...)` 的租户过滤整条摘掉」⇒ 返回的仍是「自己那份」
           ⇒ **断言全绿 ⇒ 变异存活**；同理「`GET /departments` 去掉 org 过滤」也存活。
           - **判别口诀**：这条断言测的是**隔离性 / 「不串」**吗（「A 的列表里没有 B 的东西」）？
             若被测对象共享可变状态（**进程级单例、模块级缓存、类属性**），就必须追问：
             **「B」在这个进程里真实存在吗？** 若只有用例自己造的数据 ⇒ B 压根不存在 ⇒ 断言恒真。
           - **改法是给用例垫对照组，不是删断言**：让用例**自带**一个「别人的」实体
             （别的租户 + 别的组织），并**前置断言它确实在 store 里**
             （`assert store.get_organization(other.org_id) is not None`）—— 这行前置断言同时防止
             将来有人把对照组删掉、测试又悄悄退回空转。
           - **反模式**：靠「同进程其它用例的写入」垫底（依赖测试执行顺序的污染）。
             那样单跑必假绿、只有全量才可能红 —— 是**不可复现**的绿，等于没测。
           - 与其它三档的区分：本档的用例**走到了代码、执行了断言、基准也独立**，
             唯独**缺少「反面样本」**。零覆盖 → 补用例；同源 → 换基准；本档 → **补对照组**。
      4. **最后一档出路**：删除该断言，并在注释里写明**为什么它无法失败**
         （例如该行为由依赖库结构性保证）—— 不要留着当装饰。
    
      **「上游检查吞掉了下游分支」—— 校验类代码最容易出的假绿**
    
      当被测代码里有**多个连续检查**（size → checksum → 格式）而你想要的是**中间那个**，注入的坏数据必须
      **只跨过它一个**。实测踩到：想验证"读回内容后比对 sha256"这条分支，注入的篡改串**比原文长** →
      前面的 `size` 检查先命中并 `break` → **checksum 分支从未执行，那条变异存活**。
    
      - 规则：**改注入数据，而不是改变异**。篡改串要**与原字节等长**（`"original home\n"` → `"tampered home\n"`），
        让只有校验和能发现差异。
      - 若同时也想覆盖上游那条检查，就**补一条独立的用例**（不同长度的篡改 → 断言报的是上游那条消息），
        而不是把两条检查挤进同一个场景。
      - 同一逻辑的反面：**断言消息文本**。两个检查都会失败时，断言具体报的是哪一条
        （`size mismatch at X` vs `sha256 mismatch at X`）才能固定它们的**顺序与存在性**——
        否则将来删掉其中一个，测试仍然全绿。
    
      **修完必须补「自检断言」**，让同一个错误不会再无声发生：
    
      ```python
      # 例：防止再次把参数放错位置
      assert r.json()["status"] == "resolved"     # 确实改了状态，才谈得上「没重复投递」
      # 例：防止再次被中间件拦下
      assert "CSRF" not in r.text
      ```
    
      **这两个「静默忽略 / 被上层拦掉」的家族**在 API 层极常见，且都属于
      **「测试通过是因为什么都没发生」** —— 与业务侧的「假成功」（失败了却显示成功）同源。
    
      ---
    
      ## 7. 交付时把这几样一起给出（否则结论不可复核）
    
      - 驱动脚本本身（放进仓库，如 `.workbuddy/scripts/` 或 `scripts/`）
      - 原始输出全文（`N 条，异常 M 条` 那种逐条清单）
      - **变异前/后的文件哈希**对照（证明零残留）
      - 修复前的**失败态**：哪几条绿了、根因是什么、怎么修的
      - 明确写出**本次未覆盖**的部分（哪些保护没造变异、哪些是纯新增没触发重跑）
    
      ---
    
      ## 8. ★ 驱动会被中断 —— 基线必须落盘 + 启动校验
    
      **症状**：驱动跑到一半被 kill（子进程超时、Ctrl-C、外层工具调用结束、机器休眠），源码**留在变异状态**。
      下一次运行读到的是**被污染的内容**，于是：
    
      - 那条变异的锚点报 `matched 0 times` → 你会以为「代码漂移了」，其实**是文件被改坏了**；
      - 更糟：其余变异全部基于**错误的基线**，最后那句 `N/N CAUGHT` 是对**一份已被改坏的源码**做的背书。
    
      实测踩到两次：`home.ts` 少了 `commit` 里的预替换断言，而下一轮把它当基线；另一轮把
      `if (claimed.length === 0) await rename(...)` 留在了源码里 —— 直到一个**本该绿的套件转红**才暴露。
    
      **对策（三件套）**：
    
      1. **第一次变异之前**把每个目标文件的原文写到**仓库外**（`.bak`）+ 一份 sha256 manifest：
         ```
         mutate_foo.baseline/packages__src__foo.ts.bak
         mutate_foo.baseline.json      # {"files": {"<repo-relative path>": "<sha256>"}}
         ```
      2. **每次启动先校验**：当前内容哈希 ≠ manifest 就**拒绝运行**（`exit 2`）并打印 drifted 的文件，
         报错里写清「要么上一轮被中断，要么源码被有意改了」以及下一步怎么做。
      3. 给两个开关：`--restore`（按 manifest 还原已知良好内容，顺便自愈）、`--rebaseline`（显式采纳当前内容）。
         **默认必须是拒绝**——静默覆盖会把「有人手工改了源码」也一起吞掉。
      4. 跑完再校验一次：还原后的内容 ≠ 起始内容就打印 ABORT 并给出 `.bak` 路径。
    
      **这条不是洁癖**：加上守卫后**第一次运行就拦下**了上一轮 kill 留下的真实污染。没有它，那一轮
      `11/11 CAUGHT` 是在给被污染的源码背书 —— 比完全没有变异验证更危险。
    
      **推论**：见到 `Status: killed` / 超时中断的日志后，**先校验基线再重跑**，不要直接重跑。
    
      ---
    
      ## 9. ★ 必须有一个「不可观测的中性变异」作对照
    
      在变异清单里放**一条不影响行为的改动**（改文档注释里的一句话、改一个死字符串），它的唯一职责是
      **必须报 MISSED**。
    
      理由：没有对照时，「N/N CAUGHT」与「驱动写坏了、永远输出 CAUGHT」在**输出上完全无法区分**。
      有对照才能说「这个驱动确实能区分红了和没红」。
    
      配套：**锚点报 `matched 0 times` 时**，先排除「源码被上一轮中断污染」（§8），
      再看是不是「这次修复顺手改写了那行表达式导致旧锚点过期」—— 两者都不是工具 bug，处理方式完全不同：
      前者 `--restore`，后者重锚（**语义要等价**，例如 `if (holder && holder.expiresAt > now())`
      重锚成 `if (expiresAt !== null)`，仍是「任何记录都当成活跃持有者」）。
    
      ---
    
      ## 10. ★ 报告 / 临时文件：不要删，用唯一名 + mtime 校验
    
      **症状**：驱动每个变异都先删一次报告文件（`REPORT.unlink(missing_ok=True)`），
      跑到第 8 个变异时**整轮崩掉**：
    
      ```
      [safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":56,"threshold":50,"scope":"turn", ...}
      ```
    
      **根因**：宿主的 safe-delete 守卫按**本轮累计删除数**计数（阈值 50），
      **不是**「单次删了多少个」。一个变异删一次文件，长清单必然撞线。
    
      **对策（两条必须一起上）**：
    
      1. **报告文件名带 `os.getpid()`，并且从不删除。**
         runner 的 `--outputFile` 是**覆盖写**，覆盖不算删除 ⇒ 压根不需要 `unlink`。
    
         ```python
         REPORT = ROOT / ".workbuddy" / "tmp" / f"vitest_report_{os.getpid()}.json"
         ```
    
      2. **用 mtime 校验「报告是本次运行写的」。**
    
         ```python
         before = REPORT.stat().st_mtime_ns if REPORT.exists() else 0
         proc = subprocess.run([...])
         if not REPORT.exists() or REPORT.stat().st_mtime_ns <= before:
             return False, {}, f"报告未被本次运行覆盖（退出码 {proc.returncode}）"
         ```
    
         少了这一步，runner 崩溃（或没跑到写报告那步）时你会**读到上一次的旧报告**，
         于是拿旧结果下结论 —— 这比报错更难发现。
    
      > 同类推论：驱动里**任何**删除 / 清理动作，都要先问「这一轮会累计删多少次」。
      > 临时目录里堆几十个报告文件毫无成本，被守卫拦下整轮白跑才是成本。
    
      ---
    
      ## 11. ★ 前端接线测试：替身不能是「死句柄」
    
      要把一个**容器组件**（渲染整壳的 `ConsoleShell` / `App` 之类）真渲染起来，
      通常得 `vi.mock` 掉它的网络/同步 hook（实时同步、SSE、轮询）。
      **陷阱**：把这个替身写成静态返回值的死句柄。
    
      ```ts
      // ✗ 死句柄：永远不会把 bootstrap 结果派发进 state
      vi.mock('@/hooks/useRealtimeSync', () => ({
        useRealtimeSync: () => ({ syncStatus: 'idle', manualRefresh: async () => {}, ... }),
      }))
      ```
    
      后果：`state.organizationGraph` / `state.realtime` 这些**由 bootstrap 派发填充**的字段
      恒为初始值。于是
    
      ```ts
      expect(screen.getByText(/部门 1 个 · 智能体 1 个/)).toBeInTheDocument()
      ```
    
      要么直接找不到（你以为接线坏了），要么在你写成 `/部门 0 个/` 时**恒真** ——
      后者是最坏的一种空转：断言全绿，但它测的是「组件渲染了初始零值」，
      **在接线被整段删掉之后依然全绿**。
    
      **改法**：替身保留「拉 bootstrap 并 dispatch」这一条最小行为，其余（SSE、轮询、重连）省略。
    
      ```ts
      vi.mock('@/hooks/useRealtimeSync', async () => {
        const React = await import('react')            // ★ 工厂被提升，不能用外层 import
        return {
          useRealtimeSync: (_state, dispatch, options) => {
            const url = options?.bootstrapUrl
            React.useEffect(() => {
              if (!url) return
              let cancelled = false
              void (async () => {
                const res = await fetch(url)
                if (!res.ok) return
                const data = await res.json()
                if (!cancelled) dispatch({ type: 'bootstrap/success', payload: data })   // ★ 关键
              })()
              return () => { cancelled = true }
            }, [url])
            return { syncStatus: 'idle', lastSyncedAt: null, syncError: null,
                     manualRefresh: async () => {}, refreshMessagesOnly: async () => {},
                     reconnect: () => {}, stopPolling: () => {}, startPolling: () => {} }
          },
        }
      })
      ```
    
      自查方法：**把那条 dispatch 注释掉，看有多少断言从红变绿**。
      变绿的那些，此前全是空转。
    
      > 这是「断言恒真」的第五种归因，和 §6 的「对照组缺失」是同一个病的两个科室：
      > 都源于**被测状态在一个用例里根本不可能取到非平凡值**。
    
      ---
    
      ## 快速检查清单
    
      - [ ] 每条变异都有 `if old not in src: return "SKIP-模式已失效"` 自检
      - [ ] 模式串在目标文件里**唯一**（`grep -c` == 1），**且那一处在注释/docstring 之外**（`ast` 里是语句）
      - [ ] 重复出现时用**前导缩进**做锚点，且 `count != 1` 会打印实际 count 并计入异常
      - [ ] `expect_test` 是**真实存在**的用例名（`-k` 匹配 0 个会得到退出码 5，被误当「红了」）
      - [ ] 判定是**三重**（退出码 + 确有 `N failed` + 失败的正是 `expect_test`），pytest 加了 `-rf`
      - [ ] `ERROR`/失败行的识别**只认 pytest 自己的行**（`ERROR tests/...`、`FAILED <node>`），不被应用日志的 `ERROR ` 前缀骗到
      - [ ] 有 `INVALID` 出口：`node` 指向的用例已不存在（测试改名/被替换）时**不**计入「抓住了」
      - [ ] 改动测试文件后，已回查驱动里所有 `node` 是否仍指向**存在**的用例
      - [ ] 断言同时看 `Test Files` 与 `skipped`（夹具阶段被拒 = 文件 failed + 用例 skipped，仍是有效证据）
      - [ ] 本次改动的文件若命中**历史变异批次的 `Mutation.path`**，那批已重跑（防 `SKIP` 式静默少测）
      - [ ] 读写都用 `newline=""`，模式串按文件实际换行适配，还原后**字节级**校验
      - [ ] `shell=False`；含空格参数不被 shell 二次解析
      - [ ] 子进程有 `timeout`，超时归为异常而非「符合预期」
      - [ ] 子进程 `env` 是**完整环境**（`{**os.environ, ...}`），没传精简环境让运行时崩在启动阶段
      - [ ] "抓住了"的判定不依赖 grep 框架的失败行（ANSI 颜色码会让 grep 失效）
      - [ ] 有**反向**变异（不只正向）
      - [ ] 顺序/位置类保护（路由声明顺序、配置优先级）专门造了变异
      - [ ] 存活项逐条定性：测试假绿 / 断言写法 / **零覆盖（→ 补用例，别删保护）** / **基准与输出同源（→ 换期望值来源，不是调用例）** / **对照组缺失（→ 用例自带「别人的」实体并前置断言它存在）** / 确无可失败性（并注明）
      - [ ] 每行断言问过「期望值是从被测代码的哪个出口拿的」—— 同源的（`stored.x == body["x"]`）已换成独立来源
      - [ ] 每条「不串 / 隔离」断言问过「**反面样本在这个进程里真实存在吗**」—— 被测对象是进程级单例/模块级缓存时，用例已自带别的租户/组织垫底（不靠其它用例的写入）
      - [ ] 必要的前置断言已就位（`assert store.get(other.org_id) is not None` 之类），对照组被删掉时会立刻转红而不是退回空转
      - [ ] 交付含脚本 + 原始输出 + 哈希对照 + 未覆盖说明
      - [ ] 原文在**第一次变异前**落盘为 `.bak` + sha256 manifest；启动校验不一致即 `exit 2`（§8）
      - [ ] 提供 `--restore` / `--rebaseline`，**默认拒绝运行**而不是静默覆盖（§8）
      - [ ] 有**不可观测的中性变异**作对照，且它确实报 MISSED（§9）
      - [ ] 见到 `Status: killed` / 超时中断后，**先校验基线再重跑**（§8）
      - [ ] 变异值的行内尾注没有吃掉锚点后面的代码（`# x` 吃掉行尾 `},` ⇒ 收集阶段炸 ⇒ INVALID）
      - [ ] 重构 / 插入控制结构后，所有历史锚点已用 `grep -c` 回查（缩进下沉 ⇒ 整批静默 INVALID）
      - [ ] 驱动里没有「按变异次数删文件」的写法（宿主守卫按**本轮累计**计数，阈值 50，超阈整轮崩）
      - [ ] 前端变异的报告是**本次运行**写的（mtime 前后比对），不是上一次的残留
      - [ ] 前端报告按 `fullName → status` 查表判定，不 grep 文本（没有 ANSI / reporter 漂移问题）
      - [ ] 渲染容器组件用的 hook 替身**保留了「拉 bootstrap 并 dispatch」**（死句柄 ⇒ 由 state 派生的断言恒真，见 §11）
      - [ ] 已做过「注释掉替身里那次 dispatch，看哪些断言从红变绿」的自查（变绿 = 此前空转）
