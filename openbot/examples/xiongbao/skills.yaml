  - slug: project-expert-orchestration
    title: project-expert-orchestration
    summary: 以产品经理/项目负责人身份调动「项目内匹配的虚拟专家」分工产出方案，并跟踪汇总结果，对产出逐条取证验收（专家在沙箱跑、看不到你的本地仓库，所以结论必须自己复核）。当用户说"调用项目里的专家""让专家各自出方案""按每个人的能力分工""发布…
    instructions: |-
      # 调动项目虚拟专家（WorkBuddy 项目）
    
      ## 关键事实（先记住，别重复试错）
    
      1. **专家不是项目成员。** `project_members` 只返回真人成员；虚拟专家不出现在里面。所以"按人指派事项"时专家无法作为 owner。
      2. **专家不能用 `Agent` 工具当子代理调用。** 试过 `subagent_type: "游戏设计师"` → 报错 `Task agent 游戏设计师 is not available`。别再试。
      3. **专家的正式调用入口是「项目自动化」。** `automation_create` 的 `expert_name` 字段说明为 "Expert display name; resolved against automation_list_experts"。
      4. 列出项目可用专家：`mcp__wb-issues__automation_list_experts`（返回 `expert_id` / `display_name_zh` / `profession_zh`）。
    
      ## 标准流程
    
      ### 1. 列专家 → 列成员
      ```
      automation_list_experts        # 拿到专家名单与专业
      project_members                # 确认真人成员（用于事项指派）
      ```
      如果只有 1 个成员，要主动告诉用户"按人指派只能落到你头上"，不要假装分派成功。
    
      ### 2. 建立「能力 → 任务」映射表
      不要只报名字，要给出**三列交付定义**：职责范围 / 交付物 / 验收标准。验收标准必须可判定（例如"技能清单可直接转为资产生产工单""含 priority/interrupt 字段"）。
    
      ### 3. 建自动化任务召唤专家
      ```
      automation_create({
        name: "【项目名】<交付物名>",
        schedule_type: "once",
        scheduled_at: "<几分钟后>",      # 见下方"排期纪律"
        expert_name: "<专家中文显示名>",   # 就是 automation_list_experts 里的 display_name_zh
        description: "由项目虚拟专家「<专业>」产出《<交付物>》，并回复到项目留言区…",
        prompt: "<自包含的完整任务书>"
      })
      ```
      **先跑 3 条做验证，确认产出落点无误后再铺开全部。** 一次建十几条，出问题要全部重来。
    
      ### 4. prompt 必须是自包含的
      自动化运行时**看不到当前对话**，所以任务书里必须写全：
      - 项目背景与产品定位（一句话）
      - **已确定的技术前提**（技术栈、禁用的方案、合规红线）——否则专家会给出与既定决策冲突的建议
      - 交付物的分节要求（编号列出，每节要什么）
      - 交付方式：`使用 project_message_add_or_reply，parent_id 传入 <工作令留言 id>`，这样产出统一落到同一条留言下，便于汇总
      - 写作纪律："不确定的标注「未确认」，不要编造数据"
      - 文末要求列出"需要产品侧确认的问题"
    
      ### 5. 跟踪与汇总
      ```
      automation_list                # 看 next_run_at / status
      automation_show {automation_id}  # 看 model_name / expert_name / connector_names
      automation_toggle              # 出问题立刻 PAUSED，别让它继续跑
      project_message_list           # 读专家回帖产出
      project_message_show {id}      # 读某条留言的完整线索（含回复）
      ```
      汇总时明确区分：**已按期产出的 / 未产出的 / 产出但需要修正的**。
    
      ## ★ 验收纪律（2026-09-15 实测补充，代价：一整批返工）
    
      **专家在沙箱里跑，看不到你的本地仓库。** 实测三位专家各自独立声明：执行环境是 Linux 沙箱，Windows 路径未挂载，`/workspace`、`/root/uploads` 为空 → **产出里没有任何 `file:line`**，只能给「方法论 + 推演」，并把需要核对的项标成「未确认 / 待自证」。
    
      推论（派单时就要想清楚）：
    
      1. **派单前先确认专家能不能访问代码仓库。** 不能的话，任务书里要求「引用具体 `file:line`」是**收回不来的** —— 只能收到推演。要么改任务书（改要「可复核的检索命令集 + 判定矩阵」），要么**把「取证」明确留给自己**。
      2. **验收 = 你自己把他们的命令跑一遍。** 专家给的 grep 必须**原样执行并回填行号**。实测：有专家的正则**完全打不中本仓写法**（返回 0 行），也有正则**过宽产生假阳性、同时漏掉同一函数里的真问题**。
      3. **把专家的判断当「假设」，不是「结论」。** 实测同一份五轴评审的 12 条里，经取证**只有 2 条成立**：6 条不成立、3 条属重构转决策、1 条「结论错但方向对」（它说「测试没覆盖真实失败链路」是错的，但**断言粒度太松**这个真问题是它摸到的）。**不因为对方是「专家」就直接采纳或直接驳回。**
      4. **「不可达分支」是双向陷阱。** 专家指认某分支是缺陷，先证明它**可达**（查父组件是否恒传入该 prop）。反过来，你新加的 `catch`/失败提示**也可能是死代码**（桩永不 reject ⇒ 生产路径不可达，只有测试能覆盖）。
      5. **主动声明「未核对」的产出要保护，不要惩罚。** 那是诚实标记（该给高分）；真正危险的是**没标记却像取证一样陈述**的产出。
      6. **只修「已核实为真」的。** 其余转成待决策，**不代拍**。修完把「哪些不成立、为什么不成立」也回帖 —— 否则下一个读到你汇总的人会把不成立的条目当结论。
    
      ## 排期纪律
    
      - 自动化是**定时执行**，不是本会话内即时返回。**在同一轮对话里拿不到专家产出**——要如实告诉用户，不要假装已经汇总。
      - `scheduled_at` 建议设在当前时间之后 **5–20 分钟**，给客户端留出触发窗口（用 `date` 命令取当前时间，别自己算）。
      - **`scheduled_at` 不能落在「创建时刻的同一分钟内或更早」。** 实测踩坑：21:12:27 创建、`scheduled_at` 写 `21:12` → 任务永久停在 `ACTIVE`，`last_run_at` 与 `next_run_at` **双空**，即被调度器永久跳过（既不执行也不报错）。**创建前先取当前时间，排期至少 +3 分钟**，并把分钟数取整到「当前分钟之后」。
      - 修复被跳过的任务：`automation_update { automation_id, scheduled_at: "<未来时间>", schedule_type: "once", status: "ACTIVE" }`，返回 `Automation updated` 即生效。**改期后要再查一次 `last_run_at` 确认真触发。**
      - 一次性的专家产出任务用 `schedule_type: "once"`；周期性的（如竞品政策周报跟踪）才用 `recurring`。
      - **一次性的专家任务，跑完的终态就是 `PAUSED`，这是正常的**（`automation_list` 只有 ACTIVE/PAUSED 两个状态）。**别把 PAUSED 当故障**——判断依据是 `last_run_at` 是否有值（有值=已执行），配合留言区实际产出落地时间看。单份专家产出实测耗时约 **20 分钟**（13:45:13 触发 → 14:04:51 落帖），查太早会误判成"失败"。
      - 先建任务的前置检查：`automation_list` 看有没有重复任务（只返回调用者自己创建的任务）。
    
      ## 常见坑
    
      - **别用 `project_message_add_or_reply` 发大表格前不确认**：项目留言是公开动作，发布前要拿到用户明确授权（用户说"发布给项目所有人"即为授权）。
      - **自动化只对创建者可见**（"Non-creator access returns automation not found"），团队其他人看不到你建的任务，需要另行同步。
      - 项目资料库（tdrive）的上传属于 Drive 变更，**必须先给用户看改动再确认**，不要跟项目留言混为一谈。
      - 专家的产出质量取决于任务书里"已确定前提"写得够不够硬——前提写糊，专家就会给出已经被否掉的方案（例如继续推荐 Live2D、继续推荐加密支付）。
      - **专家产出默认「无源码访问」。** 派单时不确认执行环境，就必然收到一份没有行号的推演稿，且它会如实（也可能不如实）标记「未核对」。**验收时必须自己跑命令回填行号**，否则汇总出来的是一叠看上去很专业、但没人验证过的建议。
      - **不要一次性铺开十几条同时段任务。** 实测 18 位专家分两批派单：前 11 条触发于 13:45–13:53 **全部成功**；后 7 条触发于 13:59–14:13 **全部无产出**（`last_run_at` 准点有值，但留言区查不到任何产出，全文检索 26 万字里这 7 位只出现在分工表与他人的 @ 引用里）。**失败在时间上聚集、不在人名上聚集 → 指向调度侧并发/长时运行问题，不是任务书写得不好。** 稳妥做法：**每批 ≤3–4 条，间隔 ≥3 分钟**，跑完一批再发下一批。
      - **补跑任务书要补一句「上游已有产出，可直接对齐」**，并明确"务必先让第一条回复写成功再补充内容"——否则补跑专家会重复造轮子，与本批已产出的结论互不引用。
