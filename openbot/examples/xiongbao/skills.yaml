  - slug: wiring-and-coverage-audit
    title: wiring-and-coverage-audit
    summary: 在判定「死代码」或规划「接线」之前，用实证方法证明代码到底有没有被接上、有没有被类型检查、有没有被挂载。适用于任何「实现了但没接线」的仓库——前端有文件没进路由、后端有路由没进挂载白名单、`tsc/build` 全绿但覆盖不到目标文件。触…
    instructions: |-
      # 接线与覆盖审计
    
      解决问题：**「实现了」≠「接上了」**。这个状态在前后端都会出现，而且**所有常规检查都是绿的**：
    
      - `tsc --noEmit` exit 0 —— 但它的 `include` 窄，目标文件根本不在检查范围里
      - `vitest run` 全绿 —— 但测试只覆盖被测试文件 import 的东西
      - `vite build` exit 0 —— 未接线的模块照样被打进 bundle 或根本不参与
      - 后端源码里 `@router.get(...)` 写得漂漂亮亮 —— 但模块不在挂载白名单里，一条路由都不可达
    
      **规则：在说「这是死代码」或「后端已备、只差接线」之前，先跑完下面三项实测。** 三类结论都可能被推翻。
    
      ---
    
      ## 检查 1：前端可达性（从入口 BFS import 图）
    
      **不要用 grep 组件名判断"有没有人用"** —— 会被同名前缀污染（`Card` 命中 `CardBody`）。要建 import 图。
    
      ```python
      # 关键点，别踩这四个坑
      1. 别名要从 tsconfig 的 compilerOptions.paths 读全，别硬编码 @/
         （本仓有 @/ @components/ @pages/ @services/ @store/ —— 只处理 @/ 是运气不是设计）
      2. 剥离 JSONC 注释时【不要用正则剥 /* */】：
         tsconfig 里字符串 "@/*" 含 "/*"、"src/**/__tests__/**" 含 "*/"
         → re.sub(r"/\*.*?\*/", "", txt, re.S) 会从前者一路吃到后者，把整段 paths 删掉
         → 别名全空 → 全仓判为不可达（LIVE=0）。
         正确做法：定向提取 —— 定位 '"paths"' → 花括号配平取块 → 只抓 '"@x/*": ["…"]' 条目。
      3. 说明符要覆盖：静态 import / `import()` 动态 / `require()` / CSS `@import url()`
      4. 解析要试全后缀与 index：x / x.ts / x.tsx / x.css / x/index.ts
      ```
    
      解析失败要**高声失败**（`SystemExit`），别静默返回空 —— 静默返回全 0 比崩溃危险得多。
    
      然后 **BFS from 入口**（`main.tsx`），**不是**只看"有没有直接 import"：一个文件可以有 import 方，而 import 方自己也死了。实测过一次 28 个不可达文件里只有 13 个真正零 import 方。
    
      ---
    
      ## 检查 2：类型覆盖差集（`tsc --listFiles`）
    
      `tsconfig.json` 的 `include` 常常是**窄名单**（只列几个入口 + 某个目录），tsc 只顺 import 图走。
    
      ```bash
      npx tsc --noEmit --listFiles > /tmp/before.txt     # 记录基线
      # ... 接线 ...
      npx tsc --noEmit --listFiles > /tmp/after.txt
      diff <(grep -oE 'src/.*\.(ts|tsx)$' /tmp/before.txt | sort -u) \
           <(grep -oE 'src/.*\.(ts|tsx)$' /tmp/after.txt  | sort -u)
      ```
    
      - **接线前**：拿 `--listFiles` 的结果与目标清单求差集 → 差集里的文件**零类型覆盖**，此时 `tsc exit 0` **不是证据**。
      - **接线后**：差集必须恰好等于你新接的文件 → 证明它们真的进了检查范围，此时 `exit 0` 才有意义。
    
      **不要顺手把 `include` 放宽到整个 `src/`** —— 会立刻暴露所有未接线文件的类型错误，`tsc` 变红，阻塞一切无关工作。记为待办，别现在做。
    
      **但要真检查某个未覆盖文件时，用一份临时 project 配置（用完即删）**，别动仓库的 `tsconfig.json`：
    
      ```jsonc
      // frontend/tsconfig.check-<feature>.json
      {
        "extends": "./tsconfig.json",          // 继承 compilerOptions / paths / baseUrl
        "include": ["src/services/x.ts", "src/pages/X.tsx"],   // 只列目标
        "exclude": [],                          // 覆盖基础配置的 exclude
        "references": []                        // 避免 --build 语义
      }
      ```
    
      ```bash
      npx tsc --noEmit -p tsconfig.check-x.json
      npx tsc --noEmit -p tsconfig.check-x.json --listFiles | grep -Ei "x|X"   # 先证明它真进来了
      ```
    
      **实测价值**：仓库口径 `tsc exit 0`，覆盖式检查立刻抓出 2 个真实类型错误。
      **注意**：若 `include` 命中了 `__tests__`，会冒出一批 `toBeInTheDocument` 之类「缺 jest-dom 类型」的**既有**报错 —— 先确认它们与本次改动无关（改动前就存在），再只盯新增的错误。
    
      ---
    
      ## 检查 3：后端路由挂载（别只看 `@router` 计数）
    
      很多 FastAPI 工程用**白名单 + 循环 include**：
    
      ```python
      _KEPT_ROUTER_MODULES = ("agents", "runs", ...)     # 白名单
      for _mod in _KEPT_ROUTER_MODULES:
          app.include_router(importlib.import_module(f"...api.{_mod}").router)
      ```
    
      **不在白名单里 = 源码再完整也零可达。** 所以：
    
      ```bash
      # 1. 找自动挂载循环，确认它遍历的是什么
      grep -n "include_router\|_KEPT\|ROUTER_MODULES" backend/app/main.py
      # 2. 逐模块核对：文件有 @router，但名字在不在遍历的集合里？
      # 3. 别被注释里的预算/门禁吓住 —— 先去 tests/ 找有没有断言强制它
      grep -rn "300\|budget" backend/tests/ --include=*.py
      ```
    
      同一类坑还有**同文件内的 `extended_router`**（文件被挂载，但某个二级 router 故意不挂）。判「后端已备」必须查**挂载**，不是查 `@router` 出现次数。
    
      ---
    
      ## 额外的两个接线成本放大器
    
      1. **前端 service 可能是过时 stub**：`fetch`/axios 封装里写着 `throw new Error('not supported by the backend')`，而后端其实**早就有了**。**别信 service 注释，对着后端 `@router` 核。**
      2. **fail-fast 加载器**：页面用 `Promise.all([a, b, c])` 聚合请求时，**任一失败整页必挂**；若外面还有 `setInterval(load, 30000)`，就是**每 30 秒重试、永远失败**。接线前先看页面怎么聚合请求 —— 这会把"接一个路由"变成"接路由 + 改 service + 让页面容错"。
    
      ---
    
      ## 输出
    
      产出一张表，**每一行都要有可复跑的证据**，并显式标注「后端是**源码存在**还是**已挂载**」：
    
      | 文件 | 可达性 | 上游依赖 | 证据 |
      |---|---|---|---|
      | `pages/X.tsx` | 不可达 | 后端 `mod` **未挂载** | BFS + 白名单核对 |
    
      **判定口径**：零引用只证明「当前不可达」，**不证明「无价值」**。必须再追问一句：
    
      > **它是废弃了，还是只是还没接上线？**
    
      判据（≥2 条 → 视为「待接线」而非「废弃」）：①有独立后端 API ②有测试覆盖 ③有独占能力 ④近期有维护提交。
    
      **循环论证陷阱**：先删入口，再以「零引用」删它的依赖 —— 零引用是自己造成的。判定前先确认「引用方是否曾被本次会话自己删过」。
    
      ---
    
      ## 检查 4：运行时真值（决定性证据）
    
      静态解析只能**推断**，运行时路由表才能**证明**。免 lifespan 的做法：
    
      ```python
      import sys, pathlib
      sys.path.insert(0, str(ROOT))
      from backend.app.main import app, _register_all_routers
      _register_all_routers()                     # 幂等；不走 lifespan
      runtime = {r.path for r in app.routes if hasattr(r, "path")}
      ```
    
      **别进 `with TestClient(app)` 上下文** —— 进入时会跑 lifespan，而启动路径可能有副作用（安全删除批量守卫会在 lifespan 里抛 `CancelledError`，把整批请求带崩）。直接调注册函数就能拿到全量路由表。
    
      ### 但「路由表里有」≠「能返回 200」—— 补一次真实 HTTP 冒烟
    
      `TestClient(app)` **不进上下文**时不会跑 lifespan，请求照常工作 ⇒ 这正是安全拿真实状态码的办法：
    
      ```python
      _register_all_routers()          # 手动注册（幂等），补上 lifespan 本该做的事
      client = TestClient(app)         # 刻意不写 with
      ```
    
      四个必配项，缺一个结论就不成立：
    
      | 项 | 做法 | 不做的后果 |
      |---|---|---|
      | 鉴权 | dev 模式带 bootstrap key（如 `x-api-key: <settings.bootstrap_api_key>`）→ admin 全 scope | 路由上挂了 `enforce_scope(...)` 时，`anonymous_principal()` 的 `scopes=[]` 会让所有读端点 **401**，你会误判成"接线失败" |
      | 存储 | 强制 file 后端 + **临时路径**（`XAGENT_*_STORE_PATH`） | 污染仓库 `data/*.json` |
      | 顺序 | 先 POST 建单 → 再读类 → 最后 DELETE | 没有数据可读，全返回空数组，看不出真假 |
      | **反向证据** | DELETE 后**再 GET 一次，断言 404** | 只看 204 无法区分"真删除"与"静默成功" |
    
      **最有价值的不是"14 个端点都 200"，而是那两条反向证据**：新建的数据**确实出现在** list / trends / search / stats / CSV 导出里（证明不是编的数字），以及删后确实 404（证明真生效）。
    
      实测价值：静态数出 452 条「可达」，运行时只有 **435** 条（路径去重 + 参数名归一）。
      **差异必须暴露 —— 不能拿静态数字当结论。**
    
      再补一步**可接线性探测**（决定"接线"还是"修 bug"）：
    
      ```python
      mod = importlib.import_module(f"...api.{name}")
      n = len(getattr(mod.router, "routes", []))   # 逐模块 try/except，别一把梭
      ```
    
      实测 18 个未挂载模块：**17 个可导入、1 个 `ImportError`**。
      → 「没接线」和「是坏的」是两种问题，处置方式完全不同，必须在报告里分开写。
    
      ---
    
      ## 🔴 先怀疑你的验证脚本，再怀疑代码
    
      一次接线验证报出「路由总数 435 → 495（+60），但只加了 14 条」+「40 条重复路径」，看起来像严重问题。**实际全部是脚本自身的口径错误，代码没问题。** 三个错法都很常见：
    
      ### 错法 1：两个数字口径不一致
    
      | 口径 | 写法 | 结果 |
      |---|---|---|
      | **唯一路径数** | `sorted({r.path for r in app.routes ...})` | 435 |
      | **路由条目数** | `[r.path for r in app.routes ...]` | 495 |
    
      同一路径上的 `GET` + `POST` 是**两条 `APIRoute`**，`.path` 相同。拿集合数当基线、拿列表数当结果，差出 60 条"凭空多出来的路由"。
    
      **规则：基线与结果必须同口径、同工具链、现取。**
      不要拿几十分钟前、另一个脚本跑出来的数字当基线。
    
      ### 错法 2：把正常 REST 行为当冲突
    
      「同 path 出现多次」在 REST 里是**合法的**（不同 method 共用一个路径）。
      **真冲突的判据是 `(path, method)` 重复注册**，不是 `path` 重复。
    
      ### 错法 3：硬编码清单漏项 → 假绿
    
      遮蔽检查写成 `for p in ("/trends", "/search", "/export", ...)` —— 漏了 `/stats/summary`，于是结论「无遮蔽」是**假的**。
      **必须通用化**：对所有"具体路径"逐个检查是否被**更早声明**的参数化路径匹配。
    
      ```python
      def seg_match(pattern, concrete):
          a, b = pattern.strip("/").split("/"), concrete.strip("/").split("/")
          return len(a) == len(b) and all(
              (x.startswith("{") and x.endswith("}")) or x == y for x, y in zip(a, b))
      # 只看：concrete 无参数 且 pattern 含参数 且 pattern 声明更早 且 seg_match
      ```
    
      > 段数也重要：`/{id}` 只吃**单段**。`/stats/summary` 是两段，**不会被** `/{feedback_id}` 吞掉 —— 这也是为什么硬编码清单即使不通用化，也得逐条核对段数。
    
      ### 错法 4：改动根本没落盘（工具层）
    
      把**同一文件的两处编辑放进同一条消息并行发出** → 后写覆盖前写，其中一处静默丢失。实测丢掉的正是函数签名那处，结果"改了签名"的调用点全部类型报错。
    
      **规则：同一文件的多次编辑必须串行发出。** 覆盖式 tsc（见检查 2）是抓到这类问题的有效手段 —— 默认 `tsc` 覆盖不到就不会报。
    
      ### ✅ 正解：A/B 实测（消除一切口径争议）
    
      同一解释器、同一份代码，**只切换那个开关**，跑两次差集：
    
      ```python
      import os, backend.app.main as m
      if os.environ.get("DROP_X") == "1":
          m._KEPT_ROUTER_MODULES = tuple(x for x in m._KEPT_ROUTER_MODULES if x != "x")
      m._register_all_routers()
      paths = {r.path for r in m.app.routes if hasattr(r, "path")}
      ```
    
      ```
      A(有 x) uniq=445  entries=495
      B(无 x) uniq=435  entries=481
      A\B = 精确 10 条 x 路径      B\A = 空   ← 后者同样重要：证明没有误伤
      ```
    
      **差集必须同时看两边**：`A\B` 应是目标路径、**`B\A` 必须为空**（否则说明接线顺带改掉了别的路由 —— 那是真问题）。
    
      ### 一句话总结
    
      > **断言比事实严**（把正常当阻断）和**比事实松**（硬编码清单漏项给假绿）**同样有害**。
      > 报 ❌ 之前，先问：这是代码的问题，还是我口径的问题？
    
      ---
    
      ## 🔴 前缀匹配的假阳性陷阱（规划接线时必踩）
    
      最常见的错：拿模块名/前缀去 grep 前端。
    
      **为什么错**：模块可能**部分挂载** —— 顶层 `router` 挂了，文件内 `extended_router` 没挂。此时**模块名和前缀同时对应可达与不可达两种路由**，前缀比对必然假阳性。
    
      实例：`agents` 的 `router` 挂 22 条，`extended_router` 挂 **0** 条（339 条不挂）。凡 `grep '/api/v1/agents'` 命中的前端调用，**无法判断命中的是哪一个**。
    
      **正确做法：按完整路径模板逐条匹配。**
      - 后端 `/api/v1/x/{id}` → 正则 `^/api/v1/x/[^/]+/?$`
      - 前端 `/api/v1/x/${ id }/y` → 先把 `${...}` 归一为通配，再转正则
      - 解析 `APIRouter(prefix=...)` 时**要能解析模块级字符串常量**（`PREFIX = "..."` → `APIRouter(prefix=PREFIX)`）；否则 prefix 取空 → 全量误判
    
      **分三档输出，别混为一谈：**
    
      | 档 | 含义 | 处置 |
      |---|---|---|
      | 🔴 前端在调 × 后端**确定不可达** | 功能确实是坏的 | 接线 **或** 改前端（取决于业务是否仍需） |
      | 🟠 前端在调 × 后端**源码模板都不存在** | 后端已删 / 拼写错配 | 删前端 或 修调用 |
      | ⚪️ 后端不可达 × 前端未引用 | 纯待接线 | 排期 |
    
      ---
    
      ## 文档漂移：解释性注释可能指向不存在的目录
    
      挂载白名单旁的解释性注释，常是了解「**为什么**这些模块不挂」的唯一依据 —— 而它可能已经烂掉。
    
      实例：`main.py` 注释写「已归档到 `archive/api_templates_2026-08/`，见那里的 `KEPT_ROUTERS.md`」，实测**该目录根本不存在**。
    
      **动作**：引用归档/说明文档前先 `ls` 一次。若不存在 → 这本身就是一条要报的发现（后来者会重做一遍你的全部分析）。
    
      ---
    
      ## 接线时的范围纪律
    
      「能导入」≠「该挂载」。白名单外往往有一批**敏感面**（凭据管理 / 企业配置 / 出站 webhook / SSRF 面）。
    
      **只挂「已存在调用方且确认 404」的那批**，每条都对应一个已经在跑的页面；其余按需单独评审。
      观察 `main.py` 的注释 —— 若历史上曾**为了压掉路由面**而把模块移出白名单，那"整体接线"就是反着来。
    
      ---
    
      ## 🔴 接线前必答：它返回的是**真数据**吗？
    
      **可达性排序 ≠ 价值排序。** "能导入 + 有路由 + 有前端调用方"只回答了**能不能接**，没回答**接上去会不会变成真功能**。
    
      实测教训：一次审计按可达性排出 45 条 P0 清单，动手前读代码发现其中 **41 条是硬编码 fixture**：
    
      ```python
      "total_tools": 18, "enabled_tools": 14, "success_events": 35,   # 全是字面量
      "progress": 72, "confidence": 0.92, "failure_reason": "tool timeout"
      ```
    
      接上去 = 把「**诚实的 404**」换成「**200 + 编造数字**」。
      **对控制台 / 数据类产品，后者更糟 —— 没有人会去质疑一个 200。**
    
      **分类脚本（AST，三个信号）：**
    
      ```python
      db      = [i for i in imports if any(h in i.lower() for h in DB_HINTS)]
      await_n = sum(1 for x in ast.walk(handler) if isinstance(x, ast.Await))
      svc_n   = handler 内 x.y(...) 且 y 命中 service/manager/store/planner/registry/engine
      ```
    
      | 判定 | 处置 |
      |---|---|
      | 有 DB 导入 或 `await_n > 0` | ✅ 真实现 → 值得接线 |
      | 仅 `svc_n > 0`、`await_n == 0` | 🟡 半真（如 `dispatch()` 返回真值、但外层数字是常量）→ **读代码确认** |
      | 全 0 | 🔴 fixture → **不要接线**。先决定：补实现 / 挂载+标注"演示数据" / 删前端 |
    
      **成本对比**：动手前读 1 个文件 = 1 次 Read。先接线再发现 = N 个页面显示假数字 + 返工 + 信任损失。
    
      ---
    
      ## 另一个放大器：前端 stub 会让「没接线」隐身
    
      `services/*.ts` 里若写着 `throw new Error('not supported by the backend')`，**它在构造 URL 之前就抛了**，于是：
    
      - 「前端在调」扫描**扫不到这个模块**（没有字面量路径）
      - 你会误判为"前端没需求，不排期"
      - 实际上后端是**真实现**，只是被前端 stub 拦住
    
      **判别**：对"后端有真实现、但前端扫不到调用"的模块，去 service 层找 `throw` / `unsupported`。
      **被 stub 拦住的真功能，优先级高于任何 fixture** —— 修完就是一个真实可用的功能，而不是把 404 换成假数据。
    
      ---
    
      ## 🔴 接线完成后必须变异验证（全绿 ≠ 有效）
    
      接线类改动是**最容易自我欺骗**的一类：`tsc exit 0` + vitest 全绿 + build 产出新 chunk，三件套全绿看起来完美，但断言完全可能是**空转**——测的是"组件能挂载"，不是"数据流没断"。
    
      **动作**：每加一条保护，就把它「拿掉」跑一次，**期望对应测试转红**。全绿掩盖空转，空转比没测更糟（它给你虚假的安全感）。
    
      一次完整的三段接线（store / API / 前端）本会话共做了 **17 条变异**（store 4 + API 6 + 前端 7）。典型变异：
    
      | 层 | 拿掉什么 | 期望转红的测试 |
      |---|---|---|
      | store | 未知字段守卫（`unknown = set(changes) - _MUTABLE_FIELDS`） | `test_update_rejects_unknown_field` |
      | store | 失败分支的临时文件清理（`Path(tmp).unlink(missing_ok=True)`） | `test_atomic_write_cleans_temp_on_failure` |
      | store | 逐条容错加载（坏记录跳过） | `test_load_skips_corrupt_record` |
      | API | `_get_or_404` 的跨租户判定 | 跨租户 → 404 的用例 |
      | 前端 | `payload.success === true` 改回 `!== false` | "缺失 success 视为失败"用例 |
      | 前端 | `result.message || fallback` 里去掉 `result.message` | "显示后端 message"用例 |
    
      ### 变异驱动脚本要写进仓库，不能现敲现丢
    
      把变异逻辑固化成脚本（本会话 `.workbuddy/scripts/mutate_*.py`），驱动 `subprocess` 跑 pytest / vitest：
    
      ```
      patch 某处 → 跑目标测试 → 断言"变红" → restore
      ```
    
      **脚本必须自带「模式已失效」自检**：patch 之前先断言原文能匹配到。否则一旦源码漂移，`str.replace` 会静默不生效（替换 0 次），跑出来的"测试没红"会被误读成"这条保护没用"，实际是**变异根本没打进去**——这是变异测试里最隐蔽的假阳性。
    
      ```python
      def mutate(path, old, new):
          src = path.read_text(encoding="utf-8")
          assert old in src, f"变异模式已失效（源码漂移？）: {old[:60]!r}"   # ← 少了这行，整批结论作废
          path.write_text(src.replace(old, new, 1), encoding="utf-8")
    
      def restore(path, original):
          path.write_text(original, encoding="utf-8")
      ```
    
      ### 三条「看起来在测、实际没测」的具体形态（都实测踩过）
    
      **① 断言「键存在」而响应模型有默认值 → 空转。**
      往带默认值的响应模型加字段后，`assert "new_field" in body` 在**构造点漏传该字段时照样通过** ——
      序列化会把已声明的字段一并写成 `null`。
      实测：4 条这样的断言，把构造点的传参拿掉后**全绿**，是被变异验证抓出来的。
      → 加字段后必须断言**值**：先写一个非默认值进去，再逐条返回路径确认「取回来的就是那个值」。
    
      **② 手写枚举字段的测试替身，会被新字段打挂。**
      `MagicMock()` 的未配置属性**自动生成子 Mock**。替身只枚举了旧字段时，新字段读出来是个 Mock，
      Pydantic 拒绝把 Mock 当 `str` → **端点直接 500**（实测一次挂掉 6 条）。
      → 加响应字段时**同步改替身**，并在旁边写明这个陷阱。
      → **不要**反过去让生产代码宽容非法类型 —— 那会把真实的数据类型错误一起吞掉，
      是用代码软化去迁就一个不严密的替身。
    
      **③ 回调契约从 `void` 改成「返回结果」后，裸替身会静默指向失败分支。**
      把 `onSave: () => void` 改成 `() => Promise<boolean>`（`true` = 成功）时，测试里常见的
      `onSave: vi.fn()` 会 resolve `undefined` → **每次都被判成失败**。而用例往往只断言
      `expect(onSave).toHaveBeenCalled()`，于是**照常全绿**，成功分支一次也没被走到。
    
      实测踩过两次（前端 `NotificationSettings` 与 `FeedbackDetail`，同一模式）。第二次才写成规则。
    
      → 改契约时**同步把替身喂成契约里的成功值**（`vi.fn(async () => true)`），并在旁边写明原因。
      → 只断言「被调用了」**区分不了分支**。每条 `if (ok) doX` 的保护都要**成对**测：
      `ok=false` 断「没做 X」，`ok=true` 断「做了 X」——缺一半，变异验证就会跑出 GREEN。
      → 跨用例共享 `mockProps` 时，缺 `beforeEach(() => vi.clearAllMocks())` 会让
      `toHaveBeenCalled()` 吃到上一个用例的残留调用 —— 全绿也可能是假的。
      → 区分「编辑态 / 只读态」这类分支，优先用**语义化查询**而非 class / DOM 结构：
      编辑态渲染 `<label htmlFor>` + `<select>`、只读态只是 `<p>Status</p>`，
      于是 `queryByLabelText('Status')` 天然就是判别式。
    
      ### 同一响应模型的「多处手抄构造」= 加字段的隐形税
    
      实测一次：某响应模型有 **5 处**逐字相同的构造（`_to_response` 本体 + 4 个端点各一份），
      第 5 份藏在 `list_feedback` 的**列表推导**里 —— 批量替换全部出现 (`replace_all`) 都覆盖不到它。
      加字段漏掉任何一处，该路径上的字段就**静默消失**（HTTP 200，值没了）。
      → `grep -c "ModelName("` 先数一遍构造点；**先收敛到唯一构造点，再加字段**。
    
      ---
    
      ## 🔴 判「这个失败是不是我造成的」：暂存对照法
    
      回归里出现一条失败，**别读代码猜**。用暂存对照法，30 秒给出决定性的答案：
    
      ```bash
      git stash push -- <你改动的文件…>     # 只暂存指定文件，别把无关改动一起收走
      <复跑那条失败用例>
      git stash pop
      ```
    
      - **stash 前 / 后失败完全一致** → 既有失败（pre-existing），与本次改动无关。
      - **stash 后转绿** → 就是本次改动造成的，去查自己的 diff。
    
      本会话实证：`tests/test_api_browser_desktop_memory.py::test_browser_api_session_lifecycle` 报 503，stash 掉 3 个改动文件后复跑失败完全相同 → 判定既有失败，不再纠缠。
    
      > 注意 `-- <path>` 是必需的：不带路径的 `git stash` 会把工作区全部改动卷走，`pop` 时的冲突反而更难收拾。
    
      ---
    
      ## 🔴 消费方测试漏掉的接线层：prop 契约 ≠ 页面透传
    
      **组件测试只测组件自己的 prop 契约**——"传进去的 `onTest` 被调用了"、"返回的 message 被渲染了"。它**测不到页面层怎么把 service 的返回值传下来**。
    
      而本案的用户 bug 恰好在那一层：`FeedbackDashboard` 里 `await feedbackService.testNotification(id)` **把返回值丢掉了**，于是无论后端说什么，UI 恒显示成功。
    
      ```
      service（改对了）→ 页面透传（漏了，没测）→ 组件（测了，但输入是 mock 的）
                           ↑ bug 在这里
      ```
    
      **判据**：接线改动结束后，对**真实调用链的每一层**各问一次"这一层的返回值被正确消费了吗"。组件层全绿不代表链路通。
    
      **修法**：补一条**页面级端到端**用例 —— 切到目标 tab → 点触发按钮 → 断言页面显示**后端返回的具体 message**，且**不出现**旧的假成功文案。两个断言缺一不可：只断"显示了成功"仍会被假绿穿透。
    
      ---
    
      ## 🔴 「同一件事两套口径」会让跨会话对比失效
    
      A/B 差集脚本里一个看似无关的选择会撞出不同的数字，让跨会话对比**悄悄失效**：
    
      - `entries` 是否排除 SPA catch-all 路由 → 决定了 494 还是 495。
      - 一旦两次脚本口径不同，差集看起来"有增量"，其实只是**口径变了**。
    
      **铁律**：
    
      1. **冻结口径并写进脚本注释**——A/B 脚本要么一直是这份，要么把口径差异显式说明。
      2. **`B \ A` 必须为空**。若 B 里有 A 没有的路径，说明 B 把"自己引入的新路由"也算进了增量，差集不可信。
      3. `uniq_paths` **必须独立于 method 展开**取：
    
      ```python
      uniq_paths = {r.path for r in app.routes if hasattr(r, "path")}
      ```
    
      若按 `(method, path)` 逐条展开再 `set` 路径，会漏掉**只有 HEAD/OPTIONS 或空 method** 的路由，数字对不上。
    
      ### 附：`-qq` 陷阱会把计数行吞掉
    
      `pytest.ini` 的 `addopts` 若已有 `-q`，命令行再写 `-q` 就是 `-qq`（超静默）——**摘要计数行完全消失**，只剩点号进度。你会以为"没有计数"是异常，实际是静默档位偏高。
    
      **取计数时不带 `-q`**；要静默也只静默一层。长测试重定向到文件再读，不要靠终端里现存的滚动输出。
