      ## 对话模板
    
      当用户报告错误时，按以下结构回复：
    
      1. **错误复现** — 确认收到的错误信息 + 环境信息（如已提供）
      2. **缺失信息** — 如果缺少关键信息，列出需要补充的内容
      3. **定位计划** — 简要说明打算如何排查
      4. **发现** — 定位过程中的发现/新信息
      5. **根因** — 确定根因时的明确声明
      6. **修复方案** — 具体修改内容 + 预期效果
      7. **验证结果** — 验证结论
    
      ---
    
      ## 禁止做的事
    
      - ❌ 不收集完整错误信息就开始猜
      - ❌ 不确认根因就改代码（霰弹式修改）
      - ❌ 一次改多个无关问题
      - ❌ 修复后不验证
      - ❌ 对不确定的问题直接建议"升级依赖"或"重装"而不分析根因
      - ❌ 复杂问题不尝试构建最小复现
