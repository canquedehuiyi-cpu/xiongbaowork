  - slug: frontend-build-verification
    title: frontend-build-verification
    summary: 验证前端改动"真的生效"的纪律——断言构建产物 CSS、对测试断言做变异验证、避免在压缩产物上写正则。当你在改 Tailwind/Vite/PostCSS 前端样式、组件或路由，需要证明改动确实编译进产物、且测试断言不是空转时使用。触发词…
    instructions: |-
      # 前端构建产物验证纪律
    
      解决两个反复出现的问题：
    
      1. **`vite build` exit 0 ≠ 样式生效。** 任意值类（`bg-[var(--x)]`）写错、CSS 变量未定义、PostCSS 插件没处理、
         类名没被 Tailwind 扫到 —— 全都不会让构建失败，只会让浏览器里没样式。
      2. **测试一次就绿 ≠ 测试有鉴别力。** 断言可能永远无法失败（写了但测不到东西），整体"全绿"完全掩盖它。
    
      ---
    
      ## 规则 1：断言**产物 CSS**，不要只看 exit code
    
      改完样式必须读构建产物里的 CSS，确认你写的类真的被编译出来了。
    
      ```bash
      cd <frontend>
      npx tsc --noEmit          # 类型
      npx vite build            # 构建
      ```
    
      ### 找对主 CSS 文件（第一个坑）
    
      ```bash
      # ❌ 会抓到某个页面级的碎 CSS（几百字节），不是主包
      CSS=$(find dist -name "*.css" | head -1)
    
      # ✅ 按体积/命名选主包
      CSS=$(ls -S dist/css/main-*.css | head -1)   # 或先 ls -la 肉眼看
      ```
    
      构建产物常有多个 CSS：`main-*.css`（主包）+ 按页拆分的 `<Page>-*.css`。
      **先 `ls -la dist/css/` 确认体积**，几 KB 的页面级文件直接忽略。
    
      ### 用 Python 直读，不要写正则（第二个坑）
    
      **压缩后的 CSS 里，选择器是被转义的**，用 `grep -F` 或朴素正则极易假 MISS：
    
      | 源码里写的 | 产物里的样子 |
      |---|---|
      | `bg-[var(--accent)]` | `.bg-\[var\(--accent\)\]` |
      | `active:scale-[0.98]` | `.active\:scale-\[0\.98\]:active{--tw-scale-x:.98;…}` |
      | `@media (prefers-reduced-motion:reduce)` | 常被合并/重排，选择器列表末尾元素后面**直接**跟 `{` |
    
      ```bash
      # ✅ 存在性计数用 str.count —— 稳
      python -c "
      css=open('dist/css/main-XXXX.css',encoding='utf-8').read()
      for t in ['var(--accent)','--surface-raised-hover','.badge-tint','color-mix']:
          print(t, css.count(t))
      "
      ```
    
      ```bash
      # ✅ 要看规则内容，就把整个规则块 dump 出来看 —— 比正则可靠
      python -c "
      import re
      css=open('dist/css/main-XXXX.css',encoding='utf-8').read()
      for m in re.finditer(r'@media\s*\(prefers-reduced-motion[^{]*\{', css):
          i=m.end()-1; depth=0
          while i<len(css):
              if css[i]=='{': depth+=1
              elif css[i]=='}':
                  depth-=1
                  if depth==0: break
              i+=1
          print(css[m.start():i+1])
      "
      ```
    
      **不要**用正则去匹配压缩后的选择器来判断"类是否存在"—— 判断存在性就用 `count()`，
      要看语义就 dump 块。本会话在这一点上连续栽了三次。
    
      #### 正向断言的粒度：断言**选择器**，不要断言**声明计数**（第四个坑）
    
      "某声明出现次数 > 0" 是个**无效的正向断言** —— 同一声明几乎总被多条规则复用：
    
      ```python
      # ❌ 产物里有 7 处 `background-color:var(--surface-raised)`
      #    （`.shimmer`、别的类也在用）。你抹掉想验证的那一处，断言照样通过 → 变异存活。
      assert css.count('background-color:var(--surface-raised)') > 0
    
      # ✅ 断言 Tailwind 为**这个类**生成的转义选择器 —— 唯一性有保证
      assert css.count('bg-\\[var\\(--surface-raised\\)\\]') > 0
      ```
    
      对应地，**变异要抹掉「选择器」而不是「某一条声明」**，断言才会红。
      （计数参考值可以照旧打印出来，但**不要拿它做断言**。）
    
      > 另：写这类断言时正则里的**括号要转义**。`r'background-color:var(--surface-raised)'`
      > 匹配的是字面量 `var--surface-raised`（因为 `(...)` 成了分组）→ 静默返回 0，
      > 看起来像"样式没生成"。用 `r'background-color:var\(--surface-raised\)'`。
    
      ### Tailwind 特定陷阱：**变量任意值 + 透明度修饰符 = 静默失效**（第三个坑）
    
      Tailwind v3 **不支持** `-[var(--x)]/opacity` 组合。实测（v3.3，`npx tailwindcss` 探针）：
    
      ```css
      /* 输入：class="text-[var(--danger)] border-[var(--danger)]/30 bg-[var(--danger)]/10" */
      .text-\[var\(--danger\)\]  { color: var(--danger); }          /* ✅ 生成 */
      /* border-[var(--danger)]/30  —— 产物中不存在这条规则，零 CSS */  /* ❌ 静默丢弃 */
      /* bg-[var(--danger)]/10     —— 同上 */                        /* ❌ 静默丢弃 */
      ```
    
      **不报错、不警告；`vite build` / `tsc --noEmit` / `vitest` 全绿，但边框和背景色直接消失。**
    
      对照 —— 静态色值是支持的：`border-[#dc2626]/30` → `border-color: rgb(220 38 38 / 0.3)`。
      **只有「CSS 变量 + `/opacity`」这个组合会丢。**
    
      **关键推论 —— 断言方式必须升级：** 只断言 `css.count('var(--danger)') > 0` **抓不到这类丢失**。
      因为别处不带 opacity 的 `text-[var(--danger)]` 仍然生成了，计数非零，而 36 处 `/30` 已经没了。
      → 必须**按「工具类 + 令牌 + 透明度」的完整组合**去 dump 规则块确认存在。
    
      **替代写法（三条均实测可用）**：
    
      | 写法 | 产物 | 代价 |
      |---|---|---|
      | `border-[color-mix(in_srgb,var(--danger)_30%,transparent)]` | `border-color: color-mix(in srgb,var(--danger) 30%,transparent)` | 需 Chrome 111+ / Safari 16.2+ / FF 113+（2023） |
      | `border-[var(--danger-line)]` | `border-color: var(--danger-line)` | 需新增 rgba 令牌 |
      | `bg-[rgb(var(--danger-rgb)/0.1)]` | `background-color: rgb(var(--danger-rgb)/0.1)` | 需 RGB 分量令牌（`220 38 38`） |
    
      ### 通用前置动作：**批量替换样式类前，先跑 Tailwind 探针**
    
      不要假设某个任意值写法可用 —— 用 CLI 单独验证（281ms，不碰产品代码）：
    
      ```bash
      TMPD="/c/Users/<user>/AppData/Local/Temp/twprobe"; mkdir -p "$TMPD"
      echo '<div class="你打算用的-类名 逗号或空格分隔"></div>' > "$TMPD/probe.html"
      npx tailwindcss -c tailwind.config.js \
        --content "C:/Users/<user>/AppData/Local/Temp/twprobe/probe.html" \
        -o "C:/Users/<user>/AppData/Local/Temp/twprobe/out.css"
      grep -nE '<关键词>' "$TMPD/out.css"    # 有规则=可用；没有=静默失效
      ```
    
      注意：`--content` 要传 **Windows 路径**（tailwindcss 是 node 程序），而 `-o` 用 MSYS 路径给 shell 读没问题。
    
      ---
    
      ## 规则 2：新写的断言必须做**变异验证**
    
      "测试跑绿了"不是证据。必须**故意引入 bug、确认测试会红**，否则你无法区分"测试通过"和"测试测不到东西"。
    
      > **要批量做变异（写 `mutate_*.py` 驱动脚本）时，先加载 `mutation-driver-engineering`** ——
      > 那里讲驱动脚本自己怎么骗人：判定要**三重**（只看退出码会被 atexit 守卫/语法错误骗成"全红"）、
      > 还原时**换行必须无损**（`read_text`/`write_text` 默认会刷掉整文件换行风格）、Windows 下 `shell=False`、
      > 以及「变异存活 = 测试假绿」的排查顺序。本节讲的是**断言怎么选变异**，那节讲的是**驱动怎么写**。
    
      ### 做法：一个 token 的变异
    
      尽量选**最小**的变异，最好只改一个词，这样失败原因无歧义：
    
      | 想验证的行为 | 最小变异 | 期望 |
      |---|---|---|
      | 链接走客户端路由（非整文档导航） | 给 `NavLink` 加 `reloadDocument` | 测试红 |
      | 前缀匹配被 `end` 阻止 | 去掉 `end` / 改成 `end={false}` | 测试红 |
      | 某个守卫生效 | 把守卫条件改成恒真 | 测试红 |
      | 某个默认值 | 把默认值改掉 | 测试红 |
    
      ```bash
      # 改一处 → 只跑相关测试文件 → 必须看到失败 → 恢复
      npx vitest run src/__tests__/<file>.test.tsx; echo "exit=$?"   # 期望 exit=1
      ```
    
      ### 变异"存活"怎么办
    
      变异后仍全绿 = **你的断言是空转的**。这比没有测试更糟（给虚假信心）。三条出路：
    
      0. **先怀疑断言函数自己写错了** —— 本会话实测：辅助函数签名 `run(label, sb, sa, …)`
         里却用了**全局** `SEL_B/SEL_A`，参数压根没生效 → 变异数据被忽略 → 存活。
         修成用参数后才变红。**变异验证的第二种价值：它也是"断言自身"的测试。**
      1. **重写断言**，指向真正可观测的行为（状态变化、DOM 属性、返回值），而不是"渲染没报错"。
      2. **删除断言**，并在注释里写明为什么它无法失败（例如该行为由依赖库结构性保证）。
         例：`react-router 7` 的 `to="/"` 本就无法前缀匹配，所以"根路由不在子路由高亮"的断言永远不可能红 → 删掉。
    
      ### 逐条验证，不要只验证整体
    
      6 条断言里可能只有 1 条是空转的，而"整体全绿"会完全掩盖它。**对每条关键断言各做一次变异。**
    
      ---
    
      ## 规则 3：优先写**行为断言**，而不是快照/存在性断言
    
      ```tsx
      // ❌ 弱：渲染不报错 —— 几乎不可能失败
      render(<Shell />)
      expect(screen.getByRole('navigation')).toBeInTheDocument()
    
      // ✅ 强：断言真实机制
      // 路由托管的链接会对点击调用 preventDefault → dispatchEvent 返回 false；
      // 退回 <a href> 则返回 true。这是可失败的行为断言。
      const notCancelled = fireEvent.click(link)
      expect(notCancelled).toBe(false)
    
      // ✅ 强：断言状态确实推进了
      expect(screen.getByTestId('probe')).toHaveTextContent('/tasks')
      ```
    
      ---
    
      ## 规则 4：改前端交互前，先确认测试环境的前置约束
    
      不核实这些，测试会以"看不见的原因"失败或静默测错：
    
      | 检查 | 命令 / 位置 | 常见坑 |
      |---|---|---|
      | 测试环境 | `vitest.config.ts` 的 `environment` | 需 `jsdom` 才有 DOM |
      | RTL 是否自动 cleanup | `globals` 开关 | `globals: false` 时**不会**自动 cleanup，需在 setup 里手动 `cleanup()` |
      | 自定义 hook 是否要求 Provider | grep hook 里的 `throw` | 如 `useI18n` 无 Provider **直接抛错** → 测试必须包 Provider |
      | store 是否持久化 | grep `persist` | **`localStorage.clear()` 清不掉已 hydrate 的状态**，必须显式 `setState` 重置 |
      | 是否要求 Router 祖先 | grep 新引入的 `useLocation`/`useNavigate` | `useLocation` 无 `<Router>` 会抛错；测试须包 `MemoryRouter` |
      | 样式是否被 mock | `test.css` | 默认不处理 CSS，别断言计算样式 |
    
      另：在测试文件里用 `React.FC` 而**不 import React** 会类型报错 —— `jsx: react-jsx` 只免除了 JSX 对 React 的引用，
      不提供 `React` 命名空间。用普通箭头函数。
    
      ---
    
      ## 规则 5：把字面量替换成令牌时，必须做**语义等价性核对**
    
      `bg-[#dc2626]` → `bg-[var(--danger)]` 只有在**令牌值 == 原字面量**时才叫「零视觉变化」。
      不核对这三项，"零变化"就是空话：
    
      1. **`:root` 下令牌值 == 被替换值？** —— 用 `css.count()` 或直接读 `:root` 块比对。
         不等 → 浅色主题就已经变了。
      2. **`.dark` 下值不同吗？** —— 绝大多数设计系统的语义色在暗色下是**另一组值**
         （例：`--danger` 浅色 `#dc2626` / 暗色 `#f87171`）。
      3. **那些硬编码是否都在主题三元内？** —— 如果在，暗色分支根本走不到它，暗色也零变化；
         如果是**裸硬编码**（不区分主题），替换后暗色下就会跟着令牌走。
    
      ```diff
      # ✅ 在三元内：暗色分支原样保留，两个主题都零变化
      - isDark ? 'bg-slate-950 text-slate-200' : 'bg-[#fafafa] text-[#333333]'
      + isDark ? 'bg-slate-950 text-slate-200' : 'bg-[var(--bg)] text-[var(--fg)]'
    
      # ⚠️ 裸硬编码：暗色下会从「固定浅色」变为「跟随主题」——通常是修复，但属行为变化
      - <div role="alert" className="text-[#dc2626]">
      + <div role="alert" className="text-[var(--danger)]">
      ```
    
      **判定陷阱：「同行是否含 `isDark`」是高误报判据。**
      三元的**分支行**往往在下一行；`success ? A : B` 这类**非主题**三元也会命中。
      → 要判定必须**读完整 `git diff`**（本会话在 `AgentsPage.tsx` 上一目了然）。
    
      **语义色改变是改进还是回归？** 错误/成功/警告提示在暗背景上改用亮色变体 = 可访问性改进
      （对比度从 ~3.5:1 提到 ~9:1）。**结论：报告为「设计系统期望行为，非回归」，并在 commit 里写明。**
      不要隐瞒这类变化——用户需要知道暗色主题下会看到什么。
    
      ---
    
      ## 规则 6：**纯新增**改动，用「产物选择器集合对比」证明无回归
    
      新增 CSS（而非修改现有规则）时，`tsc` / `vitest` / `build` 全绿**证明不了"没动坏东西"** ——
      它们根本不看 CSS 语义。唯一可信的产物级证据是**前后选择器集合的差集**：
    
      ```bash
      cp dist/css/main-*.css ../artifacts/main_before.css   # 1) 改动前留一份产物
      npx vite build                                        # 2) 重新构建
      ```
    
      ```python
      # 3) 大括号配平扫描，提取所有 `{` 前的选择器/at-rule 前缀，断言差集为空
      def selectors(css):
          out, i, n = [], 0, len(css)
          while i < n:
              if css[i] == "{":
                  j = i - 1
                  while j >= 0 and css[j] in " \n\t": j -= 1
                  k = j
                  while k >= 0 and css[k] not in "};": k -= 1
                  out.append(css[k+1:j+1].strip()); depth, i = 1, i + 1
                  while i < n and depth:
                      if css[i] == "{": depth += 1
                      elif css[i] == "}": depth -= 1
                      i += 1
              else: i += 1
          return out
    
      gone = set(selectors(before)) - set(selectors(after)) - EXPECTED_GONE
      assert not gone, f"意外丢失: {gone}"
      ```
    
      - `EXPECTED_GONE` = **白名单**（本次**故意**删掉的选择器）。没有就留空集。
      - 同时断言新增项存在：`set(after) - set(before)` 非空且包含你预期的那几个。
      - 实测：卡片原语改造 929 → 928，唯一消失的正是预期的 `.rounded-2xl` → 无回归成立。
    
      ### 第五个坑：负向断言**别查字面量**，查**实际生效的声明值**
    
      ```python
      # ❌ 会假阳性：index.css 里的「禁用语句」本身含该词
      assert css.count("rounded-2xl") == 0
      #    .console-root .rounded-2xl { border-radius: 0 }   ← 这是在"禁用"，不是"使用"
    
      # ✅ 查它真正产生的效果
      assert css.count("border-radius:1.5rem") == 0   # 24px，即 rounded-2xl 的实际效果
      ```
    
      ---
    
      ## 快速检查清单
    
      - [ ] `tsc --noEmit` 通过
      - [ ] `vite build` 通过
      - [ ] **认对主 CSS**（`ls -la dist/css/`，不要 `find | head -1`）
      - [ ] 新类/新 CSS 变量在产物里 `count() > 0`
      - [ ] **带透明度修饰符的任意值**：按「工具类+令牌+`/NN`」完整组合 dump 规则块确认
            （`-[var(--x)]/NN` 会静默失效且 `count('var(--x)')` 抓不到 —— 见规则 1 第三个坑）
      - [ ] 批量替换样式类**之前**，已用 tailwind 探针验证目标写法能生成规则
      - [ ] **负向断言**：被替换掉的旧类名已从产物中消失
      - [ ] 动效类在 `prefers-reduced-motion` 兜底块里
      - [ ] 每条关键断言都做过**变异验证**，其中没有"变异存活"的
      - [ ] 空转断言已重写或删除，并注明原因
      - [ ] 全量测试跑过，记录新的基线数字（files/tests）
    
      ---
    
      ## 附：一次真实的排查路径（可作模板）
    
      1. 写测试 → 全绿 → **不信**，做变异验证。
      2. 变异 A（`reloadDocument`）→ 测试红 ✅ 断言有效。
      3. 变异 B（去掉 `end`）→ **仍然全绿** ⚠️ 空转断言暴露。
      4. 读依赖库源码定位真实语义（`node_modules/<pkg>/dist/.../chunk-*.mjs`，搜关键变量名）→
         发现 `to="/"` 的匹配探针看 `charAt(1)`，根路由本就无法前缀匹配 → 该断言删除。
      5. 顺手用同一份语义检查**其他**同类项 → 发现 `/workflows` 与 `/workflows/schedules` 会双重高亮 → 真缺陷，修复。
      6. 对新断言再做变异 C → 测试红 ✅ 修复有效且被覆盖。
      7. 恢复修复、跑全量、记录基线。
    
      **每一步都以"可失败"为准绳** —— 变异不能红的断言，等于没有断言。
