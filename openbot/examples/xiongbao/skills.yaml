  - slug: cursor-memory-backup
    title: cursor-memory-backup
    summary: 备份/恢复/校验 Cursor 的会话记忆（composer 会话正文、消息、检查点、CLI transcript）。当用户问「怎么备份 Cursor 会话/聊天记录」「Cursor 对话丢了怎么找回」「迁移 Cursor 到新机器」「导…
    instructions: |-
      # Cursor 会话记忆备份
    
      ## 何时用
    
      - 用户要备份 / 迁移 / 找回 Cursor 的会话、聊天记录、composer 会话。
      - 用户说「Cursor 里的对话不见了」——先按本文确认数据是否还在库里，再谈恢复。
      - 用户要换机器 / 重装系统，需要把 Cursor 上下文搬过去。
    
      ## ⚠️ 头号误解：`globalStorage` 是数据，不是缓存
    
      用户（尤其中文教程）常把这条当成"清缓存"：
    
      ```bat
      rd /s /q %APPDATA%\Cursor\User\globalStorage
      ```
    
      **它会删掉全部会话。** 该目录实测构成：
    
      | 内容 | 体积 | 性质 |
      |---|---|---|
      | `state.vscdb` | 2.1 GB | 会话正文 |
      | `anysphere.cursor-agent-worker` | 247 MB | CLI agent 工作数据 |
      | `ms-edgedevtools.vscode-edge-devtools` | 122 MB | 扩展存储 |
      | `conversation-search.db` | 4.3 MB | 检索索引 |
      | `storage.json` | 16 KB | 全局状态 |
      | `anysphere.cursor-retrieval` | **1.1 MB** | ← 只有这个是真缓存（代码索引，自动重建） |
    
      所以备份 `global` 段**默认整目录递归**，别只抓那两个 `.db`。
      纯缓存其实在 `%APPDATA%\Cursor\` 下（`CachedData` / `Cache` / `CachedExtensionVSIXs` / `GPUCache` /
      `logs` / `Code Cache`），那才随便删，实测合计约 378 MB，与 `User\` 平级、不在 `User\` 里面。
    
      同理别当缓存删的：`User\workspaceStorage`（会话↔项目绑定）、`User\History`（**本地文件编辑历史**，
      不是缓存）、`~/.cursor/projects`。
    
      **`%APPDATA%\Cursor\Backups` 实测是空的** —— Cursor 不替用户留底，别指望它。
    
      ## 核心心智模型（这是最容易搞错的地方）
    
      会话数据分散在**两处 SQLite，必须成对备份**：
    
      | 位置 | 内容 |
      |------|------|
      | `<CursorUser>/globalStorage/state.vscdb` | **会话正文**：`cursorDiskKV` 表里 `composerData:*`（一会话一条）、`bubbleId:*`（每条消息）、`checkpointId:*`（rewind）、`agentKv:*`；以及 `composerHeaders` 表（会话索引） |
      | `<CursorUser>/workspaceStorage/<hash>/state.vscdb` + `workspace.json` | 项目↔会话绑定、当前打开的会话标签 |
    
      两个计数口径别混：`composerData.fullConversationHeadersOnly` 的长度是**对话轮次**
      （`type:1` = 用户、`type:2` = AI），而 `bubbleId:` 行数是**底层气泡数**（含工具调用等），后者通常是前者的 5~6 倍。
      报数时说清用哪个口径。
    
      `<CursorUser>` = `%APPDATA%\Cursor\User`（Win）/ `~/Library/Application Support/Cursor/User`（macOS）/
      `~/.config/Cursor/User`（Linux）。`.vscdb` 就是 SQLite。
    
      **只恢复全局库 → 会话正文在但侧边栏列不出来。两者必须来自同一次备份。**
    
      ### 版本差异（旧教程会误导）
    
      旧版把会话索引放在工作区库 `ItemTable['composer.composerData']` 的 `allComposers` 数组里；
      2026-09 版已迁到**全局库的 `composerHeaders` 表**。网上大量教程仍在教改工作区库，对新版无效。
      **判断方法**：查全局库有没有 `composerHeaders` 表。
    
      ```sql
      SELECT name FROM sqlite_master WHERE type='table';           -- 期望含 composerHeaders
      SELECT COUNT(*) FROM cursorDiskKV WHERE key LIKE 'composerData:%';  -- 会话数
      SELECT COUNT(*) FROM cursorDiskKV WHERE key LIKE 'bubbleId:%';       -- 消息数
      ```
    
      ### 其他位置
    
      - `<CursorUser>/globalStorage/conversation-search.db` — 会话全文检索索引（FTS5，`conversations` 表）。
      - `~/.cursor/projects/<项目>/agent-transcripts/<uuid>/<uuid>.jsonl` — **Cursor CLI** 的逐条会话流水，纯文本、最易读、最适合检索。
      - `~/.cursor/plans/*.plan.md`、`~/.cursor/agents/` — 计划与 agent 配置。
      - 项目内 `.cursorrules` / `.cursor/rules/**` — 规则，随 Git 走。
    
      ## 必须排除的噪音
    
      `~/.cursor/projects/*/agent-tools/`、`*/mcps/`、`*/node_modules/` 是**工具缓存**，不是会话记忆。
      实测某机器这堆占 3,037 个文件 / 207 MB（单个文件最大 61 MB）。默认排除，归档从 602 MB 降到 596 MB、
      文件数从 3,349 降到 311。
    
      ## 恢复后的验证（必须做，且是唯一可信的成功判据）
    
      恢复脚本返回"写入 N 个文件完成"**不等于**恢复成功。可信判据是：**让 Cursor 启动并实际用一会儿，再读库**：
    
      ```
      composerData / bubbleId / composerHeaders 三个计数 ≥ 快照时的值，且会话数只增不减
      integrity_check = ok
      state.vscdb-wal 有活跃写入，conversation-search.db-wal 已重建索引
      ```
    
      实测成功的样子：快照时 61 会话 → Cursor 用起来后 62 会话、bubbleId 111,694 → 111,704。
      **计数在长，就证明 Cursor 正在这个恢复后的库上正常工作。**
    
      配套：恢复前留 `*.pre-restore` 回滚点；恢复后用 `inventory --db <恢复后的 state.vscdb>` 逐项目清点。
    
      ## 排查"用户以为恢复搞坏了东西"
    
      用户常在恢复后看到无关报错就归因于恢复。**先做三重排除，再谈原因：**
    
      1. **证明恢复碰过哪些路径**：从 `MANIFEST.json` 统计 `target` 的前缀分布。
         例如"落在 `D:` 盘的目标数 = 0"就一句话排除了所有项目源码嫌疑。
      2. **测试当下可写性**：用 `open(p, 'r+b')` 只开不写（不改内容）判断文件是否可写、目录是否可写。
         瞬时错误事后测往往已恢复。
      3. **检查 `%APPDATA%\Cursor\Backups\<hash>\file\`**：为空 = 没有未保存缓冲区 = 不存在
         "用旧缓冲覆盖新文件"的可能。
    
      ### 最高频的假警报：`git diff` 报整文件被改
    
      `aiConfigService.js` 实测 `git diff --stat` 报 **2777 行变更**，加 `--ignore-cr-at-eol` 后塌缩到 **31 行**。
      原因：仓库 `core.autocrlf=true`，而工作区文件是纯 LF（`CRLF` 计数为 0），git 把整个文件判为全改。
      **看到"整个文件被覆盖"的 diff，第一步先跑 `git diff --ignore-cr-at-eol --stat`。**
    
      `git -C` 传 MSYS 风格 `/d/...` 路径会报 `cannot change to ... No such file or directory`，
      必须传 `D:/...`（与调用 Windows 原生 Python 的要求相同）。
    
      ## 执行
    
      脚本在 `scripts/cursor-memory-backup.py`，只用标准库（Python 3.8+）。
    
      ```bash
      python scripts/cursor-memory-backup.py backup                    # 默认：D:\CursorMemoryBackup（Win）或 ~/CursorMemoryBackup
      python scripts/cursor-memory-backup.py backup --out /path --only global,workspace,search,cli
      python scripts/cursor-memory-backup.py inventory <archive.zip>   # 按项目清点会话（不恢复，回答"里面到底有什么"）
      python scripts/cursor-memory-backup.py list    <archive.zip>     # 会话数、工作区映射、成员列表
      python scripts/cursor-memory-backup.py verify  <archive.zip>     # CRC + sha256 + integrity_check
      python scripts/cursor-memory-backup.py restore <archive.zip> --yes
      ```
    
      关键设计：
      - `global` 段 = **整个 `globalStorage` 递归**（因为用户常整个目录删）；`--light` 只取
        `state.vscdb` / `conversation-search.db` / `storage.json` 三项。
      - 用 `VACUUM INTO` 做在线快照 → **Cursor 开着也能备，且事务一致**（`mode=copy` 才要求退出 Cursor）。
        实测在 `mode=ro` 的只读连接上 `VACUUM INTO` 可正常工作，失败时自动退回 `Connection.backup()`。
      - `-wal` / `-shm` 附属文件跳过：`VACUUM INTO` 已把内容并进主库。
      - 顺手产出 `MANIFEST.json`：文件→原始绝对路径映射、sha256、`workspace_map`（hash→项目路径）。
        恢复靠它回写原位。
      - `inventory` 会用 `composerHeaders.workspaceId` join `workspace_map`，把会话按项目分组，
        并标出 `bubbles==0` 的**空壳会话**——这些是备份前就已损坏的，恢复也救不回来，必须如实告知用户。
    
      手动备份（用户不想跑脚本时）：退出 Cursor → 拷 `globalStorage/state.vscdb`、
      `globalStorage/conversation-search.db`、整个 `workspaceStorage/`、`~/.cursor/projects/`，
      并导出一份 `workspaceStorage/*/workspace.json` 作为路径映射表。
    
      ## 踩坑清单（都是实测踩出来的）
    
      1. **往 C 盘写会爆盘**。源库常见 2 GB+，快照需要等量临时空间。先看剩余空间，输出目录默认选非系统盘。
      2. **`tasklist` 在中文 Windows 输出 GBK**。用 `subprocess.run(..., text=True)` 会抛
         `UnicodeDecodeError`，被 `except` 吞掉后**误判为「Cursor 未运行」**，进而错误地选了 copy 模式。
         必须 `capture_output=True` 拿 bytes 再 `.decode('utf-8', 'replace')`。
      3. **SQLite 有 WAL**。`state.vscdb-wal` 里有尚未落盘的新消息。退出 Cursor 后直接拷文件也要连同
         `-wal` / `-shm` 一起，或者干脆走 `VACUUM INTO`。
      4. **`VACUUM INTO` 会顺手压缩**：2.1 GB 源库 → 归档后 596 MB（含 zip）。别被"归档比源库小"吓到以为漏了数据，
         用 `verify` 里的 `integrity_check` 证明。
      5. **受管沙箱会拦截批量删除**。脚本跑完打包后清理临时展开目录时，可能被
         `SAFE_DELETE_BULK_CONFIRM_REQUIRED` 之类的守卫拒绝。脚本已改为逐文件删除兜底 + 打印残留路径，
         不要为了让脚本"干净退出"去绕过守卫。
      6. **恢复是破坏性的**。必须 Cursor 完全退出；脚本会要求 `--yes`，并把现有文件另存 `*.pre-restore`。
      7. **不要计划在 macOS 上用 `ccb` 的 Windows 版**：第三方工具 `nikitaycs50/ccb` 只有 macOS/Linux 预编译包，
         思路一致（在线快照 + manifest + 校验），Windows 上用本技能脚本即可。
      8. 会话数据里可能含密钥、内网地址。归档默认落在本机盘，**别随手传到公开位置**。
      9. **用户要"清缓存"时，先分辨他到底要清哪个目录**。若命令里出现
         `Cursor\User\globalStorage` / `workspaceStorage` / `User\History`，那是在删数据，必须先备份 + 当面警告。
         正确的清缓存顺序：**① 先备份 → ② 完全退出 Cursor（托盘也退）→ ③ 再删 → ④ 删完先别启动 Cursor，直接恢复**。
         顺序不能颠倒：Cursor 运行时 `state.vscdb` 被占用、WAL 里可能有未落盘消息，运行中删会删不干净或状态错乱。
      10. **不要在没有备份的情况下替用户执行任何删除**。`AppData` 属于「个人文件高危区」，
         即便用户坚持，也应先出报告 + 警告 + 让用户自己确认，由用户执行删除命令。
    
      ## 交付时的自检
    
      - `verify` 三项全过：CRC、sha256、每个 `.vscdb` 的 `PRAGMA integrity_check` = `ok`。
      - **显式确认覆盖了 `globalStorage/storage.json`**：只抓两个 `.db` 的旧版本会漏掉它，
        而用户若删整个 `globalStorage`，这个文件就没了。用 `zipfile.namelist()` 逐项断言，
        不要凭"脚本写了就有"下结论。
      - `inventory` 里会话数/对话消息数 > 0，且每个项目能对上用户的真实项目路径。
      - 明确告知用户：**归档路径、体积、源库体积**、**空壳/已中断会话数量**，以及 C 盘剩余空间。
