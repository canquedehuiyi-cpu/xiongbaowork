  - slug: workbuddy-safe-delete-guard
    title: workbuddy-safe-delete-guard
    summary: 诊断并修复 WorkBuddy 沙箱环境下"安全删除批量守卫"引发的测试/启动期崩溃。当 pytest 出现 `TestClient.__enter__` → `concurrent.futures._base.CancelledErro…
    instructions: |-
      # WorkBuddy 安全删除批量守卫：诊断与修复
    
      ## 何时用
    
      在本机（Windows + WorkBuddy 沙箱）出现以下**任一**征兆：
    
      - pytest 报 `TestClient.__enter__` → `concurrent.futures._base.CancelledError`，整批测试 setup 全灭；
      - app lifespan 被取消、`SystemExit: 1` 出现在与测试无关的位置；
      - stderr 出现 `[safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED]` 或 `SAFE_DELETE_BULK_GUARD_ERROR`；
      - **同一测试"单跑绿、批跑红"或"这次绿、下次红"**（这个最关键）；
      - 某"健康检查/探测"函数在启动路径上调用后崩溃。
    
      ## 机制（先理解，再动手）
    
      运行时通过 `sitecustomize.py` 注入 safe-delete shim，把删除改为"移入回收站"，并有**批量守卫**：
    
      | 项 | 值 |
      |---|---|
      | 阈值 | **不要硬编码**：宿主机通过 `CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD` 注入（2026-09-15 实测 = **50**；shim 内置 `DEFAULT_THRESHOLD` 才 20）。**读环境变量，或从报错原文的 `threshold` 字段取** |
      | 计数键 | `requestId` = `CODEBUDDY_CONVERSATION_REQUEST_ID`（**整轮累计**）；未设则退化为 `CODEBUDDY_TOOL_CALL_ID`（每次工具调用） |
      | TTL | 7 天（`TURN_STATE_TTL_MS`） |
      | 状态文件 | `%TEMP%/codebuddy-safe-delete-bulk/<sha256(CODEBUDDY_SESSION_ID)>/state.json` |
      | 越阈行为 | 守卫 `exit 2` → shim `_exit_bulk_guard_control()` **抛 `SystemExit(1)`**；报错原文形如 `{"count":72,"threshold":50,"scope":"turn","targets":[...]}` |
      | **被拦截的调用面** | **不限于 Python / Node**：Git Bash 里 `rm` / `unlink` / `rmdir` **也被包装**（`BASH_FUNC_rm%%` 等 shell 函数）→ **bash 层的删除同样计数**。想"改用 shell 命令删"绕开是行不通的 |
    
      **致命点**：`SystemExit` 继承 **`BaseException`**，`except Exception` **抓不到**。若发生在 ASGI 启动路径（lifespan / anyio TaskGroup），会取消整个 app lifespan。
    
      ## 诊断步骤
    
      ```bash
      # PATH 前置（内置 shim 会让 ls/grep 等缺失）
      export PATH="/c/Users/<user>/.workbuddy/binaries/PortableGit/versions/1.2.0/usr/bin:$PATH"
    
      # 1) 确认守卫真的激活
      for v in CODEBUDDY_TOOL_CALL_ID CODEBUDDY_SAFE_DELETE_BULK_GUARD \
               CODEBUDDY_SAFE_DELETE_BULK_STATE_DIR CODEBUDDY_CONVERSATION_REQUEST_ID; do
        echo "$v=${!v:-<unset>}"; done
    
      # 2) 读各轮删除计数（关键证据：看谁越阈）
      python - <<'EOF'
      import hashlib, json, os, tempfile
      sid = os.environ["CODEBUDDY_SESSION_ID"]
      thr = int(os.environ.get("CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD", "20"))
      h = hashlib.sha256(sid.encode()).hexdigest()
      p = os.path.join(tempfile.gettempdir(), "codebuddy-safe-delete-bulk", h, "state.json")
      st = json.load(open(p, encoding="utf-8"))
      for rid, r in st.get("requests", {}).items():
          print(r["count"], rid, f"<-- 越阈(>={thr})" if r["count"] >= thr else "")
      EOF
      ```
    
      判定：若**本次轮次**计数接近/超过**当前阈值**即命中。**阈值从环境读，别写死**：
    
      ```bash
      echo "threshold=${CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD:-20(内置默认)}"
      ```
    
      ## 修复（三类，按顺序）
    
      **A. 代码侧（首选，通常一行）** — 让启动路径**不再产生删除**：
    
      - 健康检查/探测不要"写文件后删掉"，改为**覆写保留**一个标记文件（幂等、零删除）。
      - 只读探测不要用 `shutil.rmtree` / `Path.unlink` / `os.remove`。
      - 测试里要**强断言**"绝不删除"：
        ```python
        def test_no_delete(monkeypatch, tmp_path):
            monkeypatch.setattr("pathlib.Path.unlink", lambda *a, **k: (_ for _ in ()).throw(AssertionError("must not delete")))
            assert target.health_check() is True
        ```
    
      **B. 环境侧（临时，需明示）** — 若删除确属合法（如 pytest 临时目录清理），可在**单条命令**内抬高阈值，并**在汇报中说明**：
    
      ```bash
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD=9999 <你的命令>
      ```
    
      **C. 构建 / 打包工具（高频；最容易被误判成"前端构建坏了"）** — 很多构建器在写产物前会**清空 outDir**（vite 的 `emptyDir`、`rimraf dist`、webpack 的 `clean: true`）。目录里的文件一多就越阈，报错栈指向构建器内部，**看起来像构建配置出错，实际是守卫**。
    
      2026-09-15 实测：`vite build` 失败，`dist/` 有 68 个文件 > 阈值 50：
    
      ```
      [safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":72,"threshold":50,...}
          at emptyDir (.../vite/dist/node/chunks/dep-*.js)
          at prepareOutDir (...)
      ```
    
      **绕法（首选；不改守卫、不动环境）——把产物输出到一个全新目录**：目录不存在 → 无可删之物 → 根本不触发。
    
      ```bash
      npx vite build --outDir ../.workbuddy/tmp-dist-verify   # 全新目录，且是未跟踪目录
      ```
    
      顺带还能拿产物做校验（chunk 名、grep 新字符串），验证完**分批（每 call ≤ 阈值的一半）**清掉。
    
      ⚠️ 不要为了跑个构建就去 `CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD=9999`。对构建产物这种**可再生产物**，换个输出目录是零风险解法；抬阈值应该留给"删除确属合法且无法转移"的场合。
    
      **D. 长跑脚本的"清理步骤"顶替退出码（最阴的一种：一次全绿被报成失败）** — 脚本用 `trap cleanup EXIT` 做清理，而 `cleanup` 里删的目录越阈 ⇒ `rm -rf` 返回非 0 ⇒ **trap 的最后一条命令顶替了脚本的退出码**，外围只看到 `exit 1`。
    
      2026-09-16 实测：一个"起 PostgreSQL 集群 → 跑测试 → 清理"的验证脚本，19 个测试文件**全部通过**，脚本却 `exit 1`：
    
      ```
      [safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":46910,"threshold":50,"scope":"turn",
        "targets":["/d/…/tmp/pg-real/run-1743"],"targetCount":1}
      ```
    
      一个 PostgreSQL data dir 约 **47000 个文件**（`initdb` 的产物），远超阈值。**判据被噪声盖住**——你会去查测试为什么失败，而它们根本没失败。
    
      两个修法，**都要做**：
    
      ```bash
      # 1) trap 必须保留原始退出码（否则清理步骤的结果就是脚本的结果）
      trap 'status=$?; <清理…> || true; exit $status' EXIT
    
      # 2) 更根本：不要删这种大目录。改成持久复用，把"删"从路径上消掉
      #    例：集群只 initdb 一次，之后只 start/stop；要干净数据库就 dropdb+createdb（秒级）
      ```
    
      ⚠️ 这条与陷阱 4 的"teardown 噪音"不同：那里噪音不影响判据，这里**直接伪造判据**。
    
      ## 关键陷阱
    
      1. **只清自己装的 handler / 只改自己的文件**：批量删除一旦越阈，会连带影响**同一轮**的其它操作。
      2. **反向验证可能失效**：把修复还原后"重跑仍绿"**不代表修复无效** —— 因为计数是**整轮累计**，新轮从 0 起可能达不到 20。反向验证必须**在同一高删除量上下文**里做，否则只能证伪"唯一根因"，不能证伪修复本身。
      3. **不要试图 catch `SystemExit`**：它是 `BaseException`，用 `except Exception` 抓不到；用 `except BaseException` 抓是反模式。正解是**消除启动路径上的删除副作用**。
      4. pytest **teardown** 期的守卫触发通常只是**噪音**（不影响 passed/failed）；危险的是 **setup / 启动期**触发。
    
      ## 验证
    
      ```bash
      PYTHONUTF8=1 venv/Scripts/python.exe -m pytest <目标> -q --no-header -p no:cacheprovider > /tmp/x.log 2>&1
      echo "exit=$?"; tail -20 /tmp/x.log   # 看 passed/failed，忽略 teardown 噪音
      ```
