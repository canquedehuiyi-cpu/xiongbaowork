  - slug: hostile-git-repo-recovery
    title: hostile-git-repo-recovery
    summary: "git 写嵌套 ref 后父目录被整棵删除时，按已证实的真因取证并恢复仓库。"
    instructions: |-
      # 敌意环境下的 Git 仓库恢复
    
      ## ⚠️ 2026-09-15 重大更正：不存在「恶意外部进程」
    
      **先读这一节。** 本文原先的核心前提（"本机有个外部进程，每次 git 写操作后就删 refs/objects/worktrees"）
      经 8 组对照实验**证伪**。请不要再按"找外部进程"的思路排查。
    
      **已确证的真因（可复现）**：本机 **WorkBuddy 宿主的文件操作代理层**介入 git 的目录操作，
      导致 **git 写「嵌套 ref」时，其父目录被整棵删除（连同目录内无关文件），而 git 自身返回 0**。
    
      | 项 | 结论 |
      |---|---|
      | 触发条件 | 目标 ref 形如 `refs/<a>/<b>/...`（≥2 级）。**1 级 ref（`refs/heads/main`）不受影响** —— ⚠️ **2026-09-16 已确证例外：`git stash` 写 `refs/stash`（1 级，其父目录就是顶层 `refs/`）⇒ `.git/refs/` 整棵被删 + 对象库被清空**。判据：危险的是**被删的那个父目录**；`refs/stash` 的父目录是仓库格式判定要件 `refs/` 本身 |
      | 受影响 | `refs/remotes/origin/*`（→ `git fetch` 声称建了分支但立刻消失）、`refs/heads/<x>/<y>`（→ **带斜杠的分支名会中招**） |
      | git 版本 | 系统 git `2.54.0.windows.1` 与 PortableGit git `2.55.0.windows.3` **都中招** ⇒ 换 git 无效 |
      | 与仓库无关 | 全新空仓库即可复现 |
      | 与沙箱开关无关 | 加/不加 Bash 沙箱都复现 |
      | 与 config 无关 | 屏蔽 `GIT_CONFIG_GLOBAL`/`GIT_CONFIG_SYSTEM` 仍复现 |
      | 非文件系统问题 | 同一目录改用 **Python / bash 写入完全正常** |
      | 铁证 | 把 git 二进制改名（`git.exe`→`gitX.exe`）运行，输出 `BUG (fork bomb): …gitX.exe`；该字符串经 `grep -rla` 全盘定位**只存在于 `D:\软件安装\WorkBuddy\WorkBuddy.exe`** |
    
      宿主的代理层实物位于 `D:\软件安装\WorkBuddy\resources\app.asar.unpacked\cli\vendor\shim\`：
      `node-brokered-fs-shim.cjs`（包装 `fs.mkdirSync/renameSync/unlinkSync`…）、`brokered-bin/codebuddy-toybox-dispatch`、
      `safe-bin/{rm,rmdir,unlink}` + `safe-delete-common.sh`。
    
      **最小复现**（在任何新仓库）：
      ```bash
      git init -q t && cd t && git commit -q --allow-empty -m x
      mkdir -p .git/refs/heads/a && echo keep > .git/refs/heads/a/sentinel
      git update-ref refs/heads/a/b HEAD        # exit=0
      ls .git/refs/heads/a/                     # No such file or directory（连 sentinel 一起没了）
      ```
    
      **规避**：让 ref 只存在于**扁平文件 `packed-refs`**（不涉嵌套目录）。
      ⚠️ `packed-refs` 头声明 `sorted`，git 走**二分查找** ⇒ 必须写在**排序位置**，追加到末尾会被静默忽略（已实测）。
      现成工具：`.workbuddy/scripts/refresh_remote_refs.py`（对 X-Agent 仓；用 `git ls-remote` 取远端分支并重写 packed-refs，自带 `rev-parse` 自证）。
      日常约定：① 分支命名**避免斜杠**；② `git fetch` 后跑一次该脚本恢复 `origin/*`；③ 或用 `git ls-remote origin` 代替 `origin/main` 判远端状态。
    
      **对本文其余部分的影响**：
      - §「什么时候用」里"每次写操作后删 `refs/heads/*`、`objects/xx/`"的机制描述**不成立**（本轮探针显示这些路径的写入均存活；`refs/heads/` 变空是 `git pack-refs` 把松散 ref 打包的**正常**行为）。
      - **`git rm` 的禁用结论暂维持**（仍应改用 `rm` + `git add -A`），但请注意其根因很可能与本节同源（git 的文件操作被宿主代理），**尚未单独验证**——下文 §6 里"不是 shim 干的"那条推论需要重估。
      - 恢复流程（fetch 重建 / `read-tree` 重建 index / plumbing 提交 / bundle 备份）**依然有效**，照用。
      - **✅ 2026-09-16 已复现并定因：`git stash` 就是「pack 与对象库被整体清空 + `refs/` 整目录消失」的触发源。** 实测：`git stash push -- backend/app/models/feedback.py` 之后，`.git/logs/refs/stash` 存在而 **`.git/refs/` 整个目录不存在**，`git rev-parse --git-dir` → `fatal: not a git repository`（git 要求 `HEAD` + `objects/` + **`refs/`** 三者齐备）；同时对象库 `count:0` / `in-pack:0` / `packs:0`，`objects/pack/` 只剩**孤儿 `.idx`（`.pack` 已消失）**。**上一轮事故与本节机制其实同源**（此前判"不吻合"是错的）—— 危险面是**被删的父目录**，而 `refs/stash` 的父目录正是顶层 `refs/`。
        - **⇒ 本仓约定：禁止 `git stash`。** 做「失败是否我造成」的对照改用 **`cp` 备份 → 复跑 → `cp` 还原**。
        - 恢复路径本次**全部实测走通**（见 §「变种：对象库被**彻底清空（含 pack）**」），补两点：① 直接把远端 main fetch 进 `refs/heads/main` 会被拒（`refusing to fetch into branch ... checked out`）⇒ 用**扁平临时 ref**（如 `refs/xagent-rescue-main`）中转，再 `git update-ref refs/heads/main <sha>`；② **恢复后不要改写 reflog**（`references pruned commits` warning 是预期，reflog 是唯一恢复线索）。恢复后判「没丢东西」用 `git status --short`：应只剩你本轮真实改动，**无 ` D` 误报**，且 `git ls-files | wc -l` == `git ls-tree -r HEAD | wc -l`。
    
      ---
    
      ## 什么时候用
    
      本机（Windows + Git Bash）上 `.git` 内的状态会以**几种不同形态**消失。**先读上面的「重大更正」**——
      其中"每次 git 写操作后删 refs/objects"的表述已被证伪；实际观测到的形态是：
    
      - **（已确证，最高频）** **嵌套 ref 的父目录被删**：`.git/refs/remotes/origin/`、`.git/refs/heads/<x>/` 在 git 写入后整体消失 → `git fetch` 声称建了分支却查不到、`git branch -vv` 少远端分支。**这是宿主代理层缺陷，见文首**。
      - worktree 元数据目录：`.git/worktrees/<name>/`（含 `HEAD`、`index`）→ 在 worktree 里任何 git 命令都报 `fatal: not a git repository: (NULL)`，`git worktree list` 里该 worktree 消失；
      - **散列对象**：`.git/objects/xx/…`（保留空目录）→ `fatal: unable to read tree <sha>`、fsck 报 missing commit/tree/blob（**本轮未能复现**，成因未确证）；
      - 工作树目录被整体删除（见下节"变种"）。
    
      注：`refs/heads/` 目录变空**通常是 `git pack-refs --all` 的正常结果**（松散 ref 被打包进 `packed-refs`、松散文件被删），
      **不要**把它误判为"被删"——判据是 `git rev-parse HEAD` 能否解析、`git for-each-ref` 是否列出该 ref。
    
      `main` 这类老对象的 **pack 文件**（`.git/objects/pack/pack-*.pack`）在"pack 被删"那类事故中**已被观测到消失**（见文末变种），
      不要假设 pack 是安全网。
    
      ## 变种：工作树被删而 `.git` 完好（2026-09-14 实测）
    
      上面的失效模式都是 `.git` 内部被删。实测还存在**另一种**：`.git` 完全健康，但**工作树里的目录被整体删除**。
    
      **症状**：`git status --short` 出现大批 ` D`（已从工作树消失、未暂存）；`ls <dir>` 报 `No such file or directory`；但 `git log` / `git rev-parse HEAD` / `git cat-file -e HEAD:<path>` **全部正常**，`git diff --cached` 也正常。
    
      **取证判据（四条足以区分是哪种）**：
    
      ```bash
      git rev-parse HEAD                  # 能解析               → .git 没坏
      git ls-files | wc -l                # 与下一条相等          → 索引完好
      git ls-tree -r HEAD --name-only | wc -l
      git status --short | grep -c '^ D'  # 数值很大             → 工作树被删
      ```
    
      **恢复（简单且无损）**：
    
      ```bash
      git status --short | grep '^ M'     # 必须先确认没有"已修改"条目，否则会被覆盖
      git checkout -- .                   # 从 index 恢复工作树
      ```
    
      若此前已有**故意 staged 的删除**（`D ` 前缀），`git checkout -- .` 会正确地跳过它们——index 里已无这些路径，无需额外处理。
    
      **根因：二次复现后已锁定到 `git rm` 本身（2026-09-14 追加证据）**：本例中无自定义 hook、无 clean/smudge filter、reflog 无破坏性操作、`.git` 未受损。删除发生在 `git rm` 之后的短时间内，只影响工作树。
      - **第二次复现**：又执行一次 `git rm`（仅 3 个文件），结果 `frontend/src/components/` 整个目录 **46 个文件** + `pages/` **3 个文件**全部从工作树消失；而 index 完全不变（`git diff --cached` 为空）、`git ls-files` == HEAD 树。
      - **关键排除证据（缩小根因）**：查安全删除守卫的状态文件（`%TEMP%/codebuddy-safe-delete-bulk/<sha>/state.json`），本轮 request 的 `count` **仅 1**（那次是删 `index.lock`）→ **那 49 个文件的消失没有被守卫计数** → **不是 shim 的批量删除守卫干的**。
      - **两次都伴随 `git rm` 进程收到 SIGTERM、无任何 stdout**。
      - **🚫 结论：该环境禁用 `git rm`。** 替代方案 = `rm <files>` + `git add -A <files>`（已实测安全），并**分步校验**。
      - ⚠️ **SIGTERM 会残留 `.git/index.lock`** → 后续命令报 "Another git process seems to be running"。处理：先 `tasklist //FI "IMAGENAME eq git.exe"` 确认无活跃进程，再 `rm -f .git/index.lock`。
    
      ## 备份首选 `git bundle`，不要用 tar
    
      ```bash
      # ⚠️ 必须用 Windows 路径（C:/Users/<user>）！git 是原生 exe，不认 MSYS 路径 /c/...
      #    2026-09-15 实测：git bundle create "/c/Users/<user>" 报
      #    `Unable to create '...bundle.lock': No such file or directory`
      #    （bash 的 mkdir/cp 认 /c/...，但 git 子命令不认 → 统一用 C:/... 两边都认）
      BK="C:/Users/<user>/xagent-backup-$(date +%Y%m%d-%H%M%S)"; mkdir -p "$BK"
      git bundle create "$BK/repo-all.bundle" --all
      git bundle verify "$BK/repo-all.bundle"   # 期望："The bundle records a complete history."
      ```
    
      - 单文件，含全部 ref + **各 worktree 的 HEAD** + tag，`git clone` 即可完整还原 → 是 git 仓库最合适的备份形态；
      - ⚠️ 本例 `tar -czf ... -C .git objects packed-refs refs` **静默失败**：无输出、无报错、文件根本没生成。而 bundle 一次成功。**备份后必须校验产物，不要只信退出码。**（另注：`cp` 小文件是好的，坏的是打包大目录。）
      - 备份放**仓库外**（外部进程只盯着仓库内）。
    
      ## Windows 路径坑：git 读不了 `/tmp/...`
    
      `git` 是 Windows 原生 exe，**解析不了 MSYS 路径**。
    
      ```bash
      cat > /tmp/cmsg.txt <<'EOF' ... EOF   # 这一步会"成功"（bash 侧）
      git commit -F /tmp/cmsg.txt           # 但这一步 exit 128：fatal: could not read log file
      ```
    
      shell 与 git 对同一字符串理解不同。改用 stdin：
    
      ```bash
      git commit -F - <<'EOF'
      ...提交信息...
      EOF
      ```
    
      ## 行尾：字节数变了 ≠ 内容变了
    
      若仓库同时存在 `core.autocrlf=true` 与 `.gitattributes` 的 `* text=auto eol=lf`（**`gitattributes` 胜**），一次 `git checkout` 会把工作树文件由 CRLF 改写为 LF，**字节数减少量 ≈ 行数**（实测 177 行 → 少 177 字节）。
    
      **不要用 `wc -c` 判完整性**，唯一判据是哈希：
    
      ```bash
      git hash-object <file>              # 与下面两条相等 → 内容无损
      git rev-parse :<file>               # index 版本
      git rev-parse HEAD:<file>           # HEAD 版本
      ```
    
      三者一致即"只是行尾变了"。补一句：`grep -c $'\r' <file>` 在缺 `$'...'` 支持的 shell 里会退化成匹配全部行，**输出总行数**，是假信号，别信。
    
      **★ 程序化往 CRLF 文件里插多行文本，会把整文件行尾搞成混合（2026-09-16 实测）**：
      Python 三引号里的"真实换行"是 `\n`，而 `open(..., newline="")` 只是在**读**的时候不做转换、**写**的时候也原样落盘
      ⇒ 直接用 `handle.write(text)` 会把一整段 LF 塞进 CRLF 文件。实测 `overview.md` 由 **CRLF=600 / LF=0**
      变成 **CRLF=601 / LF=60**（60 恰为插入段的行数），**其余 600 行完好** —— 判据就是"LF 增量 == 插入段行数"。
    
      修法（插入前后都做一次）：
    
      ```python
      text = text.replace("\r\n", "\n").replace("\n", "\r\n")   # 归一化到目标行尾，再写
      ```
    
      配套两个判据/坑：
      - **先确认目标文件本来就是纯 CRLF**（`<file>` 的 `CRLF/LF` 计数），别把原本就混合的文件"修"坏；
      - **替换「行首带标记」型锚点要连尾部标记一起处理**：原文形如 `> **标题（…）：内容**`，只替换前缀
        `> **标题（…）：` 会留下**没有开头的收尾 `**`** ⇒ 跨行不闭合、渲染错乱。替换前后各 grep 一次标记配对数。
    
      ## 变种：对象库被**彻底清空（含 pack）**、refs 目录整体消失（2026-09-15 实测）
    
      比上文更严重的一种：不只散列对象，**连 `pack-*.pack` 也被删**（只剩孤儿 `.idx`），
      且 `.git/refs/` **整个目录**消失。
    
      **症状**：
      ```
      $ git rev-parse --show-toplevel
      fatal: not a git repository (or any of the parent directories): .git
      $ ls .git/ | grep refs        → 无（refs/ 目录不存在）
      $ git count-objects -v        → count: 0, in-pack: 0, garbage: 3
      $ ls .git/objects/pack/       → 只有 *.idx / multi-pack-index，没有 *.pack
      $ git cat-file -t <近期提交>   → fatal: Not a valid object name
      ```
      工作树通常**完好**，`.git/logs`（reflog）通常**完好** —— 但 reflog 指向的对象已消失，**记了不等于能救**。
    
      **恢复路径（2026-09-15 实测走通）**：
      ```bash
      # 0) 先让 git 可用：refs 目录是判定仓库格式的必需项，纯新增即可
      mkdir -p .git/refs/heads .git/refs/tags .git/refs/remotes
      git rev-parse --show-toplevel          # 应恢复
    
      # 1) 备份元数据到仓库外（Windows 路径！）
      BK="C:/Users/<user>/xagent-gitrescue-$(date +%Y%m%d-%H%M%S)"; mkdir -p "$BK/dotgit/logs/refs/heads"
      cp .git/packed-refs .git/HEAD .git/index .git/config "$BK/dotgit/"
      cp .git/logs/HEAD "$BK/dotgit/logs/"; cp .git/logs/refs/heads/main "$BK/dotgit/logs/refs/heads/" 2>/dev/null
    
      # 2) 从远端恢复对象。★ packed-refs 里指向已删对象的失效引用会让 fetch 中断
      #    （报 `bad object refs/heads/<x>` / `did not send all necessary objects`）
      #    → 先清空 packed-refs 再 fetch：
      printf '# pack-refs with: peeled fully-peeled sorted \n' > .git/packed-refs
      git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      git cat-file -t <remote-main-sha>       # commit = 对象已到
    
      # 3) 验证远端树完整
      git ls-tree -r <remote-main-sha> --name-only | wc -l
    
      # 4) ★ 旧 index 引用了已删 blob，会让 `git diff <commit>` 报
      #    `fatal: unable to read <blob>` → 用远端树重建 index：
      git read-tree <remote-main-sha>
    
      # 5) 提交前范围检查（git add -A 会把工具目录也带进来）
      git add -A
      git diff --cached --name-only <remote-main-sha> | grep -E '(^|/)\.env($|\.)|\.pyc$|node_modules/|/venv/|^data/'  # 敏感/垃圾
      git ls-tree -r <remote-main-sha> --name-only | grep -c '^\.workbuddy/'   # 0 = 从未入库 → 剔除
      git reset -- .workbuddy/                # 剔除工具目录（只动 index，不动工作树）
    
      # 6) 固化：提交（parent = 远端 main）→ 引用落 packed-refs → 异地 bundle
      git commit -F - <<'EOF'
      chore(repo): 从工作树重建历史（.git 对象库被外部进程清空后恢复）
      ...说明基线是哪个远端提交、内容范围、代价（原始 SHA 不可复原）
      EOF
      git pack-refs --all
      git bundle create "C:/Users/<user>/.../recovered.bundle" --all
      git bundle verify "C:/Users/<user>/.../recovered.bundle"   # complete history
      ```
    
      **判定"远端是不是本地基线的祖先"**（决定能否 fast-forward 推送）：
      ```bash
      git log --oneline -5 <remote-main-sha>          # 远端头部是否"认识"
      git rev-list --count <remote-main-sha>..HEAD    # 领先几个提交
      ```
      若本地工作树**包含**远端最新提交的产物（例如能读到远端某修复留下的代码注释）⇒ 本地是其后代
      ⇒ `git commit` 后可直接 push（**fast-forward，无需 force**）。
    
      **⚠️ 与本文开头相反的新证据**：本例 **`pack-*.pack` 也被删**（"pack 通常不受影响"不成立）
      ⇒ 不要假设 pack 是安全网；**只要 `in-pack: 0` 就必须走 fetch 从远端恢复**。
    
      **fsck 会报 `invalid reflog entry <sha>`**：reflog 里仍留着指向已删对象的条目，
      **不影响仓库可用性**（只要没有 `missing`/`corrupt`）。不要为此改写 reflog（那是恢复线索）。
    
      ---
    
      ## 0. 先取证，不要慌着改
    
      ```bash
      export PATH="/c/Users/<user>/.workbuddy/binaries/PortableGit/versions/1.2.0/usr/bin:/usr/bin:/bin:$PATH"
      git rev-parse HEAD                 # 能否解析
      git worktree list                  # 当前 worktree 是否登记
      git branch -vv                     # 分支引用是否还在
      git show-ref | grep <branch>       # packed-refs 兜底是否存在
      git cat-file -t <sha>              # 对象是否可读
      git fsck --no-progress 2>&1 | grep -E "^missing" | sed -E 's/ [0-9a-f]+//' | sort | uniq -c
      git count-objects -v               # 散列对象数 / pack 数
      git multi-pack-index verify        # 无输出 = pack/MID 一致（不是 pack 坏了）
      ```
    
      **先备份再动手**（关键，且成本极低）：
    
      ```bash
      BK=/d/.../x-agent bot/.workbuddy/backups/$(date +%Y%m%d-%H%M%S)
      mkdir -p "$BK/git"
      cp .git/packed-refs "$BK/git/"
      tar -czf "$BK/git/objects.tar.gz" -C .git objects packed-refs refs
      ```
      同时把**本轮改动的源文件**逐个 `cp` 到 `$BK/`（按相对路径），因为对象一旦被删，历史版本就没了。
    
      ## 1. 恢复 worktree 登记（`.git/worktrees/<name>/` 被删）
    
      worktree 里的 `.git` 是个文本文件：`gitdir: D:/…/.git/worktrees/<name>`。只要它还在，把被删的元数据目录重建即可：
    
      ```bash
      WT="/d/.../rakazo"
      GD="$WT/.git/worktrees/<name>"
      mkdir -p "$GD/logs"
      printf 'ref: refs/heads/<branch>\n' > "$GD/HEAD"
      printf '%s\n' "$WT/.worktrees/<name>/.git" > "$GD/gitdir"   # 正斜杠，指向 worktree 的 .git 文件
      printf '../..\n' > "$GD/commondir"
      git worktree list      # 应重新出现该 worktree
      ```
      注意：`gitdir` 里必须写 **worktree 的 `.git`（文件）**，不是仓库根。
    
      ## 2. 重建索引（index 被删 → `git status` 无声空白）
    
      `git read-tree HEAD` 在对象缺失时会失败。直接重建索引：
    
      ```bash
      git add -A          # 未忽略的受管文件全部入索引；会顺带把"当前内容"缺失的 blob/tree 重新写出来
      git ls-files | wc -l
      git ls-tree -r HEAD --name-only | wc -l   # 与上面数量一致 → HEAD 的树已完整
      git status --short | wc -l                # 应为 0
      ```
      只要每个文件的**当前内容**没变，重新哈希就会得到**同一个 SHA**，等于把被删的历史版本对象顺便治好；但**互相不同的历史版本**（旧提交里的旧 blob/tree）无法凭工作树重建。
    
      ## 3. 提交：porcelain 失败时改用底层命令
    
      历史链有洞（缺 commit 对象）时，`git commit` / `git commit --amend` 会去遍历提交图，直接失败：
    
      ```
      error: Could not read 2be675f3…
      fatal: unable to read tree 3184cd0f…
      ```
      此时用 plumbing 落地提交（父提交用已知的最后一个好提交）：
    
      ```bash
      TREE=$(git write-tree)
      NEW=$(git commit-tree "$TREE" -p <parent-sha> -m "feat(scope): message")
      printf '%s\n' "$NEW" > /tmp/newref
      ```
    
      **分支引用必须写进 `packed-refs`**——散列引用会被删，packed 不会：
    
      ```bash
      GD="<main-git-dir>"
      grep -v "refs/heads/<branch>" "$GD/packed-refs" > /tmp/packed-refs.new
      printf '%s refs/heads/<branch>\n' "$NEW" >> /tmp/packed-refs.new   # ← 顺序会乱，见第 4 步
      cp /tmp/packed-refs.new "$GD/packed-refs"
      mkdir -p "$GD/refs/heads/<dir>" && printf '%s\n' "$NEW" > "$GD/refs/heads/<branch>"
      ```
    
      ## 4. packed-refs 的两个坑（都踩过）
    
      1. **追加会破坏排序** → git 报 `packedRefUnsorted`。修：`git pack-refs --all`（会重排全量并删除散列 ref）。
      2. **绝不能用文本模式写 `packed-refs`**：Windows 上 Python `Path.write_text()` / shell 重定向之外的文本写入会把 `\n` 变成 `\r\n`，git 立刻报
         `badRefName: has bad refname 'refs/heads/foo?'`，**HEAD 解析失败**。必须二进制 + LF：
    
      ```python
      raw = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
      lines = raw.decode("utf-8").split("\n")
      header = [l for l in lines if l.startswith("#")]
      entries, seen = [], set()
      for line in lines:
          if not line or line.startswith("#"):
              continue
          if line.startswith("^"):            # tag 的 peeled 行必须紧跟其 tag 行
              entries[-1] += "\n" + line
              continue
          ref = line.split(" ", 1)[1] if " " in line else ""
          if ref in seen:                     # 去重（pack-refs 与手写会同时存在）
              continue
          seen.add(ref); entries.append(line)
      path.write_bytes(("\n".join(header + entries) + "\n").encode("utf-8"))
      ```
      注意 `git pack-refs --all` 之后再手写同一引用会产生**重复行**，必须去重。
    
      ## 5. 每次写操作后的固定校验（缺一不可）
    
      ```bash
      git rev-parse HEAD                       # 解析出预期 SHA
      git log --format="%H %s" -1 HEAD         # 提交信息正确
      git ls-tree -r HEAD --name-only | wc -l  # 文件数与索引一致
      git status --short | wc -l               # 0
      git hash-object <改动文件>               # 与 git rev-parse HEAD:<文件> 相同
      git fsck --no-progress 2>&1 | grep -i "packed-refs"   # 无输出
      ```
    
      ## 变种（阳性但无害）：工作区被宿主**自动提交**（2026-09-16 实测）
    
      上面几种都是"被删"。还有一种**无害**形态，与它们方向相反：宿主把工作区改动**替你提交**了。
    
      **症状**：`git status --short` 突然变空（明明刚改完文件、还没 commit），`git log` 顶部多出一条**你没写过**的提交
      （实测消息为泛化的 `feat(x-agent): update file`，作者是本人用户名，`--stat` 恰好等于刚改完的工作区）。
    
      **这不是事故，别慌。三步取证即可判「有没有丢东西」**：
    
      ```bash
      git show --name-status --format='%H%n%an <%ae>%n%ad%n%s' <new-sha>   # 文件清单是否 == 你本轮改动
      git diff --diff-filter=D --name-only <old-sha> <new-sha>             # 空 = 零删除
      git log --oneline <已知远端sha>..HEAD                                 # 未推送范围
      ```
    
      三条全对 ⇒ **无损**，当作"宿主替你 commit 了"继续即可；`refs/heads/main` 也会一并推进到该提交。
    
      **真正的代价（必须处理）**：所有写着「未提交 / 工作区已就绪」的**交付口径当场过期**。
      ⇒ **收尾前必须重新实测一次 `git status --short`**，不要凭开工时的观察下结论；
      `overview.md` / 记忆 / 交付报告里的提交状态要在收尾时统一回填。
      **推论：本环境里「未提交」不是可靠的交接状态**，别把它当成交付条件写进文档。
    
      ## 6. 预防
    
      - **🚫 不要用 `git rm`**（本环境会触发「工作树目录批量删除」，已两次复现）。要删文件改用 `rm <files>` + `git add -A <files>`，并**分步校验**：先删 1 个 → 确认 `git status --short | grep -c '^ D'` 等于删除数、且其它目录文件数不变 → 再删剩余 → 最后 `git add`。
      - **🚫 不要用 `git stash`（2026-09-16 确证）**：它写 `refs/stash`，而该 ref 的父目录就是顶层 `refs/` ⇒ **`.git/refs/` 整棵被删 + 对象库被清空**（实测一次即命中，详见文首更正表）。做「这个失败是不是我造成的」的对照，改用 **`cp` 备份 → 复跑 → `cp` 还原**（零风险）；`git stash` 的收益在 `-- <path>` 场景下本来就等于一次 `cp`，不值得冒仓库损毁的险。
      - 提交后立刻 `git pack-refs --all`，让所有引用落在 `packed-refs`；
      - 提交后立刻把 `.git/objects` + `packed-refs` + `refs` 打包备份到**仓库外**目录，并单独保存本次改动的源文件；
      - 依赖一个已知良好的父提交做 plumbing 提交，不要依赖 `git log` 能走完整条历史；
      - 判断"能不能推"：`git rev-list --count main..HEAD` 会因缺失祖先而失败 → 说明历史链有洞，**推不上去**，需要用户决策（重建分支 / 接受无历史）。
    
      ## 7. 不能修的部分（要如实上报）
    
      - 被删的 **commit 对象**（消息、作者、parent、tree 指针）无法凭工作树重建；
      - 与之对应的旧版 blob/tree 只在"当前内容恰好相同"时才能靠重新哈希复原。
      - 结论：**当前工作树内容 + 新提交可保**，但**历史链会出现不可走的缺口**，`push`/`rev-list` 会失败。
