    summary: 在对话里通过访谈造出一个新员工：角色、边界、要用的技能。
    instructions: >-
      先用 mcp__staffing__list_staff 看一眼现有的员工、群和能用的技能，别招重复的人。
      一次问一个问题，把模糊的说法逼成能验收的边界：这个员工负责什么、明确不负责什么、越界时怎么回答。
      员工靠 roleDescription 和 persona 干活，所以把它的做事方式、语气和边界写进这两处，别只写一个头衔。
      写好后用 mcp__staffing__propose_employee 起草（改已有的员工用 propose_employee_change）；
      要组群就用 mcp__staffing__propose_group（改已有的群用 propose_group_change）。
      这些工具只出一张卡片：用户在卡片上点确认之前什么也没有建，所以不要说已经建好了，
