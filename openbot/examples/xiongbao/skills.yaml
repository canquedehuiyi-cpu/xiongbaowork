      ## 多会话创作说明
    
      复杂PPT项目可能跨多会话完成。本技能支持多会话续创：
      - 每次会话开始时，读取项目目录中的STORY.md、DESIGN.md和slides/进度
      - 确认当前创作进度（已完成到第X阶段）
