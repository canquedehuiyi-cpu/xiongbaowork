  - slug: windows-pc-tuneup
    title: 电脑体检与安全优化
    summary: Windows 电脑全面体检与安全优化：CPU/内存/磁盘/网络/启动项/防火墙/安全软件/可清理项八项本机实测采集，产出带实测依据的优化建议和可双击运行的安全 .bat 清理工具（只清可再生缓存、清单二次确认、绝不碰系统文件与个人文件）…
    instructions: |-
      # Windows 电脑体检与优化
    
      给用户做系统体检、优化建议或交付自动化脚本时，按以下流程执行。核心原则：**所有结论基于本机实测数据，所有建议附带前提条件，所有脚本交付前逐字节自检。**
    
      ## 执行流程（四步）
    
      1. **先读详细清单（必读，不可跳过）**：通过 `@references/tuneup-checklist.md` 加载完整核验清单——执行环境约束、命令降级表、八项采集细则、出建议的实测义务、bat 编写硬规则、交付前自检门禁全部在内。任何体检/优化/写 bat 任务开工前必须先读它，再动手。
      2. **环境探针**：先探测 PowerShell 版本 / OS 版本 / 架构，按降级表选命令集（详见 references 清单 §0.5），不要假设目标机器是最新系统。
      3. **八项实测采集**：系统 / CPU / 内存 / 磁盘 / 网络 / 启动项 / 安全 / 可清理项（有开发环境再加开发工具缓存），全部实测，禁止凭经验报数（细则见 references 清单 §1）。
      4. **出建议或交付 bat**：建议逐条过 references 清单 §5 自检门禁后再输出；bat 以 `templates/tuneup-template.bat` 为骨架填充，交付前必跑 `scripts/check_bat.py`（静态检查）+ `scripts/test_bat_ps.py`（内嵌命令实跑）双检，缺一个不交付。
    
      ## 0.0 安全红线速览（最高优先级，凌驾于 references 清单一切章节）
    
      以下红线违反任何一条即视为任务失败，**与触发词无关**——哪怕用户问的是「C盘满了怎么清理」「电脑太卡怎么办」这类清理/提速场景，也同样适用。场景越急，越不能拿系统文件开刀。
    
      1. **页面文件（虚拟内存）不是清理项，是系统生命线。** 唯一安全的默认答案是「保持系统管理的大小，不动」。只有同时满足三个条件才允许给自定义数值：① 已实测当前提交量与上限（`Win32_PerfFormattedData_PerfOS_Memory` 的 `CommittedBytes` / `CommitLimit`，语言无关）；② 新提交上限（物理内存 + 页面文件上限）> 当前提交量 + 2GB 余量；③ 建议带前提/验证/回滚三段（见 references 清单 §2）。
         **反例（真实事故，禁止复现）**：4GB 内存机器、实测提交量 9.5GB，给「初始 2048 / 最大 4096」→ 重启后提交上限 ≈ 7.4GB < 已提交 9.5GB，程序大面积报内存不足崩溃、系统假死、高负载蓝屏，且卡到连改回去都困难。**严禁输出任何 4GB 以下的小数值作为页面文件通用建议；严禁在未实测提交量前给任何页面文件数值。**
      2. **休眠文件 hiberfil.sys 同理**：先 `Test-Path` 确认文件真实存在，且用户明确不需要休眠/快速启动，才给 `powercfg /h off`，并写明副作用（失去休眠与快速启动）。
      3. **清理清单永远不含系统文件**：pagefile.sys、hiberfil.sys、WinSxS、System32、用户个人文件，任何情况下不出现在"建议删除/建议缩小"列表里，只能作为"体积观测项"写入报告供知情。
