  - slug: code
    title: code
    summary: "面向中文交互与工作流场景的代码协作技能，覆盖静态分析与质量评分。"
    instructions: |-
      > **功能说明**: 本技能涵盖 中文交互、化工作流场景 等核心能力。
    
      > **功能说明**: 本技能涵盖 化流程场景 等核心能力。
    
