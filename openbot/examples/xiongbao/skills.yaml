      | 15 | 中心放射   | 核心词   | `   ●`<br>` ●─中心─●`<br>`   ●`                                                                                                                              | 环绕要点 ≤ 6，各 ≤ 16 字        |
      | 16 | Z 型阅读流 | 四块     | `┌──┬──┐`<br>`│1 │ 2│`<br>`├──┼──┤`<br>`│3 │ 4│`<br>`└──┴──┘`                                                                           | 每块 ≤ 30 字，等高               |
      | 17 | 大图全屏   | 强视觉   | `┌──────────┐`<br>`│ 整图+蒙版 │`<br>`│ 浮层文字   │`<br>`└──────────┘`                                                                | 蒙版保对比；文字 ≤ 40 字         |
      | 18 | 数据图页   | 趋势     | `┌────┬────┐`<br>`│图表│结论 │`<br>`│    │    │`<br>`└────┴────┘`                                                                      | 图 ≤ 1/2 高；结论 ≤ 40 字       |
      | 19 | 环形/饼图  | 构成     | `◖ 图例 ◗`<br>` 解读一句`                                                                                                                                        | 扇区 ≤ 6；解读 ≤ 30 字          |
      | 20 | 三栏并列   | 方法     | `┌─┬─┬─┐`<br>`│ │ │ │`<br>`└─┴─┴─┘`                                                                                                              | 每栏说明 ≤ 30 字                 |
      | 21 | 引言开篇   | 金句变体 | `“ ┌────┐`<br>`  │文字│`<br>`  └────┘来源`                                                                                                          | 同 #12，偏开场                    |
      | 22 | 双栏论点   | 正反     | `┌────┬────┐`<br>`│正方│反方│`<br>`│论点│论点│`<br>`└────┴────┘`                                                                       | 每栏 ≤ 4 行，底线收束            |
      | 23 | 阶梯递进   | 升级     | `▢`<br>`  ▢`<br>`    ▢`                                                                                                                                         | 每级 ≤ 20 字，3–4 级            |
      | 24 | 漏斗模型   | 转化     | `  ▽`<br>` ▽▽`<br>`▽▽▽`                                                                                                                                      | 每层 ≤ 14 字，4–5 层            |
      | 25 | 卡片清单   | 要点列表 | `▢ 标题+说明`<br>`▢ 标题+说明`<br>`▢ 标题+说明`                                                                                                                 | 每项 ≤ 2 行，≤ 5 项             |
      | 26 | 大字标语   | 强调     | `┌──────────┐`<br>`│  超大口号  │`<br>`│ 小字注释   │`<br>`└──────────┘`                                                               | 标语 ≤ 16 字/行，1–2 行         |
      | 27 | 三段式故事 | 叙事     | `起因→经过→结果`                                                                                                                                                 | 每段 ≤ 40 字，配小图             |
      | 28 | 资源/联系  | 收尾     | `┌──────────┐`<br>`│ 二维码/联系方式│`<br>`│ 致谢/CTA  │`<br>`└──────────┘`                                                            | 信息 ≤ 6 项，留白 ≥ 50%         |

      **内容类型 → 推荐版式（先查这个）**


      | 你要讲的内容      | 优先版式                                         |
      | ----------------- | ------------------------------------------------ |
      | 一个观点 + 一张图 | 4 左文右图 / 5 右文左图                          |
      | 3–6 个并列项     | 6 图标行列 / 20 三栏 / 14 卡片网格 / 25 卡片清单 |
      | 关键数字指标      | 7 大数据 KPI / 18 数据图页                       |
      | 时间顺序 / 路线图 | 8 时间轴                                         |
      | 两方对照          | 10 对比列 / 22 双栏论点                          |
      | 四象限 / 优劣     | 9 2×2 矩阵                                      |
      | 流程 / 机制       | 11 流程图 / 23 阶梯递进                          |
      | 占比 / 构成       | 19 环形饼图页 / 24 漏斗                          |
      | 中心主题 + 辐射   | 15 中心放射                                      |
      | 多模块总览        | 16 Z 型 / 14 卡片网格                            |
      | 金句 / 升华       | 12 引用金句 / 21 引言开篇 / 26 大字标语          |
      | 案例 / 强视觉     | 13 图文混排 / 17 大图全屏 / 27 三段式故事        |
      | 收尾 / CTA        | 28 资源联系                                      |

      #### 5.3 版式节奏编排（机制防雷同）

      1. **先排座位表**：生成前把每页版式写死（封面→1, 目录→2, P4→7…）。
      2. **三不重复**：相邻页不同；同类型内容页 ≥ 2 种；任一版式全局 ≤ 2 次。
      3. **穿插换气**：数据/案例/金句/图表交错，禁止连续 > 2 页同类。
      4. **过渡页是换气点**：切话题时插过渡页，天然打断重复。
      5. **终审核对**：出货前对照表确认无相邻同版式、无超次。

      ---

      ### 第六步：逐页生成

      #### 6.1 生成路径（二选一）

      - **路径 A（推荐，AI 原生）**：你按规范逐页产出带版式说明的内容，再调 `pptxgenjs` / `python-pptx` 落地。
      - **路径 B（脚本）**：先产结构化大纲 JSON（每页 type/title/要点/数据/版式/金句），喂给 `scripts/generate.js`。

      #### 6.2 逐页 Prompt 要点（内容页示例）

      ```
      版式：左文右图（#4） ← 必须来自「逐页版式分配表」，且与上一页不同
      标题（观点式，32pt 粗体，主色）：「下沉市场，才是今年最大的增量池」
      左栏要点（3–4 条，每条=数据/案例+半句洞察；⚠️单条≤38字、总≤260、要点≤6）：
        • 三线及以下城市社零增速连续 3 年跑赢一线（来源：国家统计局 2025）
        • 县域新能源车渗透率同比 +18pct，需求被长期低估
        • 关键不是便宜，而是"够用就好"的消费哲学
      右栏：配"县域消费场景"插画/图，主色描边（图源见第七节，优先 AI 生图/免版税图库）
      底部：金句预告「增量不在远处，在曾被忽略的附近。」
      安全校验：左栏文字框 h≤5.0in、不出安全边距；右图框不压字。
      ```

      #### 6.3 设计令牌应用（视觉统一语法）

      所有元素按令牌取值，确保"同一套语言"：

      - **间距**：元素间距走 0.25 / 0.5 / 1.0 in 刻度；安全边距左右 0.5、上下 0.4 in。
      - **圆角**：卡片 8–12pt，大色块 16–24pt，圆标 全圆。
      - **阴影**：卡片用轻投影（模糊 6–10pt，透明度 15–25%），暗底用发光描边替代投影。
      - **字号梯度**：页面标题 40 / 章节 22 / 卡片标题 18 / 正文 15 / 注释 11（pt）。
      - **网格**：12 列隐形网格，基准边距 0.5in；所有元素对齐到网格线。

      #### 6.4 视觉层级铁则

      - 标题 36–44pt 粗体；章节 20–24pt；正文 14–16pt；注释 10–12pt 灰。
      - 一行一个核心焦点；重点数据/金句放大、变色、加框。
      - 对齐用"隐形网格"，杜绝自由飘移。

      ---

      ### 第七步：严格终审（10 维 + 评分卡）

      **生成≠完成。出货前必须跑完 10 维清单，任一项不达标即回炉，直至全绿。**

      #### 🔍 终审清单


      | 维                  | 检查项                                      | 通过标准                                                 | 严重 |
      | ------------------- | ------------------------------------------- | -------------------------------------------------------- | ---- |
      | **1 内容完整**      | 覆盖主题全部要点？页数达标？                | 无缺页、无缩水、无"待补充"占位                           | 🔴   |
      | **2 逻辑一致**      | 目录与正文对得上？前后观点矛盾？            | 模块名一致、数据不冲突                                   | 🔴   |
      | **3 数据可信**      | 关键数据有来源/年份？无编造？               | 每条可溯源，不确定已标注                                 | 🔴   |
      | **4 故事线**        | 主线清晰？三幕结构成立？有高潮金句？        | 一句话主线可复述，情绪有起伏                             | 🟠   |
      | **5 观点与金句**    | 每 3–5 页有金句？标题是观点非目录？        | 金句 ≥ 页数/4，标题无空名                               | 🟠   |
      | **6 反 AI 味**      | 出现套话清单表达？                          | 零套话，语气像人写                                       | 🟠   |
      | **7 视觉排版**      | 文字溢出/裁切？对齐乱？留白<35%？版式重复？ | 无溢出（文字全在安全区）、网格对齐、留白达标、版式不重复 | 🔴   |
      | **8 对比度可读**    | 对比≥4.5:1？小字看清？色盲可辨？           | 全部达标                                                 | 🔴   |
      | **9 风格统一**      | 配色/字体/装饰/令牌一致？                   | 颜色≤4、字体≤2族、装饰统一                             | 🟠   |
      | **10 格式与错别字** | 错别字/语病/中英标点混用？占位符遗漏？      | 零硬伤，占位符全替换                                     | 🔴   |

      #### 📊 出货评分卡（< 85 不出货）

      ```
      内容完整度   /20
      逻辑与数据   /20
      故事线与叙事 /10
      观点与金句   /15
      去 AI 味     /10
      视觉排版     /10
      对比度可读   /10
      风格统一     /05
      ──────────────
      合计         /100   （≥85 可交付，<85 必改后重检）
      ```

      #### 🔁 修复循环

      1. 跑清单 → 2. 标红/橙 → 3. 红必改、橙尽量改 → 4. 改完重跑 → 5. 全绿且 ≥85 才交付。
         交付时附**每页一句话设计说明**（这页讲什么、什么版式、金句在哪）。

