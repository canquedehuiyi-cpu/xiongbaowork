      | 2  | 目录       | 导航     | `① 模块一`<br>`② 模块二`<br>`③ 模块三`                                                                                                                          | 条目 ≤ 6，行高统一，序号圆标同色 |
      | 3  | 章节过渡   | 分段     | `┌────┐ ┌──────┐`<br>`│视觉│ │CH.01 │`<br>`│    │ │大标题 │`<br>`└────┘ └──────┘`                                              | 标题 ≤ 12 字；半色块底           |
