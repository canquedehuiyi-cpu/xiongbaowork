  - slug: baseline-regression-triage
    title: baseline-regression-triage
    summary: 用「基线树对照 + 失败集合 diff」证明一批红灯到底是**预存债**还是**本次改动引入的回归**，而不是靠"看起来无关"下结论。当测试跑完有一批红灯、你需要回答"这些是不是我改坏的"、要给出"新增回归 = 0"的可复核证据、或团队/…
    instructions: |-
      # 基线回归归因（Baseline Regression Triage）
    
      ## 核心纪律
    
      > **交付态的失败数量本身不是证据。** `fail 46` 既可能是"改坏了 46 条"，也可能是"这仓库本来就有 46 条红的"。
      > 唯一能区分两者的证据是：**同一条命令、同一套提取逻辑，在两棵树上跑，然后对失败集合做 diff。**
    
      禁止用这些替代证据：
      - ❌ "这些测试跟我的改动无关"（未验证的断言）
      - ❌ "我改了 A 模块，红的都是 B 模块"（模块间可能有 import / 全局状态耦合）
      - ❌ "工程师说基线也是这样"（引用声明，不是证据）
    
      四条判据缺一不可：**同一命令 / 同一提取逻辑 / 已剥离耗时 / 集合 diff 三分类**。
    
      ---
    
      ## 步骤
    
      ### 1. 确定基线提交（别用错）
    
      基线 = **本任务第一个提交的父提交**，不是 `HEAD~1`。
    
      ```bash
      git log --oneline -8                      # 找到任务起点
      git diff --stat <基线>..HEAD              # 确认改动范围
      ```
    
      特别注意：如果任务有多个提交，且**中间某个提交动了 `src/`**，那它也是本次任务的一部分，
      基线要退到它之前。只看最后一个提交会漏判。
    
      ### 2. 建基线树
    
      ```bash
      BASE="C:/Windows/Temp/baseline_wt"
      rm -rf "$BASE"
      git worktree add --detach "$BASE" <基线提交>
      ```
    
      ### 3. 接上 node_modules —— 用 node junction，不要用 mklink
    
      ```bash
      node -e "
      const fs=require('fs');
      const link='C:/Windows/Temp/baseline_wt/backend-node/node_modules';
      const target='<项目绝对路径>/backend-node/node_modules';
      try{ fs.rmSync(link,{recursive:true,force:true}); }catch(e){}
      fs.symlinkSync(target, link, 'junction');
      console.log('JUNCTION_OK', fs.existsSync(link+'/better-sqlite3/package.json'));
      "
      ```
    
      **必读陷阱**：在 Git Bash 里 `cmd //c mklink /J ...` **会静默失败**——
      不报错、不建链接，`git worktree` 的输出还会把它淹没。后果是基线树跑测试时
      大量 `Cannot find module`，得到一组**毫无意义的低 tests 数 / 高 fail 数**
      （本例第一轮就得到 `tests 69 / fail 52`，与真实基线的 `112 / 50` 完全不同）。
    
      **规矩**：建完链接**必须 `ls` 复验目标包真实存在**，复验不过就不许把那轮数字当证据。
    
      ### 4. 两棵树跑完全相同的命令，落盘原始输出
    
      ```bash
      # A 树（交付态）
      cd "$WT/backend-node"    && node --test test/toapis*.test.js > "$P/head_raw.txt" 2>&1
      # B 树（基线）
      cd "$BASE/backend-node"  && node --test test/toapis*.test.js > "$P/base_raw.txt" 2>&1
      ```
    
      不要只留计数，**留完整原始输出**——后面逐字比对根因还要用。
    
      ### 5. 提取失败集合 —— 必须剥离耗时后缀
    
      ```bash
      strip() { awk '/^✖ failing tests:/{flag=1;next} flag && /^✖ /{
        sub(/^✖ /,""); sub(/ \([0-9.]+ms\)$/,""); print}' "$1" | sort -u; }
      strip "$P/base_raw.txt" > "$P/base_fails.txt"
      strip "$P/head_raw.txt" > "$P/head_fails.txt"
      ```
    
      > ⚠️ **本技能最容易致命的一步。** node 测试报告里失败项写作
      > `✖ ToAPIs rejects unsupported options before fetch (28.1529ms)`，
      > 耗时每轮都不同 ⇒ `sort` 后两版**没有任何一行相等** ⇒ `comm` 报
      > "共同失败 0、新增回归 46"。
      > **这会把结论完全反转**：真实情况是"共同失败 46、新增回归 0"。
      > 剥离耗时前，任何 diff 结果都不要采信。
    
      ### 6. 三分类
    
      ```bash
      comm -13 base_fails.txt head_fails.txt   # 仅交付态失败 = 新增回归 ← 唯一需要担心的
      comm -12 base_fails.txt head_fails.txt   # 共同失败 = 预存债
      comm -23 base_fails.txt head_fails.txt   # 仅基线失败 = 被本次改动修复
      ```
    
      ### 7. "共同失败" 还要逐字比对根因
    
      名字相同不代表根因相同。基线可能是**挂载失败**（整文件红），交付态是**断言失败**（单用例红）——
      那就不是真的"共同"。
    
      ```bash
      for lbl in base head; do
        echo "#### $lbl"
        awk '/^✖ failing tests:/{flag=1} flag' "$P/${lbl:-}_raw.txt" \
          | grep -A 12 -E "^✖ <用例名>" \
          | grep -E '^✖ |AssertionError|actual:|expected:|Error:'
      done
      ```
    
      **根因行逐字相同**（如都报 `actual: '<同一句提示>'` / 都指向同一断言）才可判为预存。
      同时留意**同名用例在两树里数量不同**——那说明基线里有重复注册或条件跳过，要单独解释。
    
      ### 8. 区分文件级失败与用例级失败
    
      `failing tests:` 段里同时混着两种条目：
      - `✖ test\foo.test.js` → **整个文件挂载失败**（import 报错等），底下没有用例级条目
      - `✖ 某个用例名 (12.3ms)` → 真实断言失败
    
      "仅基线失败"里冒出一批 `test\*.test.js`，通常意味着**本次改动补上了基线缺失的模块**，
      让这批文件从"跑不起来"变成"全绿"。这时要用**单文件重跑**坐实：
    
      ```bash
      for f in a b c d; do
        echo "$f :: $(node --test "test/$f.test.js" 2>&1 | grep -E '^ℹ (tests|pass|fail)' | tr '\n' ' ')"
      done
      ```
    
      拿到 `tests 45 / pass 45 / fail 0` 这种才是"修复"；只"不在失败列表里"不算。
    
      ---
    
      ## 环境卫生（Windows / 沙箱）
    
      - **临时库放在同步目录之外**：若工作区所在盘有百度云/OneDrive 客户端，会在测试库旁生成
        `*.baiduyun.uploading.cfg`，可能干扰文件句柄。验证库统一放 `C:/Windows/Temp/...`。
        这些同步件**不是本次产物，收尾时不要动**。
      - **给 Windows 原生 node 传路径用 `C:/...`**，不要用 MSYS 的 `/c/...`（会 `FileNotFoundError`）。
      - **拆除 junction 的顺序**：先 `fs.unlinkSync(link)`（junction 删链接本身，不递归进目标），
        **复验真实 `node_modules/<pkg>` 仍在**，再删基线树。反过来直接删树有跟进目标目录的风险。
      - **沙箱批量删除守卫**（阈值约 50 个文件）会拒绝 `rm -rf` 大目录。基线树有两千多文件，
        用逐文件删除兜底并打印残留：
    
      ```js
      function walk(d){ for(const e of fs.readdirSync(d,{withFileTypes:true})){
        const p=path.join(d,e.name);
        if(e.isDirectory()){ walk(p); try{fs.rmdirSync(p);}catch(err){errs.push(p);} }
        else { try{fs.unlinkSync(p);}catch(err){errs.push(p);} } } }
      ```
    
      - 探针脚本用完即删，别留在工作树里（`git status` 要保持干净，只剩非本任务的噪音文件）。
      - 跑完 `git worktree list` 确认基线树已注销；`git worktree remove` 可能因 `locked` 报
        `cannot remove a locked working tree`，`.git/worktrees` 已消失时属正常残留，直接删目录即可。
    
      ---
    
      ## 报告口径
    
      给出**可复核**的结论，不给形容词：
    
      ```
      交付态 <sha>：tests 216 / pass 170 / fail 46
      基线   <sha>：tests 112 / pass  62 / fail 50
      新增回归 = 0；共同失败 = 46（全部先于本任务存在）；仅基线失败 = 4 个测试文件（现 87/87 全绿）
      ```
    
      同时如实交代**口径差异**：如果 QA/工程师报的数字与你自己跑的不同，
      说明是环境还是命令差异，别抹平。无法复现的那部分标 `unverified`，不要算进结论。
    
      ---
    
      ## 变体：**行为 A/B**（失败不是红灯，而是"某个线上功能不产出"）
    
      上面是「测试红绿」的归因。但更多时候你要回答的是：**"线上某个模型/接口/功能坏了，是我这次改的吗？"**
      这里没有红灯可 diff —— 失败发生在运行时。做法是在基线提交上**起一个独立实例**，
      发**完全相同**的请求，比对**终态**。
    
      ### 装置
    
      ```bash
      # 1) 基线独立实例：同一台机器、不同端口、独立库、独立存储目录
      git worktree add --detach C:/Windows/Temp/base_wt <基线提交>
      # 2) 库用 VACUUM INTO 复制（只读打开源库，绝不碰原库）
      node -e "const D=require('better-sqlite3');
      const s=new D('D:/real/app.db',{readonly:true});
      s.exec(\"VACUUM INTO 'C:/Windows/Temp/base.db'\"); s.close();"
      # 3) 起实例：用 env 覆盖端口/库/存储，不要去改配置文件
      PORT=5681 DATABASE_PATH=C:/Windows/Temp/base.db \
      STORAGE_LOCAL_PATH=C:/Windows/Temp/base_storage \
      STORAGE_BASE_URL=/static node src/index.js
      ```
    
      **四个必须做对的点**
    
      1. **两个副本都要造**：交付态一份 + 基线一份。只有基线一份没法对照。
      2. **被 `.gitignore` 排除的运行时依赖要补进基线树**（`.env`、未跟踪的 `scripts/*`）。
         缺了会得到 `AUTH_NOT_CONFIGURED` / `MODULE_NOT_FOUND` 这类**环境伪失败**，
         与代码差异无关，却会让你误判。补的时候**排除本次变更的文件**，保证两树只差本次改动。
      3. **同一个请求、同一份凭据**发到两个实例。凭据要在两份库里都设成已知值
         （`crypto.scryptSync(pw, salt, 64).toString('hex')` 之类），否则登不进去就没法比。
      4. **比对"终态"，不是"HTTP 200"**。真正要看的是：`status` 字段、产物文件是否落盘、
         产物字节数、上游原始响应、以及**计费流水是否闭环**（`reserve → confirm` / `refund`）。
    
      ### 判定表
    
      | 交付态 | 基线态 | 判定 |
      |---|---|---|
      | 失败 | 失败（报错逐字一致） | **预存缺陷**，与本次改动无关 |
      | 失败 | 成功 | **回归**，本次改动引入 |
      | 成功 | 成功 | 无影响 |
      | 失败 | 失败（报错**不同**） | 需深挖：可能是同根因的不同表象，也可能是新问题 |
    
      **交叉验证（强烈建议）**：行为 A/B 给出"两态一致"后，再用 `git blame` 定位相关代码行的提交。
      若该行属于**基线提交**，行为证据 + 代码考古互相印证，结论就锁死了：
    
      ```bash
      git blame -L <start>,<end> --date=short -- path/to/file.js   # 看是否全是 ^<基线sha>
      git show <本次提交> -- path/to/file.js                        # 确认本次没碰这些行
      ```
    
      ### 报告口径（务必写清）
    
      ```
      <模型A>：交付态 ❌ `未返回图片地址` ｜ 基线态 ❌ `未返回图片地址`  → 预存
      <模型B>：交付态 ❌ 未产出          ｜ 基线态 ❌ HTTP 400           → 预存（git blame 归 ^<基线sha>）
      自动退款已确认：400 / 200+800，用户无资金损失
      ```
    
      ### 两条纪律
    
      - **预存缺陷不要顺手塞进本次发布**。候选范围一旦被审计固定（overlay 清单 / release-scope /
        门禁白名单），混入无关修复会破坏可审计性，把一个"零风险增量"变成"范围外改动"。
        正确做法：**单独开缺陷条目 + 给出推荐修法**，由人决定何时修。
      - **失败但已自动退款** 也要写明"用户无损失"。这决定了它是不是阻塞项。
    
      ---
    
      ## 相关技能
    
      - 证明断言不是空转（故意改坏看是否转红）→ `mutation-driver-engineering`
      - 证明改动确实进了构建产物 → `frontend-build-verification`
      - 证明代码到底有没有被接线 → `wiring-and-coverage-audit`
