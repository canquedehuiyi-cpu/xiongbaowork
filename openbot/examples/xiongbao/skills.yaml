    summary: 取证并判读"反爬平台上的短视频到底展示了什么"——尤其适用于用户丢来一个抖音/头条/西瓜/B站链接，要求判断视频里的功能/产品/演示是真实可达还是 AI 生成、摆拍、概念片。触发词：分析这个视频、视频里的功能能不能做出来、这个视频是真的吗…
    instructions: |-
      # 视频内容取证（反爬平台）
    
      ## 何时用
    
      - 用户给一个视频链接，要求"分析视频里展示的功能能不能真做出来"。
      - 需要判断视频是**真实录屏/产品演示**，还是 **AI 生成 / 拼接 / 概念片**。
      - 目标平台静态抓取被 JS 反爬挡住（字节系尤其典型）。
    
      ## 核心纪律
    
      **绝不用"看起来像"下结论。** 必须拿到视频本体、逐帧看、找**物理上不可能出现在真实录屏中的矛盾**。用户要的是证据，不是观感描述。
    
      ## 步骤
    
      ### 1. 短链还原出真实视频 ID
    
      ```bash
      curl -s -I -L -A "<移动 UA>" "<短链>" | grep -iE "^(HTTP|location)"
      ```
    
      字节系短链（`m.toutiao.com/is/xxx`）会 302 到 `m.toutiao.com/video/{ID}/`，ID 就是主键。
    
      ### 2. 静态抓取一定失败，不要在这里耗时间
    
      - `curl` 拿到的页面只有 `_$jsvmprt` 混淆脚本（字节的 JS VM 保护），无 `<title>`、无 `_ROUTER_DATA`。
      - `r.jina.ai/<url>` 可以拿到**标题、作者、发布时间、"作者声明：内容由 AI 生成"等元信息**——这一步很有价值，但拿不到视频源。
      - 结论：元信息走 Jina，视频本体必须走真实浏览器渲染。
    
      ### 3. 无头浏览器渲染提取视频源
    
      环境（Windows / 本机已装好）：
    
      ```bash
      export PATH="/c/Users/<user>/.workbuddy/binaries/PortableGit/versions/1.2.0/usr/bin:/c/Users/<user>/.workbuddy/binaries/node/versions/22.22.2-3:$PATH"
      # 首次：cd /c/Users/<user>/.workbuddy/binaries/node/workspace && npm i playwright && npx playwright install chromium
      ```
    
      脚本要点：
      - **脚本必须放在 `~/.workbuddy/binaries/node/workspace/` 目录内运行**，否则 `require('playwright')` 找不到模块。
      - **不要设 `NODE_PATH`**：forward-slash 路径在 Windows 上不生效（反斜杠也常被拒），靠 cwd 解析最稳。
      - 用移动 UA + 移动视口访问 `m.toutiao.com/video/{ID}/`。
      - 取地址两条路：`document.querySelectorAll('video')` 的 `currentSrc` / `source`，以及 `performance.getEntriesByType('resource')` 里过滤 `mime_type=video_mp4`。
      - 页面会有多个清晰度（`br=277/378/554/790`），**取 `br` 最大的**，否则字幕/小组件文字糊到读不出来。
      - `page.waitForTimeout(10000)` 之后再读，视频元素要时间挂载。
      - 输出重定向到文件再读，别用 `| head` 截管道（会 SIGTERM 掉 node）。
    
      ### 4. 下载 + 采帧
    
      ```bash
      curl -s -L -A "<移动 UA>" -e "https://m.toutiao.com/" "<mp4 url>" -o video.mp4
      ```
    
      - **必须带 `Referer`**，否则防盗链。
      - ffmpeg 位置：`C:\Users\<user>\AppData\Local\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-8.1.1-full_build\bin`
      - 先 `ffprobe` 看时长，再决定采样率。
    
      ```bash
      # 单帧总览：省 token 的关键一步
      ffmpeg -v error -i video.mp4 -vf "fps=1/2,scale=640:-1,tile=3x4" -frames:v 1 -q:v 2 contact_sheet.jpg
      # 需要读细节时再导出单帧
      ffmpeg -v error -i video.mp4 -vf "fps=1/2" -q:v 2 frames/f%02d.jpg
      ```
    
      **先读拼图总览，再挑 2–3 张全分辨率单帧读细节**（比如识别小图标、读小组件文字）。24 秒视频用 12 帧拼图 ≈ 1 张图的 token，但能覆盖全片。
    
      ### 5. 判读：区分"功能"与"观感"
    
      对照检查表，逐项问：
    
      | 检查点 | 说明 |
      |---|---|
      | 平台是否有 "内容由 AI 生成" 声明 | 最直接的线索，但**不足以单独定案** |
      | 时间/日期类小组件在帧间是否一致 | 时钟跳变、日历日期倒退 = 真实录屏不可能 |
      | Dock / 任务栏图标组是否稳定 | 图标组大改、位置漂移 = 背景也是生成的 |
      | 有无生成式伪影 | 悬浮方块、肢体溶解、文字糊成一团 |
      | 是否存在**交互 UI** | 没有输入框、对话气泡、设置面板 → 视频只在展示"观感"，不是产品演示 |
      | 唯一的产品化元素是什么 | 比如只有右下角一个音频波形条 → 暗示语音但未展示 |
    
      **输出模板**：把需求拆成"桌面形态层 / 角色表现层 / 合规层"三层，各自给 `可直接实现 / 需权衡 / 硬约束`，并对每个功能项标注依据与代价。核心判断句：**"视频演示的是观感目标，不是功能清单。"**
    
      ### 6. 收尾
    
      - 视频、帧、拼图留在 `research/` 目录作为证据，别删。
      - 报告里内嵌拼图时用 base64 内联（相对路径在预览面板里不可靠）：
        读 HTML → 读 jpg → `data:image/jpeg;base64,` + b64 → 替换占位符。跑 Python 前加 `PYTHONUTF8=1`。
    
      ## 已知陷阱
    
      - `curl | head` 会 SIGTERM 掉 node 进程且丢光输出 → 重定向到文件。
      - 前台跑 node + 无头浏览器要 2–3 分钟，直接 `run_in_background`。
      - CDP 直连用户浏览器（web-access skill 的路径）在本机默认不可用（浏览器未开远程调试），别在这上面反复重试——Playwright 自装 Chromium 更省事。
      - 视频 URL 带时效 token，抓到就立刻下载，别隔太久。
