  - slug: design-token-forensics
    title: design-token-forensics
    summary: 从「参考应用」里取证**真实**设计令牌，再与本地项目逐项对齐。当用户说"一切参考 XX 的整体风格/UI"、"按 XX 的样式来"、"对齐 XX"、或需要知道某个第三方应用的主色/描边/圆角/字号刻度时使用。触发词：参考 XX 风格、对…
    instructions: |-
      # 设计令牌取证（Design Token Forensics）
    
      ## 为什么需要这个技能
    
      用户说"参考 XX 的整体风格"时，最容易失败的做法是**凭印象描述**（"XX 是卡片风格""XX 用蓝色主色"），然后照着印象改 —— 改完一轮发现不对，返工。
    
      正确做法：**去参考物自己的资源里读字面值**。绝大多数桌面/Web 应用都留有可读的样式产物。一次取证换来的是"色值级确定性"，而不是"观感级猜测"。
    
      判断标准很简单：**你能写出 `#dcdee3` 这样的字面值，还是只能写出"灰一点的线"？** 只能写后者 = 还没取证。
    
      ---
    
      ## 一、按优先级找取证源
    
      | 优先级 | 目标 | 典型路径 | 说明 |
      |---|---|---|---|
      | 1 | **Electron 应用的散装 CSS** | `<App>\resources\app.asar.unpacked\**\dist\**\assets\*.css` | 最理想。Electron 常把 web 产物留成散装 |
      | 2 | 应用自带的 HTML 导出物 | `<App>\resources\*.html`（报告/导出/预览） | 常内嵌完整设计系统；但注意它可能是**另一套**风格 |
      | 3 | 应用内的主题/皮肤目录 | `<App>\resources\app.asar.unpacked\resources\{themes,templates,branding}\` | 找 `*theme*` / `*.css` |
      | 4 | 打包文件（下策） | `resources\app.asar` | **几百 MB，别急着解**；npm 不可达时 `asar` 工具也装不上 |
      | 5 | 用户截图 | — | 只在 1–4 全失败时索取；能拿到就要求**一页**即可，别要全套 |
    
      **关键判别**：一份 CSS 是不是"产品本体"，看它有没有**场景专属令牌**。
      例：出现 `--color-bg-channel` / `--color-composer-*` / `--color-canvas-tile-*` → 是聊天主界面本体；
      只有 `--bg/#fafafa` 之类的通用名 → 可能是报告模板，**风格可能完全不同，不要混用**。
    
      > 同一应用存在**多套风格**是常态（产品 UI 一套、导出报告一套）。取证时必须先判定拿到的是哪一套，并在交付里**写明来源路径**。
    
      ---
    
      ## 二、提取什么（六类）
    
      用 `grep -oE` 抽字面值 + `sort | uniq -c | sort -rn` 看**频次**，频次本身就是设计意图。
    
      ```bash
      export PATH="/c/Users/<user>/.workbuddy/binaries/PortableGit/versions/1.2.0/usr/bin:$PATH"
      F="<目标 css>"
      echo "size: $(wc -c < "$F")"
    
      # 1 颜色令牌（含浅/深双值 —— 同一 token 出现两次即浅/深）
      grep -oE '\-\-[a-z0-9-]+ *: *(#[0-9a-fA-F]{3,8}|rgba?\([^)]*\))[^;]*;' "$F" | sort -u
    
      # 2 字体栈
      grep -oE 'font-family: *[^;}]+' "$F" | sort -u
    
      # 3 字号刻度（频次 = 主力档位）
      grep -oE 'font-size: *[0-9.]+(px|rem|em)' "$F" | sort | uniq -c | sort -rn
    
      # 4 字重刻度（频次 = 默认字重）
      grep -oE 'font-weight: *[0-9]+' "$F" | sort | uniq -c | sort -rn
    
      # 5 圆角刻度（全谱系 = 有无限用；窄谱系 = 有约束）
      grep -oE 'border-radius: *[^;}]+' "$F" | sort -u
    
      # 6 阴影（判断"卡片靠什么分离"）
      grep -oE 'box-shadow: *[^;}]+' "$F" | sort -u
      ```
    
      **附加信号**：
      - `grep -c 'prefers-color-scheme'` / `grep -oE '\.dark\b|\[data-theme'` → 是否支持深色、用什么机制切换
      - `grep -oE '\.[a-z-]+ *\{'` → 有没有 `.card` / `.panel` / `.tile` 这类**结构原语**（比色值更能说明手法）
      - `grep -oE 'border[a-z-]*: *[^;}]+' | sort | uniq -c | sort -rn` → **主力分离手段**是描边还是填充
    
      ---
    
      ## 三、判定「分离靠什么」—— 最容易看错的维度
    
      卡片/面板"看不看得见"**不取决于有没有阴影**。用亮度差量化：
    
      ```
      Δ(页底, 卡面)   → 深色主题下主要靠这个
      Δ(描边, 卡面)   → 浅色主题下主要靠这个
      ```
    
      经验规律：**浅色靠描边，深色靠填充。**
    
      实操：把两个 hex 的 R 值相减即可（近似亮度差）。
      - 深色页底 `#000000`(0) ↔ 卡面 `#1a1a1a`(26) → Δ**26** = 卡片清楚
      - 深色页底 `#0f1115`(15) ↔ 卡面 `#16181d`(22) → Δ**7** = 卡片糊在背景里
    
      **这是"改完卡片化还是发糊"的头号原因，且和阴影无关。** 对齐时优先调步进，别急着加阴影。
    
      ---
    
      ## 四、对照与交付
    
      逐项做一张表，列 `维度 | 参考应用 | 本地项目 | 判定`，判定只用三档：**相同 / 可忽略 / 冲突**。
    
      交付物（写到 `.workbuddy/artifacts/`）：
    
      1. **`.html` 视觉预览** —— 用**硬编码的真实令牌值**渲染"现状 vs 对齐后"并排。不要用宿主 CSS 变量（那会让两边看起来一样）。
      2. **`.md` 取证报告** —— 必须包含：
         - 来源路径（可复核）
         - 完整令牌摘录
         - 逐项对照表
         - **冲突清单**（哪些是"参考物这么做但我们不能/不该照做"，附建议 + 理由）
         - **未取证项**（诚实声明哪些是推断）
    
      **冲突必须交给用户裁决，不要自己拍。** 典型三类：
      - 参考物的做法违反本地红线（如纯黑 vs "禁纯黑"）
      - 照做会牵动大面积调用点（如改主色别名）
      - 照做会改变产品定位（如"工具风" vs "编辑部风"的字号刻度）
    
      ---
    
      ## 五、坑
    
      1. **别用报告/导出模板推断产品风格** —— 同一应用里它们常常是两套系统。先找产品本体的 CSS。
      2. **同一 token 出现两个值 = 浅/深，不是重复** —— `sort -u` 后要成对读，别只取一个。
      3. **`wc -c` 看文件大小，别直接 Read 238KB 的压缩 CSS** —— 全在几行里，Read 会截断。用 `grep -oE` 抽取。
      4. **`grep -c` 数的是行数不是出现次数** —— 压缩产物里多值可能同一行。要次数就用 `grep -oE ... | wc -l`。
      5. **字体权重别只信设计规范文档** —— 产品的**实际**字重看 `font-weight` 频次；设计系统文档可能只描述 widget 子集。
      6. **字号频次是刻度，不是规则** —— "≥20px 各只出现 1 次"说明它**几乎不用大标题**，比"标题该用 16px"这种推断更可靠。推断出的值必须在交付里标注为推断。
      7. **app.asar 别硬解** —— 297MB + npm 不可达时是死路。优先找 `.asar.unpacked`（Electron 会把原生模块和部分资源留在这里）。
    
      ---
    
      ## 六、本机已知路径（跨项目复用）
    
      WorkBuddy 产品本体的设计系统：
      ```
      D:\软件安装\WorkBuddy\resources\app.asar.unpacked\cli\dist\web-ui\assets\index-*.css
      ```
      （含 `--color-bg-channel` / `--color-composer-*` / `--color-canvas-tile-*` = 聊天主界面本体；Tailwind 构建产物）
    
      **不要**用 `resources\conversation-report.html` / `startup-report.html` 代表它 —— 那是深色等宽的报告模板，属另一套。
    
      ---
    
      ## 七、与 `frontend-build-verification` 的分工
    
      - **本技能**：确定「改成什么值」（取证 → 对照 → 裁决）
      - **`frontend-build-verification`**：证明「改动真的生效了」（产物选择器集合对比 / 变异验证）
    
      两者串联：取证定值 → 改代码 → 产物级验证。
