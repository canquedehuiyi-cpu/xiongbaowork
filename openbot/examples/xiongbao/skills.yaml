  - slug: workbuddy-market-export
    title: workbuddy-market-export
    summary: 把 WorkBuddy（CodeBuddy）三个市场——专家、技能、插件——的全部内容批量导出成中文命名、按类目分目录的本地素材库。当用户要求"把 WorkBuddy 市场里的专家/技能/插件全下载下来""导出技能市场""做成中文素材库给…
    instructions: |-
      # WorkBuddy 三市场批量导出
    
      ## 核心事实：官方只给「单个安装」，但有整包/公开接口
    
      不要用 `workbuddy_marketplace_skill` 之类工具逐个安装——几百上千次调用跑不完。真正的批量通道都是**免鉴权**的：
    
      | 市场 | 数据源 | 规模 | 通道 |
      |---|---|---|---|
      | 专家 | 公开 COS | 428 位 / 15 中文类目 | 目录 `…/workbuddy/expert-marketplace/expert_center.json`<br>专家包 `…/expert-marketplace/bundles/{plugin}.tar.gz` |
      | 插件·连接器 | 本机 | 243 个 / 含 568 技能 | `~/.workbuddy/connectors-marketplace/`，中文名在 `.codebuddy-connector/connectors.json` |
      | 插件·插件包 | 本机 | 270 个 | `~/.workbuddy/plugins/marketplaces/{cb_teams_marketplace,codebuddy-plugins-official}/`、`<安装目录>/resources/plugins/workbuddy-builtin/` |
      | 技能·官方 | 公开 CDN | 293 个 / 11 中文类目 | `https://download.codebuddy.cn/skill-marketplace/skill-marketplace.zip`（约 30 MB 整包，含全部正文） |
      | 技能·社区 | SkillHub 公网 | **全量 15 万+** | 见下 |
    
      专家包 COS 根：`https://acc-1258344699.cos.accelerate.myqcloud.com/workbuddy/expert-marketplace`
      （`expert_center.json` 里 `paths.experts` / `paths.avatars` 是相对路径，包路径是 `bundles/{name}.tar.gz`）
    
      ## SkillHub 公网接口（社区技能）
    
      ```
      GET  https://lightmake.site/api/v1/categories                  → 13 个中文类目
      GET  https://lightmake.site/api/skills?category=<key>&pageSize=100&page=<n>&sortBy=downloads
           → {code, data:{skills:[…], total}}
      GET  https://lightmake.site/api/v1/search?q=&limit=            → 搜索
      GET  https://lightmake.site/api/v1/download?slug=<slug>&namespace=<handle>
           → 302 到 skillhub-*.cos.*.myqcloud.com/skills/<slug>/<version>.zip
      ```
    
      - 排序参数是 **`sortBy=downloads`**。写成 `sort=downloads` 无效，`sort=installs` 会 400。
      - 分页参数是 `page` / `pageSize`。
      - 同名技能会有多个作者各传一份；`namespace.handle` 区分，去重按 `slug` 保 `downloads` 最大的。
      - **先问用户要哪个量级**：全量 15 万（数小时、数 GB）vs 每类目 Top N。默认建议 Top 200。
    
      ## 执行顺序
    
      1. **探测**：确认各通道可达（`curl -sI`），报告真实规模给用户，让其拍板技能市场量级与去重策略。
      2. **下载**（后台并发，见下）：专家包、SkillHub 包、官方整包。写好断点续传。
      3. **整理**：各分区独立脚本，中文类目 → 中文条目目录，每个条目写一份 `说明.md`。
      4. **命名收敛**：用一张人工校订表（`标识 → 中文名`）修正机器生成的过长/夹带英文的目录名。
      5. **造索引**：扫描目录（而非依赖中间 JSON）生成 CSV（**UTF-8 BOM**）+ 总览 Markdown。
    
      ## 硬约束与坑
    
      1. **前台长任务会被杀**：前台 Bash 命令超过约 1 分钟会被 SIGTERM **且不返回任何输出**（连 `echo $?` 都没有）。
         → 一律 `run_in_background=true`；脚本内 `print(..., flush=True)` 打进度；靠产物存在性做断点续传。
      2. **不要 `| tail -N`**：管道会缓冲，后台任务期间看不到进度。让脚本直接输出。
      3. **tarfile 解包**：Python 3.12+ 传 `filter="data"`。若包内含指向外部的软链接，`extractall` 会**整包失败**；
         改为逐成员 `extractfile()`，跳过 `issym()/islnk()`。
      4. **Windows 文件名**：替换 `<>:"/\|?*` 与控制字符，去尾部 `.` 空格，处理 `CON/PRN/NUL/COM1…` 保留名，截断到 ~80 字。
      5. **安全守卫**：`shutil.rmtree` 超过 50 个文件会被拦并要求确认。**不要强删**——改成在总览里注明重复位置。
      6. **中文名从哪来**（优先用源数据自带的，别翻译）：
         - 专家：`displayName.zh` / `profession.zh`
         - 连接器：`name` / `description_zh`
         - 官方技能：`skills[].name`（已是中文）+ `tags_zh`（中文类目）
         - 插件包：`PLUGIN_ZH` 校订表，兜底取描述首句
         - 社区技能：`name` → `description_zh` 首句
      7. **"纯中文"要留专有名词**：Kubernetes、Ardot、腾讯文档这类全抹掉会让名称失去辨识度。
         按"标识部分中文 + 保留产品名"处理，并在总览里**明确写出这个取舍**，让用户能反悔。
    
      ## 目录结构（约定的输出形态）
    
      ```
      <目标目录>/
      ├── 00-总览.md                 总览 + 导入说明
      ├── 01-专家市场/<中文类目>/<中文专家名>/
      ├── 02-插件市场/连接器/<中文名>/
      ├── 02-插件市场/插件包/<中文类目>/<中文名>/
      ├── 03-技能市场/{官方技能,内置技能,社区技能}/<中文类目>/<中文名>/
      ├── 索引/*.csv                 UTF-8 BOM
      └── _raw/                      原始压缩包 + 采集脚本（可整体删）
      ```
    
      条目目录内的 `说明.md` 字段必须固定为 `- **类目**：` / `- **原始标识**：` / `## 简介`，
      索引生成器靠解析这些字段工作。
    
      ## 交付前必做
    
      - 抽查若干条目的 `说明.md` 与正文是否存在、可读。
      - 统计各分区条目数并与源规模对账（不一致就查重复目录与中断残留）。
      - **报告许可边界**：第三方条目各带许可（包内 LICENSE），对外分发前需逐一核对；
        "金融投资""商业运营"类目常含付费技能。
