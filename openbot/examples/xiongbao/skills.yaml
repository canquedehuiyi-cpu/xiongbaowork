  - slug: frontend-artifact-contract-drift-triage
    title: frontend-artifact-contract-drift-triage
    summary: 定位并证明「后端/目录/策略都已放开，但线上前端产物仍在拦截」这类契约漂移事故。当用户报「以前能用现在报错」「报错文案变了」「解锁了还是不行」「前后端行为不一致」，或需要判断某个限制到底是产品意图还是产物滞后时使用。触发词：前端产物滞后、…
    instructions: |-
      # 前端产物契约漂移定位
    
      ## 何时用
    
      一个功能「本该能用」但线上拦住了，而看源码感觉没问题。典型症状：
    
      - 用户报「**还是报错，只是信息变了**」
      - 源码里有新逻辑，但线上行为还是旧的
      - 目录/接口声明支持某能力，提交时却被拒
      - 「部署过了」但行为没变
    
      核心假设：**限制点可能存在于多个层，其中某一层（通常是已构建的前端产物）滞后**。
      不要一看到源码新就认定线上也是新的；也不要一看源码旧就去改代码。
    
      ## 五层对照法（本方法论的核心）
    
      对**同一个具体请求**（写死一个 body），逐层实测，做一张表：
    
      | # | 层 | 怎么取证 |
      |---|---|---|
      | 1 | 策略/常量 | 读源码里的权威常量与**注释**（注释常写着设计意图，比代码本身更有信息量） |
      | 2 | 目录/接口声明（后端下发给前端的 capabilities） | **在生产里实跑**该服务的 list/describe 函数，而不是查数据库字段 |
      | 3 | 协议客户端校验 | require 生产模块，用同一 body 实跑校验函数 |
      | 4 | 业务服务校验 | 同上；注意热改过的文件 |
      | 5 | **已构建的前端产物** | 直接读线上 `dist/assets/*.js`，反压缩看真实逻辑 |
    
      只有 1–4 放行、5 拒绝 ⇒ 根因就是**产物滞后**，改源码 + 重建产物即可，不要去动后端。
      反之若 1–4 也拒绝 ⇒ 是产品/策略决策，别急着改代码。
    
      > 关键纪律：**永远读产物，不读源码**来判断线上行为。源码新 ≠ 线上新。
    
      ## 具体动作
    
      ### A. 读线上产物（不要用 chunk 名单推断新旧）
    
      ```bash
      # 找到承载该逻辑的 chunk，整文件读出来（通常几 KB，minified 但可读）
      grep -rl "<该模块里独有的一个字符串>" dist/assets/
      cat dist/assets/<chunk>.js
      sha256sum dist/assets/<chunk>.js
      ```
      - 变量被压缩成单字母，但**字符串字面量和数值不会被改名**，靠它们定位逻辑。
      - ❌ **不要用「chunk 名单差异」判断新旧**：打包器只按动态 import 边界切 chunk，静态 import 会被内联，
        名单差异与源码新旧无因果关系。正确判据是「同名产物内容哈希」或「重建后比对」。
    
      ### B. 只读 in-process 探针（最有力的取证手段，零成本零副作用）
    
      写一个 `.js` 文件 scp 到服务器，`require` 生产的服务模块，只读打开生产库，直接调用校验函数：
    
      ```js
      const Database = require('better-sqlite3');
      const db = new Database('<生产库绝对路径>', { readonly: true });   // 必须 readonly
      const svc = require('/opt/.../src/services/xxxService.js');
      for (const c of cases) {
        let r; try { svc.validate(c.body); r = 'PASS'; } catch (e) { r = 'THROW: ' + e.message; }
        console.log(`${c.label} => ${ r }`);
      }
      ```
      ```bash
      scp -i key.pem probe.js ubuntu@host:/tmp/probe.js
      ssh -i key.pem ubuntu@host 'sudo env NODE_PATH=<release>/node_modules /usr/bin/node /tmp/probe.js'
      ```
      - `sudo` 会丢 `NODE_PATH` → 必须 `sudo env NODE_PATH=... /usr/bin/node`。
      - 生产库路径通常不在 release 里（如 `/opt/app/shared/data/*.db`），别猜。
      - 只调用**纯校验函数**；不要触发提交/写库。
    
      ### C. 用「目录实际输出」而非「数据库字段」判断前端能看到什么
    
      数据库里的 capabilities 字段可能是**历史遗留值**，会被服务层重算。必须实跑目录服务的 list。
    
      ### D. 变异验证（证明断言不是空转）
    
      补丁写完后，把源码改回旧行为跑一次，确认测试转红；再改回来跑一次确认转绿。
      变异注入若用字符串替换，必须**命中失败即以非零码退出并打印失败标记**，否则会得到假绿。
    
      ## 硬坑（都踩过）
    
      1. **不要用 `ssh host 'node -e "..."'` 做关键判定。**
         多层引号会静默污染参数（曾把 `seedance-2` 传成带斜杠的畸形串，导致校验函数误报「未开放」，
         据此得出**完全相反**的结论）。→ **一律写 `.js` 文件 scp 上去跑**，
         并在输出里回显 `JSON.stringify(正常化的参数值)` 自证参数没被弄脏。
      2. **限定名 vs 裸名**：很多服务要求 `cfg-<id>::<model>` 形式的限定名，传裸上游名会误抛。
      3. **不要只依赖一次 `diff`**：`sudo diff -u A B > /tmp/x 2>&1` 曾静默返回空，导致误判「0 行差异」。
         用 `cmp`（可直接给出字节/行号）+ `awk` 逐行比对交叉验证。
      4. **行尾差异是伪因**：先做 EOL 归一化再比，别把 CRLF 当根因。
      5. **数据里的可疑值先查是不是「存量脏值」**：改过能力声明后，老数据可能还留着旧值；
         但也要反过来考虑——也可能是目录一直在下发，用户有权选，被拒的是提交层。
         **两种解释都要用「目录实际输出」来区分。**
      6. `sudo` + 中文系统输出是 GBK；Node 读 `tasklist` 之类要取 bytes 再 decode。
    
      ## 收尾检查
    
      - [ ] 五层表每一格都有**实测输出**支撑，没有「应该是」
      - [ ] 已确认既有测试里**没有**断言旧行为的用例（`grep` 目标字符串）
      - [ ] 变异验证：至少两种变异，各自转红，还原后转绿
      - [ ] 明确列出**不改的东西**（其他模型/分支不受影响），并给出依据
      - [ ] 若改动文件被发布门禁追踪 → 单独标注「必须与门禁重绑一起审查，不得热改上线」
