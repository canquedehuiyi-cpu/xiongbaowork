      | 严重度分布 | 🔴 X / 🟠 X / 🟡 X / 🟢 X |
      | 关键行动项 | X 条 |
      | 建议负责人 | ... |

      ---

      ## 1. 各成员核心结论（每位 1 段，别整段复制成员原文）

