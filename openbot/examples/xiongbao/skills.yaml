  - slug: postgres-real-verification
    title: postgres-real-verification
    summary: 在 Docker 不可用的 Windows 机器上，用本机 PostgreSQL 二进制起一个可抛弃集群，跑那些默认被跳过的 `*.postgres.test.ts`（触发器、唯一索引、`SELECT ... FOR UPDATE`、并发…
    instructions: |-
      # 真库验证装置（本机 PostgreSQL，不依赖 Docker）
    
      ## 何时用
    
      - 仓库里有一类 `*.postgres.test.ts` / `*_pg_test.go` 之类**默认被跳过**的套件（常见做法是
        `describe.skipIf(!process.env.VERIFY_DATABASE)`，或全局 setup 在未设标志时**删掉 `DATABASE_URL`**）。
        ⇒ 常规全绿**完全没有覆盖**它们，而它们往往正是**唯一**能证明"数据库确实会拒绝"的地方。
      - 要验证的是**服务端强制**的东西：触发器（append-only / 审计）、`CHECK` 约束、唯一索引充当的准入控制器、
        并发竞态（"恰好 N 个成功"）、迁移本身能否在真库上干净应用。
      - Docker 起不来（agent 会话里守护进程不可用），但机器上装了 PostgreSQL 二进制。
    
      **反过来说**：如果断言能在内存假客户端上证明（纯逻辑、返回值形状），不要用这套装置。它慢、有状态、
      需要重建库，成本要用在"假客户端证明不了"的地方。
    
      ## 装置配方
    
      一个"起集群 → 应用迁移 → 串行跑指定文件 → 停集群"的脚本即可。要点**全部**是被坑逼出来的：
    
      ```bash
      # 1) 端口现取，不要硬编码
      #    Windows 的 Hyper-V/WSL 保留端口段会**在会话中途漂移**：某个端口连续四次可用后突然被吃掉，
      #    只报 `无法绑定IPv4地址"127.0.0.1": Permission denied`（读起来像文件权限问题）。
      #    让 OS 分配（OS 不会分发自己保留的端口），把结果记在集群旁边复用，复用前探一次能否 bind：
      PORT="$(node -e 'const n=require("node:net");const s=n.createServer();
        s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close();})')"
    
      # 2) 路径必须是 Windows 正斜杠形态
      #    MSYS2_ARG_CONV_EXCL=* 时 Git Bash 不做路径转换，`/d/…` 传给原生程序会被当成"当前盘根的相对路径"，
      #    实测会在 D:\d\… 下建出整套目录镜像。取 `pwd -W`（不是 `pwd`）。
      PROJECT="$(cd "$(dirname "$0")/../.." && pwd -W)"
    
      # 3) 集群持久复用，不要每次 initdb、更不要删它
      "$PG_BIN/initdb" -D "$PGDATA" -U <user> -A trust -E UTF8   # 仅当 $PGDATA/PG_VERSION 不存在
      printf "port = %s\nlisten_addresses = '127.0.0.1'\n" "$PORT" >>"$PGDATA/postgresql.conf"
      "$PG_BIN/pg_ctl" -D "$PGDATA" -l "$LOG_DIR/postgres.log" -w -t 60 start
    
      # 4) 数据库默认重建：dropdb --if-exists + createdb（秒级），再用仓库自己的迁移入口
      (cd <pkg> && DATABASE_URL="postgresql://<user>@127.0.0.1:$PORT/<db>" node_modules/.bin/<migrate> deploy)
    
      # 5) 跑测试：必须串行，环境变量与常规跑一致（NODE_ENV=test 之类）
      NODE_ENV=test VERIFY_DATABASE=1 DATABASE_URL="…" \
        node node_modules/vitest/vitest.mjs run --no-file-parallelism <文件…>
      ```
    
      `trap` 必须是：
    
      ```bash
      trap 'status=$?; "$PG_BIN/pg_ctl" -D "$PGDATA" stop -m fast >/dev/null 2>&1 || true; exit $status' EXIT
      ```
    
      ## 六个坑（症状 → 原因 → 修法）
    
      | 症状 | 原因 | 修法 |
      | --- | --- | --- |
      | `无法绑定IPv4地址"127.0.0.1": Permission denied` | 端口落在 Windows 保留段，且保留段**会漂移** | 用 `listen(0)` 现取端口，见配方 1；**不要**记某个"安全端口" |
      | 在 `D:\d\…` 下多出一整套目录镜像 | MSYS2 不做路径转换，`/d/…` 被当成相对路径 | 全脚本用 `pwd -W` 取 `D:/…` |
      | `initdb` 后某步报找不到 `postgresql.conf` | `initdb` 失败但错误写进了重定向日志，脚本继续跑 | initdb 后**显式检查** `$PGDATA/postgresql.conf` 存在，否则打印日志尾部并退出 |
      | 脚本全绿却 `exit 1` | `trap` 里 `rm -rf` 大目录撞上沙箱批量删除守卫（PG data dir ≈ 47000 文件），trap 的最后一条命令顶替了退出码 | `exit $status` 保序 + **根本不删**集群目录（持久复用） |
      | 同一批套件在 A 库全绿、在 B 库掉几个 | 套件用**固定 id** 播种且不做 upsert ⇒ 在已有这些行的库上**静默失效**，产品旅程因与被测代码无关的原因失败 | **默认重建数据库**；排查时先看被测系统自己记录的失败原因（如 `runs.error` 那一列），再怀疑被测代码 |
      | 套件互相干扰（一个在清表另一个在读） | 共享同一个库并发跑 | `--no-file-parallelism` |
    
      另外三条操作纪律：
    
      - **`pg_ctl start` 起的 postmaster 不跨工具调用存活**（父 shell 退出后被带走）。"起服务 → 查询 → 停止"
        必须写在**同一条**命令里，否则跨调用拿到 `Connection refused`。
      - **`psql` 连上之后先确认状态干净**：`pg_ctl start` 报 `another server might be running; trying to start
        server anyway` 时端口上可能**根本没有**服务在听，`psql` 会连到陈旧状态，足以让一次"对象不存在"的观察
        变成误导。诊断迁移/触发器状态前先 `pg_ctl stop -m immediate` 再干净启动。
      - 集群目录、日志放在仓库**之外**或 `.workbuddy/tmp/`（被 gitignore）。
    
      ## 证伪（必做，否则"通过"没有意义）
    
      真库套件里的断言大多是"服务端会拒绝 X"。证明它**不是空转**的办法是**直接改数据库对象**再重跑，
      而不是改源码——触发器/索引由服务端强制，源码里没有可变异的东西：
    
      ```bash
      psql -c 'DROP TRIGGER "t" ON "x"'          # 记下现在的对象清单
      <跑测试>                                    # 点名的那条必须转红
      psql -c 'CREATE TRIGGER "t" … '             # 装回
      <跑测试>                                    # 必须转回绿
      <DROP 另一个对象>  <跑测试>                  # 对照：只有对应的那几条转红
      ```
    
      **"装回后转绿"是关键一步**：它把"上一步转红"钉在对象上，而不是钉在"这一次跑得不好"上。
    
      `TRUNCATE` 这类**行级触发器不触发**的语句要单独造触发器、单独造断言——只测 `UPDATE`/`DELETE` 对
      `TRUNCATE` 一言不发，而"一条语句清空表"往往正是最危险的那个。
    
      ## 报告结果时
    
      - 报**具体数字**（多少个文件、多少条用例），并明确"失败清单是否等于已知环境性文件"。
      - 用了 `--no-file-parallelism`、重建库、端口现取这些前提要写出来，否则别人复现不出同样的结果。
      - **未被验证的仍然要说出口**：Docker 相关的东西（真实 S3/minio、compose 编排）不会因为这套装置而变成已验证。
