      - 关键建议：...

      > 只包含**本次实际上场的成员**，未上场成员不列

      ---

      ## 2. 综合审查发现（去重合并后按严重度排序）

      | # | 严重度 | 类别 | 位置 | 问题描述 | 建议 | 来源成员 |
