      ### remotion-best-practices（已归档）
      最佳实践技能，内容与 `remotion-video-toolkit` 完全重叠。所有最佳实践规则均已收录于 `rules/` 目录，无需单独引用。
    
      **使用方式**：直接使用本技能，通过上方规则表格中的链接跳转到具体规则文件即可。
