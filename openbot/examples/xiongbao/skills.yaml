  - slug: reverse-engineering-fusion
    title: reverse-engineering-fusion
    summary: 逆向工程融合技能 - 通过ORRI方法论(观察→逆向→重建→创新)系统化提取外部系统核心设计并融合。适用场景:融合竞品能力、提取协议格式、重构系统架构、学习未知代码库。当用户提到"逆向工程融合"、"ORRI方法"、"提取协议格式"、"NE…
    instructions: |-
      # 逆向工程融合技能 v2.0
    
      ## 🎯 核心理念
    
      **逆向工程不是复制代码,而是理解原理后重新实现。**
    
      ```
      目标系统 → 观察行为 → 提取规律 → 重新实现 → 优化超越
      ```
    
      ## 📚 ORRI 方法论
    
      ### 第一步:Observation(观察)
    
      **原则**:只看不改,观察外部行为
    
      **执行清单**:
      - [ ] 定位目标系统目录结构
      - [ ] 识别关键文件(入口、配置、文档)
      - [ ] 观察输入/输出关系
      - [ ] 记录边界条件和错误处理
      - [ ] 理解 UI/UX 交互流程
    
      **工具**:文件浏览、日志分析、网络抓包
    
      ### 第二步:Reverse(逆向)
    
      **原则**:从行为反推内部结构
    
      **执行清单**:
      - [ ] 提取通信协议格式(XML/JSON/二进制)
      - [ ] 分析数据流和控制流
      - [ ] 识别关键函数和模块
      - [ ] 重建架构图和时序图
      - [ ] 标注协议版本和约束
    
      **输出**:协议文档、架构图、接口规范
    
      ### 第三步:Reconstruct(重建)
    
      **原则**:用自己的技术栈重新实现
    
      **执行清单**:
      - [ ] 先实现协议层(最稳定)
      - [ ] 再实现数据转换层
      - [ ] 最后实现业务逻辑层
      - [ ] 保持接口协议兼容
      - [ ] 编写单元测试验证
    
      **关键**:协议兼容,功能自主
    
      ### 第四步:Innovate(创新)
    
      **原则**:在还原基础上优化改进
    
      **执行清单**:
      - [ ] 解决原系统的已知问题
      - [ ] 扩展原系统未有的功能
      - [ ] 与自有系统深度融合
      - [ ] 建立竞争壁垒
    
      ## 🎯 融合四层次
    
      | 层次 | 表现 | 适用场景 | 稳定性 |
      |------|------|----------|--------|
      | **功能层** | 抄功能 | 临时验证、概念原型 | ⭐⭐ |
      | **协议层** | 抄格式 | 长期维护、系统集成 | ⭐⭐⭐⭐ |
      | **架构层** | 抄设计 | 深度定制、可扩展 | ⭐⭐⭐⭐⭐ |
      | **原理层** | 抄思想 | 建立壁垒、创新超越 | ⭐⭐⭐⭐⭐ |
    
      ## 🛠️ 逆向工程实施流程
    
      ### 阶段一:目标识别
    
      ```bash
      # 1. 定位目标系统目录
      # 2. 识别关键文件:
      #    - 主入口文件(main/index)
      #    - 架构文档(AGENTS.md/README.md)
      #    - 配置文件
      # 3. 确定逆向范围(单模块 or 全系统)
      ```
    
      ### 阶段二:协议提取
    
      ```bash
      # 1. 寻找通信格式文档
      # 2. 提取输入/输出规范
      # 3. 标注协议版本
      # 4. 验证协议完整性
      ```
    
      ### 阶段三:功能拆解
    
      ```
      ┌──────────────────────┐
      │     目标系统          │
      │  ┌────┐ ┌────┐ ┌───┐│
      │  │ A  │ │ B  │ │ C ││
      │  └─┬──┘ └─┬──┘ └─┬─┘│
      │    └──────┴──────┘  │
      │           ↓          │
      │   ┌──────────┐      │
      │   │ 共享协议层│      │
      │   └────┬─────┘      │
      └────────┼─────────────┘
               ↓
      ┌──────────────────────┐
      │   我们的融合系统      │
      └──────────────────────┘
      ```
    
      ### 阶段四:适配器开发
    
      ```typescript
      interface IAdapter {
        // 输入转换(我们的格式 → 目标协议格式)
        encode(input: OurFormat): TargetFormat
        // 输出转换(目标协议格式 → 我们的格式)
        decode(output: TargetFormat): OurFormat
      }
      ```
    
      ### 阶段五:集成测试
    
      ```bash
      # 1. 单元测试:各模块独立验证
      # 2. 协议测试:输入/输出符合目标格式
      # 3. 功能测试:行为与目标系统一致
      # 4. 融合测试:与自有系统集成验证
      ```
    
      ## ⚠️ 常见错误与规避
    
      ### ❌ 错误1:陷入代码细节
    
      **表现**:逐行复制代码,试图理解每一行  
      **问题**:失去全局视野  
      **规避**:先画架构图,再看代码
    
      ### ❌ 错误2:迷信单一系统
    
      **表现**:试图100%复制目标系统  
      **问题**:版本依赖,失去自主性  
      **规避**:保留自有核心,融合补充能力
    
      ### ❌ 错误3:忽略边界条件
    
      **表现**:只测试正常路径  
      **问题**:上线即崩溃  
      **规避**:系统整理边界场景
    
      ### ❌ 错误4:缺乏文档记录
    
      **表现**:做了但不写  
      **问题**:团队无法复用  
      **规避**:每个融合点都要文档记录
    
      ## 📝 输出清单
    
      完成逆向工程融合后,必须产出:
    
      | 文档 | 内容 |
      |------|------|
      | **protocol.md** | 输入/输出格式、字段语义、版本变更 |
      | **architecture.md** | 模块关系、数据流向、设计决策 |
      | **implementation.md** | 融合步骤、测试结果、已知限制 |
      | **maintenance.md** | 升级注意事项、故障排查、扩展点 |
    
      ## ✅ 验收标准
    
      - [ ] ORRI 方法论文档完整
      - [ ] 协议格式说明清晰
      - [ ] 有可运行的参考实现
      - [ ] 测试用例覆盖
      - [ ] 边界条件说明
      - [ ] 融合示例
      - [ ] 错误规避清单
    
      ## 📖 参考资源
    
