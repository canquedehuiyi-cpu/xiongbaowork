{{- if .Values.migrations.enabled }}
{{- $component := "migrations" -}}
{{/*
The schema, before anything serves a request.

A pre-install and pre-upgrade hook rather than an init container on the Deployment: with several
replicas, an init container means every replica races to migrate the same database, and the
migration that loses is a failed pod on an otherwise healthy rollout. One Job runs once.

WHEN IT RUNS DEPENDS ON WHOSE DATABASE IT IS, and both wrong answers deadlock rather than slow down.

A pre-install hook runs before the chart's own resources, so with the bundled database the
StatefulSet does not exist yet and never will while the hook is running: waiting cannot help,
because the thing being waited for is behind the wait. A post-install hook has the mirror image of
the same problem, because `--wait` holds it until the Deployment is ready and the Deployment cannot
be ready against a database with no schema in it.

So on a first install with the bundled database this is not a hook at all. It is an ordinary Job,
created in the same pass as the database and the Deployment, and it waits for the database while the
replicas wait for it: every pod that reads the database holds in its `wait-for-database` init
container until this Job's migrations are in (`openbot.waitForDatabase`). They used to start anyway,
log a connection failure on every first install and retry, against a schema still on its way. The
server waiting on this Job is not a deadlock because this Job never waits on the server.

Every other case is a hook, because in every other case the database already exists. An external
database on install, and any upgrade at all, run `pre`, where the schema is ready before a replica
reaches a version of it that it has not seen.

Deleted before the next run and on success. A failed one is kept, so the reason is still readable.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}-{{ .Release.Revision }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
  {{- if not (and .Values.postgresql.enabled .Release.IsInstall) }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
{{ include "openbot.componentSelectorLabels" (dict "root" . "component" $component) | indent 8 }}
        {{- if .Values.postgresql.enabled }}
        {{- /*
          The bundled database admits pods carrying this label and nothing else, which this chart pins on.
          Anything that opens the database needs it, and only the API server had it: this would have been
          refused on any cluster that actually enforces a NetworkPolicy. Not caught by hand, because the
          cluster it was driven on ships enforcement switched off.
        */}}
        {{ .Release.Name }}-postgresql-client: "true"
        {{- end }}
    spec:
      restartPolicy: Never
      {{- /*
        NO SERVICE ACCOUNT, WHICH IS BOTH CORRECT AND NECESSARY.
        
        Correct because this Job talks to a database and never to the cluster, so a cluster
        credential in it is one nothing needs. Necessary because as a pre-install hook it runs before
        the chart's own resources exist, and naming the ServiceAccount the API pods use fails with
        "serviceaccount not found" and a Job that can never schedule. The default account, with no
        token mounted, is what a migration actually requires.
      */}}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "openbot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/server
          command:
            - /bin/sh
            - -ec
            - |
              {{- if not .Values.postgresql.enabled }}
              # The owner migrates (0054's grants and 0109's roles are the owner's to make); the API's
              # own role cannot. See database.migrationUrl in values.yaml.
              if [ -n "${MIGRATION_DATABASE_URL:-}" ]; then
                export APP_DATABASE_URL="${APP_DATABASE_URL:-$DATABASE_URL}"
                export DATABASE_URL="$MIGRATION_DATABASE_URL"
              elif [ -n "${MIGRATION_URL_EXPECTED:-}" ]; then
                echo "migrate: no ${MIGRATION_URL_EXPECTED} key in the database Secret, so migrating with database-url as before. Add the owner's URL under that key: the API's role cannot run migrations." >&2
              fi
              {{- end }}
              # Bounded, so a database that is never coming back fails the install rather than
              # holding it open until somebody notices. `pg_isready` reads the same DATABASE_URL the
              # migration is about to use, so this cannot wait on the wrong server.
              deadline=$(( $(date +%s) + {{ .Values.migrations.waitForDatabaseSeconds }} ))
              until pg_isready -d "$DATABASE_URL" -q; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "the database did not accept connections within {{ .Values.migrations.waitForDatabaseSeconds }}s" >&2
                  exit 1
                fi
                sleep 2
              done
              {{- if not .Values.postgresql.enabled }}
              # The owner's URL and the API's must reach the SAME database, or this migrates one the API
              # never reads and still succeeds. Compared by name and by when that server started (as an epoch,
              # so neither role's DateStyle or timezone can make one server read as two), which
              # both roles can read. On a first install openbot_app has no password yet (it is set after
              # migrating), so a failed API connection is reported and the check skipped.
              if [ -n "${APP_DATABASE_URL:-}" ] && [ "$APP_DATABASE_URL" != "$DATABASE_URL" ]; then
                identity="SELECT current_database() || ' started ' || extract(epoch FROM pg_postmaster_start_time())"
                owner_reaches="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "$identity")"
                if api_reaches="$(psql "$APP_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "$identity" 2>/dev/null)"; then
                  if [ "$owner_reaches" != "$api_reaches" ]; then
                    echo "migrate: refusing to migrate. The migration URL reaches '$owner_reaches' but the API's URL reaches '$api_reaches': database.migrationUrl (or the Secret's migration key) points at a different database than the API uses." >&2
                    exit 1
                  fi
                  echo "migrate: the owner's and the API's URLs reach the same database"
                else
                  echo "migrate: could not connect with the API's URL to confirm it reaches the same database as the migration URL (expected on a first install, before openbot_app has a password); migrating without that check" >&2
                fi
              fi
              {{- end }}
              /usr/local/bin/bun scripts/migrate.ts
              {{- if .Values.postgresql.enabled }}
              # The role writer's password, as the embedded image's migrate.sh sets it: after the
              # migrations that create the role, as the owner. Alphanumeric by construction; checked
              # anyway before it goes into a SQL literal.
              case "$ROLE_WRITER_PASSWORD" in ''|*[!A-Za-z0-9]*) echo "migrate: invalid role writer password" >&2; exit 1 ;; esac
              printf "ALTER ROLE openbot_role_writer WITH LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD '%s';\n" "$ROLE_WRITER_PASSWORD" |
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q >/dev/null
              echo "migrate: openbot_role_writer password installed"
              {{- end }}
          env:
{{ include "openbot.migrationDatabaseUrlEnv" . | indent 12 }}
            {{- if and (not .Values.postgresql.enabled) (not (.Values.database).migrationUrl) .Values.database.existingSecret }}
            - name: MIGRATION_URL_EXPECTED
              value: {{ (.Values.database).migrationExistingSecretKey | default "migration-database-url" | quote }}
            {{- end }}
            - name: EMBEDDED_POSTGRES
              value: "off"
            - name: EMBEDDED_COMPUTER
              value: "off"
          {{- with .Values.migrations.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}
