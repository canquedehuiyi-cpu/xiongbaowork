{{- if .Values.postgresql.enabled }}
{{/*
The role writer's password, for the bundled database (migration 0109's `openbot_role_writer`).

The API refuses to start without ROLE_WRITER_DATABASE_URL in every mode, and the role 0109 creates
has no password, so nothing could log in as it. This is the embedded image's answer
(docker/s6/scripts/postgres-init.sh and migrate.sh), in a chart's terms: a random password kept
across upgrades, set on the role by the migrations Job as the owner after it migrates, and the
same value in the API's URL.

STABLE ACROSS UPGRADES. Read back from the cluster (`lookup`) when it already exists, generated only
when it does not. `helm template` and GitOps tools that render without a cluster cannot look it up
and generate a fresh one each render; the migrations Job sets whatever value was rendered, so the
role and the API still agree after each sync, but the role's password then changes on every sync.

A HOOK, BECAUSE THE MIGRATIONS JOB IS ONE. On an upgrade the Job runs before the chart's ordinary
resources are written, so a Secret added by this release would not exist yet when the Job starts.
As a pre-install/pre-upgrade hook it is written first; Helm replaces it on each run (with the value
read back above) and does not delete it on uninstall, which is `resource-policy: keep` for a hook.
*/}}
{{- $name := printf "%s-database-roles" (include "openbot.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "role-writer-password") }}
{{- $password = index $existing.data "role-writer-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
{{ include "openbot.labels" . | indent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  role-writer-password: {{ $password | quote }}
{{- end }}
