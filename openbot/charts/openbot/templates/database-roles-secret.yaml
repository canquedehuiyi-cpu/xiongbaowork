{{- if .Values.postgresql.enabled }}
{{/*
The role writer's password, for the bundled database (migration 0109's `openbot_role_writer`).

The API refuses to start without ROLE_WRITER_DATABASE_URL in every mode, and the role 0109 creates
has no password, so nothing could log in as it. This is the embedded image's answer
(docker/s6/scripts/postgres-init.sh and migrate.sh), in a chart's terms: a random password kept
across upgrades, set on the role by the migrations Job as the owner after it migrates, and the
same value in the API's URL.

STABLE ACROSS UPGRADES. `database.roleWriterPassword` when the operator sets one; otherwise read back
from the cluster (`lookup`) when it already exists, generated only when it does not. A tool that
renders without a cluster (`helm template`, GitOps) cannot look it up and generates a fresh one each
render: the Job sets it on the role, and the API pods roll because their `checksum/role-writer`
annotation follows the value, but the password still changes on every sync. GitOps installs set
`database.roleWriterPassword`, or name their own Secret with `database.roleWriterPasswordExistingSecret`
(this template then renders nothing).

A HOOK, BECAUSE THE MIGRATIONS JOB IS ONE. On an upgrade the Job runs before the chart's ordinary
resources are written, so a Secret added by this release would not exist yet when the Job starts.
As a pre-install/pre-upgrade hook it is written first; Helm replaces it on each run (with the value
read back above) and does not delete it on uninstall, which is `resource-policy: keep` for a hook.
*/}}
{{- if not (.Values.database).roleWriterPasswordExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbot.fullname" . }}-database-roles
  labels:
{{ include "openbot.labels" . | indent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  role-writer-password: {{ include "openbot.roleWriterPassword" . | quote }}
{{- end }}
{{- end }}
