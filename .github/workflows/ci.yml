# GitHub only discovers workflows here. openbot/.github/workflows is retained
# for upstream synchronisation and does not execute in this fork.
name: 熊宝交付 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs these same checks on the tagged commit before it builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: openbot

env:
  TENANT_PACKAGE_DIR: ../examples/qoderwake
  # Frozen at the commit main was created from (D06 candidate). The previous value
  # 03df9efa... does not exist in this repository. Never replace with moving main.
  DELIVERY_BASELINE_SHA: 2aacf0f19fdaaeeb4414d4ee4c09cef1f2fc7634

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx biome lint --error-on-warnings --diagnostic-level=warn .
      - run: bun run typecheck
      - run: bun test test-report.test.mjs release-tag.test.mjs
        working-directory: openbot/scripts/ci

  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_b_head
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_b_head"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTELLIGENCE_MODE: local
      DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_head
      TEST_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_head
      # Migration 0109 creates the restricted role writer; tests bind it the way the server does.
      TEST_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_b_head
      # D06 suites clone this migrated, never-connected template into one-time databases.
      TEST_DATABASE_ADMIN_URL: postgres://openbot:ci-owner@127.0.0.1:5432/postgres
      TEST_DATABASE_TEMPLATE: openbot_continuation_template
      TEST_DATABASE_BYPASS_URL: postgres://openbot_fixture:ci-fixture@127.0.0.1:5432/postgres
      PGPASSWORD: ci-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare frozen baseline and separate databases
        run: |
          bash scripts/ci/prepare-baseline.sh
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_b_base OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_b_head bun run --cwd server scripts/migrate.ts
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_b_base bun run --cwd "$RUNNER_TEMP/delivery-baseline/openbot/server" scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_continuation_template OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_continuation_template bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE openbot_fixture LOGIN PASSWORD 'ci-fixture' NOSUPERUSER BYPASSRLS IN ROLE openbot_app"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          printf 'DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base\n' > "$RUNNER_TEMP/delivery-baseline/openbot/.env"
      - name: Baseline tests (same head shard file list, own database)
        continue-on-error: true
        run: |
          DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base \
          TEST_DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base \
            bash scripts/ci/run-tests.sh "$RUNNER_TEMP/delivery-baseline/openbot" server "$RUNNER_TEMP/base.log" "${{ matrix.shard }}" "$PWD"
      - name: Head tests (openbot_app, one process per shard)
        continue-on-error: true
        run: bash scripts/ci/run-tests.sh "$PWD" server "$RUNNER_TEMP/head.log" "${{ matrix.shard }}" "$PWD"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" "server shard ${{ matrix.shard }}"
      - name: Print head test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/head.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-${{ matrix.shard }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.log.files.txt

  app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bash scripts/ci/prepare-baseline.sh
      - name: Baseline app tests
        continue-on-error: true
        run: bash scripts/ci/run-tests.sh "$RUNNER_TEMP/delivery-baseline/openbot" app "$RUNNER_TEMP/base.log"
      - name: Generate configuration and run app tests
        continue-on-error: true
        run: bash scripts/ci/run-tests.sh "$PWD" app "$RUNNER_TEMP/head.log"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-logs
          path: ${{ runner.temp }}/*.log

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: docker build -f Dockerfile -t openbot:trackb .
      - name: DoD-2 and DoD-3 (no provider credentials)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/delivery-evidence
        run: bash scripts/ci/image-smoke.sh openbot:trackb
      - name: Print container logs (credentials masked)
        if: failure()
        run: |
          for f in startup owner auth recreated; do
            bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/delivery-evidence/$f.log" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-evidence
          path: ${{ runner.temp }}/delivery-evidence/
          if-no-files-found: error
