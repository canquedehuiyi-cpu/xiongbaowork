# 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
# GitHub only discovers workflows here; xiongbao/.github/workflows does not execute.
name: 熊宝交付 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs these same checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      skip_image:
        description: The caller builds and smoke-tests the image itself (release.yml builds once).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: xiongbao

env:
  TENANT_PACKAGE_DIR: ../examples/xiongbao
  # The frozen baseline is "the last commit on main whose whole run was green", pinned by commit — never
  # a branch: a moving baseline turns 「新增失败」into "whatever main was when this job started", and the
  # comparison then says nothing about the change under test.
  #
  # 2026-11-18: moved from 2aacf0f19f (2026-11-04, before the openbot/ → xiongbao/ rename and before
  # examples/xiongbao existed) to e63acdfb51 (run 44264063700, 46/46). Two things came from that staleness:
  # the baseline had to be located under its old product directory (baseline-dir.sh still allows that for
  # old pins), and the app baseline had to be generated with TENANT_PACKAGE_DIR=../examples/qoderwake, a
  # package this tree no longer carries. Both allowances are gone below; the pin now needs neither.
  # Also: 03df9efa... (an even earlier value) does not exist in this repository — prepare-baseline.sh now
  # says so by name instead of failing inside `git worktree add`.
  DELIVERY_BASELINE_SHA: e63acdfb51a3a5e6624f50b03991ef6e4d423a42

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome lint --error-on-warnings --diagnostic-level=warn .
      - run: bun run typecheck
      # app-shards and server-shards are here because app-test/server-test trust their manifests: a
      # stale list would drop test files from every run, and neither suite would notice.
      - run: bun test test-report.test.mjs release-tag.test.mjs manual-blocks.test.mjs device-release-workflow.test.mjs mirror-release-workflow.test.mjs app-shards.test.mjs server-shards.test.mjs
        working-directory: xiongbao/scripts/ci

  # The tests sit outside `server/tsconfig.json`, so `bun run typecheck` above says nothing about them:
  # a change can type-check as a product and still leave the test that exercises it unrepresentable.
  # `scripts/typecheck-tests.ts` runs tsc over `server/tsconfig.tests.json` and fails on any error the
  # frozen baseline (`server/tests/typecheck-baseline.txt`) does not already carry. The baseline is debt
  # that predates the gate: fix what it reports, and never regenerate it with `--update` to go green.
  # That debt is now paid off — the file has been empty since 2026-11-18 — so as of today this job is
  # a clean gate: any error in `server/tests` fails it, with no frozen entries to absorb one.
  # Its own job, so a red run here reads as "the tests project", not as the product failing to compile,
  # and so it does not lengthen the static gate every pull request waits on.
  typecheck-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:tests

  # The Helm chart, rendered for real. xiongbao/.github's chart job is the upstream copy and does not
  # run here, so nothing rendered the chart in this fork. Lint plus a few `helm template` renders,
  # no cluster: see scripts/ci/chart-check.sh for what each check stands for.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - run: bash scripts/ci/chart-check.sh

  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_b_head
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_b_head"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTELLIGENCE_MODE: local
      DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_b_head
      TEST_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_b_head
      # Migration 0109 creates the restricted role writer; tests bind it the way the server does.
      TEST_ROLE_WRITER_DATABASE_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_b_head
      # D06 suites clone this migrated, never-connected template into one-time databases.
      TEST_DATABASE_ADMIN_URL: postgres://openbot:ci-owner@127.0.0.1:5432/postgres
      TEST_DATABASE_TEMPLATE: xiongbao_continuation_template
      TEST_DATABASE_BYPASS_URL: postgres://xiongbao_fixture:ci-fixture@127.0.0.1:5432/postgres
      PGPASSWORD: ci-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Print database version
        # After checkout: the workflow's default working-directory (xiongbao) exists only then.
        # Run psql inside the service container: the runner image need not ship a client.
        run: docker exec ${{ job.services.postgres.id }} psql -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'select version()'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The Bots are not root workspaces and each keeps its own lockfile (as upstream CI installs them).
      # Restored upstream suites spawn agent-bot and import agent-mastra's receiver (R0, learning).
      # egress-policy-delivery (upstream v1.0.0) starts the real agent-computer, which runs from its own
      # lockfile (playwright, web-bot-auth, xterm), as the image installs it.
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: xiongbao/agent-computer
      - run: bun install --frozen-lockfile
        working-directory: xiongbao/agent-bot
      - run: bun install --frozen-lockfile
        working-directory: xiongbao/agent-langgraph
      - run: bun install
        working-directory: xiongbao/agent-mastra
      - name: Prepare frozen baseline and separate databases
        run: |
          bash scripts/ci/prepare-baseline.sh --with-bots
          baseline="$(bash scripts/ci/baseline-dir.sh)"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE xiongbao_b_base OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_b_head bun run --cwd server scripts/migrate.ts
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_b_base bun run --cwd "$baseline/server" scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE xiongbao_continuation_template OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_continuation_template bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_role_writer WITH PASSWORD 'ci-role-writer'"
          # The frozen baseline predates migration 0240, which renames the application roles: head's
          # migration renamed the cluster's roles first, and the baseline's own migrations then made
          # roles under the old names for its database. They get the same passwords. Once the pin moves
          # past 0240 these roles no longer exist (hence the guard) and the baseline URLs below move
          # to the new names with it. (Checked in R4 Task 25: the pin, e63acdfb, still predates 0240.)
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'openbot_app') THEN ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS; END IF; IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'openbot_role_writer') THEN ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'; END IF; END \$\$"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE xiongbao_fixture LOGIN PASSWORD 'ci-fixture' NOSUPERUSER BYPASSRLS IN ROLE xiongbao_app"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          printf 'DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/xiongbao_b_base\n' > "$baseline/.env"
      - name: Baseline tests (same head shard file list, own database)
        continue-on-error: true
        # Every database the baseline tree touches is its own, the writer too. `initializeRoleWriter`
        # refuses an application and a writer that are not on the same database (it compares database,
        # oid, server address and port), so leaving TEST_ROLE_WRITER_DATABASE_URL at the job default
        # pointed the writer at xiongbao_b_head while the application was on xiongbao_b_base: every suite
        # that binds the writer died in its hook — 38 unnamed failures on shard 1 alone — and
        # test-report.mjs refuses to compare a log with unnamed failures at all.
        # The baseline predates migration 0240, so its database's roles still have the old names (see the
        # preparation step); the URLs move to the new names when the pin moves past 0240.
        env:
          DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/xiongbao_b_base
          TEST_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/xiongbao_b_base
          TEST_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_b_base
        run: bash scripts/ci/run-tests.sh "$(bash scripts/ci/baseline-dir.sh)" server "$RUNNER_TEMP/base.log" "${{ matrix.shard }}" "$PWD"
      - name: Head tests (xiongbao_app, one process per shard)
        # No continue-on-error: a failing head test fails this step and the job. The report step
        # below runs anyway (if: always()) for the baseline comparison.
        # G01-E P15: nothing to set for tenant frames. The frame-guard switch is gone: the database
        # client throws a TenantContextError (server/src/tenant/context.ts) for every read or write
        # made outside a tenant frame, unconditionally, so the test that made it fails on its own.
        run: bash scripts/ci/run-tests.sh "$PWD" server "$RUNNER_TEMP/head.log" "${{ matrix.shard }}" "$PWD"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" "server shard ${{ matrix.shard }}"
      - name: Print head test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/head.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-${{ matrix.shard }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.log.files.txt

  # One Bun process per shard, as server-test already does. Run whole, this suite was 628 files in
  # one process, and from roughly 300 files in `app/tests/workbench-frame-routes.test.tsx` stopped
  # mounting the workbench frame: its seven route cases each waited the test's own 25s LOAD and then
  # failed on a DOM that held only the settings page's own shell. The same file alone is 8/8 green in
  # about a second, and the 200 files ahead of it in that run order were green too, so the trigger is
  # how much ran before it in the process, not the file or the code under test. The split is a
  # committed list (scripts/ci/app-tests.list.txt, rewritten with
  # `bun scripts/ci/app-shards.mjs --write`): a new test file without a manifest update fails the job
  # rather than silently never running, and a shard is reproducible from the manifest alone.
  app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bash scripts/ci/prepare-baseline.sh
      - name: Baseline app tests (the frozen tree's own tenant package)
        continue-on-error: true
        # No TENANT_PACKAGE_DIR override: the baseline is now the last green main commit, so it carries
        # examples/xiongbao and generates its own app config. The override existed because the previous
        # baseline (2aacf0f) predated examples/xiongbao: `generate:app-config` exited 1 there, `set -e`
        # stopped the script, and base.log held no `Ran … tests` line, so the comparison was empty on
        # every run since the baseline was pinned. That commit's own CI used ../examples/qoderwake; it is
        # not in this tree any more, which is why the refresh and this removal had to land together.
        run: bash scripts/ci/run-tests.sh "$(bash scripts/ci/baseline-dir.sh)" app "$RUNNER_TEMP/base.log" "${{ matrix.shard }}" "$PWD"
      - name: Generate configuration and run app tests (this shard)
        run: bash scripts/ci/run-tests.sh "$PWD" app "$RUNNER_TEMP/head.log" "${{ matrix.shard }}" "$PWD"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" "app shard ${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-${{ matrix.shard }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.log.files.txt

  # WP-3.2 状态行实时耗时的截图取证（设计规格 §8.3）：真 Chromium 里画真转录，暗色＋2 倍像素，
  # 五个画面各存一张图，上传成 artifact 供负责人核对界面后才合并。新增的证据 job，不动任何既有门；
  # 测试本体由 skipIf 门控，app 分片不为它付时间，只有这个 job 带着 XIONGBAO_APP_BROWSER 要浏览器。
  app-status-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The transcript imports brand.ts, which reads the generated application config. The app
      # shards get it from run-tests.sh, which cds into app/ first (so its `--cwd ..` is this
      # directory); this job already runs here, where package.json defines generate:app-config.
      - name: Generate the app configuration the transcript imports
        run: bun run generate:app-config
      - name: Install Chromium for the root workspace's playwright-core
        run: bunx playwright-core install --with-deps --no-shell chromium
      - name: Status-line scenes, dark at 2x
        env:
          XIONGBAO_APP_BROWSER: '1'
          XIONGBAO_APP_SHOTS: ${{ runner.temp }}/wp32-shots
        run: bun test app/tests/wp32-status-shots.test.tsx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wp32-status-shots
          path: ${{ runner.temp }}/wp32-shots

  # Scan what the customer is given (spec 5.1): the built web app and the runner sidecar are
  # checked against the word lists in xiongbao/app/tests/brand-artifacts, and the
  # rewrite gauge goes into the job summary.
  brand-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the web app
        run: bun run generate:app-config && bun run --cwd app build
      # Only to have the runner binary to scan below: this is not a package build. It never runs
      # `tauri build`, so no installer ships from here, no third-party notices are needed, and the
      # device bundle builds counted in desktop-device/tests/brand-icons.test.ts do not include it.
      - name: Build the runner sidecar
        run: |
          bun desktop-device/scripts/build-sidecar.ts
      - name: Scan the web app
        run: bun scripts/brand/scan-artifact.ts --kind web --input app/dist --allowlist app/tests/brand-artifacts/web.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Scan the runner
        run: bun scripts/brand/scan-artifact.ts --kind runner --input desktop-device/src-tauri/binaries/xiongbao-runner-x86_64-unknown-linux-gnu --allowlist app/tests/brand-artifacts/runner.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Rewrite gauge
        if: always()
        run: bun scripts/brand/metrics.ts --base origin/main >> "$GITHUB_STEP_SUMMARY"

  # Gate G4: the WakerFlow basic lifecycle in a real browser (the runner's preinstalled Chrome, driven
  # by playwright-core) against the real server on its own PostgreSQL, serving the built app the way
  # the image does. The model is aimock: no secret, no provider call, nothing charged. Generate ->
  # edit -> save -> run -> abort mid-step -> inspect -> SIGKILL the server mid-run -> restart ->
  # the interrupted run is closed failed and not replayed (WF-F) -> a fresh run completes.
  e2e-wakerflow:
    name: G4 WakerFlow lifecycle (browser, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_e2e
      # The fresh-database check and the recovery-horizon time shift only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Build the app the server serves (APP_DIST_DIR)
        run: bun run --cwd app build
      - name: The runner's preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "E2E_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: G4 WakerFlow lifecycle
        env:
          E2E_APP_DIST_DIR: app/dist
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g4
        run: bun scripts/e2e/wakerflow-lifecycle.ts
      - name: Print server logs (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g4/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Screenshots of every step, the Playwright trace, both server logs and the model-call record.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-wakerflow-evidence
          path: ${{ runner.temp }}/g4/

  # Gate G6: 对话招员工 / 组群聊 in a real browser, the same services and environment as G4 (its own
  # PostgreSQL, the built app served by the real server, the runner's Chrome, aimock as the model: no
  # secret, no provider call). Ask 小管家 to hire -> the draft card -> edit the name -> confirm -> the
  # employee exists under the edited name -> 小管家 reads proposal_status and carries on; ask for a
  # group of two -> another account opens the conversation and has nothing to press -> confirm -> the
  # group exists with its employees in the drafted order.
  e2e-staffing:
    name: G6 staffing lifecycle (browser, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_e2e
      # The fresh-database check only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Build the app the server serves (APP_DIST_DIR)
        run: bun run --cwd app build
      - name: The runner's preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "E2E_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: G6 staffing lifecycle
        env:
          E2E_APP_DIST_DIR: app/dist
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g6
        run: bun scripts/e2e/staffing-lifecycle.ts
      - name: Print server log (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g6/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Screenshots of every step (the other account's view included), the Playwright trace, the
      # server log and the model-call record.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-staffing-evidence
          path: ${{ runner.temp }}/g6/

  # G7: a file the Bot saved is reachable from the conversation — the download address the line hands
  # out, the turn's artifact list, and the browser saving what that address answers. The computer's own
  # answers (the write, the folder listing, the bytes) are fixed in the script, because a runner has no
  # computer to reach; the scope answer that decides whether a link is drawn at all is the server's.
  # Screenshots are the deliverable, so the evidence is uploaded on a green run too (dark, 2x).
  e2e-artifact:
    name: G7 artifact reachability (browser, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_e2e
      # The fresh-database check only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Build the app the server serves (APP_DIST_DIR)
        run: bun run --cwd app build
      - name: The runner's preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "E2E_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: G7 artifact reachability
        env:
          E2E_APP_DIST_DIR: app/dist
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g7
        run: bun scripts/e2e/artifact-reachability.ts
      - name: Print server log (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g7/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Screenshots of the four states (dark, 2x), the Playwright trace on failure, the server log and
      # the record of every answer the script fixed for the computer.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-artifact-evidence
          path: ${{ runner.temp }}/g7/

  # G8 (期九·六): the turn a person starts in a chat keeps going when nobody is watching, over plain HTTP
  # (no browser, no built app) against the real server and its own PostgreSQL, with the model mocked
  # (aimock) and the computer a fixed stand-in (a runner has none): the page closes at the first tool
  # call and the turn still finishes with both results stored and each command run once; a dropped
  # connection joins the live turn again (replay, then live); a killed and restarted server marks the
  # running turn interrupted, says so in Chinese, and replays nothing. XIONGBAO_CHAT_SERVER_COMPUTER_TOOLS
  # is set by the script for the server it starts, not here. Scenario C waits out the real recovery
  # horizon (about 45 s), so the job takes about a minute after install.
  e2e-background-chat:
    name: G8 background chat (HTTP, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_e2e
      # The fresh-database check and reading the turn's rows back only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: G8 background chat
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g8
        run: bun scripts/e2e/background-chat.ts
      - name: Print server logs (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g8/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Both server logs and the record of every command the computer was asked to run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-background-chat-evidence
          path: ${{ runner.temp }}/g8/

  # 期 3 主动场景冒烟：员工自己认领看板上的卡并做完；安静时段内不发通知也不开工。接真库（应用角色）、用真的心跳、
  # 认领、交付闭环和通知投递代码，只把模型那一轮换成固定的替身，不碰网络、不要密钥。比 G8 轻得多（不起服务器），
  # 几秒钟就跑完；库的属主连接只用来种数据和读回结果。
  e2e-proactive:
    name: Proactive smoke (heartbeat, card claiming, quiet hours)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_e2e
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role password (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE xiongbao_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
      - name: Proactive smoke
        run: bun scripts/e2e/employee-eval/smoke-proactive.ts

  image:
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: docker build -f Dockerfile -t xiongbao:trackb .
      # Each scan runs to the end and the verdict comes after, so one CI round shows every word list.
      - name: Brand scan - image files, env, labels
        id: scan_image
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh xiongbao:trackb -c 'find / -xdev \( -path /proc -o -path /sys \) -prune -o -print' > "$RUNNER_TEMP/image-files.txt"
          docker inspect xiongbao:trackb > "$RUNNER_TEMP/image-config.json"
          rc=0
          bun scripts/brand/scan-artifact.ts --kind image-files --input "$RUNNER_TEMP/image-files.txt" --allowlist app/tests/brand-artifacts/image-files.json --summary "$GITHUB_STEP_SUMMARY" || rc=1
          bun scripts/brand/scan-artifact.ts --kind image-config --input "$RUNNER_TEMP/image-config.json" --allowlist app/tests/brand-artifacts/image-config.json --summary "$GITHUB_STEP_SUMMARY" || rc=1
          exit "$rc"
      # The s6 oneshot that writes the image's defaults and refuses settings still under their names before
      # v0.2.16 only reads and writes files: on the host as the runner's own user, and in the image as root.
      - name: env-defaults oneshot
        run: |
          sh docker/tests/env-defaults.test.sh
          docker run --rm --user root --entrypoint /bin/sh -v "$PWD:/repo:ro" xiongbao:trackb /repo/docker/tests/env-defaults.test.sh
      # The check that refuses a volume v0.2.16 never upgraded (v0.2.15's names and journal, v0.2.16's
      # unfinished rename), against clusters made with the image's PostgreSQL 16: as root, as migrate.sh
      # runs it, and as the image's postgres user.
      - name: upgrade gate (real PostgreSQL)
        run: |
          docker run --rm --user root --entrypoint /bin/sh -v "$PWD:/repo:ro" xiongbao:trackb /repo/docker/tests/upgrade-gate.test.sh
          docker run --rm --user postgres --entrypoint /bin/sh -v "$PWD:/repo:ro" xiongbao:trackb /repo/docker/tests/upgrade-gate.test.sh
      # A new volume's first boot (migrations under the names postgres-init gives it, then the rename of the
      # superuser and the database), a second start doing nothing, a v0.2.15-shaped volume refused untouched,
      # and the connection strings written after it: clusters made with the image's PostgreSQL 16, migrated
      # with the image's own migrator under /app/server, as root as migrate.sh runs.
      - name: embedded database boot and rename (real PostgreSQL)
        run: docker run --rm --user root --entrypoint /bin/sh -v "$PWD:/repo:ro" xiongbao:trackb /repo/docker/tests/rebrand-superuser.test.sh
      # The per-employee root helper creates users, so it is tested as root inside the image.
      - name: xb-bot helper (per-employee users)
        run: docker run --rm --user root --entrypoint /bin/sh -v "$PWD/docker/tests:/t:ro" xiongbao:trackb /t/xb-bot.test.sh
      # The documents toolchain, as the default employee: docx, xlsx, pptx and PDF with Chinese, read back.
      - name: documents toolchain self-check (as pwuser)
        run: docker run --rm --user pwuser --entrypoint python3 xiongbao:trackb /opt/docs-toolchain/selfcheck.py --require-pandoc --require-soffice
      # Two employees cannot read each other's files, and a stopped command ends within 10 seconds.
      - name: per-employee users smoke
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/delivery-evidence
        run: bash scripts/ci/per-bot-users-smoke.sh xiongbao:trackb
      - name: DoD-2 and DoD-3 (no provider credentials)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/delivery-evidence
        run: bash scripts/ci/image-smoke.sh xiongbao:trackb
      - name: Brand scan - startup log (words only)
        id: scan_logs
        continue-on-error: true
        run: bun scripts/brand/scan-artifact.ts --kind web --input "$RUNNER_TEMP/delivery-evidence/startup.log" --allowlist app/tests/brand-artifacts/image-logs.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Brand scans verdict
        if: always()
        env:
          IMAGE_SCAN: ${{ steps.scan_image.outcome }}
          LOG_SCAN: ${{ steps.scan_logs.outcome }}
        run: |
          echo "image files/env/labels: $IMAGE_SCAN; startup log: $LOG_SCAN"
          test "$IMAGE_SCAN" != failure && test "$LOG_SCAN" != failure
      - name: Print container logs (credentials masked)
        if: failure()
        run: |
          for f in startup owner auth recreated; do
            bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/delivery-evidence/$f.log" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-evidence
          path: ${{ runner.temp }}/delivery-evidence/
          if-no-files-found: error

  # Packages outside the server/app suites. None of them has a test counterpart in the frozen
  # baseline run, so the gate is head only: Bun must report Ran N > 0, 0 fail, no unhandled errors.
  # runner/ protocol tests live in server/tests and run in the server-test shards; its own tests
  # (runner/tests: data directory, credential store, and the `bun build --compile` package test)
  # run here, and its native Windows path is exercised by win1-windows below.
  workspaces-test:
    name: workspace tests (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Own bun.lock, outside the root workspaces, so installed and typechecked on their own.
          # supervisor's docker.integration suite runs because the hosted runner has a Docker socket.
          # Both also need the root install before their tests, as upstream and the image install them:
          # agent-computer's source reaches `shared` (zod since upstream v1.0.0), and both take
          # `@types/bun` from the root.
          - pkg: agent-computer
            own-lockfile: true
            root-install: true
          - pkg: supervisor
            own-lockfile: true
            root-install: true
          # Root workspace since upstream v1.0.0 (its own package.json: zod, happy-dom for the
          # rule tests), so it needs the root install like worker and runner.
          - pkg: shared
            own-lockfile: false
            root-install: true
          # Root workspace (typechecked by static). Its source imports `@xiongbao/shared` by the
          # workspace name (upstream #784), which only the root install links.
          - pkg: worker
            own-lockfile: false
            root-install: true
          # Root workspace (typechecked by static). Its tests need the root install: runner/src reaches
          # yaml through agent-computer, and the package test serves the server's own runner routes.
          - pkg: runner
            own-lockfile: false
            root-install: true
          # Root workspace. static's typecheck reads its src only (tsconfig include), not its tests.
          - pkg: toolkit
            own-lockfile: false
            root-install: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install from the package's own frozen lockfile (no lifecycle scripts)
        id: install
        if: matrix.own-lockfile
        working-directory: xiongbao/${{ matrix.pkg }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        if: matrix.root-install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Head tests
        working-directory: xiongbao/${{ matrix.pkg }}
        # agent-computer's forwarding test starts the real computer as a child process (task 18); the
        # other packages ignore the variable.
        env:
          XIONGBAO_FORWARD_HTTP: '1'
        run: bun test > "$RUNNER_TEMP/head.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/head.log" "${{ matrix.pkg }} (head only)"
      - name: Print head test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/head.log"
      - name: Root frozen install (tsc resolves @types/bun from the root node_modules)
        if: always() && matrix.own-lockfile && steps.install.outcome == 'success'
        working-directory: xiongbao
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck (not covered by the root typecheck)
        if: always() && matrix.own-lockfile && steps.install.outcome == 'success'
        working-directory: xiongbao/${{ matrix.pkg }}
        run: bun run typecheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: workspace-${{ matrix.pkg }}-logs
          path: ${{ runner.temp }}/head.log

  # The repository-level tests in xiongbao/tests: the chart, compose and Dockerfiles, the release and
  # upgrade scripts, the default tenant package and the copy guards. None has a counterpart in the
  # frozen baseline run, so the gate is head only, as for the workspaces above. `./tests/` and not
  # `tests/`: Bun reads a bare argument as a path filter and would run every tests/ directory in the
  # tree. Helm is pinned as in the chart job, so the chart suites run rather than skip; the hosted
  # runner's Docker serves the real-tool update suite; chart-database-wait creates and drops scratch
  # databases on this job's own PostgreSQL, so it is given the owner. Left to the guards they already
  # have: the kind-cluster suites (XIONGBAO_KIND_KUBECONFIG) and the smoke journey (XIONGBAO_SMOKE),
  # which need a running cluster or a deployed instance.
  repo-tests:
    name: repository tests (xiongbao/tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: repo_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d repo_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/repo_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      # agent-bot.test.ts starts the agent-bot Bot, which keeps its own lockfile.
      - name: Install agent-bot from its own frozen lockfile (no lifecycle scripts)
        working-directory: xiongbao/agent-bot
        run: bun install --frozen-lockfile --ignore-scripts
      # The chart suites render charts/xiongbao, which needs its subcharts on disk, as chart-check.sh does.
      - name: Fetch the chart's dependencies
        run: helm dependency build charts/xiongbao
      - name: Repository tests
        run: bun test ./tests/ > "$RUNNER_TEMP/repo-tests.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/repo-tests.log" 'repository tests (head only)'
      - name: Print repository test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/repo-tests.log"
      # xiongbao/scripts 下的脚本测试（建学习容器、发版、变异登记等）原先不在任何 job 里，红了也没人看见。
      - name: Script tests
        if: always()
        run: bun test ./scripts/ > "$RUNNER_TEMP/script-tests.log" 2>&1
      - name: Zero-fail gate for script tests (head only)
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/script-tests.log" 'script tests (head only)'
      - name: Print script test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/script-tests.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repo-tests-logs
          path: ${{ runner.temp }}/repo-tests.log

  # The Expo app in xiongbao/mobile: its own npm project with its own package-lock.json, outside the
  # bun workspaces, so neither static's typecheck nor any test job reaches it. npm ci installs exactly
  # the lockfile, without lifecycle scripts like every bun install here, on the runner's preinstalled
  # Node. Its unit tests (tests/, pure modules such as the push deep links) run under bun after the
  # typecheck; the job name stays the same so required-check settings keep matching.
  mobile-typecheck:
    name: mobile typecheck (Expo, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xiongbao/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: node --version && npm --version
      - name: Install from package-lock.json (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Unit tests
        run: bun test ./tests/

  # The computer's real-browser tests, which prove a secret typed into a page never reaches the Bot:
  # the aria snapshot hides a password's value and the screenshot paints the marked fields over under
  # the neutral attribute names (L1-17, neutral-page-marks.test.ts), the private sign-in types only on
  # its own origin and is not read back (sign-in.test.ts), a field a person filled reads as filled
  # (person-filled.test.ts), and session cookies survive a restart under the renamed file
  # (session-cookies.test.ts). They are asked for by name and skipped by the plain workspace run above,
  # so this job also fails on any skip: a misspelt variable would otherwise make the proof a silent pass.
  computer-browser:
    name: computer browser tests (real Chromium, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # agent-computer's source reaches `shared`, and takes `@types/bun` from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install agent-computer from its own frozen lockfile (no lifecycle scripts)
        working-directory: xiongbao/agent-computer
        run: bun install --frozen-lockfile --ignore-scripts
      # agent-computer's own playwright, so the Chromium is the build that version drives. `--no-shell`
      # as the image does, so the headless run proves nothing needs the shell.
      - name: Install Chromium for agent-computer's Playwright
        working-directory: xiongbao/agent-computer
        run: bunx playwright install --with-deps --no-shell chromium
      - name: Browser tests
        working-directory: xiongbao/agent-computer
        env:
          XIONGBAO_COMPUTER_BROWSER: '1'
          COMPUTER_BROWSER_MODE: headless
        run: >-
          bun test tests/neutral-page-marks.test.ts tests/sign-in.test.ts
          tests/person-filled.test.ts tests/session-cookies.test.ts
          > "$RUNNER_TEMP/computer-browser.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/computer-browser.log" 'computer browser tests (head only)'
      - name: Zero-skip gate (a skipped browser test proves nothing)
        if: always()
        run: |
          set -euo pipefail
          text=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/computer-browser.log")
          if ! grep -Eq '^Ran [1-9][0-9]* tests? across 4 files' <<<"$text"; then
            echo "::error::the four browser test files did not all run"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*[1-9][0-9]* skip[[:space:]]*$' <<<"$text"; then
            echo "::error::browser tests were skipped: XIONGBAO_COMPUTER_BROWSER did not reach them"
            exit 1
          fi
      - name: Print browser test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/computer-browser.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: computer-browser-logs
          path: ${{ runner.temp }}/computer-browser.log

  # WIN1: the native Windows device CLI executes commands, start failures are explicit, and Stop,
  # timeout and protocol cancel kill the whole descendant tree. The probe imports the real runner
  # executor, agent-computer shell, bun:sqlite journal and dispatcher; any failed check throws.
  win1-windows:
    name: WIN1 device CLI probe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: xiongbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: WIN1 probe (fresh Unicode workspace with spaces, real Node child trees)
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $name = 'win1 ' + [char]0x718A + [char]0x5B9D + " $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $dir = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path -LiteralPath $dir) { throw "Workspace $dir already exists; the probe needs a fresh one." }
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $log = Join-Path $env:RUNNER_TEMP 'win1.log'
          bun scripts/ci/windows-runner-probe.ts $dir $node *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "windows-runner-probe exited $code" }
          if (-not (Select-String -LiteralPath $log -SimpleMatch -Quiet -Pattern '"platform":"win32"')) { throw 'Probe did not report win32.' }
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^WINDOWS_PROBE_PASS$')) { throw 'WINDOWS_PROBE_PASS missing.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win1-windows-log
          path: ${{ runner.temp }}/win1.log

  # G5, the browser half, on a CI machine: the runner's real dispatcher, journal, executor and browser
  # drive the hosted runner's Google Chrome against fixture pages the probe serves itself on
  # 127.0.0.1 (read, type, click, navigate, scroll, cancel, restart, refused addresses). Headless,
  # because the box has no desktop. This is not a user's device: pairing, offline reconnect and the
  # approval loop on real hardware stay a person's step (docs/acceptance/HUMAN-STEPS.md, section 11).
  g5-browser-probe:
    name: G5 runner browser probe (real Chrome, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Real browser probe (the runner image's Chrome, nothing downloaded)
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome-stable || command -v google-chrome)
          "$chrome" --version
          log="$RUNNER_TEMP/g5-browser.log"
          bun scripts/ci/runner-browser-probe.ts --run --executable "$chrome" --headless true 2>&1 | tee "$log"
          grep -q '^BROWSER_PROBE_PASS$' "$log"
          if grep -q '"passed":false' "$log"; then echo "::error::a probe check failed"; exit 1; fi
      # The step above runs the runner from the checkout, where every path `bun build --compile` writes
      # into the sidecar still exists. This one is the sidecar as a user gets it: compiled with the
      # release flags, copied out, started from an empty directory, and the checkout covered by an
      # empty tmpfs in a private mount namespace (sudo for the mount only; the sidecar runs as this
      # user). playwright-core reading its own package.json from the build tree passed above and
      # fails here.
      - name: Compiled sidecar starts a browser in an isolated directory (checkout hidden)
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome-stable || command -v google-chrome)
          bun desktop-device/scripts/build-sidecar.ts
          log="$RUNNER_TEMP/sidecar-browser.log"
          bun scripts/ci/sidecar-browser-probe.ts \
            --binary desktop-device/src-tauri/binaries/xiongbao-runner-x86_64-unknown-linux-gnu \
            --executable "$chrome" --hide "$GITHUB_WORKSPACE" 2>&1 | tee "$log"
          grep -q '^SIDECAR_BROWSER_PROBE_PASS$' "$log"
          if grep -q '"passed":false' "$log"; then echo "::error::a sidecar probe check failed"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g5-browser-probe-log
          path: |
            ${{ runner.temp }}/g5-browser.log
            ${{ runner.temp }}/sidecar-browser.log

  # The same G5 probe on a Windows machine, with Chrome headed (no --headless): the hosted
  # windows-latest image runs an interactive desktop session. Not a user's device; the real-hardware
  # part stays a person's step (docs/acceptance/HUMAN-STEPS.md).
  g5-browser-probe-windows:
    name: G5 runner browser probe (real Chrome, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: xiongbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Real browser probe (the runner image's Chrome, headed, nothing downloaded)
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw "Chrome not found at $chrome" }
          (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          $log = Join-Path $env:RUNNER_TEMP 'g5-browser-windows.log'
          bun scripts/ci/runner-browser-probe.ts --run --executable $chrome *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "runner-browser-probe exited $code" }
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^BROWSER_PROBE_PASS$')) { throw 'BROWSER_PROBE_PASS missing.' }
          if (Select-String -LiteralPath $log -SimpleMatch -Quiet -Pattern '"passed":false') { throw 'a probe check failed ("passed":false).' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g5-browser-probe-windows-log
          path: ${{ runner.temp }}/g5-browser-windows.log

  # Desktop control phase 2 (plan docs/plans/2026-11-12-desktop-write.md, Task 10): the runner's own
  # desktop.windows and desktop.snapshot through the pinned agent-desktop binary, against a real
  # editor on each hosted runner (Notepad, TextEdit, gedit under Xvfb with an AT-SPI bus). Read only.
  # A runner without accessibility permission or a session bus fails the probe; it is never skipped.
  desktop-probe:
    name: desktop probe, agent-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src imports agent-computer and shared code that need the root workspaces.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Xvfb, gedit, openbox and the AT-SPI bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gedit openbox at-spi2-core dbus-x11 libatspi2.0-0 gsettings-desktop-schemas
      - name: Fetch and verify agent-desktop
        run: bun desktop-device/scripts/fetch-agent-desktop.ts --triple "$TRIPLE" --out "$RUNNER_TEMP/agent-desktop"
      - name: Desktop probe (gedit under Xvfb, with a session bus and the AT-SPI bus)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/desktop-probe.log"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
            set -euo pipefail
            export GTK_MODULES=gail:atk-bridge NO_AT_BRIDGE=0 GNOME_ACCESSIBILITY=1
            gsettings set org.gnome.desktop.interface toolkit-accessibility true || echo "gsettings could not set toolkit-accessibility"
            /usr/libexec/at-spi-bus-launcher --launch-immediately >"$RUNNER_TEMP/at-spi-bus.log" 2>&1 &
            openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
            sleep 3
            bun scripts/ci/desktop-probe.ts "$RUNNER_TEMP/desktop-probe" --helper "$RUNNER_TEMP/agent-desktop/agent-desktop-$TRIPLE"
          ' 2>&1 | tee "$log"
          grep -q '^DESKTOP_PROBE_PASS$' "$log"
          if grep -q '"passed":false' "$log"; then echo "::error::a probe check failed"; exit 1; fi
      - name: Desktop probe (TextEdit)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/desktop-probe.log"
          bun scripts/ci/desktop-probe.ts "$RUNNER_TEMP/desktop-probe" --helper "$RUNNER_TEMP/agent-desktop/agent-desktop-$TRIPLE" 2>&1 | tee "$log"
          grep -q '^DESKTOP_PROBE_PASS$' "$log"
          if grep -q '"passed":false' "$log"; then echo "::error::a probe check failed"; exit 1; fi
      - name: Desktop probe (Notepad, the agent-desktop engine)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XIONGBAO_DESKTOP_ENGINE: agent-desktop
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $dir = Join-Path $env:RUNNER_TEMP 'desktop-probe'
          $helper = Join-Path $env:RUNNER_TEMP "agent-desktop\agent-desktop-$env:TRIPLE.exe"
          $log = Join-Path $env:RUNNER_TEMP 'desktop-probe.log'
          bun scripts/ci/desktop-probe.ts $dir --helper $helper *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "desktop-probe exited $code" }
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^DESKTOP_PROBE_PASS$')) { throw 'DESKTOP_PROBE_PASS missing.' }
          if (Select-String -LiteralPath $log -SimpleMatch -Quiet -Pattern '"passed":false') { throw 'a probe check failed ("passed":false).' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-probe-${{ matrix.os }}-log
          path: ${{ runner.temp }}/desktop-probe.log

  # F2 stage 1: the device tray app (desktop-device/, 熊宝数字员工 设备端). The Rust supervisor,
  # process-tree and autostart tests run on both systems the stage targets; they need no runner
  # binary (the sidecar is only added to the bundle config) and no secrets.
  device-shell:
    name: device shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: xiongbao/desktop-device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: xiongbao/desktop-device/src-tauri
          key: device-${{ matrix.os }}
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # The pairing form's rules and the sidecar build's names. Only bun:test and local files are
      # imported, so nothing is installed.
      - name: Bun tests (pairing form, sidecar build)
        run: bun test > "$RUNNER_TEMP/device-bun.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        working-directory: xiongbao
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/device-bun.log" 'device shell Bun tests (${{ matrix.os }}, head only)'
      - name: Print Bun test diagnostics (credentials masked)
        if: failure()
        working-directory: xiongbao
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/device-bun.log"
      - name: Rust tests (--locked)
        working-directory: xiongbao/desktop-device/src-tauri
        run: |
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/device-cargo.log"
          # cargo exits 0 when a target has no tests; require that something actually passed.
          passed=$(sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' "$RUNNER_TEMP/device-cargo.log" | awk '{s+=$1} END {print s+0}')
          echo "Rust tests passed: $passed"
          [ "$passed" -gt 0 ] || { echo '::error::cargo test ran zero tests'; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-shell-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/device-*.log
          if-no-files-found: ignore

  # F2 stage 1: an UNSIGNED Linux installer of the device app, uploaded as an artifact for manual
  # install tests (the clean-VM checks are manual, gate 7). No signing, notarization, updater or
  # release here. The runner sidecar is compiled with the stage 0 flags; the Tauri CLI is the one
  # tools/tauri-cli/bun.lock pins, installed from that frozen lockfile.
  device-bundle-linux:
    name: device app unsigned deb (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: xiongbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: xiongbao/desktop-device/src-tauri
          key: device-bundle
      - name: Linux libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # The runner's own dependencies (playwright-core, agent-computer's yaml) for the compile.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from its own frozen lockfile (no lifecycle scripts)
        working-directory: xiongbao/tools/tauri-cli
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Fetch and verify agent-desktop
        run: bun desktop-device/scripts/fetch-agent-desktop.ts
      # The bundle ships THIRD-PARTY-NOTICES.md (tauri.bundle.conf.json); it is generated, never committed.
      - name: Write the third-party notices the bundle ships
        run: bun scripts/brand/third-party-notices.ts
      - name: Bundle the unsigned deb
        working-directory: xiongbao/desktop-device
        run: ../tools/tauri-cli/node_modules/.bin/tauri build --ci --bundles deb --config src-tauri/tauri.bundle.conf.json
      - name: Check the package installs and carries the runner
        working-directory: xiongbao/desktop-device/src-tauri/target/release/bundle/deb
        run: |
          deb=$(ls *.deb)
          dpkg-deb -f "$deb" Package Version Depends
          test "$(dpkg-deb -f "$deb" Package)" = xiongbao-device
          # Listed once: grep -q on a live pipe kills dpkg-deb with SIGPIPE, and pipefail fails the step.
          contents=$(dpkg-deb -c "$deb")
          grep -Eq 'usr/bin/xiongbao-device$' <<<"$contents"
          grep -Eq 'usr/bin/xiongbao-runner$' <<<"$contents"
          grep -Eq 'usr/bin/agent-desktop$' <<<"$contents"
          sudo dpkg --dry-run -i "$deb"
      - name: Brand scan - deb listing, fields and contents
        run: bun scripts/brand/scan-artifact.ts --kind deb --input desktop-device/src-tauri/target/release/bundle/deb/*.deb --allowlist app/tests/brand-artifacts/deb.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-deb
          path: xiongbao/desktop-device/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # F2 stage 3: the UNSIGNED Windows installer of the device app, the counterpart of the deb above,
  # uploaded as an artifact for manual install tests. verify-windows-signatures.ps1 -Unsigned checks
  # the installer carries the app and the runner, that both the installer and the app say
  # 熊宝数字员工 设备端 and the package.json version, and that nothing in it is signed.
  # Then a signing rehearsal: the same tree is bundled again through tauri.windows-signing.conf.json
  # with a throwaway self-signed certificate trusted only on this runner, so the signCommand wiring,
  # the sign script and the verifier run against real Authenticode signatures. The rehearsal output
  # is never uploaded; device-release.yml refuses the test-certificate mode. No secrets used.
  device-bundle-windows:
    name: device app unsigned NSIS installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: xiongbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: xiongbao/desktop-device/src-tauri
          key: device-bundle-windows
      # The runner's own dependencies (playwright-core, agent-computer's yaml) for the compile.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from its own frozen lockfile (no lifecycle scripts)
        working-directory: xiongbao/tools/tauri-cli
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Fetch and verify agent-desktop
        run: bun desktop-device/scripts/fetch-agent-desktop.ts
      # The bundle ships THIRD-PARTY-NOTICES.md (tauri.bundle.conf.json); it is generated, never committed.
      - name: Write the third-party notices the bundle ships
        run: bun scripts/brand/third-party-notices.ts
      # The bundler downloads NSIS and nsis_tauri_utils.dll itself, once per attempt, and GitHub's release
      # downloads answered 504 for minutes at a time, outlasting the retry below. Seed the exact cache it
      # checks first (%LOCALAPPDATA%\tauri\NSIS, the files and SHA-1s pinned by tauri-bundler 2.11.4)
      # with curl retrying for up to ten minutes per file. If the layout ever stops matching, the
      # bundler only logs "missing some files" and downloads them as before.
      - name: Seed Tauri's NSIS toolset (curl with retries, SHA-1 verified)
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          $dll = Join-Path $nsis 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          function Fetch($url, $out, $sha1) {
            curl.exe -fsSL --retry 40 --retry-all-errors --retry-delay 15 --retry-max-time 600 -o $out $url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
            $got = (Get-FileHash -Algorithm SHA1 $out).Hash
            if ($got -ne $sha1) { throw "SHA-1 mismatch for $url ($got)" }
          }
          if (-not (Test-Path (Join-Path $nsis 'Bin\makensis.exe'))) {
            New-Item -ItemType Directory -Force $tools | Out-Null
            $zip = Join-Path $tools 'nsis-3.11.zip'
            Fetch 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' $zip 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'
            if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
            Expand-Archive -Force $zip $tools
            Rename-Item (Join-Path $tools 'nsis-3.11') 'NSIS'
            Remove-Item $zip
          }
          New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
          Fetch 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $dll '75197FEE3C6A814FE035788D1C34EAD39349B860'
      - name: Bundle the unsigned NSIS installer
        working-directory: xiongbao/desktop-device
        # The bundler downloads NSIS from GitHub releases, which answered 504 intermittently and failed
        # this job on PRs that touched nothing here. Retry only that failure; any other error throws.
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            ../tools/tauri-cli/node_modules/.bin/tauri build --ci --bundles nsis --config src-tauri/tauri.bundle.conf.json 2>&1 | Tee-Object -Variable output
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 4 -and ($output | Out-String) -match 'http status: 5\d\d') {
              Write-Host "NSIS download failed with a 5xx (attempt $attempt); retrying in 30s"
              Start-Sleep -Seconds 30
              continue
            }
            throw "tauri build exited $LASTEXITCODE"
          }
      - name: Check the installer's payload, product name and version, and that it is unsigned
        working-directory: xiongbao/desktop-device
        run: |
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-signatures.ps1 -Unsigned -ExpectedVersion $version -EvidenceDirectory "$env:RUNNER_TEMP/device-unsigned-evidence"
          Get-Content "$env:RUNNER_TEMP/device-unsigned-evidence/signatures.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-nsis
          path: xiongbao/desktop-device/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Signing rehearsal - throwaway certificate trusted on this runner only
        id: rehearsal-cert
        run: |
          $subject = "XiongBao CI rehearsal $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$subject" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddDays(1)
          $cer = Join-Path $env:RUNNER_TEMP 'rehearsal.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher=$subject" >> $env:GITHUB_OUTPUT
      - name: Signing rehearsal - bundle again through the signing overlay
        working-directory: xiongbao/desktop-device
        env:
          DEVICE_WINDOWS_SIGNING: test-certificate
          DEVICE_TEST_SIGNING_THUMBPRINT: ${{ steps.rehearsal-cert.outputs.thumbprint }}
        run: |
          Remove-Item src-tauri/target/release/bundle/nsis -Recurse -Force
          ../tools/tauri-cli/node_modules/.bin/tauri build --ci --bundles nsis --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.windows-signing.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build exited $LASTEXITCODE" }
      - name: Signing rehearsal - verify, and refuse the wrong publisher and the unsigned label
        working-directory: xiongbao/desktop-device
        env:
          PUBLISHER: ${{ steps.rehearsal-cert.outputs.publisher }}
        run: |
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-signatures.ps1 -ExpectedPublisher $env:PUBLISHER -ExpectedVersion $version -EvidenceDirectory "$env:RUNNER_TEMP/device-rehearsal-evidence"
          foreach ($case in @(
              @{ args = @{ ExpectedPublisher = "$env:PUBLISHER (someone else)" }; message = 'Unexpected publisher' },
              @{ args = @{ Unsigned = $true }; message = 'is labelled unsigned' },
              @{ args = @{ ExpectedPublisher = $env:PUBLISHER; ExpectedVersion = '0.0.0-wrong' }; message = 'Expected version' }
          )) {
            $refused = $false
            try {
              $parameters = $case.args
              ./scripts/verify-windows-signatures.ps1 @parameters -EvidenceDirectory "$env:RUNNER_TEMP/device-refused-evidence" | Out-Null
            } catch {
              if ($_.Exception.Message -notlike "*$($case.message)*") { throw }
              $refused = $true
            }
            if (-not $refused) { throw "The verifier accepted a signed build it should refuse ($($case.message))." }
          }
          Write-Host 'Rehearsal: signed build verified; wrong publisher, unsigned label and wrong version refused.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-bundle-windows-evidence
          path: |
            ${{ runner.temp }}/device-unsigned-evidence/
            ${{ runner.temp }}/device-rehearsal-evidence/
          if-no-files-found: ignore

  # F2 stage 3: the UNSIGNED macOS build of the device app (Apple Silicon, .app and .dmg), so the
  # release's macOS lane is exercised before anyone tags. Ad-hoc signed only (APPLE_SIGNING_IDENTITY
  # "-"), with the hardened runtime and Entitlements.plist from tauri.macos.conf.json:
  # verify-macos.sh --unsigned checks identifier, product name and version, that the bundled runner
  # starts under that signature, that the dmg holds the same app, and that Gatekeeper rejects it.
  # Whether macOS ships at all is D5; this job only proves the build. No secrets used.
  device-bundle-macos:
    name: device app unsigned dmg (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: xiongbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: xiongbao/desktop-device/src-tauri
          key: device-bundle-macos
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from its own frozen lockfile (no lifecycle scripts)
        working-directory: xiongbao/tools/tauri-cli
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Fetch and verify agent-desktop
        run: bun desktop-device/scripts/fetch-agent-desktop.ts
      # The bundle ships THIRD-PARTY-NOTICES.md (tauri.bundle.conf.json); it is generated, never committed.
      - name: Write the third-party notices the bundle ships
        run: bun scripts/brand/third-party-notices.ts
      - name: Bundle the unsigned app and dmg
        working-directory: xiongbao/desktop-device
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: ../tools/tauri-cli/node_modules/.bin/tauri build --ci --bundles app,dmg --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.agent-desktop-macos.conf.json
      - name: Check the bundle, the runner inside it, and that it is unsigned
        working-directory: xiongbao/desktop-device
        run: |
          version="$(jq -r .version ../package.json)"
          bash scripts/verify-macos.sh --unsigned --expected-version "$version" --evidence-dir "$RUNNER_TEMP/device-macos-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-dmg
          path: xiongbao/desktop-device/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-bundle-macos-evidence
          path: ${{ runner.temp }}/device-macos-evidence/
          if-no-files-found: ignore

  # F2 stage 3, HUMAN-STEPS 12.6 on every pull request: the unsigned deb device-bundle-linux just built,
  # installed on a fresh GitHub-hosted Ubuntu machine and taken through the same phases of
  # scripts/ci/device-clean-linux.sh that device-release.yml's clean-linux runs before a release
  # (checksum, apt install, installed files, runner self-check, pairing the INSTALLED runner with a
  # real server and PostgreSQL, one model-free command, quit, the installed app back online, apt
  # remove). CI uploads no SHA256SUMS, so one is written for the downloaded deb and the same sums
  # phase runs. No secrets used; the database is the job's own throwaway one.
  device-clean-linux:
    name: device clean-machine install (ubuntu-latest)
    needs: device-bundle-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        # 钉住版本；升级 PostgreSQL 要显式改这里并跑全量
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: xiongbao_device_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d xiongbao_device_clean"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: xiongbao
    env:
      DIST: ${{ github.workspace }}/device-dist
      EVIDENCE: ${{ github.workspace }}/device-clean-linux/device-clean-linux-evidence.txt
      LOG_DIR: ${{ github.workspace }}/device-clean-logs
      PGPASSWORD: ci-owner
      OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/xiongbao_device_clean
      APP_DATABASE_URL: postgres://xiongbao_app:ci-app@127.0.0.1:5432/xiongbao_device_clean
      ROLE_WRITER_URL: postgres://xiongbao_role_writer:ci-role-writer@127.0.0.1:5432/xiongbao_device_clean
      ORIGIN: http://127.0.0.1:3901
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xiongbao-device-unsigned-deb
          path: ${{ runner.temp }}/device-download
      - id: stage
        name: Stage the CI deb under its release name, with a SHA256SUMS for it
        env:
          DOWNLOAD: ${{ runner.temp }}/device-download
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          debs=("$DOWNLOAD"/*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::expected one deb in xiongbao-device-unsigned-deb, found ${#debs[@]}"
            exit 1
          fi
          deb="xiongbao-device_${version}_amd64.deb"
          mkdir -p "$DIST"
          cp "${debs[0]}" "$DIST/$deb"
          (cd "$DIST" && sha256sum "$deb" > SHA256SUMS)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - id: sums
        name: The deb is the one SHA256SUMS names (sha256sum -c --ignore-missing)
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/device-clean-linux.sh sums
      - id: install
        name: Install the deb with apt (its Depends come from the archive)
        run: bash scripts/ci/device-clean-linux.sh install
      - id: files
        name: The installed app, runner sidecar and desktop entry
        run: bash scripts/ci/device-clean-linux.sh files
      - id: selfcheck
        name: The installed runner's own checks (no network)
        run: bash scripts/ci/device-clean-linux.sh selfcheck
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - id: server
        name: Migrate the job's own database and start the real server (stopped by its PID below)
        run: bash scripts/ci/device-clean-linux.sh server
      - id: lifecycle
        name: Pair the installed runner, one command, quit, back online
        env:
          RUNNER_BIN: /usr/bin/xiongbao-runner
          APP_BIN: /usr/bin/xiongbao-device
        run: bash scripts/ci/device-clean-linux.sh lifecycle
      - name: Stop the server by its PID
        if: always()
        run: bash scripts/ci/device-clean-linux.sh stop-server
      - id: uninstall
        name: Uninstall with apt and nothing of the package is left
        run: bash scripts/ci/device-clean-linux.sh uninstall
      - id: result
        name: Every check passed
        run: bash scripts/ci/device-clean-linux.sh result
      - name: Print server, runner and app logs (credentials masked)
        if: failure()
        run: |
          for f in "$LOG_DIR"/*.log; do
            bash scripts/ci/print-diagnostics.sh "$f" || true
          done
      # Not device-clean-linux-evidence: device-release.yml calls this workflow and uploads that name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-linux-ci-evidence
          path: ${{ github.workspace }}/device-clean-linux/
          if-no-files-found: error
          retention-days: 14

  # The same on a fresh GitHub-hosted Windows machine with the unsigned NSIS installer
  # device-bundle-windows just built, through scripts/ci/device-clean-windows.ps1 as device-release.yml's
  # clean-windows runs it: checksum, Authenticode state (NotSigned expected), silent install, installed
  # files, runner self-check, the installed app starting the installed runner and leaving none behind,
  # silent uninstall. No server here (no pgvector PostgreSQL on windows-latest). No secrets used.
  device-clean-windows:
    name: device clean-machine install (windows-latest)
    needs: device-bundle-windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: xiongbao
    env:
      DIST: ${{ github.workspace }}/device-dist
      EVIDENCE: ${{ github.workspace }}/device-clean-windows/device-clean-windows-evidence.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xiongbao-device-unsigned-nsis
          path: ${{ runner.temp }}/device-download
      - id: stage
        name: Stage the CI installer under its release name, with a SHA256SUMS for it
        shell: pwsh
        env:
          DOWNLOAD: ${{ runner.temp }}/device-download
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content -LiteralPath package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $found = @(Get-ChildItem -LiteralPath $env:DOWNLOAD -Filter '*-setup.exe' -File)
          if ($found.Count -ne 1) { throw "Expected one installer in xiongbao-device-unsigned-nsis, found $($found.Count)." }
          $installer = "xiongbao-device_$($version)_x64-setup.exe"
          New-Item -ItemType Directory -Path $env:DIST -Force | Out-Null
          Copy-Item -LiteralPath $found[0].FullName -Destination (Join-Path $env:DIST $installer)
          $hash = (Get-FileHash -LiteralPath (Join-Path $env:DIST $installer) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content -LiteralPath (Join-Path $env:DIST 'SHA256SUMS') -Encoding utf8NoBOM
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - id: sums
        name: The installer is the one SHA256SUMS names (Get-FileHash)
        shell: pwsh
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci/device-clean-windows.ps1 -Phase sums -Commit $env:COMMIT
      - id: signature
        name: The installer's Authenticode state (NotSigned, a CI build)
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase signature -ExpectedSigned false
      - id: install
        name: Silent install (NSIS /S) and the installed files
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase install
      - id: selfcheck
        name: The installed runner's own checks (no network)
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase selfcheck
      - id: app
        name: The installed app starts the installed runner, and no xiongbao-runner outlives it
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase app
      - id: uninstall
        name: Silent uninstall (/S) removes the app and the runner
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase uninstall
      - id: result
        name: Every check passed
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase result
      # Not device-clean-windows-evidence: device-release.yml calls this workflow and uploads that name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-windows-ci-evidence
          path: ${{ github.workspace }}/device-clean-windows/
          if-no-files-found: error
          retention-days: 14

  # Third-party notices of the bundled agent-desktop binary. The notice is regenerated from the
  # upstream commit pinned in desktop-device/agent-desktop.lock.json and must match the committed
  # THIRD-PARTY.md byte for byte; cargo-about itself fails on any licence outside about.toml's
  # accepted list (no copyleft). Regenerate locally with the same command when the lock changes.
  agent-desktop-licenses:
    name: agent-desktop licence notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/agent-desktop
          ref: 2b0a7334fc111730454b726e6800aa41cdafc093
          path: upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Generate the notice from the upstream lockfile
        working-directory: upstream
        env:
          RUSTUP_TOOLCHAIN: stable
          NOTICES: ${{ github.workspace }}/xiongbao/desktop-device/licenses/agent-desktop
        run: >-
          cargo about generate --workspace --locked -c "$NOTICES/about.toml"
          -o "$RUNNER_TEMP/THIRD-PARTY.md" "$NOTICES/about.hbs"
      # Some crates ship licence files with CRLF line ends; the repository stores text as LF
      # (.gitattributes eol=lf), so only that line-ending difference is normalised before comparing.
      - name: The committed notice matches the generated one
        run: tr -d '\r' < "$RUNNER_TEMP/THIRD-PARTY.md" | diff -u desktop-device/licenses/agent-desktop/THIRD-PARTY.md -
