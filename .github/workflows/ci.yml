# GitHub only discovers workflows here. openbot/.github/workflows is retained
# for upstream synchronisation and does not execute in this fork.
name: 熊宝交付 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs these same checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      skip_image:
        description: The caller builds and smoke-tests the image itself (release.yml builds once).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: openbot

env:
  TENANT_PACKAGE_DIR: ../examples/xiongbao
  # Frozen at the commit main was created from (D06 candidate). The previous value
  # 03df9efa... does not exist in this repository. Never replace with moving main.
  DELIVERY_BASELINE_SHA: 2aacf0f19fdaaeeb4414d4ee4c09cef1f2fc7634

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome lint --error-on-warnings --diagnostic-level=warn .
      - run: bun run typecheck
      - run: bun test test-report.test.mjs release-tag.test.mjs manual-blocks.test.mjs device-release-workflow.test.mjs
        working-directory: openbot/scripts/ci

  # The Helm chart, rendered for real. openbot/.github's chart job is the upstream copy and does not
  # run here, so nothing rendered the chart in this fork. Lint plus a few `helm template` renders,
  # no cluster: see scripts/ci/chart-check.sh for what each check stands for.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - run: bash scripts/ci/chart-check.sh

  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_b_head
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_b_head"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTELLIGENCE_MODE: local
      DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_head
      TEST_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_head
      # Migration 0109 creates the restricted role writer; tests bind it the way the server does.
      TEST_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_b_head
      # D06 suites clone this migrated, never-connected template into one-time databases.
      TEST_DATABASE_ADMIN_URL: postgres://openbot:ci-owner@127.0.0.1:5432/postgres
      TEST_DATABASE_TEMPLATE: openbot_continuation_template
      TEST_DATABASE_BYPASS_URL: postgres://openbot_fixture:ci-fixture@127.0.0.1:5432/postgres
      PGPASSWORD: ci-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The Bots are not root workspaces and each keeps its own lockfile (as upstream CI installs them).
      # Restored upstream suites spawn agent-bot and import agent-mastra's receiver (R0, learning).
      # egress-policy-delivery (upstream v1.0.0) starts the real agent-computer, which runs from its own
      # lockfile (playwright, web-bot-auth, xterm), as the image installs it.
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: openbot/agent-computer
      - run: bun install --frozen-lockfile
        working-directory: openbot/agent-bot
      - run: bun install --frozen-lockfile
        working-directory: openbot/agent-langgraph
      - run: bun install
        working-directory: openbot/agent-mastra
      - name: Prepare frozen baseline and separate databases
        run: |
          bash scripts/ci/prepare-baseline.sh
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_b_base OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_b_head bun run --cwd server scripts/migrate.ts
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_b_base bun run --cwd "$RUNNER_TEMP/delivery-baseline/openbot/server" scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_continuation_template OWNER openbot'
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_continuation_template bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE openbot_fixture LOGIN PASSWORD 'ci-fixture' NOSUPERUSER BYPASSRLS IN ROLE openbot_app"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          printf 'DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base\n' > "$RUNNER_TEMP/delivery-baseline/openbot/.env"
      - name: Baseline tests (same head shard file list, own database)
        continue-on-error: true
        run: |
          DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base \
          TEST_DATABASE_URL=postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_b_base \
            bash scripts/ci/run-tests.sh "$RUNNER_TEMP/delivery-baseline/openbot" server "$RUNNER_TEMP/base.log" "${{ matrix.shard }}" "$PWD"
      - name: Head tests (openbot_app, one process per shard)
        # No continue-on-error: a failing head test fails this step and the job. The report step
        # below runs anyway (if: always()) for the baseline comparison.
        # G01-E P15: no OPENBOT_TENANT_FRAME_GUARD here. scripts/test-preload.ts defaults it to
        # `throw`, so a database read or write with no tenant frame fails the test that made it.
        run: bash scripts/ci/run-tests.sh "$PWD" server "$RUNNER_TEMP/head.log" "${{ matrix.shard }}" "$PWD"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" "server shard ${{ matrix.shard }}"
      - name: Print head test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/head.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-${{ matrix.shard }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.log.files.txt

  app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bash scripts/ci/prepare-baseline.sh
      - name: Baseline app tests
        continue-on-error: true
        run: bash scripts/ci/run-tests.sh "$RUNNER_TEMP/delivery-baseline/openbot" app "$RUNNER_TEMP/base.log"
      - name: Generate configuration and run app tests
        run: bash scripts/ci/run-tests.sh "$PWD" app "$RUNNER_TEMP/head.log"
      - name: Failure name multiset difference and zero-fail gate
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log" app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-logs
          path: ${{ runner.temp }}/*.log

  # Gate G4: the WakerFlow basic lifecycle in a real browser (the runner's preinstalled Chrome, driven
  # by playwright-core) against the real server on its own PostgreSQL, serving the built app the way
  # the image does. The model is aimock: no secret, no provider call, nothing charged. Generate ->
  # edit -> save -> run -> abort mid-step -> inspect -> SIGKILL the server mid-run -> restart ->
  # the interrupted run is closed failed and not replayed (WF-F) -> a fresh run completes.
  e2e-wakerflow:
    name: G4 WakerFlow lifecycle (browser, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_e2e
      # The fresh-database check and the recovery-horizon time shift only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/openbot_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Build the app the server serves (APP_DIST_DIR)
        run: bun run --cwd app build
      - name: The runner's preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "E2E_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: G4 WakerFlow lifecycle
        env:
          E2E_APP_DIST_DIR: app/dist
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g4
        run: bun scripts/e2e/wakerflow-lifecycle.ts
      - name: Print server logs (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g4/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Screenshots of every step, the Playwright trace, both server logs and the model-call record.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-wakerflow-evidence
          path: ${{ runner.temp }}/g4/

  # Gate G6: 对话招员工 / 组群聊 in a real browser, the same services and environment as G4 (its own
  # PostgreSQL, the built app served by the real server, the runner's Chrome, aimock as the model: no
  # secret, no provider call). Ask 小管家 to hire -> the draft card -> edit the name -> confirm -> the
  # employee exists under the edited name -> 小管家 reads proposal_status and carries on; ask for a
  # group of two -> another account opens the conversation and has nothing to press -> confirm -> the
  # group exists with its employees in the drafted order.
  e2e-staffing:
    name: G6 staffing lifecycle (browser, mocked model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: ci-owner
      E2E_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_e2e
      E2E_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_e2e
      # The fresh-database check only (see the harness header).
      E2E_OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/openbot_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        run: |
          DATABASE_URL=postgres://openbot:ci-owner@127.0.0.1:5432/openbot_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Build the app the server serves (APP_DIST_DIR)
        run: bun run --cwd app build
      - name: The runner's preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "E2E_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: G6 staffing lifecycle
        env:
          E2E_APP_DIST_DIR: app/dist
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g6
        run: bun scripts/e2e/staffing-lifecycle.ts
      - name: Print server log (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/g6/server-*.log; do
            bash scripts/ci/print-diagnostics.sh "$f"
          done
      # Screenshots of every step (the other account's view included), the Playwright trace, the
      # server log and the model-call record.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-staffing-evidence
          path: ${{ runner.temp }}/g6/

  image:
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: docker build -f Dockerfile -t openbot:trackb .
      # The s6 oneshot that copies XIONGBAO_* onto OPENBOT_* runs on the host: it only reads and writes files.
      - name: env-aliases oneshot
        run: sh docker/tests/env-aliases.test.sh
      # The per-employee root helper creates users, so it is tested as root inside the image.
      - name: xb-bot helper (per-employee users)
        run: docker run --rm --user root --entrypoint /bin/sh -v "$PWD/docker/tests:/t:ro" openbot:trackb /t/xb-bot.test.sh
      # Two employees cannot read each other's files, and a stopped command ends within 10 seconds.
      - name: per-employee users smoke
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/delivery-evidence
        run: bash scripts/ci/per-bot-users-smoke.sh openbot:trackb
      - name: DoD-2 and DoD-3 (no provider credentials)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/delivery-evidence
        run: bash scripts/ci/image-smoke.sh openbot:trackb
      - name: Print container logs (credentials masked)
        if: failure()
        run: |
          for f in startup owner auth recreated; do
            bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/delivery-evidence/$f.log" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-evidence
          path: ${{ runner.temp }}/delivery-evidence/
          if-no-files-found: error

  # Packages outside the server/app suites. None of them has a test counterpart in the frozen
  # baseline run, so the gate is head only: Bun must report Ran N > 0, 0 fail, no unhandled errors.
  # runner/ protocol tests live in server/tests and run in the server-test shards; its own tests
  # (runner/tests: data directory, credential store, and the `bun build --compile` package test)
  # run here, and its native Windows path is exercised by win1-windows below.
  workspaces-test:
    name: workspace tests (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Own bun.lock, outside the root workspaces, so installed and typechecked on their own.
          # supervisor's docker.integration suite runs because the hosted runner has a Docker socket.
          # Both also need the root install before their tests, as upstream and the image install them:
          # agent-computer's source reaches `shared` (zod since upstream v1.0.0), and both take
          # `@types/bun` from the root.
          - pkg: agent-computer
            own-lockfile: true
            root-install: true
          - pkg: supervisor
            own-lockfile: true
            root-install: true
          # Root workspace since upstream v1.0.0 (its own package.json: zod, happy-dom for the
          # recorder and rule tests), so it needs the root install like worker and runner.
          - pkg: shared
            own-lockfile: false
            root-install: true
          # Root workspace (typechecked by static). Its source imports `@openbot/shared` by the
          # workspace name (upstream #784), which only the root install links.
          - pkg: worker
            own-lockfile: false
            root-install: true
          # Root workspace (typechecked by static). Its tests need the root install: runner/src reaches
          # yaml through agent-computer, and the package test serves the server's own runner routes.
          - pkg: runner
            own-lockfile: false
            root-install: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install from the package's own frozen lockfile (no lifecycle scripts)
        id: install
        if: matrix.own-lockfile
        working-directory: openbot/${{ matrix.pkg }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        if: matrix.root-install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Head tests
        working-directory: openbot/${{ matrix.pkg }}
        run: bun test > "$RUNNER_TEMP/head.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/head.log" "${{ matrix.pkg }} (head only)"
      - name: Print head test diagnostics (credentials masked)
        if: failure()
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/head.log"
      - name: Root frozen install (tsc resolves @types/bun from the root node_modules)
        if: always() && matrix.own-lockfile && steps.install.outcome == 'success'
        working-directory: openbot
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck (not covered by the root typecheck)
        if: always() && matrix.own-lockfile && steps.install.outcome == 'success'
        working-directory: openbot/${{ matrix.pkg }}
        run: bun run typecheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: workspace-${{ matrix.pkg }}-logs
          path: ${{ runner.temp }}/head.log

  # WIN1: the native Windows device CLI executes commands, start failures are explicit, and Stop,
  # timeout and protocol cancel kill the whole descendant tree. The probe imports the real runner
  # executor, agent-computer shell, bun:sqlite journal and dispatcher; any failed check throws.
  win1-windows:
    name: WIN1 device CLI probe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: WIN1 probe (fresh Unicode workspace with spaces, real Node child trees)
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $name = 'win1 ' + [char]0x718A + [char]0x5B9D + " $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $dir = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path -LiteralPath $dir) { throw "Workspace $dir already exists; the probe needs a fresh one." }
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $log = Join-Path $env:RUNNER_TEMP 'win1.log'
          bun scripts/ci/windows-runner-probe.ts $dir $node *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "windows-runner-probe exited $code" }
          if (-not (Select-String -LiteralPath $log -SimpleMatch -Quiet -Pattern '"platform":"win32"')) { throw 'Probe did not report win32.' }
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^WINDOWS_PROBE_PASS$')) { throw 'WINDOWS_PROBE_PASS missing.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win1-windows-log
          path: ${{ runner.temp }}/win1.log

  # G5, the browser half, on a CI machine: the runner's real dispatcher, journal, executor and browser
  # drive the hosted runner's Google Chrome against fixture pages the probe serves itself on
  # 127.0.0.1 (read, type, click, navigate, scroll, cancel, restart, refused addresses). Headless,
  # because the box has no desktop. This is not a user's device: pairing, offline reconnect and the
  # approval loop on real hardware stay a person's step (docs/acceptance/HUMAN-STEPS.md, section 11).
  g5-browser-probe:
    name: G5 runner browser probe (real Chrome, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Real browser probe (the runner image's Chrome, nothing downloaded)
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome-stable || command -v google-chrome)
          "$chrome" --version
          log="$RUNNER_TEMP/g5-browser.log"
          bun scripts/ci/runner-browser-probe.ts --run --executable "$chrome" --headless true 2>&1 | tee "$log"
          grep -q '^BROWSER_PROBE_PASS$' "$log"
          if grep -q '"passed":false' "$log"; then echo "::error::a probe check failed"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g5-browser-probe-log
          path: ${{ runner.temp }}/g5-browser.log

  # The same G5 probe on a Windows machine, with Chrome headed (no --headless): the hosted
  # windows-latest image runs an interactive desktop session. Not a user's device; the real-hardware
  # part stays a person's step (docs/acceptance/HUMAN-STEPS.md).
  g5-browser-probe-windows:
    name: G5 runner browser probe (real Chrome, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # runner/src/browser imports agent-computer/src/aria-snapshot, which needs yaml from the root.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Real browser probe (the runner image's Chrome, headed, nothing downloaded)
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw "Chrome not found at $chrome" }
          (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          $log = Join-Path $env:RUNNER_TEMP 'g5-browser-windows.log'
          bun scripts/ci/runner-browser-probe.ts --run --executable $chrome *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "runner-browser-probe exited $code" }
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^BROWSER_PROBE_PASS$')) { throw 'BROWSER_PROBE_PASS missing.' }
          if (Select-String -LiteralPath $log -SimpleMatch -Quiet -Pattern '"passed":false') { throw 'a probe check failed ("passed":false).' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g5-browser-probe-windows-log
          path: ${{ runner.temp }}/g5-browser-windows.log

  # Desktop shell on Windows: frontend typecheck, Bun tests and build (Tauri embeds ../dist at
  # compile time), then the Rust regression tests. Ignored live tests stay off; no secrets used.
  desktop-windows:
    name: desktop tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: openbot/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: openbot/desktop/src-tauri
          key: windows
      - name: Install desktop from its own frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      # Bash (Git Bash on the runner), not pwsh: Bun writes its report to stderr, and pwsh would turn
      # each redirected stderr line into an ErrorRecord before Tee-Object formats it into the log.
      # The release and signing scripts' tests (upstream v1.0.0) drive bash, tar and xcrun and build
      # POSIX paths: they are for the macOS and Linux runners that publish, as upstream runs them. They
      # run in desktop-scripts below; everything else of the desktop runs here, on Windows.
      - name: Bun tests
        shell: bash
        run: >-
          bun test
          --path-ignore-patterns='scripts/cli-bundle.test.ts'
          --path-ignore-patterns='scripts/prefetch-tauri-tools.test.ts'
          --path-ignore-patterns='scripts/publish-signed-*.test.ts'
          --path-ignore-patterns='scripts/release-cli-bundle.test.ts'
          --path-ignore-patterns='scripts/staple-with-retry.test.ts'
          > "$RUNNER_TEMP/desktop-bun.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        shell: bash
        working-directory: openbot
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/desktop-bun.log" 'desktop Bun tests on Windows (head only)'
      - name: Print desktop Bun test diagnostics (credentials masked)
        if: failure()
        shell: bash
        working-directory: openbot
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/desktop-bun.log"
      - name: Frontend build (frontendDist for the Tauri compile)
        run: bun run build
      - name: Rust regression tests (lib and bins, --locked)
        working-directory: openbot/desktop/src-tauri
        shell: bash
        run: |
          cargo test --locked --lib --bins 2>&1 | tee "$RUNNER_TEMP/desktop-cargo.log"
          # cargo exits 0 when a target has no tests; require that something actually passed.
          passed=$(sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' "$RUNNER_TEMP/desktop-cargo.log" | awk '{s+=$1} END {print s+0}')
          echo "Rust tests passed: $passed"
          [ "$passed" -gt 0 ] || { echo '::error::cargo test ran zero tests'; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-windows-logs
          path: ${{ runner.temp }}/desktop-*.log

  desktop-scripts:
    name: desktop release scripts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: openbot/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install desktop from its own frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Release and signing script tests (POSIX)
        run: >-
          bun test scripts/cli-bundle.test.ts scripts/prefetch-tauri-tools.test.ts
          scripts/publish-signed-mac.test.ts scripts/publish-signed-windows.test.ts
          scripts/release-cli-bundle.test.ts scripts/staple-with-retry.test.ts
          > "$RUNNER_TEMP/desktop-scripts.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        working-directory: openbot
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/desktop-scripts.log" 'desktop release scripts (head only)'

  # F2 stage 1: the device tray app (desktop-device/, 熊宝数字员工 设备端). The Rust supervisor,
  # process-tree and autostart tests run on both systems the stage targets; they need no runner
  # binary (the sidecar is only added to the bundle config) and no secrets.
  device-shell:
    name: device shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: openbot/desktop-device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: openbot/desktop-device/src-tauri
          key: device-${{ matrix.os }}
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # The pairing form's rules and the sidecar build's names. Only bun:test and local files are
      # imported, so nothing is installed.
      - name: Bun tests (pairing form, sidecar build)
        run: bun test > "$RUNNER_TEMP/device-bun.log" 2>&1
      - name: Zero-fail gate (head only, no baseline counterpart)
        if: always()
        working-directory: openbot
        run: bun scripts/ci/test-report.mjs "$RUNNER_TEMP/no-baseline.log" "$RUNNER_TEMP/device-bun.log" 'device shell Bun tests (${{ matrix.os }}, head only)'
      - name: Print Bun test diagnostics (credentials masked)
        if: failure()
        working-directory: openbot
        run: bash scripts/ci/print-diagnostics.sh "$RUNNER_TEMP/device-bun.log"
      - name: Rust tests (--locked)
        working-directory: openbot/desktop-device/src-tauri
        run: |
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/device-cargo.log"
          # cargo exits 0 when a target has no tests; require that something actually passed.
          passed=$(sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' "$RUNNER_TEMP/device-cargo.log" | awk '{s+=$1} END {print s+0}')
          echo "Rust tests passed: $passed"
          [ "$passed" -gt 0 ] || { echo '::error::cargo test ran zero tests'; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-shell-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/device-*.log
          if-no-files-found: ignore

  # F2 stage 1: an UNSIGNED Linux installer of the device app, uploaded as an artifact for manual
  # install tests (the clean-VM checks are manual, gate 7). No signing, notarization, updater or
  # release here. The runner sidecar is compiled with the stage 0 flags; the Tauri CLI is the one
  # desktop/bun.lock pins, installed from that frozen lockfile.
  device-bundle-linux:
    name: device app unsigned deb (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: openbot/desktop-device/src-tauri
          key: device-bundle
      - name: Linux libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # The runner's own dependencies (playwright-core, agent-computer's yaml) for the compile.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Bundle the unsigned deb
        working-directory: openbot/desktop-device
        run: ../desktop/node_modules/.bin/tauri build --ci --bundles deb --config src-tauri/tauri.bundle.conf.json
      - name: Check the package installs and carries the runner
        working-directory: openbot/desktop-device/src-tauri/target/release/bundle/deb
        run: |
          deb=$(ls *.deb)
          dpkg-deb -f "$deb" Package Version Depends
          test "$(dpkg-deb -f "$deb" Package)" = xiongbao-device
          # Listed once: grep -q on a live pipe kills dpkg-deb with SIGPIPE, and pipefail fails the step.
          contents=$(dpkg-deb -c "$deb")
          grep -Eq 'usr/bin/xiongbao-device$' <<<"$contents"
          grep -Eq 'usr/bin/xiongbao-runner$' <<<"$contents"
          sudo dpkg --dry-run -i "$deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-deb
          path: openbot/desktop-device/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # F2 stage 3: the UNSIGNED Windows installer of the device app, the counterpart of the deb above,
  # uploaded as an artifact for manual install tests. verify-windows-signatures.ps1 -Unsigned checks
  # the installer carries the app and the runner, that both the installer and the app say
  # 熊宝数字员工 设备端 and the package.json version, and that nothing in it is signed.
  # Then a signing rehearsal: the same tree is bundled again through tauri.windows-signing.conf.json
  # with a throwaway self-signed certificate trusted only on this runner, so the signCommand wiring,
  # the sign script and the verifier run against real Authenticode signatures. The rehearsal output
  # is never uploaded; device-release.yml refuses the test-certificate mode. No secrets used.
  device-bundle-windows:
    name: device app unsigned NSIS installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: openbot/desktop-device/src-tauri
          key: device-bundle-windows
      # The runner's own dependencies (playwright-core, agent-computer's yaml) for the compile.
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      # The bundler downloads NSIS and nsis_tauri_utils.dll itself, once per attempt, and GitHub's release
      # downloads answered 504 for minutes at a time, outlasting the retry below. Seed the exact cache it
      # checks first (%LOCALAPPDATA%\tauri\NSIS, the files and SHA-1s pinned by tauri-bundler 2.11.4)
      # with curl retrying for up to ten minutes per file. If the layout ever stops matching, the
      # bundler only logs "missing some files" and downloads them as before.
      - name: Seed Tauri's NSIS toolset (curl with retries, SHA-1 verified)
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          $dll = Join-Path $nsis 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          function Fetch($url, $out, $sha1) {
            curl.exe -fsSL --retry 40 --retry-all-errors --retry-delay 15 --retry-max-time 600 -o $out $url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
            $got = (Get-FileHash -Algorithm SHA1 $out).Hash
            if ($got -ne $sha1) { throw "SHA-1 mismatch for $url ($got)" }
          }
          if (-not (Test-Path (Join-Path $nsis 'Bin\makensis.exe'))) {
            New-Item -ItemType Directory -Force $tools | Out-Null
            $zip = Join-Path $tools 'nsis-3.11.zip'
            Fetch 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' $zip 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'
            if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
            Expand-Archive -Force $zip $tools
            Rename-Item (Join-Path $tools 'nsis-3.11') 'NSIS'
            Remove-Item $zip
          }
          New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
          Fetch 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $dll '75197FEE3C6A814FE035788D1C34EAD39349B860'
      - name: Bundle the unsigned NSIS installer
        working-directory: openbot/desktop-device
        # The bundler downloads NSIS from GitHub releases, which answered 504 intermittently and failed
        # this job on PRs that touched nothing here. Retry only that failure; any other error throws.
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            ../desktop/node_modules/.bin/tauri build --ci --bundles nsis --config src-tauri/tauri.bundle.conf.json 2>&1 | Tee-Object -Variable output
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 4 -and ($output | Out-String) -match 'http status: 5\d\d') {
              Write-Host "NSIS download failed with a 5xx (attempt $attempt); retrying in 30s"
              Start-Sleep -Seconds 30
              continue
            }
            throw "tauri build exited $LASTEXITCODE"
          }
      - name: Check the installer's payload, product name and version, and that it is unsigned
        working-directory: openbot/desktop-device
        run: |
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-signatures.ps1 -Unsigned -ExpectedVersion $version -EvidenceDirectory "$env:RUNNER_TEMP/device-unsigned-evidence"
          Get-Content "$env:RUNNER_TEMP/device-unsigned-evidence/signatures.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-nsis
          path: openbot/desktop-device/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Signing rehearsal - throwaway certificate trusted on this runner only
        id: rehearsal-cert
        run: |
          $subject = "XiongBao CI rehearsal $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$subject" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddDays(1)
          $cer = Join-Path $env:RUNNER_TEMP 'rehearsal.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher=$subject" >> $env:GITHUB_OUTPUT
      - name: Signing rehearsal - bundle again through the signing overlay
        working-directory: openbot/desktop-device
        env:
          DEVICE_WINDOWS_SIGNING: test-certificate
          DEVICE_TEST_SIGNING_THUMBPRINT: ${{ steps.rehearsal-cert.outputs.thumbprint }}
        run: |
          Remove-Item src-tauri/target/release/bundle/nsis -Recurse -Force
          ../desktop/node_modules/.bin/tauri build --ci --bundles nsis --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.windows-signing.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build exited $LASTEXITCODE" }
      - name: Signing rehearsal - verify, and refuse the wrong publisher and the unsigned label
        working-directory: openbot/desktop-device
        env:
          PUBLISHER: ${{ steps.rehearsal-cert.outputs.publisher }}
        run: |
          $version = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-signatures.ps1 -ExpectedPublisher $env:PUBLISHER -ExpectedVersion $version -EvidenceDirectory "$env:RUNNER_TEMP/device-rehearsal-evidence"
          foreach ($case in @(
              @{ args = @{ ExpectedPublisher = "$env:PUBLISHER (someone else)" }; message = 'Unexpected publisher' },
              @{ args = @{ Unsigned = $true }; message = 'is labelled unsigned' },
              @{ args = @{ ExpectedPublisher = $env:PUBLISHER; ExpectedVersion = '0.0.0-wrong' }; message = 'Expected version' }
          )) {
            $refused = $false
            try {
              $parameters = $case.args
              ./scripts/verify-windows-signatures.ps1 @parameters -EvidenceDirectory "$env:RUNNER_TEMP/device-refused-evidence" | Out-Null
            } catch {
              if ($_.Exception.Message -notlike "*$($case.message)*") { throw }
              $refused = $true
            }
            if (-not $refused) { throw "The verifier accepted a signed build it should refuse ($($case.message))." }
          }
          Write-Host 'Rehearsal: signed build verified; wrong publisher, unsigned label and wrong version refused.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-bundle-windows-evidence
          path: |
            ${{ runner.temp }}/device-unsigned-evidence/
            ${{ runner.temp }}/device-rehearsal-evidence/
          if-no-files-found: ignore

  # F2 stage 3: the UNSIGNED macOS build of the device app (Apple Silicon, .app and .dmg), so the
  # release's macOS lane is exercised before anyone tags. Ad-hoc signed only (APPLE_SIGNING_IDENTITY
  # "-"), with the hardened runtime and Entitlements.plist from tauri.macos.conf.json:
  # verify-macos.sh --unsigned checks identifier, product name and version, that the bundled runner
  # starts under that signature, that the dmg holds the same app, and that Gatekeeper rejects it.
  # Whether macOS ships at all is D5; this job only proves the build. No secrets used.
  device-bundle-macos:
    name: device app unsigned dmg (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: openbot/desktop-device/src-tauri
          key: device-bundle-macos
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Bundle the unsigned app and dmg
        working-directory: openbot/desktop-device
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: ../desktop/node_modules/.bin/tauri build --ci --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: Check the bundle, the runner inside it, and that it is unsigned
        working-directory: openbot/desktop-device
        run: |
          version="$(jq -r .version ../package.json)"
          bash scripts/verify-macos.sh --unsigned --expected-version "$version" --evidence-dir "$RUNNER_TEMP/device-macos-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiongbao-device-unsigned-dmg
          path: openbot/desktop-device/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-bundle-macos-evidence
          path: ${{ runner.temp }}/device-macos-evidence/
          if-no-files-found: ignore

  # F2 stage 3, HUMAN-STEPS 12.6 on every pull request: the unsigned deb device-bundle-linux just built,
  # installed on a fresh GitHub-hosted Ubuntu machine and taken through the same phases of
  # scripts/ci/device-clean-linux.sh that device-release.yml's clean-linux runs before a release
  # (checksum, apt install, installed files, runner self-check, pairing the INSTALLED runner with a
  # real server and PostgreSQL, one model-free command, quit, the installed app back online, apt
  # remove). CI uploads no SHA256SUMS, so one is written for the downloaded deb and the same sums
  # phase runs. No secrets used; the database is the job's own throwaway one.
  device-clean-linux:
    name: device clean-machine install (ubuntu-latest)
    needs: device-bundle-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_device_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_device_clean"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: openbot
    env:
      DIST: ${{ github.workspace }}/device-dist
      EVIDENCE: ${{ github.workspace }}/device-clean-linux/device-clean-linux-evidence.txt
      LOG_DIR: ${{ github.workspace }}/device-clean-logs
      PGPASSWORD: ci-owner
      OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/openbot_device_clean
      APP_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_device_clean
      ROLE_WRITER_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_device_clean
      ORIGIN: http://127.0.0.1:3901
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xiongbao-device-unsigned-deb
          path: ${{ runner.temp }}/device-download
      - id: stage
        name: Stage the CI deb under its release name, with a SHA256SUMS for it
        env:
          DOWNLOAD: ${{ runner.temp }}/device-download
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          debs=("$DOWNLOAD"/*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::expected one deb in xiongbao-device-unsigned-deb, found ${#debs[@]}"
            exit 1
          fi
          deb="xiongbao-device_${version}_amd64.deb"
          mkdir -p "$DIST"
          cp "${debs[0]}" "$DIST/$deb"
          (cd "$DIST" && sha256sum "$deb" > SHA256SUMS)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - id: sums
        name: The deb is the one SHA256SUMS names (sha256sum -c --ignore-missing)
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/device-clean-linux.sh sums
      - id: install
        name: Install the deb with apt (its Depends come from the archive)
        run: bash scripts/ci/device-clean-linux.sh install
      - id: files
        name: The installed app, runner sidecar and desktop entry
        run: bash scripts/ci/device-clean-linux.sh files
      - id: selfcheck
        name: The installed runner's own checks (no network)
        run: bash scripts/ci/device-clean-linux.sh selfcheck
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - id: server
        name: Migrate the job's own database and start the real server (stopped by its PID below)
        run: bash scripts/ci/device-clean-linux.sh server
      - id: lifecycle
        name: Pair the installed runner, one command, quit, back online
        env:
          RUNNER_BIN: /usr/bin/xiongbao-runner
          APP_BIN: /usr/bin/xiongbao-device
        run: bash scripts/ci/device-clean-linux.sh lifecycle
      - name: Stop the server by its PID
        if: always()
        run: bash scripts/ci/device-clean-linux.sh stop-server
      - id: uninstall
        name: Uninstall with apt and nothing of the package is left
        run: bash scripts/ci/device-clean-linux.sh uninstall
      - id: result
        name: Every check passed
        run: bash scripts/ci/device-clean-linux.sh result
      - name: Print server, runner and app logs (credentials masked)
        if: failure()
        run: |
          for f in "$LOG_DIR"/*.log; do
            bash scripts/ci/print-diagnostics.sh "$f" || true
          done
      # Not device-clean-linux-evidence: device-release.yml calls this workflow and uploads that name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-linux-ci-evidence
          path: ${{ github.workspace }}/device-clean-linux/
          if-no-files-found: error
          retention-days: 14

  # The same on a fresh GitHub-hosted Windows machine with the unsigned NSIS installer
  # device-bundle-windows just built, through scripts/ci/device-clean-windows.ps1 as device-release.yml's
  # clean-windows runs it: checksum, Authenticode state (NotSigned expected), silent install, installed
  # files, runner self-check, the installed app starting the installed runner and leaving none behind,
  # silent uninstall. No server here (no pgvector PostgreSQL on windows-latest). No secrets used.
  device-clean-windows:
    name: device clean-machine install (windows-latest)
    needs: device-bundle-windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: openbot
    env:
      DIST: ${{ github.workspace }}/device-dist
      EVIDENCE: ${{ github.workspace }}/device-clean-windows/device-clean-windows-evidence.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xiongbao-device-unsigned-nsis
          path: ${{ runner.temp }}/device-download
      - id: stage
        name: Stage the CI installer under its release name, with a SHA256SUMS for it
        shell: pwsh
        env:
          DOWNLOAD: ${{ runner.temp }}/device-download
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content -LiteralPath package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $found = @(Get-ChildItem -LiteralPath $env:DOWNLOAD -Filter '*-setup.exe' -File)
          if ($found.Count -ne 1) { throw "Expected one installer in xiongbao-device-unsigned-nsis, found $($found.Count)." }
          $installer = "xiongbao-device_$($version)_x64-setup.exe"
          New-Item -ItemType Directory -Path $env:DIST -Force | Out-Null
          Copy-Item -LiteralPath $found[0].FullName -Destination (Join-Path $env:DIST $installer)
          $hash = (Get-FileHash -LiteralPath (Join-Path $env:DIST $installer) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content -LiteralPath (Join-Path $env:DIST 'SHA256SUMS') -Encoding utf8NoBOM
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - id: sums
        name: The installer is the one SHA256SUMS names (Get-FileHash)
        shell: pwsh
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci/device-clean-windows.ps1 -Phase sums -Commit $env:COMMIT
      - id: signature
        name: The installer's Authenticode state (NotSigned, a CI build)
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase signature -ExpectedSigned false
      - id: install
        name: Silent install (NSIS /S) and the installed files
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase install
      - id: selfcheck
        name: The installed runner's own checks (no network)
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase selfcheck
      - id: app
        name: The installed app starts the installed runner, and no xiongbao-runner outlives it
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase app
      - id: uninstall
        name: Silent uninstall (/S) removes the app and the runner
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase uninstall
      - id: result
        name: Every check passed
        shell: pwsh
        run: ./scripts/ci/device-clean-windows.ps1 -Phase result
      # Not device-clean-windows-evidence: device-release.yml calls this workflow and uploads that name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-windows-ci-evidence
          path: ${{ github.workspace }}/device-clean-windows/
          if-no-files-found: error
          retention-days: 14
