# Gate 7, Linux half: install a published release the way a customer does. The README's
# <!-- g7:linux --> block runs verbatim, in an empty directory, with no checkout around it and no
# GHCR login, on a fresh runner. Then the running image must be the digest the release recorded in
# container-images.json, and it must pass the same API/branding assertions as Gate 1.
#
# The GHCR package must be public for the unauthenticated pull to work; until a person makes it
# public this job fails at `docker pull`, which is the correct customer-facing answer.
name: 熊宝干净部署（G7 Linux）

on:
  workflow_call:
    inputs:
      tag:
        description: 已发布的版本标签，例如 v0.2.0-rc.1
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的版本标签，例如 v0.2.0-rc.1
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Release tag format
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g7"
          echo "EVIDENCE=$RUNNER_TEMP/g7" >> "$GITHUB_ENV"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/g7/tag.txt"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Not a release tag: '$TAG'"
            exit 1
          fi
      # Only the manual and the assertion scripts come from here; the install itself never sees it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Manual block checks (tagged README and deployment manual)
        working-directory: source/openbot/scripts/ci
        run: bun test manual-blocks.test.mjs
      - name: Extract the README g7:linux block
        working-directory: source/openbot
        run: |
          set -euo pipefail
          bun scripts/ci/manual-blocks.mjs ../README.md g7:linux > "$EVIDENCE/g7-linux.sh"
          cat "$EVIDENCE/g7-linux.sh"
      - name: Run it as a customer (empty directory, no registry login)
        env:
          OPENBOT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          customer="$RUNNER_TEMP/customer"
          mkdir "$customer"
          # An empty Docker config: no stored registry credential can make a private image pullable.
          mkdir "$RUNNER_TEMP/docker-config"
          printf '{}\n' > "$RUNNER_TEMP/docker-config/config.json"
          cd "$customer"
          start=$SECONDS
          env -u GITHUB_TOKEN -u GH_TOKEN DOCKER_CONFIG="$RUNNER_TEMP/docker-config" \
            bash -euo pipefail "$EVIDENCE/g7-linux.sh"
          echo "G7 install and health in $((SECONDS-start))s" | tee "$EVIDENCE/timing.txt"
          # The customer directory holds the generated key: record only which names it set.
          sed -E 's/=.*$/=<set>/' .env.delivery > "$EVIDENCE/env-names.txt"
      - name: The running image is the released digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern container-images.json --dir "$EVIDENCE"
          expected="$(jq -r .images.openbot.reference "$EVIDENCE/container-images.json")"
          if [[ ! "$expected" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::container-images.json has no usable reference: '$expected'"
            exit 1
          fi
          image="$(docker inspect xiongbao-local --format '{{.Config.Image}}')"
          if [ "$image" != "${expected%@*}:$TAG" ]; then
            echo "::error::xiongbao-local runs '$image', expected ${expected%@*}:$TAG"
            exit 1
          fi
          digests="$(docker image inspect "$image" --format '{{json .RepoDigests}}')"
          revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          commit="$(git -C source rev-parse HEAD)"
          printf 'image=%s\nexpected=%s\nrepo_digests=%s\nrevision=%s\ntag_commit=%s\n' \
            "$image" "$expected" "$digests" "$revision" "$commit" | tee "$EVIDENCE/digest.txt"
          if ! grep -qF "\"$expected\"" <<< "$digests"; then
            echo "::error::$image has RepoDigests $digests, the release recorded $expected"
            exit 1
          fi
          # Same final SHA: the image the customer pulled was built from the commit the tag names.
          if [ "$revision" != "$commit" ]; then
            echo "::error::$image was built from '$revision', $TAG names $commit"
            exit 1
          fi
          running="$(docker inspect xiongbao-local --format '{{.Image}}')"
          pulled="$(docker image inspect "$image" --format '{{.Id}}')"
          if [ "$running" != "$pulled" ]; then
            echo "::error::xiongbao-local runs $running, not the pulled $pulled"
            exit 1
          fi
      - name: Gate 1 assertions against the customer install
        working-directory: source/openbot
        run: |
          set -euo pipefail
          bun scripts/ci/assert-image.mjs http://127.0.0.1:3772 "$EVIDENCE"
          # The API runs as the non-superuser, non-BYPASSRLS app role (same check as image-smoke.sh).
          role="$(docker exec xiongbao-local sh -c 'url=$(cat /run/s6/container_environment/DATABASE_URL); /usr/lib/postgresql/16/bin/psql "$url" -At -v ON_ERROR_STOP=1 -c "select current_user, rolsuper, rolbypassrls from pg_roles where rolname=current_user"')"
          printf 'runtime_role=%s\n' "$role" | tee "$EVIDENCE/role.txt"
          if [ "$role" != 'openbot_app|f|f' ]; then
            echo "::error::the API database role is '$role', expected openbot_app|f|f"
            exit 1
          fi
          docker logs xiongbao-local > "$EVIDENCE/container.log" 2>&1
          if grep -aq 'rls-not-enforced\|rls-role-check-unavailable' "$EVIDENCE/container.log"; then
            echo "::error::the container reported an RLS readiness problem"
            exit 1
          fi
      - name: Save container logs
        if: always()
        run: docker logs xiongbao-local > "$EVIDENCE/container.log" 2>&1 || true
      - name: Print container logs (credentials masked)
        if: failure()
        run: bash source/openbot/scripts/ci/print-diagnostics.sh "$EVIDENCE/container.log" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g7-linux-evidence
          path: ${{ runner.temp }}/g7/
          if-no-files-found: error
