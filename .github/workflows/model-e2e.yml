# Two jobs, both spending a real key, so both run only by hand, only from main, and only inside the
# GitHub Environment `model-e2e` (whose protection rules gate the secret). ci.yml never runs this;
# there is deliberately no pull_request or push trigger here.
#
#   model-e2e             Story G6 / audit defect #11: one minimal REAL bound-model call, reconciled
#                         against the model_token_calls row it wrote.
#   wakerflow-real-model  Gate G4 with a real model: the WakerFlow lifecycle through the API (the real
#                         planner generates a plan, it is edited, saved, run to completion, a second run
#                         is aborted) against a real server and Postgres, with model_token_calls read as
#                         the tenant. ci.yml's e2e-wakerflow proves the same lifecycle with a mocked model.
#
# The key is the DeepSeek key stored ONLY as the `model-e2e` Environment's secret
# DEEPSEEK_API_KEY: an Environment secret reaches only a job that names that Environment.
# The model and endpoint are variables (MODEL_E2E_MODEL, MODEL_E2E_BASE_URL) with DeepSeek's
# own defaults when unset.
#
# 期六「熊宝员工对标 Codex」另加四个作业，只有手动触发时选了对应的 suite 才跑（默认 metering-only 只跑上面两个）：
#
#   employee-eval-xiongbao     五道真实题交给熊宝员工，自动判分并记录每期能力指标。执行路径由输入 paths 选：board（看板派活，
#                              服务器执行电脑工具）、chat（单聊接口，期九·六，HTTP 读事件流、服务器执行电脑工具）、board,chat
#                              （依次两条都跑，同一个结果目录里各写各的文件）。
#   employee-eval-codex        同样五道题交给 Codex CLI（codex exec），同一个模型、同一套判分。
#   employee-eval-report       把两边结果合成一张对比表（步骤摘要 + artifact）；有单聊路径的结果时，看板和单聊并排。
#   employee-capability-smoke  每期能力一个最小场景（计划、子代理、改完跑测试、长任务续跑、思考、编辑/检索工具），日常回归；
#                              另有后台长跑两个场景 disconnect / reconnect（scenarios 填 background，真模型走单聊路径）。
#
# 模型和提供方都是输入（provider / model / base_url），两边脚本从同一组输入读，不写死 DeepSeek；key 仍是
# 上面那个 Environment secret。脚本在 xiongbao/scripts/e2e/employee-eval/，用法见各文件开头。
# 输入 xiongbao_model 只改熊宝侧的模型（空表示和 model 一样，Codex 侧永远用 model），三方对照：熊宝、Codex、换更强模型的熊宝。
# 熊宝侧作业另记每道题发给模型的提示词体积（EVAL_PROMPT_CHARS），报告里有「提示词体积」表。
name: 模型 E2E 计量对账

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "跑哪一组：metering-only（只跑计量对账和 WakerFlow）、employee-eval（五道题对标）、capability-smoke（能力冒烟）、all"
        type: choice
        default: metering-only
        options:
          - metering-only
          - employee-eval
          - capability-smoke
          - all
      tasks:
        description: "对标题目：all（五道对标题）、hard（加难题 compare,refactor,terminal,webform），或逗号分隔的 research,docs,code,data,office,compare,refactor,terminal,webform,repeat,repeat-pitfall（repeat、repeat-pitfall 只能点名，同一道题连做两次，记第一次和第二次的指标：repeat 是多步办公（会议纪要），repeat-pitfall 是第一次有坑、学会后能跳过的账单导入题，可以同时点名 repeat,repeat-pitfall）"
        type: string
        default: all
      repeat_pairs:
        description: "重复类的题（repeat、repeat-pitfall）连做几对，1 到 4，默认 1；每一对一位新员工、新的随机种子，复盘和技能只在同一对内有效；报告给出每一对和平均值，平均值对照「步数和 token 降 ≥30%」。多对在同一次运行里做完（model-e2e 并发组同一时刻只放一个在跑），每对两次（repeat-pitfall 的熊宝侧每对三次：第三次是同一份第二次夹具、没有技能的新员工做的对照，判定看「有技能比没技能」）；来不及在作业超时前做完的对会被跳过并在报告里注明"
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      paths:
        description: "熊宝员工对标走哪条执行路径：board（看板派活）、chat（单聊接口，期九·六）、board,chat（依次两条都跑，出并排表）"
        type: choice
        default: board
        options:
          - board
          - chat
          - board,chat
      scenarios:
        description: "冒烟场景：all（plan,subagent,code,long,reasoning,edit-grep 六个），background（后台长跑 disconnect,reconnect，真模型走单聊路径，各约 3～5 分钟、上限 15 分钟），或逗号分隔的场景名，可混写如 all,background"
        type: string
        default: all
      provider:
        description: "模型提供方（熊宝模型库的提供方模板名；Codex 侧的自定义 provider 名）"
        type: string
        default: deepseek
      model:
        description: "模型名（熊宝和 Codex 两侧都用它；填了 xiongbao_model 时只有 Codex 侧用它）"
        type: string
        default: deepseek-v4-flash
      xiongbao_model:
        description: "只给熊宝侧换的模型名，留空表示和 model 一样；填了以后熊宝侧用它、Codex 侧仍用 model，用来分清差距有多少来自模型、多少来自做法"
        type: string
        default: ""
      prompt_slim:
        description: "熊宝侧的提示词瘦身（XIONGBAO_PROMPT_SLIM）：on 是默认，off 关掉做对照（系统提示和工具定义回到原样）；只影响熊宝侧"
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      base_url:
        description: "OpenAI 兼容接口地址，留空按提供方默认（deepseek 为 https://api.deepseek.com）；Codex 侧要求它支持 Responses"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: model-e2e
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: xiongbao

jobs:
  model-e2e:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: model-e2e
    timeout-minutes: 10
    services:
      # PostgreSQL 17 with pgvector: migration 0000 creates the `vector` extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: e2e-owner
          POSTGRES_DB: openbot_model_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_model_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      PGPASSWORD: e2e-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      # This job holds a real key: no dependency lifecycle script runs in it.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Migrate the job's own database (ci.yml recipe)
        run: |
          DATABASE_URL=postgres://openbot:e2e-owner@127.0.0.1:5432/openbot_model_e2e bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'e2e-app' NOSUPERUSER NOBYPASSRLS"
      - name: One bound-model call, reconciled against model_token_calls
        env:
          MODEL_E2E: "1"
          DATABASE_URL: postgres://openbot_app:e2e-app@127.0.0.1:5432/openbot_model_e2e
          MODEL_E2E_PROVIDER: deepseek
          MODEL_E2E_MODEL: ${{ vars.MODEL_E2E_MODEL || 'deepseek-chat' }}
          MODEL_E2E_BASE_URL: ${{ vars.MODEL_E2E_BASE_URL || 'https://api.deepseek.com/v1' }}
          MODEL_E2E_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bun run --cwd server scripts/model-e2e.ts

  wakerflow-real-model:
    name: G4 WakerFlow with a real model
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: model-e2e
    # The same ceiling as model-e2e (server/tests/model-e2e-workflow.test.ts): a locally mocked run
    # takes under a minute end to end, so ten minutes is room for a slow provider, not a habit.
    timeout-minutes: 10
    services:
      # PostgreSQL 17 with pgvector: migration 0000 creates the `vector` extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: e2e-owner
          POSTGRES_DB: openbot_g4_real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_g4_real"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: e2e-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      # This job holds a real key: no dependency lifecycle script runs in it.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Migrate the job's own database and set the runtime role passwords (ci.yml e2e-wakerflow recipe)
        run: |
          DATABASE_URL=postgres://openbot:e2e-owner@127.0.0.1:5432/openbot_g4_real bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'e2e-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'e2e-role-writer'"
      # No app build: the harness drives the API only, and the server serves no APP_DIST_DIR. The
      # server log stays on the runner (it is neither printed nor uploaded).
      - name: G4 WakerFlow lifecycle with a real model
        env:
          MODEL_E2E: "1"
          E2E_DATABASE_URL: postgres://openbot_app:e2e-app@127.0.0.1:5432/openbot_g4_real
          E2E_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:e2e-role-writer@127.0.0.1:5432/openbot_g4_real
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/g4-real
          MODEL_E2E_MODEL: ${{ vars.MODEL_E2E_MODEL || 'deepseek-chat' }}
          MODEL_E2E_BASE_URL: ${{ vars.MODEL_E2E_BASE_URL || 'https://api.deepseek.com/v1' }}
          MODEL_E2E_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bun scripts/e2e/wakerflow-real-model.ts

  employee-eval-xiongbao:
    name: 对标评测 · 熊宝员工
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["employee-eval","all"]'), inputs.suite)
    runs-on: ubuntu-latest
    environment: model-e2e
    # 五道题、每题墙钟上限 20 分钟；paths 选两条路径时是两遍，再加起服务、装浏览器的时间（GitHub 单个作业上限 6 小时，这里按 3 小时）。
    # 重复类的题多对（repeat_pairs）：只点名 repeat-pitfall、四对、一条路径，典型约 55 分钟（有坑可学每对三次：第一次约 6 分钟、
    # 第二次和同种子对照各约 3 分钟、复盘最多等 150 秒，每对约 14 分钟），最坏每次都跑满 20 分钟会超过上限；所以作业开头记截止时间
    # （165 分钟），脚本来不及时把剩下的对跳过，不让作业超时丢掉全部结果。
    timeout-minutes: 180
    services:
      # PostgreSQL 17 with pgvector: migration 0000 creates the `vector` extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: e2e-owner
          POSTGRES_DB: openbot_employee_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_employee_eval"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: e2e-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      # This job holds a real key: no dependency lifecycle script runs in it.
      - run: bun install --frozen-lockfile --ignore-scripts
      # 浏览器装在 /opt（不在 runner 的 home 里）：下面隔离员工电脑以后，员工用户读得到它。
      - name: Install the computer from its own frozen lockfile, and its browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        run: |
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
          cd agent-computer && bun install --frozen-lockfile --ignore-scripts
          bun x playwright install --with-deps chromium
      # 员工的电脑读不到评测仓库：员工的命令以专用系统用户 xbeval 运行（评测脚本 isolation.ts 以 EVAL_EMPLOYEE_USER 起电脑），
      # runner 的 home（检出目录、临时目录都在里面）对它关闭；电脑的运行副本放 /opt/xbeval（它 import ../../shared，
      # 依赖 zod 从 agent-computer/node_modules 找）；bun 等工具须在该用户也读得到的位置。评测开始时脚本还会以员工身份自检，
      # 日志里「员工的命令读不到评测仓库（自检通过）」就是隔离生效，「未隔离」就是没生效（不让评测失败）。
      - name: Isolate the employee's computer from the checkout
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash xbeval
          sudo chmod o-rwx "$HOME"
          sudo mkdir -p /opt/xbeval
          # 电脑的代码还引用 runner/（ACP 宿主、浏览器）和 server/src/computer/target.ts（导航目标校验），一并拷过去。
          sudo cp -a agent-computer shared runner /opt/xbeval/
          sudo install -D -m 0644 server/src/computer/target.ts /opt/xbeval/server/src/computer/target.ts
          sudo ln -s agent-computer/node_modules /opt/xbeval/node_modules
          sudo chmod -R a+rX /opt/xbeval
          if [ -d /opt/ms-playwright ]; then sudo chmod -R a+rX /opt/ms-playwright; fi
          bun_path="$(command -v bun)"
          case "$bun_path" in "$HOME"/*) sudo install -m 0755 "$bun_path" /usr/local/bin/bun ;; esac
          for tool in bun python3 node; do
            sudo -n -u xbeval env "PATH=$PATH" "$tool" --version
          done
      - name: Migrate the job's own database and set the runtime role passwords (ci.yml e2e-wakerflow recipe)
        run: |
          DATABASE_URL=postgres://openbot:e2e-owner@127.0.0.1:5432/openbot_employee_eval bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'e2e-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'e2e-role-writer'"
      # 多对放在同一次运行里做完，不能被作业超时整个杀掉：记下一个比作业超时（180 分钟）早的截止时间，评测脚本在开始每一对之前
      # 看还剩多少时间，来不及做完一对就不做，已完成的各对照常记录。留出十五分钟给装依赖、出报告和上传。
      - name: Record the wall-clock deadline for repeat pairs
        run: echo "EVAL_DEADLINE_EPOCH=$(( $(date +%s) + 165 * 60 ))" >> "$GITHUB_ENV"
      # 每条路径一遍：board 写 xiongbao.json，chat 写 xiongbao-chat.json，同一个结果目录。一条路径失败不拦下一条，
      # 最后作业按有没有失败收尾。路径名只认 board 和 chat（输入是 choice，这里再核一遍）。
      - name: Five tasks for a Xiongbao employee, over each chosen path
        env:
          MODEL_E2E: "1"
          MODEL_E2E_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_PROVIDER: ${{ inputs.provider }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          # 只影响熊宝侧；空表示和 EVAL_MODEL 一样（run-xiongbao.ts 里的 xiongbaoModel）。
          EVAL_XIONGBAO_MODEL: ${{ inputs.xiongbao_model }}
          # 熊宝侧的提示词瘦身开关，run-xiongbao.ts 传给服务器的 XIONGBAO_PROMPT_SLIM；off 用来做对照。
          EVAL_PROMPT_SLIM: ${{ inputs.prompt_slim }}
          # 记录每道题发给模型的请求体大小（提示词体积表）：在服务器和提供方之间夹一个回环转发，不改请求。
          EVAL_PROMPT_CHARS: "on"
          EVAL_SUITE: tasks
          EVAL_TASKS: ${{ inputs.tasks }}
          # 重复类的题连做几对，和有坑可学的题的基础种子（同一次运行里熊宝、Codex 两个作业同一个，两边夹具才一样）。
          EVAL_REPEAT_PAIRS: ${{ inputs.repeat_pairs }}
          EVAL_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
          EVAL_PATHS: ${{ inputs.paths }}
          EVAL_OUT: ${{ runner.temp }}/employee-eval
          # 员工的电脑以专用用户运行、读不到评测仓库（上面的隔离步骤；评测脚本 isolation.ts）。
          EVAL_EMPLOYEE_USER: xbeval
          EVAL_COMPUTER_DIR: /opt/xbeval/agent-computer
          PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
          E2E_DATABASE_URL: postgres://openbot_app:e2e-app@127.0.0.1:5432/openbot_employee_eval
          E2E_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:e2e-role-writer@127.0.0.1:5432/openbot_employee_eval
        run: |
          status=0
          for path in ${EVAL_PATHS//,/ }; do
            case "$path" in
              board | chat) ;;
              *) echo "unknown execution path in the paths input"; exit 2 ;;
            esac
            echo "== execution path: $path"
            EVAL_PATH="$path" bun scripts/e2e/employee-eval/run-xiongbao.ts || status=$?
          done
          exit "$status"
      - name: Step summary
        if: always()
        run: bun scripts/e2e/employee-eval/report.ts "$RUNNER_TEMP/employee-eval"
      # The server and computer logs stay on the runner (neither printed nor uploaded).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: employee-eval-xiongbao
          path: |
            ${{ runner.temp }}/employee-eval
            !${{ runner.temp }}/employee-eval/*.log

  employee-eval-codex:
    name: 对标评测 · Codex
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["employee-eval","all"]'), inputs.suite)
    runs-on: ubuntu-latest
    environment: model-e2e
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      # The judges import nothing outside the repository, so no workspace install. Codex is the npm
      # package @openai/codex (Apache-2.0) at the exact version run-codex.ts names (CODEX_VERSION),
      # installed without lifecycle scripts into the runner's temp directory, never into the workspace.
      - name: Install Codex CLI 0.166.0
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" --no-save --no-audit --no-fund --ignore-scripts @openai/codex@0.166.0
          "$RUNNER_TEMP/codex/node_modules/.bin/codex" --version
      # 同熊宝侧：记下比作业超时（120 分钟）早的截止时间，来不及做完一对的就不做。
      - name: Record the wall-clock deadline for repeat pairs
        run: echo "EVAL_DEADLINE_EPOCH=$(( $(date +%s) + 105 * 60 ))" >> "$GITHUB_ENV"
      - name: Five tasks for Codex
        env:
          MODEL_E2E: "1"
          MODEL_E2E_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_PROVIDER: ${{ inputs.provider }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_TASKS: ${{ inputs.tasks }}
          EVAL_REPEAT_PAIRS: ${{ inputs.repeat_pairs }}
          EVAL_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
          EVAL_OUT: ${{ runner.temp }}/employee-eval
          CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/codex
          # The runner is the disposable sandbox, as it is for the Xiongbao employee's commands; Codex's
          # own Linux sandbox needs user namespaces the hosted runner does not reliably allow.
          EVAL_CODEX_SANDBOX: danger-full-access
        run: bun scripts/e2e/employee-eval/run-codex.ts
      - name: Step summary
        if: always()
        run: bun scripts/e2e/employee-eval/report.ts "$RUNNER_TEMP/employee-eval"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: employee-eval-codex
          path: ${{ runner.temp }}/employee-eval

  employee-eval-report:
    name: 对标评测 · 对比表
    needs: [employee-eval-xiongbao, employee-eval-codex]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["employee-eval","all"]'), inputs.suite)
    runs-on: ubuntu-latest
    environment: model-e2e
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: employee-eval-*
          merge-multiple: true
          path: ${{ runner.temp }}/employee-eval
      - name: Both sides in one table
        run: bun scripts/e2e/employee-eval/report.ts "$RUNNER_TEMP/employee-eval"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: employee-eval-report
          path: ${{ runner.temp }}/employee-eval/report.md

  employee-capability-smoke:
    name: 能力冒烟 · 熊宝员工
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["capability-smoke","all"]'), inputs.suite)
    runs-on: ubuntu-latest
    environment: model-e2e
    # 六个最小场景各自 5 到 12 分钟的上限（共 42 分钟），再加后台长跑两个场景各 15 分钟的上限（scenarios 填 background），
    # 再加起服务的时间。
    timeout-minutes: 100
    services:
      # PostgreSQL 17 with pgvector: migration 0000 creates the `vector` extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: e2e-owner
          POSTGRES_DB: openbot_capability_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_capability_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: e2e-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      # This job holds a real key: no dependency lifecycle script runs in it.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the computer from its own frozen lockfile (no browser, since no scenario browses)
        run: cd agent-computer && bun install --frozen-lockfile --ignore-scripts
      # 员工的电脑读不到评测仓库：员工的命令以专用系统用户 xbeval 运行（评测脚本 isolation.ts 以 EVAL_EMPLOYEE_USER 起电脑），
      # runner 的 home（检出目录、临时目录都在里面）对它关闭；电脑的运行副本放 /opt/xbeval（它 import ../../shared，
      # 依赖 zod 从 agent-computer/node_modules 找）；bun 等工具须在该用户也读得到的位置。评测开始时脚本还会以员工身份自检，
      # 日志里「员工的命令读不到评测仓库（自检通过）」就是隔离生效，「未隔离」就是没生效（不让评测失败）。
      - name: Isolate the employee's computer from the checkout
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash xbeval
          sudo chmod o-rwx "$HOME"
          sudo mkdir -p /opt/xbeval
          # 电脑的代码还引用 runner/（ACP 宿主、浏览器）和 server/src/computer/target.ts（导航目标校验），一并拷过去。
          sudo cp -a agent-computer shared runner /opt/xbeval/
          sudo install -D -m 0644 server/src/computer/target.ts /opt/xbeval/server/src/computer/target.ts
          sudo ln -s agent-computer/node_modules /opt/xbeval/node_modules
          sudo chmod -R a+rX /opt/xbeval
          if [ -d /opt/ms-playwright ]; then sudo chmod -R a+rX /opt/ms-playwright; fi
          bun_path="$(command -v bun)"
          case "$bun_path" in "$HOME"/*) sudo install -m 0755 "$bun_path" /usr/local/bin/bun ;; esac
          for tool in bun python3 node; do
            sudo -n -u xbeval env "PATH=$PATH" "$tool" --version
          done
      - name: Migrate the job's own database and set the runtime role passwords (ci.yml e2e-wakerflow recipe)
        run: |
          DATABASE_URL=postgres://openbot:e2e-owner@127.0.0.1:5432/openbot_capability_smoke bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'e2e-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'e2e-role-writer'"
      - name: One minimal scenario per capability
        env:
          MODEL_E2E: "1"
          MODEL_E2E_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_PROVIDER: ${{ inputs.provider }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_XIONGBAO_MODEL: ${{ inputs.xiongbao_model }}
          # 熊宝侧的提示词瘦身开关，run-xiongbao.ts 传给服务器的 XIONGBAO_PROMPT_SLIM；off 用来做对照。
          EVAL_PROMPT_SLIM: ${{ inputs.prompt_slim }}
          EVAL_SUITE: smoke
          EVAL_TASKS: ${{ inputs.scenarios }}
          EVAL_OUT: ${{ runner.temp }}/capability-smoke
          # 同对标评测：员工的电脑以专用用户运行、读不到评测仓库。
          EVAL_EMPLOYEE_USER: xbeval
          EVAL_COMPUTER_DIR: /opt/xbeval/agent-computer
          E2E_DATABASE_URL: postgres://openbot_app:e2e-app@127.0.0.1:5432/openbot_capability_smoke
          E2E_ROLE_WRITER_DATABASE_URL: postgres://openbot_role_writer:e2e-role-writer@127.0.0.1:5432/openbot_capability_smoke
        run: bun scripts/e2e/employee-eval/run-xiongbao.ts
      - name: Step summary
        if: always()
        run: bun scripts/e2e/employee-eval/report.ts "$RUNNER_TEMP/capability-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capability-smoke
          path: |
            ${{ runner.temp }}/capability-smoke
            !${{ runner.temp }}/capability-smoke/*.log
