name: A11 offline original export DATA verification
on:
  push:
    branches:
      - codex/a11-data-verify-run-20261030-a1
permissions:
  contents: read
  actions: read
concurrency:
  group: source-recovery-bytes
  cancel-in-progress: false
jobs:
  data-only:
    if: github.repository == 'canquedehuiyi-cpu/xiongbaowork' && github.ref == 'refs/heads/codex/a11-data-verify-run-20261030-a1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify administrative controller and run only fixed compressed DATA
        env:
          EXPECTED_CONTROLLER_SHA256: db31c05de7a12400228eb3b6e78dbf532c104d21b4f180ef3e4ec83128e0e6b5
          A11_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "canquedehuiyi-cpu/xiongbaowork"
          test "$GITHUB_REF" = "refs/heads/codex/a11-data-verify-run-20261030-a1"
          test "$GITHUB_EVENT_NAME" = "push"
          controller="$RUNNER_TEMP/a11-offline-data-controller.py"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 --max-filesize 32768 \
            "https://raw.githubusercontent.com/canquedehuiyi-cpu/xiongbaowork/$GITHUB_SHA/archives/recovery-20261028/A11-OFFLINE-DATA-CONTROLLER-20261030.py" -o "$controller"
          sudo --preserve-env=A11_READ_TOKEN /usr/bin/python3 -I -B - "$controller" "$RUNNER_TEMP" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(id -u)" "$(id -g)" <<'PY'
          import hashlib, os, stat, sys
          from pathlib import Path
          source,base,target,runid,attempt,uid,gid=sys.argv[1:]
          assert os.geteuid()==0 and runid.isdecimal() and attempt.isdecimal()
          fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW)
          try:
              before=os.fstat(fd)
              assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size<32768
              raw=os.read(fd,32769)
              after=os.fstat(fd)
              assert (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns)
          finally:os.close(fd)
          assert hashlib.sha256(raw).hexdigest()=="db31c05de7a12400228eb3b6e78dbf532c104d21b4f180ef3e4ec83128e0e6b5"
          directory=Path("/run")/("xb-a11-code-"+runid+"-"+attempt)
          directory.mkdir(mode=0o755)
          path=directory/"controller.py"
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o444)
          with os.fdopen(fd,"wb") as out:out.write(raw)
          import subprocess
          for name,limit in (("xiongbaowork.slice","512M"),("xiongbaowork-data.slice","64M")):
              unitpath=Path("/run/systemd/system")/name
              fd=os.open(unitpath,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o644)
              with os.fdopen(fd,"w") as out:out.write("[Unit]\nDescription=Fixed ordinary DATA aggregate\n[Slice]\nMemoryMax="+limit+"\nMemorySwapMax=0\n")
          for args in (["systemctl","daemon-reload"],["systemctl","start","xiongbaowork-data.slice"]):
              subprocess.run(args,check=True,timeout=5,env={"PATH":"/usr/bin:/bin"})
          project=Path("/sys/fs/cgroup/xiongbaowork.slice")
          shared=project/"xiongbaowork-data.slice"
          keys=("memory.max","memory.swap.max","memory.oom.group")
          for cg,cap in ((project,"536870912"),(shared,"67108864")):
              (cg/"memory.oom.group").write_text("1")
              assert {k:(cg/k).read_text().strip() for k in keys}==dict(zip(keys,(cap,"0","1")))
          adminunit="xb-a11-admin-"+runid+"-"+attempt+".service"
          args=["systemd-run","--wait","--pipe","--unit="+adminunit,"--slice=xiongbaowork-data.slice",
                "--setenv=A11_READ_TOKEN","--property=Type=exec","--property=MemoryMax=16777216",
                "--property=MemorySwapMax=0","--property=OOMPolicy=kill","--property=KillMode=control-group",
                "--property=RuntimeMaxSec=150","--property=TimeoutStartSec=1","--property=TimeoutStopSec=1",
                "--property=SendSIGKILL=yes","--property=KillSignal=SIGKILL","--property=FinalKillSignal=SIGKILL",
                "/usr/bin/python3","-I","-B",str(path),"admin",base,target,runid,attempt,uid,gid]
          completed=subprocess.run(args,stdin=subprocess.DEVNULL,timeout=153,
              env={"PATH":"/usr/bin:/bin","A11_READ_TOKEN":os.environ.pop("A11_READ_TOKEN")})
          raise SystemExit(completed.returncode)
          PY
      - name: Always independently verify original terminal and actual empty aggregate
        if: always()
        run: |
          set -euo pipefail
          script="/run/xb-a11-code-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/controller.py"
          if test -f "$script"; then
            sudo /usr/bin/python3 -I -B "$script" witness "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          else
            echo 'A11_DATA_ALWAYS_UNKNOWN {"status":"SETUP_FAILED_OR_UNKNOWN","restore_proven":false,"source_adopted":false}'
            exit 1
          fi
