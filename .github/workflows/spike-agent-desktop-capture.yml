# 仅 spike 分支：抓取 agent-desktop v1.2.0 的锁定值与三平台样本（桌面操控第 2 期 Task 1）。不合入 main。
name: spike-agent-desktop-capture

on:
  push:
    branches: [spike/agent-desktop-capture]

permissions:
  contents: read

jobs:
  hashes:
    name: hashes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 六个目标的 SHA-256
        env:
          HASH_ONLY: "1"
        run: bash .github/spike/capture.sh

  capture:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
          - name: macos
            os: macos-latest
            triple: aarch64-apple-darwin
          - name: linux
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: ${{ matrix.name }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Linux 依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gedit zenity openbox at-spi2-core dbus-x11 libatspi2.0-0 gsettings-desktop-schemas
      - name: 抓取（Linux）
        if: matrix.name == 'linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash .github/spike/capture.sh
      - name: 抓取
        if: matrix.name != 'linux'
        run: bash .github/spike/capture.sh
      - name: 上传样本
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-${{ matrix.name }}
          path: capture-out
          if-no-files-found: warn
