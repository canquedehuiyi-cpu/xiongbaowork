# Pre-review of a pull request by open-code-review (https://github.com/alibaba/open-code-review, Apache-2.0).
# REPORT ONLY: the job uploads one artifact and nothing else. It does not comment on the pull request,
# approve, request changes, label, or touch the merge button, and it never fails the pull request's checks
# (`continue-on-error`).
#
# It runs only by hand (workflow_dispatch) and only from main, like model-e2e.yml: the range to review is
# two inputs, base and head (branch names or commits of this repository). There is no pull_request trigger,
# no label trigger and no pull_request_target. The checkout is of main, so the workflow file, the review
# script and the rule file that see the key are main's; the reviewed range is only read as git objects
# (`ocr review --from <base> --to <head>`), never checked out, built or run by this workflow. A pull request
# from a fork is not reachable: its commits are not in this repository.
#
# The model key is the Environment secret OCR_API_KEY of the GitHub Environment `ocr-review`. Create the
# Environment first and give it a required reviewer: that is a precondition of turning this on, not a
# suggestion. The key leaves the repository for the provider's servers together with the reviewed code, and
# the reviewer's approval is what makes each run a decision by a person. Provider and model are variables
# of the same Environment:
#   secret    OCR_API_KEY       the key (no repository- or organisation-level secret is named here)
#   variable  OCR_PROVIDER      required, no default: where the code goes (`ocr llm providers` lists the
#                               built-in ones). Unset: the run is skipped and the artifact says so.
#   variable  OCR_MODEL         default deepseek-v4-flash
#   variable  OCR_TOKEN_BUDGET  default 1500000     (input + output tokens for the whole review)
# Without the key or the provider the run is skipped and the artifact says so. Do not make this a required
# check. How to run it by hand, how to read the report, and the benchmark behind it:
# xiongbao/scripts/review/ocr/README.md.
name: OCR 预审（只出报告）

on:
  workflow_dispatch:
    inputs:
      base:
        description: "范围的起点（分支名或提交），按 merge-base 比较：ocr review --from <base> --to <head>"
        type: string
        default: origin/main
      head:
        description: "范围的终点（分支名或提交）"
        type: string
        default: HEAD

permissions:
  contents: read

concurrency:
  group: ocr-review-${{ inputs.base }}-${{ inputs.head }}
  cancel-in-progress: true

jobs:
  ocr-review:
    name: OCR 预审
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ocr-review
    continue-on-error: true
    timeout-minutes: 30
    steps:
      # Main, with the whole history so every branch is there as a git object: the range is compared from its
      # merge-base. Nothing of the reviewed range is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Inputs reach the script as environment variables, never spliced into it.
      - name: Pre-review the range
        env:
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          OCR_PROVIDER: ${{ vars.OCR_PROVIDER }}
          OCR_MODEL: ${{ vars.OCR_MODEL || 'deepseek-v4-flash' }}
          OCR_TOKEN_BUDGET: ${{ vars.OCR_TOKEN_BUDGET || '1500000' }}
          OCR_BASE: ${{ inputs.base }}
          OCR_HEAD: ${{ inputs.head }}
          # CI reads test files too: the rules ask for changed assertions to be reported.
          OCR_INCLUDE_TESTS: "1"
          OCR_OUT_DIR: ${{ runner.temp }}/ocr-report
        run: bash xiongbao/scripts/review/ocr/run-review.sh
      - name: Show the outcome on the run page
        if: always()
        env:
          OCR_OUT_DIR: ${{ runner.temp }}/ocr-report
        run: |
          for file in summary.md SKIPPED.txt; do
            if [ -f "$OCR_OUT_DIR/$file" ]; then cat "$OCR_OUT_DIR/$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ocr-review-report
          path: ${{ runner.temp }}/ocr-report
          if-no-files-found: warn
          retention-days: 14
