# Device app release (F2 stage 3): 熊宝数字员工 设备端 installers on a GitHub Release, with SHA256SUMS.
# A person pushes a device-v* tag; this workflow never creates or moves one, and it is separate from
# release.yml (the server image), whose v* tags it does not match.
#
# Signing is decided by configuration a person sets, never by this file (D3, D4):
# - Windows is signed when the device-release Environment sets DEVICE_WINDOWS_SIGNING to
#   azure-key-vault or trusted-signing (and that mode's variables); verify-windows-signatures.ps1
#   then has to pass on the installer, the app and the runner it installs.
# - Without it every installer is built and checked as unsigned, and the release can only be a
#   prerelease titled 「未签名内测版」 whose notes say what is unsigned. A full (non-pre) release is
#   published only when every installer that can be signed was signed and verified.
# - DEVICE_RELEASE_REQUIRE_SIGNED=true (repository variable) turns "publish unsigned as a
#   prerelease" into "fail": the switch for D4 = "first release must be signed".
# - macOS (Apple Silicon dmg) is built only when the repository variable DEVICE_RELEASE_MACOS is
#   true (D5 decides whether macOS ships). It is signed with a Developer ID certificate and
#   notarized when the Environment sets DEVICE_MACOS_SIGNING=developer-id and its secrets, then has
#   to pass verify-macos.sh (codesign, stapler validate, spctl --assess); otherwise it is ad-hoc
#   signed only and counts as unsigned, like Windows above.
# The Linux deb is checksum-only (no OS-level signature check applies to a downloaded .deb).
# No updater (D6): the release carries no update manifest or updater key.
# Before anything is published, clean-linux and clean-windows install the exact files assemble made
# on fresh GitHub-hosted machines (HUMAN-STEPS 12.6), and their records
# (device-clean-{linux,windows}-evidence.txt) go up with the release, outside SHA256SUMS.
#
# Every run script reads its inputs from env, never from ${{ }}: the steps are exercised as written
# by openbot/scripts/ci/device-release-workflow.test.mjs.
name: 熊宝设备端发布

on:
  push:
    tags:
      - "device-v*.*.*"
  # Manual runs are for an existing tag only (a re-run, or a dry run before publishing): pick that
  # tag under "Use workflow from" and type it again here; tag-check refuses any other ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的设备端版本标签（与 Use workflow from 所选标签一致），如 device-v0.1.0
        type: string
        required: true
      dry_run:
        description: 只构建、签名（若已配置）、校验和生成 SHA256SUMS，不发布
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: device-release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      rc: ${{ steps.tag.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: The run is for an existing tag, on the commit it names, already on origin/main
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::A device release runs only from a tag (got $REF_TYPE $REF_NAME)."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::Input tag '$INPUT_TAG' is not the ref this run was started from ($REF_NAME). Choose $INPUT_TAG under 'Use workflow from'."
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse --verify "refs/tags/$REF_NAME^{commit}")"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$REF_NAME names $tagged, checked out $head, run is for $GITHUB_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on origin/main."
            exit 1
          fi
      - id: tag
        name: Tag format and the version the app is built with
        working-directory: openbot
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          if [[ ! "$REF_NAME" =~ ^device-v${number}\.${number}\.${number}(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "::error::Not a device release tag: '$REF_NAME' (expected device-vX.Y.Z or device-vX.Y.Z-rc.N, no leading zeros)."
            exit 1
          fi
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          # tauri.conf.json's version is "../../package.json": the app is built with this version.
          built="$(jq -r '.version' package.json)"
          if [ "$built" != "$base" ]; then
            echo "::error::package.json builds version $built, but the tag is for $base."
            exit 1
          fi
          if [ -n "${BASH_REMATCH[5]}" ]; then rc=true; else rc=false; fi
          {
            echo "tag=$REF_NAME"
            echo "version=$base"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"
          echo "Device release $REF_NAME: version $base, rc=$rc"

  # The same CI that gates main, on the tagged tree, as release.yml runs it. Nothing is built unless
  # it passes. (CI's own unsigned device bundles run there too; the release builds its own below.)
  checks:
    needs: tag-check
    uses: ./.github/workflows/ci.yml
    with:
      skip_image: true
    permissions:
      contents: read

  linux:
    needs: [tag-check, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Linux libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      - name: Bundle the deb
        working-directory: openbot/desktop-device
        run: ../desktop/node_modules/.bin/tauri build --ci --bundles deb --config src-tauri/tauri.bundle.conf.json
      - name: Check the package and stage it under its release name
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          debs=(desktop-device/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one deb, found ${#debs[@]}"; exit 1; }
          deb="${debs[0]}"
          dpkg-deb -f "$deb" Package Version Depends
          test "$(dpkg-deb -f "$deb" Package)" = xiongbao-device
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          contents=$(dpkg-deb -c "$deb")
          grep -Eq 'usr/bin/xiongbao-device$' <<<"$contents"
          grep -Eq 'usr/bin/openbot-runner$' <<<"$contents"
          sudo dpkg --dry-run -i "$deb"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$deb" "$RUNNER_TEMP/dist/xiongbao-device_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-release-linux
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [tag-check, checks]
    runs-on: windows-latest
    timeout-minutes: 90
    # Holds the signing variables. Its protection rules (tags device-v*, required reviewers) are
    # what keep the signing identity away from anything but a person's release tag.
    environment: device-release
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.done.outputs.signed }}
      publisher: ${{ steps.done.outputs.publisher }}
    # windows-latest runs a step in PowerShell unless it says otherwise. These steps are bash
    # (Git Bash on the runner); the ones written for PowerShell declare `shell: pwsh`.
    defaults:
      run:
        shell: bash
        working-directory: openbot
    env:
      SIGNING_SOURCE_SHA: ${{ github.sha }}
      DEVICE_WINDOWS_SIGNING: ${{ vars.DEVICE_WINDOWS_SIGNING }}
      DEVICE_WINDOWS_PUBLISHER: ${{ vars.DEVICE_WINDOWS_PUBLISHER }}
      DEVICE_AZURE_CLIENT_ID: ${{ vars.DEVICE_AZURE_CLIENT_ID }}
      DEVICE_AZURE_TENANT_ID: ${{ vars.DEVICE_AZURE_TENANT_ID }}
      DEVICE_AZURE_KEY_VAULT_URL: ${{ vars.DEVICE_AZURE_KEY_VAULT_URL }}
      DEVICE_AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.DEVICE_AZURE_KEY_VAULT_CERTIFICATE }}
      DEVICE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.DEVICE_TRUSTED_SIGNING_ENDPOINT }}
      DEVICE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.DEVICE_TRUSTED_SIGNING_ACCOUNT }}
      DEVICE_TRUSTED_SIGNING_PROFILE: ${{ vars.DEVICE_TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: mode
        name: Windows signing mode (from the device-release Environment)
        run: |
          set -euo pipefail
          require() {
            for name in "$@"; do
              if [ -z "${!name:-}" ]; then
                echo "::error::DEVICE_WINDOWS_SIGNING=$DEVICE_WINDOWS_SIGNING needs the variable $name."
                exit 1
              fi
            done
          }
          case "${DEVICE_WINDOWS_SIGNING:-}" in
            "" | none)
              mode=none
              echo "::warning::No Windows signing configured: the installer is built unsigned and the release can only be a prerelease (未签名内测版)."
              ;;
            azure-key-vault)
              mode=azure-key-vault
              require DEVICE_WINDOWS_PUBLISHER DEVICE_AZURE_CLIENT_ID DEVICE_AZURE_TENANT_ID DEVICE_AZURE_KEY_VAULT_URL DEVICE_AZURE_KEY_VAULT_CERTIFICATE
              ;;
            trusted-signing)
              mode=trusted-signing
              require DEVICE_WINDOWS_PUBLISHER DEVICE_AZURE_CLIENT_ID DEVICE_AZURE_TENANT_ID DEVICE_TRUSTED_SIGNING_ENDPOINT DEVICE_TRUSTED_SIGNING_ACCOUNT DEVICE_TRUSTED_SIGNING_PROFILE
              ;;
            *)
              echo "::error::DEVICE_WINDOWS_SIGNING must be empty, none, azure-key-vault or trusted-signing (got '$DEVICE_WINDOWS_SIGNING')."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Windows signing mode: $mode"
      # OIDC only: the federated credential on the Azure app registration names this repository and
      # the device-release Environment, so there is no client secret anywhere.
      - if: ${{ steps.mode.outputs.mode != 'none' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DEVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.DEVICE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Install pinned AzureSignTool
        if: ${{ steps.mode.outputs.mode == 'azure-key-vault' }}
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'azuresigntool-7.0.1'
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          $tool = Join-Path $toolDirectory 'AzureSignTool.exe'
          Invoke-WebRequest 'https://github.com/vcsjones/AzureSignTool/releases/download/v7.0.1/AzureSignTool-x64.exe' -OutFile $tool
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash -ne 'DC85A3F24BCD5978C63FCFD167A9B41313AF9116722B99B831400F05F387FCBA') {
            throw 'AzureSignTool download hash mismatch.'
          }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          az keyvault certificate show --id "$env:DEVICE_AZURE_KEY_VAULT_URL/certificates/$env:DEVICE_AZURE_KEY_VAULT_CERTIFICATE" --query id --output tsv --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the signing certificate from Key Vault.' }
      - name: Install pinned Artifact Signing (Trusted Signing) dlib
        if: ${{ steps.mode.outputs.mode == 'trusted-signing' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'artifactsigning-client-1.0.146.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.146/microsoft.artifactsigning.client.1.0.146.nupkg' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne '7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70') {
            throw 'Artifact Signing client download hash mismatch.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'artifactsigning-client'
          Expand-Archive -LiteralPath $package -DestinationPath $directory -Force
          $dlib = Join-Path $directory 'bin/x64/Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) { throw 'Azure.CodeSigning.Dlib.dll is missing from the package.' }
          "DEVICE_TRUSTED_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      # Signed: Tauri runs sign-windows.ps1 on the app, the runner sidecar and the installer.
      - name: Bundle the NSIS installer
        working-directory: openbot/desktop-device
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          configs=(--config src-tauri/tauri.bundle.conf.json)
          if [ "$MODE" != none ]; then configs+=(--config src-tauri/tauri.windows-signing.conf.json); fi
          ../desktop/node_modules/.bin/tauri build --ci --bundles nsis "${configs[@]}"
      - name: Verify the installer (verify-windows-signatures.ps1)
        working-directory: openbot/desktop-device
        shell: pwsh
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-evidence'
          if ($env:MODE -eq 'none') {
            ./scripts/verify-windows-signatures.ps1 -Unsigned -ExpectedVersion $env:VERSION -EvidenceDirectory $evidence
          } else {
            ./scripts/verify-windows-signatures.ps1 -ExpectedPublisher $env:DEVICE_WINDOWS_PUBLISHER -ExpectedVersion $env:VERSION -EvidenceDirectory $evidence
          }
          Get-Content (Join-Path $evidence 'signatures.json')
      - name: Stage the installer under its release name
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          installers=(desktop-device/src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#installers[@]}" -eq 1 ] || { echo "::error::expected one installer, found ${#installers[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          # ASCII release name: GitHub rewrites non-ASCII asset names. The signature is unaffected.
          cp "${installers[0]}" "$RUNNER_TEMP/dist/xiongbao-device_${VERSION}_x64-setup.exe"
      # Reached only when the verifier passed in the mode above, so "signed" is never claimed for an
      # installer that was not verified as signed.
      - id: done
        name: Record the signing result
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = none ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "publisher=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "publisher=$DEVICE_WINDOWS_PUBLISHER" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-release-windows
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-release-windows-evidence
          path: ${{ runner.temp }}/windows-evidence/
          if-no-files-found: ignore
          retention-days: 30

  macos:
    needs: [tag-check, checks]
    # D5: macOS ships only once a person sets this repository variable.
    if: ${{ vars.DEVICE_RELEASE_MACOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: device-release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.done.outputs.signed }}
      team: ${{ steps.done.outputs.team }}
    defaults:
      run:
        working-directory: openbot
    env:
      DEVICE_MACOS_SIGNING: ${{ vars.DEVICE_MACOS_SIGNING }}
      DEVICE_APPLE_SIGNING_IDENTITY: ${{ vars.DEVICE_APPLE_SIGNING_IDENTITY }}
      DEVICE_APPLE_TEAM_ID: ${{ vars.DEVICE_APPLE_TEAM_ID }}
      DEVICE_APPLE_API_KEY_ID: ${{ vars.DEVICE_APPLE_API_KEY_ID }}
      DEVICE_APPLE_API_ISSUER: ${{ vars.DEVICE_APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: mode
        name: macOS signing mode (from the device-release Environment)
        env:
          # Only whether each secret is set; the values never reach this script.
          HAS_DEVICE_APPLE_CERTIFICATE: ${{ secrets.DEVICE_APPLE_CERTIFICATE != '' }}
          HAS_DEVICE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVICE_APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_DEVICE_APPLE_API_KEY_P8: ${{ secrets.DEVICE_APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          case "${DEVICE_MACOS_SIGNING:-}" in
            "" | none)
              mode=none
              echo "::warning::No macOS signing configured: the dmg is ad-hoc signed only and the release can only be a prerelease (未签名内测版)."
              ;;
            developer-id)
              mode=developer-id
              for name in DEVICE_APPLE_SIGNING_IDENTITY DEVICE_APPLE_TEAM_ID DEVICE_APPLE_API_KEY_ID DEVICE_APPLE_API_ISSUER; do
                if [ -z "${!name:-}" ]; then
                  echo "::error::DEVICE_MACOS_SIGNING=developer-id needs the variable $name."
                  exit 1
                fi
              done
              for name in DEVICE_APPLE_CERTIFICATE DEVICE_APPLE_CERTIFICATE_PASSWORD DEVICE_APPLE_API_KEY_P8; do
                has="HAS_$name"
                if [ "${!has:-}" != true ]; then
                  echo "::error::DEVICE_MACOS_SIGNING=developer-id needs the secret $name."
                  exit 1
                fi
              done
              ;;
            *)
              echo "::error::DEVICE_MACOS_SIGNING must be empty, none or developer-id (got '$DEVICE_MACOS_SIGNING')."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "macOS signing mode: $mode"
      # A keychain of this job's own, deleted at the end. The certificate and the notary key reach
      # this step only through env and go only to files under RUNNER_TEMP that the cleanup removes.
      - name: Signing keychain and notary key
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        env:
          CERTIFICATE: ${{ secrets.DEVICE_APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVICE_APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.DEVICE_APPLE_API_KEY_P8 }}
          NOTARY_KEY: ${{ runner.temp }}/notary/AuthKey.p8
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/device-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/device-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/device-signing.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign > /dev/null
          rm -f "$RUNNER_TEMP/device-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$DEVICE_APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The certificate in DEVICE_APPLE_CERTIFICATE is not the identity DEVICE_APPLE_SIGNING_IDENTITY names."
            exit 1
          fi
          mkdir -p "$(dirname "$NOTARY_KEY")"
          printf '%s\n' "$API_KEY_P8" > "$NOTARY_KEY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Tauri CLI from desktop's frozen lockfile (no lifecycle scripts)
        working-directory: openbot/desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the runner sidecar
        run: bun desktop-device/scripts/build-sidecar.ts
      # Signed: Tauri signs the app and the runner with the hardened runtime and Entitlements.plist,
      # notarizes the app with the App Store Connect API key and staples it, then builds the dmg.
      - name: Bundle the app and dmg (Developer ID, notarized)
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        working-directory: openbot/desktop-device
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.DEVICE_APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ vars.DEVICE_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.DEVICE_APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary/AuthKey.p8
        run: ../desktop/node_modules/.bin/tauri build --ci --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: Bundle the app and dmg (ad-hoc signature only)
        if: ${{ steps.mode.outputs.mode == 'none' }}
        working-directory: openbot/desktop-device
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: ../desktop/node_modules/.bin/tauri build --ci --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: Sign, notarize and staple the dmg
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary/AuthKey.p8
        run: |
          set -euo pipefail
          dmgs=(desktop-device/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected one dmg, found ${#dmgs[@]}"; exit 1; }
          dmg="${dmgs[0]}"
          codesign --force --timestamp --sign "$DEVICE_APPLE_SIGNING_IDENTITY" "$dmg"
          result="$(xcrun notarytool submit "$dmg" --key "$NOTARY_KEY" --key-id "$DEVICE_APPLE_API_KEY_ID" \
            --issuer "$DEVICE_APPLE_API_ISSUER" --wait --output-format json)"
          echo "$result" | jq '{id, status, message}'
          if [ "$(jq -r .status <<<"$result")" != Accepted ]; then
            echo "::error::Notarization of the dmg was not accepted."
            exit 1
          fi
          xcrun stapler staple "$dmg"
      - name: Verify the bundle (codesign, stapler validate, spctl --assess)
        working-directory: openbot/desktop-device
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$MODE" = none ]; then
            bash scripts/verify-macos.sh --unsigned --expected-version "$VERSION" --evidence-dir "$RUNNER_TEMP/macos-evidence"
          else
            bash scripts/verify-macos.sh --team-id "$DEVICE_APPLE_TEAM_ID" --expected-version "$VERSION" --evidence-dir "$RUNNER_TEMP/macos-evidence"
          fi
      - name: Stage the dmg under its release name
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ] || { echo "::error::the release dmg is the Apple Silicon build, this runner is $(uname -m)"; exit 1; }
          dmgs=(desktop-device/src-tauri/target/release/bundle/dmg/*.dmg)
          mkdir -p "$RUNNER_TEMP/dist"
          cp "${dmgs[0]}" "$RUNNER_TEMP/dist/xiongbao-device_${VERSION}_aarch64.dmg"
      - id: done
        name: Record the signing result
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = none ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "team=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "team=$DEVICE_APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/device-signing.keychain-db" 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/device-signing.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-release-macos
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-release-macos-evidence
          path: ${{ runner.temp }}/macos-evidence/
          if-no-files-found: ignore
          retention-days: 30

  # Everything the release will carry, decided and checksummed here, also on a dry run.
  assemble:
    needs: [tag-check, linux, windows, macos]
    # macOS may be skipped (D5); everything that ran must have succeeded.
    if: >-
      ${{ !cancelled() && needs.tag-check.result == 'success' && needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
      signed: ${{ steps.kind.outputs.signed }}
      title: ${{ steps.kind.outputs.title }}
    steps:
      - id: kind
        name: Decide the release kind (unsigned is always a prerelease)
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
          RC: ${{ needs.tag-check.outputs.rc }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.result == 'skipped' && 'skipped' || needs.macos.outputs.signed }}
          REQUIRE_SIGNED: ${{ vars.DEVICE_RELEASE_REQUIRE_SIGNED }}
        run: |
          set -euo pipefail
          for pair in "RC=$RC" "WINDOWS_SIGNED=$WINDOWS_SIGNED"; do
            case "${pair#*=}" in
              true | false) ;;
              *) echo "::error::${pair%%=*} is '${pair#*=}', expected true or false."; exit 1 ;;
            esac
          done
          case "$MACOS_SIGNED" in
            true | false | skipped) ;;
            *) echo "::error::MACOS_SIGNED is '$MACOS_SIGNED', expected true, false or skipped."; exit 1 ;;
          esac
          unsigned=()
          [ "$WINDOWS_SIGNED" = true ] || unsigned+=(Windows)
          [ "$MACOS_SIGNED" != false ] || unsigned+=(macOS)
          if [ "${#unsigned[@]}" -gt 0 ]; then
            if [ "${REQUIRE_SIGNED:-}" = true ]; then
              echo "::error::DEVICE_RELEASE_REQUIRE_SIGNED=true, but these installers are unsigned: ${unsigned[*]}. Nothing is published."
              exit 1
            fi
            signed=false
            prerelease=true
            title="熊宝数字员工 设备端 ${VERSION}（未签名内测版）"
          elif [ "$RC" = true ]; then
            signed=true
            prerelease=true
            title="熊宝数字员工 设备端 ${VERSION}（预发布）"
          else
            signed=true
            prerelease=false
            title="熊宝数字员工 设备端 ${VERSION}"
          fi
          if [ "$prerelease" != true ] && [ "$signed" != true ]; then
            echo "::error::refusing a full release with unsigned installers"
            exit 1
          fi
          {
            echo "signed=$signed"
            echo "prerelease=$prerelease"
            echo "title=$title"
            echo "unsigned=${unsigned[*]}"
          } >> "$GITHUB_OUTPUT"
          echo "$title: prerelease=$prerelease signed=$signed unsigned='${unsigned[*]}'"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-linux
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-windows
          path: dist
      - if: ${{ needs.macos.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-macos
          path: dist
      - id: assets
        name: Assets, SHA256SUMS and release notes
        env:
          TAG: ${{ needs.tag-check.outputs.tag }}
          VERSION: ${{ needs.tag-check.outputs.version }}
          SIGNED: ${{ steps.kind.outputs.signed }}
          UNSIGNED: ${{ steps.kind.outputs.unsigned }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          WINDOWS_PUBLISHER: ${{ needs.windows.outputs.publisher }}
          MACOS_SIGNED: ${{ needs.macos.result == 'skipped' && 'skipped' || needs.macos.outputs.signed }}
          MACOS_TEAM: ${{ needs.macos.outputs.team }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          windows="xiongbao-device_${VERSION}_x64-setup.exe"
          linux="xiongbao-device_${VERSION}_amd64.deb"
          macos="xiongbao-device_${VERSION}_aarch64.dmg"
          files=("$linux" "$windows")
          [ "$MACOS_SIGNED" = skipped ] || files+=("$macos")
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          actual="$(cd dist && find . -mindepth 1 -printf '%P\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist holds unexpected files:"
            printf '%s\n' "$actual"
            exit 1
          fi
          (cd dist && sha256sum -- "${files[@]}" > SHA256SUMS && sha256sum -c SHA256SUMS)
          if [ "$WINDOWS_SIGNED" = true ]; then
            windows_state="已签名（${WINDOWS_PUBLISHER}），已通过 verify-windows-signatures.ps1 校验"
          else
            windows_state="**未签名**"
          fi
          if [ "$MACOS_SIGNED" = true ]; then
            macos_state="Developer ID 签名并已公证（团队 ${MACOS_TEAM}），已通过 stapler validate 与 spctl --assess"
          else
            macos_state="**未签名**（只有 ad-hoc 签名，未公证）"
          fi
          {
            echo "## 熊宝数字员工 设备端 ${VERSION}"
            echo
            echo "标签 \`${TAG}\`，提交 \`${COMMIT}\`。"
            echo
            if [ "$SIGNED" != true ]; then
              echo "> **未签名内测版**：${UNSIGNED} 安装包没有代码签名，只用于小范围内测，不要发给正式客户。"
              if [ "$WINDOWS_SIGNED" != true ]; then
                echo "> Windows 安装时 SmartScreen 会提示「Windows 已保护你的电脑」，需要点「更多信息 → 仍要运行」。"
              fi
              if [ "$MACOS_SIGNED" = false ]; then
                echo "> macOS 会提示无法验证开发者：在 Finder 里按住 Control 点按应用并选「打开」，或到「系统设置 → 隐私与安全性」点「仍要打开」。"
              fi
              echo
            fi
            echo "| 文件 | 平台 | 签名 |"
            echo "| --- | --- | --- |"
            echo "| \`${windows}\` | Windows 10/11 x64 | ${windows_state} |"
            if [ "$MACOS_SIGNED" != skipped ]; then
              echo "| \`${macos}\` | macOS 11+，Apple 芯片 | ${macos_state} |"
            fi
            echo "| \`${linux}\` | Ubuntu / Debian x64 | 不做代码签名，只提供 SHA256 校验和 |"
            echo
            echo "下载后核对校验和：Linux 运行 \`sha256sum -c SHA256SUMS --ignore-missing\`，macOS 运行 \`shasum -a 256 <文件>\`；Windows 在 PowerShell 运行 \`Get-FileHash <文件> -Algorithm SHA256\`，与 \`SHA256SUMS\` 里的值对照。"
            echo
            echo "\`device-clean-linux-evidence.txt\` 与 \`device-clean-windows-evidence.txt\` 是发布前在全新的 GitHub 托管 Ubuntu 与 Windows 机器上，用上表这些文件自动做的校验、安装、启动、退出与卸载记录（不在 SHA256SUMS 里）。"
            echo
            echo "本版本没有自动更新，新版本需要重新下载安装。"
          } > notes.md
          cat notes.md
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-release-dist
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 30

  # HUMAN-STEPS 12.6 on a fresh GitHub-hosted Ubuntu machine, with the exact files assemble made:
  # SHA256SUMS, apt install (Depends from the archive), the installed files, the installed runner
  # paired with a real server (and PostgreSQL) through the API, one command from the server, quit with
  # no openbot-runner left, the installed app back online without pairing, apt remove. No secret and
  # no Environment; publish waits for it. Not the default success(): macOS may have been skipped.
  clean-linux:
    needs: [tag-check, assemble]
    if: ${{ !cancelled() && needs.tag-check.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: openbot_device_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_device_clean"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
      # The job's own throwaway database (the e2e-wakerflow recipe in ci.yml), not a secret.
      PGPASSWORD: ci-owner
      OWNER_DATABASE_URL: postgres://openbot:ci-owner@127.0.0.1:5432/openbot_device_clean
      APP_DATABASE_URL: postgres://openbot_app:ci-app@127.0.0.1:5432/openbot_device_clean
      ROLE_WRITER_URL: postgres://openbot_role_writer:ci-role-writer@127.0.0.1:5432/openbot_device_clean
      ORIGIN: http://127.0.0.1:3901
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-dist
          path: release
      - id: sums
        name: The deb is the one SHA256SUMS names (sha256sum -c --ignore-missing)
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          deb="xiongbao-device_${VERSION}_amd64.deb"
          evidence="$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
          mkdir -p "$(dirname "$evidence")"
          os="$(. /etc/os-release && echo "$PRETTY_NAME")"
          {
            echo "熊宝数字员工 设备端 ${VERSION}：全新 Linux 机器检查（HUMAN-STEPS 12.6）"
            echo "标签 ${TAG}，提交 ${COMMIT}"
            echo "系统：${os}，内核 $(uname -r)，$(uname -m)，托管镜像 ${ImageOS:-未知} ${ImageVersion:-未知}"
          } > "$evidence"
          listed="$(awk -v file="$deb" '$2 == file { print $1 }' release/dist/SHA256SUMS)"
          if ! [[ "$listed" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SHA256SUMS does not list $deb exactly once."
            exit 1
          fi
          (cd release/dist && sha256sum -c --ignore-missing SHA256SUMS)
          actual="$(sha256sum "release/dist/$deb" | cut -d' ' -f1)"
          [ "$actual" = "$listed" ]
          {
            echo "安装包：${deb}"
            echo "SHA256：${actual}"
            echo "签名：deb 不做代码签名，只核对 SHA256（checksum-only）"
            echo "PASS SHA256SUMS 校验（sha256sum -c --ignore-missing）"
          } >> "$evidence"
      - name: Install the deb with apt (its Depends come from the archive)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "./release/dist/xiongbao-device_${VERSION}_amd64.deb"
          echo "PASS sudo apt-get install -y ./xiongbao-device_${VERSION}_amd64.deb" >> "$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
      - id: files
        name: The installed app, runner sidecar and desktop entry
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
          status="$(dpkg-query -W -f='${Status} ${Version}' xiongbao-device)"
          [ "$status" = "install ok installed $VERSION" ] || { echo "::error::dpkg says: $status"; exit 1; }
          for binary in /usr/bin/xiongbao-device /usr/bin/openbot-runner; do
            [ -x "$binary" ] || { echo "::error::$binary is missing or not executable."; exit 1; }
            echo "已安装 ${binary}，SHA256 $(sha256sum "$binary" | cut -d' ' -f1)" >> "$evidence"
          done
          entry=/usr/share/applications/xiongbao-device.desktop
          grep -qx 'Exec=xiongbao-device' "$entry"
          grep -qx 'Name=熊宝数字员工 设备端' "$entry"
          echo "PASS 已安装 /usr/bin/xiongbao-device、/usr/bin/openbot-runner 与 ${entry}（dpkg：${status}）" >> "$evidence"
      - id: selfcheck
        name: The installed runner's own checks (no network)
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
          scratch="$(mktemp -d)"
          code=0
          /usr/bin/openbot-runner --help > "$scratch/help.txt" 2>&1 || code=$?
          [ "$code" = 2 ] && grep -q -- '--pair CODE' "$scratch/help.txt"
          mkdir "$scratch/folder"
          data="$scratch/data"
          /usr/bin/openbot-runner --data-dir "$data" --add-root "selfcheck=$scratch/folder" | jq -e '.ok and (.roots | length) == 1' > /dev/null
          /usr/bin/openbot-runner --data-dir "$data" --list-roots | jq -e '.ok and .roots[0].name == "selfcheck"' > /dev/null
          /usr/bin/openbot-runner --data-dir "$data" --remove-root selfcheck | jq -e '.ok and (.roots | length) == 0' > /dev/null
          if [ -n "$(ps -C openbot-runner -o pid= || true)" ]; then
            echo "::error::an openbot-runner is still running after the one-shot commands."
            exit 1
          fi
          rm -rf "$scratch"
          echo "PASS 已安装的 openbot-runner 自检：--help 退出码 2 并打印用法；--add-root / --list-roots / --remove-root 正常；之后没有残留进程" >> "$evidence"
      # The server side of 「我的设备」, from the tagged tree: only the server runs from source, the
      # device side is what apt installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: source
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install root workspaces from the frozen lockfile (no lifecycle scripts)
        working-directory: source/openbot
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Migrate the job's own database and set the runtime role passwords (server-test recipe)
        working-directory: source/openbot
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" bun run --cwd server scripts/migrate.ts
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_app WITH PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U openbot -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE openbot_role_writer WITH PASSWORD 'ci-role-writer'"
      - name: Start the real server (stopped by its PID below)
        working-directory: source/openbot/server
        env:
          NODE_ENV: test
          PORT: "3901"
          TENANT_PACKAGE_DIR: ../examples/qoderwake
          INTELLIGENCE_MODE: local
          COPILOTKIT_TELEMETRY_DISABLED: "true"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/device-clean-logs"
          mkdir -p "$logs"
          KEY_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY_ENCRYPTION_KEY"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          export KEY_ENCRYPTION_KEY BETTER_AUTH_SECRET
          export DATABASE_URL="$APP_DATABASE_URL" ROLE_WRITER_DATABASE_URL="$ROLE_WRITER_URL"
          export BETTER_AUTH_URL="$ORIGIN" OPENBOT_PUBLIC_URL="$ORIGIN"
          nohup bun src/index.ts > "$logs/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/device-clean-server.pid"
          for _ in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "$ORIGIN/health" || true)" = 200 ]; then exit 0; fi
            kill -0 "$(cat "$RUNNER_TEMP/device-clean-server.pid")" || { echo "::error::the server exited"; exit 1; }
            sleep 1
          done
          echo "::error::the server was not healthy within 90s"
          exit 1
      - name: Pair the installed runner, one command, quit, back online (device-clean-linux.sh)
        working-directory: source/openbot
        env:
          EVIDENCE: ${{ runner.temp }}/device-clean-linux/device-clean-linux-evidence.txt
          LOG_DIR: ${{ runner.temp }}/device-clean-logs
          RUNNER_BIN: /usr/bin/openbot-runner
          APP_BIN: /usr/bin/xiongbao-device
        run: |
          set -euo pipefail
          # Test harness only, not the app's dependencies: a virtual display for the tray app.
          sudo apt-get install -y xvfb dbus-daemon dbus-session-bus-common
          bash scripts/ci/device-clean-linux.sh
      - name: Stop the server by its PID
        if: always()
        run: |
          pidfile="$RUNNER_TEMP/device-clean-server.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill -TERM "$pid" 2> /dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
            kill -KILL "$pid" 2> /dev/null || true
          fi
      - id: uninstall
        name: Uninstall with apt and nothing of the package is left
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
          sudo apt-get remove -y xiongbao-device
          status="$(dpkg-query -W -f='${Status}' xiongbao-device 2> /dev/null || true)"
          case "$status" in
            "" | "deinstall ok config-files" | "unknown ok not-installed" | "deinstall ok not-installed") ;;
            *) echo "::error::xiongbao-device is still installed: $status"; exit 1 ;;
          esac
          for file in /usr/bin/xiongbao-device /usr/bin/openbot-runner /usr/share/applications/xiongbao-device.desktop; do
            if [ -e "$file" ]; then echo "::error::$file is still there after apt-get remove."; exit 1; fi
          done
          if [ -n "$(ps -C openbot-runner -o pid= || true)" ]; then
            echo "::error::an openbot-runner is still running after uninstall."
            exit 1
          fi
          echo "PASS sudo apt-get remove -y xiongbao-device：应用、openbot-runner 与桌面入口都已删除，没有残留进程" >> "$evidence"
          echo "说明：apt 不删除用户目录里的 ~/.local/share/com.xiongbao.device（配对信息），与普通 Linux 软件一致" >> "$evidence"
      - name: Every check passed
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/device-clean-linux/device-clean-linux-evidence.txt"
          if grep -q '^FAIL ' "$evidence"; then exit 1; fi
          echo "RESULT: PASS" >> "$evidence"
          cat "$evidence"
      - name: Print server, runner and app logs (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/device-clean-logs/*.log; do
            bash source/openbot/scripts/ci/print-diagnostics.sh "$f" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-linux-evidence
          path: ${{ runner.temp }}/device-clean-linux/
          if-no-files-found: error
          retention-days: 30

  # The same on a fresh GitHub-hosted Windows machine, as far as one can go without a server there
  # (no pgvector PostgreSQL on windows-latest): SHA256SUMS, the installer's Authenticode state, a
  # silent NSIS install, the installed files, the installed runner's own checks, the installed app
  # starting the installed runner and leaving none behind when it ends, a silent uninstall.
  clean-windows:
    needs: [tag-check, windows, assemble]
    if: ${{ !cancelled() && needs.tag-check.result == 'success' && needs.windows.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
      PRODUCT: 熊宝数字员工 设备端
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-dist
          path: release
      - id: sums
        name: The installer is the one SHA256SUMS names (Get-FileHash)
        shell: pwsh
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "xiongbao-device_$($env:VERSION)_x64-setup.exe"
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          New-Item -ItemType Directory -Path (Split-Path $evidence) -Force | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          @(
            "熊宝数字员工 设备端 $($env:VERSION)：全新 Windows 机器检查（HUMAN-STEPS 12.6）"
            "标签 $($env:TAG)，提交 $($env:COMMIT)"
            "系统：$($os.Caption) $($os.Version)（build $($os.BuildNumber)），$($os.OSArchitecture)，托管镜像 $($env:ImageOS) $($env:ImageVersion)"
          ) | Set-Content -LiteralPath $evidence -Encoding utf8NoBOM
          $listed = @(Get-Content -LiteralPath 'release/dist/SHA256SUMS' | ForEach-Object {
            $hash, $name = $_ -split '  ', 2
            if ($name -ceq $installer) { $hash }
          })
          if ($listed.Count -ne 1 -or $listed[0] -notmatch '^[0-9a-f]{64}$') { throw "SHA256SUMS does not list $installer exactly once." }
          $actual = (Get-FileHash -LiteralPath "release/dist/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $listed[0]) { throw "SHA256 mismatch for ${installer}: $actual, SHA256SUMS says $($listed[0])." }
          @(
            "安装包：$installer"
            "SHA256：$actual"
            "PASS Get-FileHash 与 SHA256SUMS 一致"
          ) | Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - id: signature
        name: The installer's Authenticode state (Valid when signed, NotSigned otherwise)
        shell: pwsh
        env:
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          WINDOWS_PUBLISHER: ${{ needs.windows.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          $signature = Get-AuthenticodeSignature -LiteralPath "release/dist/xiongbao-device_$($env:VERSION)_x64-setup.exe"
          $status = [string]$signature.Status
          if ($env:WINDOWS_SIGNED -eq 'true') {
            if ($status -ne 'Valid') { throw "The release is signed, but the installer's Authenticode status is $status." }
            $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne $env:WINDOWS_PUBLISHER) { throw "Signed by '$publisher', expected '$($env:WINDOWS_PUBLISHER)'." }
            $line = "签名：Valid，发布者 $publisher，证书指纹 $($signature.SignerCertificate.Thumbprint)"
          } elseif ($env:WINDOWS_SIGNED -eq 'false') {
            if ($status -ne 'NotSigned') { throw "The release is labelled unsigned, but the installer's Authenticode status is $status." }
            $line = '签名：NotSigned（未签名内测版，SmartScreen 会提示）'
          } else {
            throw "WINDOWS_SIGNED is '$($env:WINDOWS_SIGNED)', expected true or false."
          }
          @($line, "PASS Get-AuthenticodeSignature：$status") | Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - id: install
        name: Silent install (NSIS /S) and the installed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          $setup = Start-Process -FilePath "release/dist/xiongbao-device_$($env:VERSION)_x64-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer exited $($setup.ExitCode)." }
          # Tauri's NSIS installer registers itself under ...\Uninstall with DisplayName = productName;
          # the default installMode is currentUser (HKCU, %LOCALAPPDATA%\<productName>).
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $all = @(Get-ItemProperty -Path $roots -ErrorAction SilentlyContinue)
          $entries = @($all | Where-Object { $_.DisplayName -ceq $env:PRODUCT })
          if ($entries.Count -eq 0) { $entries = @($all | Where-Object { [string]$_.DisplayIcon -like '*\xiongbao-device.exe*' }) }
          if ($entries.Count -ne 1) {
            $all | Where-Object { $_.DisplayName } | ForEach-Object { Write-Host "uninstall entry: $($_.PSChildName) = $($_.DisplayName)" }
            throw "Expected one uninstall entry for $($env:PRODUCT), found $($entries.Count)."
          }
          $entry = $entries[0]
          if ($entry.DisplayVersion -cne $env:VERSION) { throw "Installed version $($entry.DisplayVersion), expected $($env:VERSION)." }
          $directory = ([string]$entry.InstallLocation).Trim().Trim('"').TrimEnd('\')
          if (-not $directory) { $directory = Split-Path -Parent ([string]$entry.UninstallString).Trim().Trim('"') }
          $uninstaller = Join-Path $directory 'uninstall.exe'
          $app = Join-Path $directory 'xiongbao-device.exe'
          $sidecar = Join-Path $directory 'openbot-runner.exe'
          foreach ($file in @($app, $sidecar, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "$file is missing after the install." }
          }
          $info = (Get-Item -LiteralPath $app).VersionInfo
          if ($info.ProductName -cne $env:PRODUCT -or $info.ProductVersion -cne $env:VERSION) {
            throw "The installed app says $($info.ProductName) $($info.ProductVersion)."
          }
          $scope = if ($entry.PSPath -like '*HKEY_CURRENT_USER*') { '当前用户（HKCU）' } else { '本机所有用户（HKLM）' }
          $default = Join-Path $env:LOCALAPPDATA $env:PRODUCT
          "INSTALL_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "安装方式：$scope，安装目录 $directory$(if ($directory -eq $default) { '（Tauri 默认的 %LOCALAPPDATA%\<产品名>）' })"
            "已安装 xiongbao-device.exe，SHA256 $((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant())，签名 $([string](Get-AuthenticodeSignature -LiteralPath $app).Status)"
            "已安装 openbot-runner.exe，SHA256 $((Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash.ToLowerInvariant())，签名 $([string](Get-AuthenticodeSignature -LiteralPath $sidecar).Status)"
            "PASS 静默安装（/S，退出码 0）：xiongbao-device.exe、openbot-runner.exe、uninstall.exe 都在安装目录，卸载项版本 $($entry.DisplayVersion)"
          ) | Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - id: selfcheck
        name: The installed runner's own checks (no network)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          $sidecar = Join-Path $env:INSTALL_DIR 'openbot-runner.exe'
          $scratch = Join-Path $env:RUNNER_TEMP 'runner-selfcheck'
          New-Item -ItemType Directory -Path (Join-Path $scratch 'folder') -Force | Out-Null
          $help = Start-Process -FilePath $sidecar -ArgumentList '--help' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $scratch 'help.out') -RedirectStandardError (Join-Path $scratch 'help.err')
          $usage = (Get-Content -Raw (Join-Path $scratch 'help.out')) + (Get-Content -Raw (Join-Path $scratch 'help.err'))
          if ($help.ExitCode -ne 2 -or $usage -notmatch '--pair CODE') { throw "--help exited $($help.ExitCode) without the usage." }
          $data = Join-Path $scratch 'data'
          $added = & $sidecar --data-dir $data --add-root "selfcheck=$(Join-Path $scratch 'folder')" | ConvertFrom-Json
          if (-not $added.ok -or @($added.roots).Count -ne 1) { throw "--add-root: $($added | ConvertTo-Json -Compress)" }
          $listed = & $sidecar --data-dir $data --list-roots | ConvertFrom-Json
          if (-not $listed.ok -or $listed.roots[0].name -cne 'selfcheck') { throw "--list-roots: $($listed | ConvertTo-Json -Compress)" }
          $removed = & $sidecar --data-dir $data --remove-root selfcheck | ConvertFrom-Json
          if (-not $removed.ok -or @($removed.roots).Count -ne 0) { throw "--remove-root: $($removed | ConvertTo-Json -Compress)" }
          if (Get-Process -Name openbot-runner -ErrorAction SilentlyContinue) { throw 'openbot-runner is still running after the one-shot commands.' }
          Remove-Item -LiteralPath $scratch -Recurse -Force
          'PASS 已安装的 openbot-runner.exe 自检：--help 退出码 2 并打印用法；--add-root / --list-roots / --remove-root 正常；之后没有残留进程' |
            Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      # No server on this machine, so the app is given a pairing that cannot connect: the runner it
      # starts keeps retrying, which is enough to see whose child it is and that it dies with the app.
      - id: app
        name: The installed app starts the installed runner, and no openbot-runner outlives it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          $sidecar = Join-Path $env:INSTALL_DIR 'openbot-runner.exe'
          $data = Join-Path $env:APPDATA 'com.xiongbao.device'
          if (Test-Path -LiteralPath $data) { throw "$data already exists: this is not a clean machine." }
          New-Item -ItemType Directory -Path (Join-Path $data 'runner') -Force | Out-Null
          '{"server": "http://127.0.0.1:9", "name": "clean-windows"}' | Set-Content -LiteralPath (Join-Path $data 'device.json') -Encoding utf8NoBOM
          '{"deviceId": "clean-windows", "token": "not-a-device-token", "server": "http://127.0.0.1:9"}' |
            Set-Content -LiteralPath (Join-Path $data 'runner/runner-state.json') -Encoding utf8NoBOM
          if (Get-Process -Name openbot-runner -ErrorAction SilentlyContinue) { throw 'An openbot-runner is already running.' }
          $app = Start-Process -FilePath (Join-Path $env:INSTALL_DIR 'xiongbao-device.exe') -PassThru
          $child = $null
          foreach ($second in 1..60) {
            # The supervised runner, not a one-shot --list-roots the window may ask for (roots.rs).
            $child = Get-CimInstance Win32_Process -Filter "Name = 'openbot-runner.exe' AND ParentProcessId = $($app.Id)" |
              Where-Object { $_.CommandLine -notlike '*--list-roots*' } | Select-Object -First 1
            if ($child) { break }
            if ($app.HasExited) { throw "The app exited $($app.ExitCode) before starting the runner." }
            Start-Sleep -Seconds 1
          }
          if (-not $child) { throw 'The app did not start openbot-runner within 60s.' }
          if ($child.ExecutablePath -ne $sidecar) { throw "The app started $($child.ExecutablePath), not the installed $sidecar." }
          if ($child.CommandLine -match '--pair') { throw 'The app passed --pair without a pairing code.' }
          Start-Sleep -Seconds 5
          if (-not (Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue)) { throw 'The runner did not keep running.' }
          # The hardest way out: the app is killed outright, and the job object it holds
          # (process_tree.rs, KILL_ON_JOB_CLOSE) has to take the runner with it.
          Stop-Process -Id $app.Id -Force
          $app.WaitForExit(30000) | Out-Null
          $left = $null
          foreach ($second in 1..15) {
            $left = Get-Process -Name openbot-runner -ErrorAction SilentlyContinue
            if (-not $left) { break }
            Start-Sleep -Seconds 1
          }
          if ($left) { throw "openbot-runner is still running after the app ended: $($left.Id -join ', ')" }
          Remove-Item -LiteralPath $data -Recurse -Force
          @(
            "PASS 启动已安装的 xiongbao-device.exe：它拉起安装目录里的 openbot-runner.exe（PID $($child.ProcessId)，命令行不带 --pair）"
            'PASS 结束应用进程（Stop-Process -Force，比托盘「退出」更粗暴）后 15 秒内没有任何 openbot-runner 进程（Get-Process）'
          ) | Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - id: uninstall
        name: Silent uninstall (/S) removes the app and the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          $uninstaller = Join-Path $env:INSTALL_DIR 'uninstall.exe'
          $run = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The uninstaller exited $($run.ExitCode)." }
          # An NSIS uninstaller copies itself to %TEMP% and finishes from there.
          $files = @('xiongbao-device.exe', 'openbot-runner.exe', 'uninstall.exe') | ForEach-Object { Join-Path $env:INSTALL_DIR $_ }
          foreach ($second in 1..60) {
            $remaining = @($files | Where-Object { Test-Path -LiteralPath $_ })
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($remaining.Count -ne 0) { throw "Still there after uninstall: $($remaining -join ', ')" }
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          if (@(Get-ItemProperty -Path $roots -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -ceq $env:PRODUCT }).Count -ne 0) {
            throw 'The uninstall entry is still registered.'
          }
          if (Get-Process -Name openbot-runner, xiongbao-device -ErrorAction SilentlyContinue) { throw 'A device process is still running after uninstall.' }
          $folder = if (Test-Path -LiteralPath $env:INSTALL_DIR) { '安装目录仍在（只剩空目录或非安装文件）' } else { '安装目录已删除' }
          "PASS 静默卸载（uninstall.exe /S）：xiongbao-device.exe、openbot-runner.exe、uninstall.exe 与卸载项都已删除，$folder，没有残留进程" |
            Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - name: Every check passed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'device-clean-windows/device-clean-windows-evidence.txt'
          if (Select-String -LiteralPath $evidence -Pattern '^FAIL ' -Quiet) { throw 'A check failed.' }
          'RESULT: PASS' | Add-Content -LiteralPath $evidence -Encoding utf8NoBOM
          Get-Content -LiteralPath $evidence -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-clean-windows-evidence
          path: ${{ runner.temp }}/device-clean-windows/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [tag-check, assemble, clean-linux, clean-windows]
    # Not the default success(): macOS may have been skipped upstream of assemble. Nothing is
    # published unless both fresh-machine checks passed on the files being published.
    if: >-
      ${{ !cancelled() && !inputs.dry_run && needs.tag-check.result == 'success' &&
      needs.assemble.result == 'success' && needs.clean-linux.result == 'success' &&
      needs.clean-windows.result == 'success' }}
    runs-on: ubuntu-latest
    environment: device-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-release-dist
          path: release
      # The fresh-machine records, in a directory of their own: SHA256SUMS covers the installers only.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-clean-linux-evidence
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-clean-windows-evidence
          path: evidence
      - id: publish
        name: Publish the GitHub Release (existing tag only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          TITLE: ${{ needs.assemble.outputs.title }}
          PRERELEASE: ${{ needs.assemble.outputs.prerelease }}
          SIGNED: ${{ needs.assemble.outputs.signed }}
        run: |
          set -euo pipefail
          case "$PRERELEASE/$SIGNED" in
            true/true | true/false) flags=(--prerelease) ;;
            false/true) flags=() ;;
            false/false) echo "::error::refusing to publish unsigned installers as a full release"; exit 1 ;;
            *) echo "::error::prerelease='$PRERELEASE' signed='$SIGNED'"; exit 1 ;;
          esac
          test -s release/notes.md
          (cd release/dist && sha256sum -c SHA256SUMS)
          evidence=(evidence/device-clean-linux-evidence.txt evidence/device-clean-windows-evidence.txt)
          for file in "${evidence[@]}"; do
            # The Windows record has CRLF line ends.
            if ! tr -d '\r' < "$file" | grep -qx 'RESULT: PASS'; then
              echo "::error::$file is missing or does not say RESULT: PASS."
              exit 1
            fi
          done
          gh release create "$TAG" release/dist/* "${evidence[@]}" \
            --verify-tag --title "$TITLE" --notes-file release/notes.md "${flags[@]}"
