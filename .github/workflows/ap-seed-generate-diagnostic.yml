name: Filtered offline approval seed generation diagnostic
on:
  push:
    branches: [codex/ap-seed-generate-filtered-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-recovery-bytes
  cancel-in-progress: false
jobs:
  source-bytes:
    name: Filtered server diagnostic - lifecycle scripts disabled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Establish project aggregate memory slice
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B - <<'PY'
          from pathlib import Path
          unit = Path("/run/systemd/system/xiongbaowork.slice")
          with unit.open("x") as out:
              out.write("[Unit]\nDescription=Dedicated xiongbaowork validation\n[Slice]\nMemoryMax=512M\nMemorySwapMax=0\n")
          PY
          sudo systemctl daemon-reload
          sudo systemctl start xiongbaowork.slice
          sudo /usr/bin/python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          p = Path("/sys/fs/cgroup/xiongbaowork.slice")
          (p / "memory.oom.group").write_text("1")
          assert (p / "memory.max").read_text().strip() == "536870912"
          assert (p / "memory.swap.max").read_text().strip() == "0"
          assert (p / "memory.oom.group").read_text().strip() == "1"
          print("PROJECT_PARENT_RESOURCE_GATE " + json.dumps({"aggregate_memory_max": 536870912, "swap_max": 0}))
          PY
      - name: Verify all 2065 source files under 64 MiB DATA cap
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "canquedehuiyi-cpu/xiongbaowork"
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - "$GITHUB_SHA" <<'PY'
          import base64, gzip, hashlib, io, json, os, stat, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path
          
          target = sys.argv[1]
          assert len(target) == 40 and all(c in "0123456789abcdef" for c in target)
          cg_lines = Path("/proc/self/cgroup").read_text().splitlines()
          assert len(cg_lines) == 1 and cg_lines[0].startswith("0::/")
          cg = Path("/sys/fs/cgroup") / cg_lines[0][3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert (cg / "memory.oom.group").read_text().strip() == "1"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          print("RESOURCE_GATE " + json.dumps({"cgroup": cg_lines[0], "aggregate_memory_max": 67108864, "project_upper_bound": 536870912, "swap_max": 0}), flush=True)
          
          def command(args, cwd):
              print("SOURCE_COMMAND_START " + json.dumps({"operation": args[1], "argument_count": len(args)}), flush=True)
              completed = subprocess.run(["timeout", "--signal=TERM", "--kill-after=2s", "45s",
                  "git", "-c", "gc.auto=0", "-c", "maintenance.auto=false",
                  "-c", "core.deltaBaseCacheLimit=1m", "-c", "core.packedGitLimit=8m",
                  "-c", "core.packedGitWindowSize=1m", "-c", "pack.threads=1", *args[1:]],
                  cwd=cwd, text=True, capture_output=True,
                  env={**os.environ, "GIT_TERMINAL_PROMPT": "0"})
              if completed.returncode:
                  print("SOURCE_COMMAND_FAILURE " + json.dumps({"operation": args[1], "exit_code": completed.returncode,
                      "stderr": completed.stderr[-4000:]}), flush=True)
              completed.check_returncode()
              print("SOURCE_COMMAND_END " + json.dumps({"operation": args[1]}), flush=True)
              return completed.stdout.strip()
          
          def metadata(s):
              return (s.st_dev, s.st_ino, s.st_size, s.st_mode, s.st_nlink, s.st_mtime_ns, s.st_ctime_ns)
          
          def verified_bytes(root, rel, expected_size, expected_sha, retain=False, expected_mode=None):
              part = Path(rel)
              assert not part.is_absolute() and ".." not in part.parts and part.parts[0] != ".git"
              assert "\\" not in rel and "\x00" not in rel
              path = root / part
              for parent in [path, *path.parents]:
                  if parent == root:
                      break
                  assert not parent.is_symlink()
              assert path.resolve(strict=True).is_relative_to(root)
              named = os.stat(path, follow_symlinks=False)
              assert stat.S_ISREG(named.st_mode) and named.st_nlink == 1 and named.st_size == expected_size, json.dumps({"path": rel, "expected_bytes": expected_size, "actual_bytes": named.st_size, "nlink": named.st_nlink, "mode": named.st_mode})
              if expected_mode is not None:
                  assert stat.S_IMODE(named.st_mode) == (int(expected_mode.removeprefix("0o"), 8) & 0o7777), json.dumps({"path": rel, "expected_mode": expected_mode, "actual_mode": oct(stat.S_IMODE(named.st_mode))})
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  assert metadata(before) == metadata(named)
                  digest = hashlib.sha256()
                  data = bytearray() if retain else None
                  count = 0
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk:
                          break
                      count += len(chunk)
                      assert count <= expected_size
                      digest.update(chunk)
                      if retain:
                          data.extend(chunk)
                  assert count == expected_size and digest.hexdigest() == expected_sha, json.dumps({"path": rel, "expected_sha256": expected_sha, "actual_sha256": digest.hexdigest(), "expected_bytes": expected_size, "actual_bytes": count})
                  assert metadata(os.fstat(fd)) == metadata(before) == metadata(os.stat(path, follow_symlinks=False))
                  return bytes(data) if retain else count
              finally:
                  os.close(fd)
          
          work = Path.cwd() / "xiongbaowork-verified-source"
          work.mkdir(mode=0o700)
          root = Path(work) / "repo"
          command(["git", "init", "--quiet", str(root)], Path(work))
          command(["git", "remote", "add", "origin", "https://github.com/canquedehuiyi-cpu/xiongbaowork.git"], root)
          command(["git", "config", "remote.origin.promisor", "true"], root)
          command(["git", "config", "remote.origin.partialclonefilter", "blob:none"], root)
          command(["git", "fetch", "--quiet", "--no-tags", "--filter=blob:none", "--depth=1", "origin", target], root)
          control_path = "archives/recovery-20261028/V57-MANIFEST.json"
          shown = subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=1m", "-c", "pack.threads=1",
                                  "show", target + ":" + control_path], cwd=root,
                                 check=True, capture_output=True, env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout
          assert len(shown) == 419227
          assert hashlib.sha256(shown).hexdigest() == "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920"
          manifest = json.loads(shown)
          overlay_specs = json.loads("[{\"path\":\"archives/recovery-20261028/AP-INPUT-BUN-ADOPTED.json\",\"bytes\":2726,\"sha256\":\"e3f70c824d32664eb69ec86c8cdc8b9bb2a7ee98f51fb8bf182b5fdd85fd2184\",\"formal_adoption\":true,\"ticket\":\"AP-INPUT-BUN-20261028\",\"source_paths\":[\"openbot/server/src/approvals/exact-http-owned-input.ts\",\"openbot/server/tests/approval-exact-input-json-materializer.test.ts\",\"openbot/server/tests/approval-exact-http-owned-input.test.ts\"]},{\"path\":\"archives/recovery-20261028/AP-SCHEMA-RUNTIME-ADOPTED.json\",\"bytes\":4912,\"sha256\":\"e0e19145d1605dfb19201e5bd1e0b3f9856fba37f1e39a8ebfe3adcec176ffc9\",\"formal_adoption\":true,\"ticket\":\"AP-SCHEMA-RUNTIME-20261028\",\"source_paths\":[\"openbot/server/src/db/schema/approvals.ts\",\"openbot/server/src/db/schema/approval-exact-input-objects.ts\",\"openbot/server/tests/recovery-ap2-parent-schema-reconcile.test.ts\",\"openbot/server/tests/recovery-approval-exact-input-objects.test.ts\",\"openbot/server/tests/recovery-approval-direct-execution-domains.test.ts\"]},{\"path\":\"archives/recovery-20261028/KNOWLEDGE-RESOURCE-RUNTIME-ADOPTED.json\",\"bytes\":4954,\"sha256\":\"947602e681a0ea87306aec11ef296cc961dd9ed75c323bad843a79de0f32f655\",\"formal_adoption\":true,\"ticket\":\"KNOWLEDGE-RESOURCE-RUNTIME-20261028\",\"source_paths\":[\"openbot/server/src/db/schema/knowledge-foundations.ts\",\"openbot/server/src/db/schema/knowledge-write-foundations.ts\",\"openbot/server/src/db/schema/resource-project-foundations.ts\",\"openbot/server/tests/recovery-knowledge-write-foundations.test.ts\",\"openbot/server/tests/recovery-resource-project-foundations.test.ts\"]},{\"path\":\"archives/recovery-20261028/AUTOMATION-FK-ASSERTION-ADOPTED.json\",\"bytes\":2467,\"sha256\":\"21cfd36110aed505088883686c6b793c31ec6ee08477e6c6c43bc382225125d2\",\"formal_adoption\":true,\"ticket\":\"AUTOMATION-FK-ASSERTION-20261028\",\"source_paths\":[\"openbot/server/tests/recovery-automation-run-records.test.ts\"]},{\"path\