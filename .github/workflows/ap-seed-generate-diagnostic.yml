          assert "DATABASE_URL" not in env
          args=[node,"--max-old-space-size=384",str(cli),"generate","--config="+str(base/"xiongbaowork-offline-drizzle.config.cjs"),"--name=approval_fresh_seeds"]
          try:
              r=subprocess.run(args,cwd=root/"server",env=env,stdin=subprocess.DEVNULL,capture_output=True,text=True,timeout=120)
              code=r.returncode;output=r.stdout+r.stderr
          except subprocess.TimeoutExpired as e:
              code=124;output="OFFLINE_GENERATION_TIMEOUT_OR_INTERACTIVE_CHOICE"
          with (base/"xiongbaowork-offline-drizzle.log").open("x") as h:h.write(output)
          for line in output.splitlines()[-100:]:print("OFFLINE_DRIZZLE_LOG "+line[:3000],flush=True)
          result={"exit_code":code,"drizzle_kit":metadata["version"],"database_credentials":"NOT_SUPPLIED","database_migration":"NOT_RUN","original_db_generate_script":"NOT_RUN","memory_limit":536870912,"swap":0,"postgres17":"PG_PENDING","commercial_acceptance":"NOT_DELIVERED"}
          with (base/"xiongbaowork-offline-drizzle-result.json").open("x") as h:json.dump(result,h)
