          import json,os,shutil,subprocess
          from pathlib import Path
          base=Path.cwd()
          cg=Path("/sys/fs/cgroup")/Path("/proc/self/cgroup").read_text().strip()[3:].lstrip("/")
          assert (cg/"memory.max").read_text().strip()==(cg.parent/"memory.max").read_text().strip()=="536870912"
          assert (cg/"memory.swap.max").read_text().strip()=="0"
          root=base/"xiongbaowork-verified-source"/"repo"/"openbot"
          node=shutil.which("node");assert node
          packages=[root/"server/node_modules/drizzle-kit",root/"node_modules/drizzle-kit"]
          package=next(p for p in packages if (p/"package.json").is_file()).resolve()
          assert package.is_relative_to(root)
          metadata=json.loads((package/"package.json").read_text())
          binary=metadata["bin"]
          if isinstance(binary,dict):binary=binary["drizzle-kit"]
          cli=(package/binary).resolve(strict=True);assert cli.is_relative_to(root) and cli.is_file()
          home=base/"xiongbaowork-offline-drizzle-home";home.mkdir(mode=0o700)
