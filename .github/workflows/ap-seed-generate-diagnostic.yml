      - name: Inspect and export only private generated DATA within64MiB
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice --property=Type=exec --property=MemoryMax=64M --property=MemorySwapMax=0 --property=OOMPolicy=kill --uid="$(id -u)" --working-directory="$RUNNER_TEMP" /usr/bin/python3 -I -B - <<'PY'
          import base64,gzip,hashlib,json,os,stat
          from pathlib import Path
          base=Path.cwd()
          cg=Path("/sys/fs/cgroup")/Path("/proc/self/cgroup").read_text().strip()[3:].lstrip("/")
          assert (cg/"memory.max").read_text().strip()=="67108864"
          assert (cg.parent/"memory.max").read_text().strip()=="536870912"
          assert (cg/"memory.swap.max").read_text().strip()=="0"
          out=base/"xiongbaowork-private-offline-drizzle"
          before=json.loads((base/"xiongbaowork-offline-drizzle-before.json").read_text())
          after={}
          for current,dirs,names in os.walk(out,followlinks=False):
              for name in names:
                  f=Path(current)/name;s=f.lstat()
                  assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and f.resolve().is_relative_to(out)
                  b=f.read_bytes();after[f.relative_to(out).as_posix()]={"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
          removed=sorted(set(before)-set(after))
          added=sorted(set(after)-set(before))
          changed=sorted(p for p in before if p in after and before[p]!=after[p])
          result=json.loads((base/"xiongbaowork-offline-drizzle-result.json").read_text())
          print("OFFLINE_DRIZZLE_DIFF "+json.dumps({"added":added,"changed":changed,"removed":removed,"source_adopted":False,"postgres17":"PG_PENDING"}),flush=True)
          assert not removed and set(changed)<=set(["meta/_journal.json"])
          complete=result["exit_code"]==0 and "meta/0081_snapshot.json" in added and len([p for p in added if p.endswith(".sql")])==1
          if complete:
              for rel in added+changed:
                  f=out/rel;named=f.lstat()
                  with f.open("rb") as h:
                      a=os.fstat(h.fileno());b=h.read();z=os.fstat(h.fileno())
                  end=f.lstat()
                  key=lambda s:(s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns,s.st_ctime_ns,s.st_mode,s.st_nlink)
                  assert key(named)==key(a)==key(z)==key(end)
                  assert len(b)<=2000000 and b.decode("utf8").encode("utf8")==b
                  packed=gzip.compress(b,mtime=0);encoded=base64.b64encode(packed).decode("ascii")
                  assert len(encoded)<=250000
                  item={"path":rel,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"git_blob":hashlib.sha1(("blob "+str(len(b))+"\0").encode()+b).hexdigest(),"mode":oct(stat.S_IMODE(a.st_mode)),"ino":str(a.st_ino),"mtime_ns":str(a.st_mtime_ns),"ctime_ns":str(a.st_ctime_ns),"gzip_bytes":len(packed),"gzip_sha256":hashlib.sha256(packed).hexdigest(),"base64":encoded}
                  print("OFFLINE_DRIZZLE_DATA "+json.dumps(item,separators=(",",":")),flush=True)
          print("OFFLINE_DRIZZLE_FINAL "+json.dumps({"complete_metadata_candidate":complete,"source_adopted":False,"original_db_generate_script":"NOT_RUN","migration_execution":"NOT_RUN","PG":"PG_PENDING","commercial_acceptance":"NOT_DELIVERED"}),flush=True)
          if not complete:raise SystemExit(1)
          PY
