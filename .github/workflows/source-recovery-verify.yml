                  result=subprocess.run([str(binary),"test","--no-install","--timeout","5000",str(root/relative)],cwd=harness,env=env,timeout=remaining)
                  code=result.returncode
              except subprocess.TimeoutExpired:
                  code=124
              results.append({"path":relative,"exit_code":code})
              print("COMPONENT_FILE_RESULT "+json.dumps(results[-1]),flush=True)
              if code!=0:
                  overall=124 if code==124 else (overall or 1)
              if code==124:
                  break
          print("COMPONENT_TEST_RESULT "+json.dumps({"exit_code":overall,"test_files":len(paths),"completed_files":len(results),"results":results,
           "scope":"eight sequential isolated flow source, outbox, role and security foundation definition test files",
           "batch_timeout_seconds":120,"test_timeout_ms":5000,"original_repo_preload_suite":"NOT_RUN",
           "postgres17":"PG_PENDING","producer_wiring":"NOT_VERIFIED","commercial_acceptance":"NOT_DELIVERED"}),flush=True)
          raise SystemExit(overall)
          
