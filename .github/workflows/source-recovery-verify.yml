name: Recovery validation - source and components
on:
  push:
    branches:
      - codex/approval-input-bun-fix-20261028
    paths:
      - '.github/**'
      - '.gitignore'
      - 'CONTEXT.md'
      - 'README.md'
      - 'docs/**'
      - 'openbot/**'
      - 'archives/recovery-20261028/V57-MANIFEST.json'
permissions:
  contents: read
concurrency:
  group: source-recovery-bytes
  cancel-in-progress: false
jobs:
  source-bytes:
    name: Candidate approval input runtime fix - not adopted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Establish project aggregate memory slice
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B - <<'PY'
          from pathlib import Path
          unit = Path("/run/systemd/system/xiongbaowork.slice")
          with unit.open("x") as out:
              out.write("[Unit]\nDescription=Dedicated xiongbaowork validation\n[Slice]\nMemoryMax=512M\nMemorySwapMax=0\n")
          PY
          sudo systemctl daemon-reload
          sudo systemctl start xiongbaowork.slice
          sudo /usr/bin/python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          p = Path("/sys/fs/cgroup/xiongbaowork.slice")
          (p / "memory.oom.group").write_text("1")
          assert (p / "memory.max").read_text().strip() == "536870912"
          assert (p / "memory.swap.max").read_text().strip() == "0"
          assert (p / "memory.oom.group").read_text().strip() == "1"
          print("PROJECT_PARENT_RESOURCE_GATE " + json.dumps({"aggregate_memory_max": 536870912, "swap_max": 0}))
          PY
      - name: Verify all 2045 source files under 64 MiB DATA cap
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "canquedehuiyi-cpu/xiongbaowork"
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - "$GITHUB_SHA" <<'PY'
          import base64, gzip, hashlib, io, json, os, stat, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path
          
          target = sys.argv[1]
          assert len(target) == 40 and all(c in "0123456789abcdef" for c in target)
          cg_lines = Path("/proc/self/cgroup").read_text().splitlines()
          assert len(cg_lines) == 1 and cg_lines[0].startswith("0::/")
          cg = Path("/sys/fs/cgroup") / cg_lines[0][3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert (cg / "memory.oom.group").read_text().strip() == "1"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          print("RESOURCE_GATE " + json.dumps({"cgroup": cg_lines[0], "aggregate_memory_max": 67108864, "project_upper_bound": 536870912, "swap_max": 0}), flush=True)
          
          def command(args, cwd):
              return subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=8m", "-c", "core.packedGitLimit=8m", "-c", "core.packedGitWindowSize=1m", "-c", "pack.threads=1", *args[1:]], cwd=cwd, check=True, text=True, capture_output=True,
                                    env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout.strip()
          
          def metadata(s):
              return (s.st_dev, s.st_ino, s.st_size, s.st_mode, s.st_nlink, s.st_mtime_ns, s.st_ctime_ns)
          
          def verified_bytes(root, rel, expected_size, expected_sha, retain=False, expected_mode=None):
              part = Path(rel)
              assert not part.is_absolute() and ".." not in part.parts and part.parts[0] != ".git"
              assert "\\" not in rel and "\x00" not in rel
              path = root / part
              for parent in [path, *path.parents]:
                  if parent == root:
                      break
                  assert not parent.is_symlink()
              assert path.resolve(strict=True).is_relative_to(root)
              named = os.stat(path, follow_symlinks=False)
              assert stat.S_ISREG(named.st_mode) and named.st_nlink == 1 and named.st_size == expected_size, json.dumps({"path": rel, "expected_bytes": expected_size, "actual_bytes": named.st_size, "nlink": named.st_nlink, "mode": named.st_mode})
              if expected_mode is not None:
                  assert stat.S_IMODE(named.st_mode) == (int(expected_mode.removeprefix("0o"), 8) & 0o7777), json.dumps({"path": rel, "expected_mode": expected_mode, "actual_mode": oct(stat.S_IMODE(named.st_mode))})
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  assert metadata(before) == metadata(named)
                  digest = hashlib.sha256()
                  data = bytearray() if retain else None
                  count = 0
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk:
                          break
                      count += len(chunk)
                      assert count <= expected_size
                      digest.update(chunk)
                      if retain:
                          data.extend(chunk)
                  assert count == expected_size and digest.hexdigest() == expected_sha, json.dumps({"path": rel, "expected_sha256": expected_sha, "actual_sha256": digest.hexdigest(), "expected_bytes": expected_size, "actual_bytes": count})
                  assert metadata(os.fstat(fd)) == metadata(before) == metadata(os.stat(path, follow_symlinks=False))
                  return bytes(data) if retain else count
              finally:
                  os.close(fd)
          
          work = Path.cwd() / "xiongbaowork-verified-source"
          work.mkdir(mode=0o700)
          root = Path(work) / "repo"
          command(["git", "init", "--quiet", str(root)], Path(work))
          command(["git", "remote", "add", "origin", "https://github.com/canquedehuiyi-cpu/xiongbaowork.git"], root)
          command(["git", "config", "remote.origin.promisor", "true"], root)
          command(["git", "config", "remote.origin.partialclonefilter", "blob:none"], root)
          command(["git", "fetch", "--quiet", "--no-tags", "--filter=blob:none", "--depth=1", "origin", target], root)
          control_path = "archives/recovery-20261028/V57-MANIFEST.json"
          shown = subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=8m", "-c", "pack.threads=1",
                                  "show", target + ":" + control_path], cwd=root,
                                 check=True, capture_output=True, env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout
          assert len(shown) == 419227
          assert hashlib.sha256(shown).hexdigest() == "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920"
          manifest = json.loads(shown)
          overlay_raw = subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=8m", "-c", "pack.threads=1",
                                        "show", target + ":archives/recovery-20261028/AP-INPUT-BUN-CANDIDATE.json"],
                                       cwd=root, check=True, capture_output=True,
                                       env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout
          assert len(overlay_raw) == 2060 and hashlib.sha256(overlay_raw).hexdigest() == "ff799100294e46b3988a1605e60e1cd31a07b05c64fe0713659455183e910395"
          overlay = json.loads(overlay_raw)
          assert overlay["base_manifest_sha256"] == "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920"
          assert overlay["formal_adoption"] is False and len(overlay["changes"]) == 3
          assert {c["path"] for c in overlay["changes"]} == set(["openbot/server/src/approvals/exact-http-owned-input.ts","openbot/server/tests/approval-exact-input-json-materializer.test.ts","openbot/server/tests/approval-exact-http-owned-input.test.ts"])
          records = {f["path"]: f for f in manifest["files"]}
          for change in overlay["changes"]:
              original = records[change["path"]]
              assert original["bytes"] == change["before"]["bytes"] and original["sha256"] == change["before"]["sha256"]
              original["bytes"] = change["after"]["bytes"]
              original["sha256"] = change["after"]["sha256"]
          command(["git", "sparse-checkout", "init", "--no-cone"], root)
          def sparse_literal(path):
              return "/" + "".join(("\\" + c) if c in "\\*?[]!#" else c for c in path)
          patterns = "\n".join(sparse_literal(f["path"]) for f in manifest["files"]) + "\n/" + control_path + "\n"
          subprocess.run(["git", "sparse-checkout", "set", "--no-cone", "--stdin"], input=patterns,
                         cwd=root, check=True, text=True, capture_output=True)
          command(["git", "checkout", "--quiet", "--detach", target], root)
          assert command(["git", "rev-parse", "HEAD"], root) == target
          manifest_raw = verified_bytes(root, control_path, 419227,
              "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920", True)
          assert manifest_raw == shown
          assert manifest["file_count"] == len(manifest["files"]) == 2045
          assert len({f["path"] for f in manifest["files"]}) == 2045
          total = 0
          for item in manifest["files"]:
              total += verified_bytes(root, item["path"], item["bytes"], item["sha256"],
                                      expected_mode=item["mode"])
          assert total == 48438057
          tracked = set(command(["git", "ls-files", "-z"], root).split("\x00"))
          assert all(f["path"] in tracked for f in manifest["files"])
          assert not command(["git", "status", "--porcelain"], root)
          result = {"status": "CANDIDATE_SOURCE_BYTES_VERIFIED_NOT_ADOPTED", "head": target,
                    "git_tree": command(["git", "rev-parse", "HEAD^{tree}"], root),
                    "formal_baseline": "V57 + AP-INPUT-BUN-20261028 candidate", "overlay_sha256": "ff799100294e46b3988a1605e60e1cd31a07b05c64fe0713659455183e910395", "verified_source_files": 2045, "verified_source_bytes": total,
                    "manifest_sha256": "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920",
                    "source_mismatches": 0, "file_modes_verified": True, "fd_named_stability_verified": True,
                    "aggregate_memory_limit": 67108864, "project_upper_bound": 536870912, "swap_limit": 0,
                    "project_tests": "NOT_RUN", "postgres17": "PG_PENDING",
                    "commercial_acceptance": "NOT_DELIVERED", "windows_source_files_written": 0}
          print("SOURCE_RECOVERY_RESULT " + json.dumps(result, sort_keys=True), flush=True)
          
          PY
      - name: Install pinned official runtime and copy exact input component files
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, stat, sys, urllib.request, zipfile
          from pathlib import Path
          
          base = Path.cwd()
          cg = Path("/sys/fs/cgroup") / Path("/proc/self/cgroup").read_text().strip()[3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          tools = base / "xiongbaowork-bun-1.3.14"
          tools.mkdir(mode=0o700)
          archive = tools / "vendor.zip"
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen("https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip", timeout=60) as incoming, archive.open("xb") as out:
              while True:
                  block = incoming.read(65536)
                  if not block:
                      break
                  size += len(block)
                  assert size <= 35969274
                  digest.update(block)
                  out.write(block)
                  if size % 262144 < len(block):
                      out.flush()
                      os.fsync(out.fileno())
              out.flush()
              os.fsync(out.fileno())
          assert size == 35969274 and digest.hexdigest() == "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
          binary = tools / "bun"
          binary_hash = hashlib.sha256()
          binary_bytes = 0
          with zipfile.ZipFile(archive) as bundle:
              files = [i for i in bundle.infolist() if not i.is_dir()]
              assert len(files) == 1 and files[0].filename == "bun-linux-x64/bun"
              assert not files[0].flag_bits & 1
              assert stat.S_ISREG(files[0].external_attr >> 16)
              assert files[0].file_size <= 256 * 1024 * 1024
              with bundle.open(files[0]) as incoming, binary.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      binary_bytes += len(block)
                      assert binary_bytes <= files[0].file_size
                      binary_hash.update(block)
                      out.write(block)
                      if binary_bytes % 262144 < len(block):
                          out.flush()
                          os.fsync(out.fileno())
                  out.flush()
                  os.fsync(out.fileno())
              assert binary_bytes == files[0].file_size
          os.chmod(binary, 0o700)
          
          root = base / "xiongbaowork-verified-source" / "repo"
          harness = base / "xiongbaowork-input-provenance-components"
          harness.mkdir(mode=0o700)
          identities = json.loads("[{\"path\":\"openbot/server/tests/approval-exact-input-json-materializer.test.ts\",\"bytes\":19601,\"sha256\":\"bd49e4b4ed9f4261d7a3c65beb2e023872941a4e32e41435ed38c3238797e830\"},{\"path\":\"openbot/server/tests/approval-exact-http-owned-input.test.ts\",\"bytes\":14378,\"sha256\":\"a9640de6b61967d09cd4b9ab1b69649a03762008f6d1925525e2ca192d53c6f3\"},{\"path\":\"openbot/server/src/approvals/exact-input-json.ts\",\"bytes\":6534,\"sha256\":\"24a5f4a6597cf7822df10536fcafcc01e10b41fcdb21bbcf48c281492dd02b45\"},{\"path\":\"openbot/server/src/approvals/exact-input-json-materializer.ts\",\"bytes\":11512,\"sha256\":\"1f00ea78d598d1736512133066b12072f331f31c1e900aad9c97f1c718398b19\"},{\"path\":\"openbot/server/src/approvals/exact-http-owned-input.ts\",\"bytes\":9733,\"sha256\":\"ca9c1e2826d9fa2753d22138f13314cac79e11c4a5d7ed55d91ce4c973596ff2\"}]")
          for item in identities:
              source = root / item["path"]
              assert source.is_file() and not source.is_symlink() and source.stat().st_nlink == 1
              target = harness / item["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              raw_hash = hashlib.sha256()
              length = 0
              with source.open("rb") as incoming, target.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      length += len(block)
                      raw_hash.update(block)
                      out.write(block)
              assert length == item["bytes"] and raw_hash.hexdigest() == item["sha256"]
              assert target.stat().st_nlink == 1 and target.stat().st_ino != source.stat().st_ino
          assert len(identities) == 5
          print("RUNTIME_AND_HARNESS " + json.dumps({"bun_version": "1.3.14", "vendor_archive_bytes": size,
              "vendor_archive_sha256": digest.hexdigest(), "binary_bytes": binary_bytes,
              "binary_sha256": binary_hash.hexdigest(), "exact_component_files": len(identities),
              "data_job_memory_max": 67108864, "project_parent_memory_max": 536870912, "swap_max": 0}), flush=True)
          
          PY
      - name: Run isolated input provenance component tests under project limit
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=512M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          
          base = Path.cwd()
          cg_line = Path("/proc/self/cgroup").read_text().strip()
          cg = Path("/sys/fs/cgroup") / cg_line[3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "536870912"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert (cg / "memory.oom.group").read_text().strip() == "1"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          print("PROJECT_TEST_RESOURCE_GATE " + json.dumps({"cgroup": cg_line, "aggregate_memory_max": 536870912,
                                                          "parent_memory_max": 536870912, "swap_max": 0}), flush=True)
          binary = base / "xiongbaowork-bun-1.3.14" / "bun"
          harness = base / "xiongbaowork-input-provenance-components"
          home = base / "xiongbaowork-component-home"
          home.mkdir(mode=0o700)
          env = {"PATH": str(binary.parent) + ":/usr/bin:/bin", "HOME": str(home),
                 "NODE_ENV": "test", "CI": "true", "NO_COLOR": "1"}
          version = subprocess.run([str(binary), "--version"], env=env, check=True, capture_output=True, text=True).stdout.strip()
          assert version == "1.3.14"
          revision = subprocess.run([str(binary), "--revision"], env=env, check=True, capture_output=True, text=True).stdout.strip()
          args = [str(binary), "test", "--no-install", "--timeout", "5000",
                  "server/tests/approval-exact-input-json-materializer.test.ts",
                  "server/tests/approval-exact-http-owned-input.test.ts"]
          result = subprocess.run(args, cwd=harness / "openbot", env=env, capture_output=True, text=True, timeout=120)
          print(result.stdout, end="", flush=True)
          print(result.stderr, end="", flush=True)
          print("COMPONENT_TEST_RESULT " + json.dumps({"exit_code": result.returncode, "bun_version": version,
              "bun_revision": revision, "test_files": 2, "scope": "isolated exact-byte HTTP input and JSON materializer components",
              "native_pg17_executable_present": Path("/usr/lib/postgresql/17/bin/postgres").is_file(),
              "original_repo_preload_suite": "NOT_RUN", "postgres17": "PG_PENDING",
              "producer_wiring": "NOT_VERIFIED", "commercial_acceptance": "NOT_DELIVERED"}), flush=True)
          raise SystemExit(result.returncode)
          
          PY
