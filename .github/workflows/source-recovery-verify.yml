          tracked = set(command(["git", "ls-files", "-z"], root).split("\x00"))
          assert all(f["path"] in tracked for f in manifest["files"])
          assert not command(["git", "status", "--porcelain"], root)
          result = {"status": "SOURCE_BYTES_VERIFIED_EXPLICIT_OVERLAYS", "head": target,
                    "git_tree": command(["git", "rev-parse", "HEAD^{tree}"], root),
                    "formal_baseline": "V57 with explicit source overlays", "overlay_tickets": [x["ticket"] for x in overlay_specs], "verified_source_files": 2060, "verified_source_bytes": total,
                    "manifest_sha256": "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920",
                    "source_mismatches": 0, "file_modes_verified": True, "fd_named_stability_verified": True,
                    "aggregate_memory_limit": 67108864, "project_upper_bound": 536870912, "swap_limit": 0,
                    "project_tests": "NOT_RUN", "postgres17": "PG_PENDING",
                    "commercial_acceptance": "NOT_DELIVERED", "windows_source_files_written": 0}
          print("SOURCE_RECOVERY_RESULT " + json.dumps(result, sort_keys=True), flush=True)
          
