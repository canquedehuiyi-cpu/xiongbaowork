      - name: Install pinned official runtime and copy exact input component files
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, stat, sys, urllib.request, zipfile
          from pathlib import Path
          
          base = Path.cwd()
          cg = Path("/sys/fs/cgroup") / Path("/proc/self/cgroup").read_text().strip()[3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          tools = base / "xiongbaowork-bun-1.3.14"
          tools.mkdir(mode=0o700)
          archive = tools / "vendor.zip"
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen("https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip", timeout=60) as incoming, archive.open("xb") as out:
              while True:
                  block = incoming.read(65536)
                  if not block:
                      break
                  size += len(block)
                  assert size <= 35969274
                  digest.update(block)
                  out.write(block)
                  if size % 262144 < len(block):
                      out.flush()
                      os.fsync(out.fileno())
              out.flush()
              os.fsync(out.fileno())
          assert size == 35969274 and digest.hexdigest() == "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
          binary = tools / "bun"
          binary_hash = hashlib.sha256()
          binary_bytes = 0
          with zipfile.ZipFile(archive) as bundle:
              files = [i for i in bundle.infolist() if not i.is_dir()]
              assert len(files) == 1 and files[0].filename == "bun-linux-x64/bun"
              assert not files[0].flag_bits & 1
              assert stat.S_ISREG(files[0].external_attr >> 16)
              assert files[0].file_size <= 256 * 1024 * 1024
              with bundle.open(files[0]) as incoming, binary.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      binary_bytes += len(block)
                      assert binary_bytes <= files[0].file_size
                      binary_hash.update(block)
                      out.write(block)
                      if binary_bytes % 262144 < len(block):
                          out.flush()
                          os.fsync(out.fileno())
                  out.flush()
                  os.fsync(out.fileno())
              assert binary_bytes == files[0].file_size
          os.chmod(binary, 0o700)
          
          root = base / "xiongbaowork-verified-source" / "repo"
          harness = base / "xiongbaowork-schema-components"
          harness.mkdir(mode=0o700)
          identities = []
          for item in identities:
              source = root / item["path"]
              assert source.is_file() and not source.is_symlink() and source.stat().st_nlink == 1
              target = harness / item["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              raw_hash = hashlib.sha256()
              length = 0
              with source.open("rb") as incoming, target.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      length += len(block)
                      raw_hash.update(block)
                      out.write(block)
              assert length == item["bytes"] and raw_hash.hexdigest() == item["sha256"]
              assert target.stat().st_nlink == 1 and target.stat().st_ino != source.stat().st_ino
          assert len(identities) == 0
          print("RUNTIME_AND_HARNESS " + json.dumps({"bun_version": "1.3.14", "vendor_archive_bytes": size,
              "vendor_archive_sha256": digest.hexdigest(), "binary_bytes": binary_bytes,
              "binary_sha256": binary_hash.hexdigest(), "exact_component_files": len(identities),
              "data_job_memory_max": 67108864, "project_parent_memory_max": 536870912, "swap_max": 0}), flush=True)
          
