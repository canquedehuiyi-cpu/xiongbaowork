      - name: Install frozen workspace dependencies within the human-authorized512MiB install exception
        id: workspace_install
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=512M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - "$GITHUB_SHA" <<'PY'
          import collections, hashlib, json, os, selectors, signal, stat, subprocess, sys, time
          from pathlib import Path
          base=Path.cwd()
          target=sys.argv[1]
          assert len(target)==40 and all(c in "0123456789abcdef" for c in target)
          cg_line=Path("/proc/self/cgroup").read_text().strip()
          cg=Path("/sys/fs/cgroup")/cg_line[3:].lstrip("/")
          assert (cg/"memory.max").read_text().strip()=="536870912"
          assert (cg/"memory.swap.max").read_text().strip()=="0"
          assert (cg/"memory.oom.group").read_text().strip()=="1"
          assert cg.parent.name=="xiongbaowork.slice"
          assert (cg.parent/"memory.max").read_text().strip()=="536870912"
          assert (cg.parent/"memory.swap.max").read_text().strip()=="0"
          print("WORKSPACE_INSTALL_RESOURCE_GATE "+json.dumps({"memory_limit":536870912,"project_memory_limit":536870912,"swap":0}),flush=True)
          root=base/"xiongbaowork-verified-source"/"repo"/"openbot"
          assert root.is_dir() and root.resolve().is_relative_to(base)
          assert not (root/".env").exists() and not (root/".npmrc").exists()
          binary=base/"xiongbaowork-bun-1.3.14"/"bun"
          assert binary.is_file()
          cache=base/"xiongbaowork-workspace-install-cache"
          home=base/"xiongbaowork-workspace-install-home"
          cache.mkdir(mode=0o700); home.mkdir(mode=0o700)
          protected=["bun.lock","package.json","app/package.json","server/package.json","worker/package.json","runner/package.json"]
          def seal(path):
              s=path.lstat()
              assert stat.S_ISREG(s.st_mode) and s.st_nlink==1
              return {"bytes":s.st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()}
          before={p:seal(root/p) for p in protected}
          assert before["bun.lock"]=={"bytes":453991,"sha256":"c5b3f3c17b2159e033c7cf8911780b98d0ebeba93756e175e32064b15849e670"}
          env={"PATH":str(binary.parent)+":/usr/bin:/bin","HOME":str(home),"CI":"true","NO_COLOR":"1",
               "NPM_CONFIG_IGNORE_SCRIPTS":"true","GIT_TERMINAL_PROMPT":"0"}
          assert subprocess.run([str(binary),"--version"],env=env,capture_output=True,text=True,check=True).stdout.strip()=="1.3.14"
          args=[str(binary),"install","--frozen-lockfile","--ignore-scripts","--backend","copyfile",
                "--cache-dir",str(cache),"--network-concurrency","4","--no-progress","--verbose"]
          print("WORKSPACE_INSTALL_START "+json.dumps({"frozen_lockfile":True,"ignore_all_lifecycle_scripts":True,
                "backend":"copyfile","cache":"private job directory","network_concurrency":4,"timeout_seconds":480,
                "source_commit":target}),flush=True)
          proc=subprocess.Popen(args,cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
          selector=selectors.DefaultSelector()
          selector.register(proc.stdout,selectors.EVENT_READ)
          deadline=time.monotonic()+480
          pending=""
          tail=collections.deque(maxlen=40)
          lines=0
          timed_out=False
          def installer_line(line):
              global lines
              lines+=1
              line=line[:1600]
              tail.append(line)
              if lines<=80 or lines%250==0 or any(marker in line.lower() for marker in ["error:","failed","timed out","timeout","404","403"]):
                  print("BUN_INSTALL_PROGRESS "+line,flush=True)
          while selector.get_map():
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  timed_out=True
                  os.killpg(proc.pid,signal.SIGKILL)
                  break
              for key,event in selector.select(min(remaining,1)):
                  chunk=os.read(key.fd,65536)
                  if not chunk:
                      selector.unregister(key.fileobj)
                      continue
                  pending+=chunk.decode("utf8",errors="replace")
                  while "\n" in pending:
                      line,pending=pending.split("\n",1)
                      installer_line(line)
                  if len(pending)>8192:
                      installer_line(pending[:1600]);pending=""
              if proc.poll() is not None and not selector.get_map():
                  break
          if pending:
              installer_line(pending)
          proc.wait()
          selector.close()
          code=124 if timed_out else proc.returncode
          print("BUN_INSTALL_LOG_TAIL "+json.dumps({"lines_seen":lines,"last40":list(tail)}),flush=True)
          after={p:seal(root/p) for p in protected}
          assert after==before,"install changed frozen package/lock inputs"
          audit={"status":"NOT_REACHED","regular_files":0,"symlinks":0,"hardlink_files":0,"outside_private_paths":0}
          if code==0:
              audit["status"]="PASS"
              modules=root/"node_modules"
              assert modules.is_dir()
              for current,dirs,files in os.walk(modules,followlinks=False):
                  for name in dirs+files:
                      item=Path(current)/name
                      s=item.lstat()
                      if stat.S_ISLNK(s.st_mode):
                          audit["symlinks"]+=1
                          resolved=item.resolve(strict=True)
                          assert resolved.is_relative_to(root) or resolved.is_relative_to(cache),"external dependency link"
                      elif stat.S_ISREG(s.st_mode):
                          assert s.st_nlink==1,"hardlinked dependency rejected"
                          audit["regular_files"]+=1
              for package in ["app","server","worker","runner"]:
                  nested=root/package/"node_modules"
                  if nested.exists():
                      for current,dirs,files in os.walk(nested,followlinks=False):
                          for name in dirs+files:
                              item=Path(current)/name;s=item.lstat()
                              if stat.S_ISREG(s.st_mode):
                                  assert s.st_nlink==1,"hardlinked workspace dependency rejected"
                              elif stat.S_ISLNK(s.st_mode):
                                  resolved=item.resolve(strict=True)
                                  assert resolved.is_relative_to(root) or resolved.is_relative_to(cache),"external workspace dependency link"
          partial_inventory={}
          for label,directory in [("private_cache",cache),("root_node_modules",root/"node_modules")]:
              files=0; total=0
              if directory.exists():
                  for current,dirs,names in os.walk(directory,followlinks=False):
                      for name in names:
                          s=(Path(current)/name).lstat()
                          if stat.S_ISREG(s.st_mode):
                              files+=1;total+=s.st_size
              partial_inventory[label]={"regular_files":files,"bytes":total}
          print("WORKSPACE_INSTALL_FILESYSTEM_PROGRESS "+json.dumps(partial_inventory),flush=True)
          print("WORKSPACE_INSTALL_RESULT "+json.dumps({"exit_code":code,"frozen_inputs_unchanged":True,
                "lifecycle_scripts":"NOT_RUN","source_commit":target,"install_memory_limit":536870912,"other_data_copy_limit":67108864,"backend":"copyfile","private_cache":True,"dependency_audit":audit,
                "full_ci":"NOT_RUN","original_preload_suite":"NOT_RUN","typecheck":"NOT_RUN",
                "postgres17":"PG_PENDING","commercial_acceptance":"NOT_DELIVERED"}),flush=True)
          raise SystemExit(code)
          
