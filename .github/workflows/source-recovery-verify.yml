name: Recovery Flow source and security foundation validation
on:
  push:
    branches:
      - codex/security-fk-assertion-fix-20261028
    paths:
      - '.github/**'
      - '.gitignore'
      - 'CONTEXT.md'
      - 'README.md'
      - 'docs/**'
      - 'openbot/**'
      - 'archives/recovery-20261028/V57-MANIFEST.json'
permissions:
  contents: read
concurrency:
  group: source-recovery-bytes
  cancel-in-progress: false
jobs:
  source-bytes:
    name: Existing foundation tests - native PG pending
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Establish project aggregate memory slice
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B - <<'PY'
          from pathlib import Path
          unit = Path("/run/systemd/system/xiongbaowork.slice")
          with unit.open("x") as out:
              out.write("[Unit]\nDescription=Dedicated xiongbaowork validation\n[Slice]\nMemoryMax=512M\nMemorySwapMax=0\n")
          PY
          sudo systemctl daemon-reload
          sudo systemctl start xiongbaowork.slice
          sudo /usr/bin/python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          p = Path("/sys/fs/cgroup/xiongbaowork.slice")
          (p / "memory.oom.group").write_text("1")
          assert (p / "memory.max").read_text().strip() == "536870912"
          assert (p / "memory.swap.max").read_text().strip() == "0"
          assert (p / "memory.oom.group").read_text().strip() == "1"
          print("PROJECT_PARENT_RESOURCE_GATE " + json.dumps({"aggregate_memory_max": 536870912, "swap_max": 0}))
          PY
      - name: Verify all 2045 source files under 64 MiB DATA cap
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "canquedehuiyi-cpu/xiongbaowork"
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - "$GITHUB_SHA" <<'PY'
          import base64, gzip, hashlib, io, json, os, stat, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path
          
          target = sys.argv[1]
          assert len(target) == 40 and all(c in "0123456789abcdef" for c in target)
          cg_lines = Path("/proc/self/cgroup").read_text().splitlines()
          assert len(cg_lines) == 1 and cg_lines[0].startswith("0::/")
          cg = Path("/sys/fs/cgroup") / cg_lines[0][3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert (cg / "memory.oom.group").read_text().strip() == "1"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          print("RESOURCE_GATE " + json.dumps({"cgroup": cg_lines[0], "aggregate_memory_max": 67108864, "project_upper_bound": 536870912, "swap_max": 0}), flush=True)
          
          def command(args, cwd):
              print("SOURCE_COMMAND_START " + json.dumps({"operation": args[1], "argument_count": len(args)}), flush=True)
              completed = subprocess.run(["timeout", "--signal=TERM", "--kill-after=2s", "45s",
                  "git", "-c", "gc.auto=0", "-c", "maintenance.auto=false",
                  "-c", "core.deltaBaseCacheLimit=1m", "-c", "core.packedGitLimit=8m",
                  "-c", "core.packedGitWindowSize=1m", "-c", "pack.threads=1", *args[1:]],
                  cwd=cwd, text=True, capture_output=True,
                  env={**os.environ, "GIT_TERMINAL_PROMPT": "0"})
              if completed.returncode:
                  print("SOURCE_COMMAND_FAILURE " + json.dumps({"operation": args[1], "exit_code": completed.returncode,
                      "stderr": completed.stderr[-4000:]}), flush=True)
              completed.check_returncode()
              print("SOURCE_COMMAND_END " + json.dumps({"operation": args[1]}), flush=True)
              return completed.stdout.strip()
          
          def metadata(s):
              return (s.st_dev, s.st_ino, s.st_size, s.st_mode, s.st_nlink, s.st_mtime_ns, s.st_ctime_ns)
          
          def verified_bytes(root, rel, expected_size, expected_sha, retain=False, expected_mode=None):
              part = Path(rel)
              assert not part.is_absolute() and ".." not in part.parts and part.parts[0] != ".git"
              assert "\\" not in rel and "\x00" not in rel
              path = root / part
              for parent in [path, *path.parents]:
                  if parent == root:
                      break
                  assert not parent.is_symlink()
              assert path.resolve(strict=True).is_relative_to(root)
              named = os.stat(path, follow_symlinks=False)
              assert stat.S_ISREG(named.st_mode) and named.st_nlink == 1 and named.st_size == expected_size, json.dumps({"path": rel, "expected_bytes": expected_size, "actual_bytes": named.st_size, "nlink": named.st_nlink, "mode": named.st_mode})
              if expected_mode is not None:
                  assert stat.S_IMODE(named.st_mode) == (int(expected_mode.removeprefix("0o"), 8) & 0o7777), json.dumps({"path": rel, "expected_mode": expected_mode, "actual_mode": oct(stat.S_IMODE(named.st_mode))})
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  assert metadata(before) == metadata(named)
                  digest = hashlib.sha256()
                  data = bytearray() if retain else None
                  count = 0
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk:
                          break
                      count += len(chunk)
                      assert count <= expected_size
                      digest.update(chunk)
                      if retain:
                          data.extend(chunk)
                  assert count == expected_size and digest.hexdigest() == expected_sha, json.dumps({"path": rel, "expected_sha256": expected_sha, "actual_sha256": digest.hexdigest(), "expected_bytes": expected_size, "actual_bytes": count})
                  assert metadata(os.fstat(fd)) == metadata(before) == metadata(os.stat(path, follow_symlinks=False))
                  return bytes(data) if retain else count
              finally:
                  os.close(fd)
          
          work = Path.cwd() / "xiongbaowork-verified-source"
          work.mkdir(mode=0o700)
          root = Path(work) / "repo"
          command(["git", "init", "--quiet", str(root)], Path(work))
          command(["git", "remote", "add", "origin", "https://github.com/canquedehuiyi-cpu/xiongbaowork.git"], root)
          command(["git", "config", "remote.origin.promisor", "true"], root)
          command(["git", "config", "remote.origin.partialclonefilter", "blob:none"], root)
          command(["git", "fetch", "--quiet", "--no-tags", "--filter=blob:none", "--depth=1", "origin", target], root)
          control_path = "archives/recovery-20261028/V57-MANIFEST.json"
          shown = subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=1m", "-c", "pack.threads=1",
                                  "show", target + ":" + control_path], cwd=root,
                                 check=True, capture_output=True, env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout
          assert len(shown) == 419227
          assert hashlib.sha256(shown).hexdigest() == "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920"
          manifest = json.loads(shown)
          overlay_specs = json.loads("[{\"path\":\"archives/recovery-20261028/AP-INPUT-BUN-ADOPTED.json\",\"bytes\":2726,\"sha256\":\"e3f70c824d32664eb69ec86c8cdc8b9bb2a7ee98f51fb8bf182b5fdd85fd2184\",\"formal_adoption\":true,\"ticket\":\"AP-INPUT-BUN-20261028\",\"source_paths\":[\"openbot/server/src/approvals/exact-http-owned-input.ts\",\"openbot/server/tests/approval-exact-input-json-materializer.test.ts\",\"openbot/server/tests/approval-exact-http-owned-input.test.ts\"]},{\"path\":\"archives/recovery-20261028/AP-SCHEMA-RUNTIME-ADOPTED.json\",\"bytes\":4912,\"sha256\":\"e0e19145d1605dfb19201e5bd1e0b3f9856fba37f1e39a8ebfe3adcec176ffc9\",\"formal_adoption\":true,\"ticket\":\"AP-SCHEMA-RUNTIME-20261028\",\"source_paths\":[\"openbot/server/src/db/schema/approvals.ts\",\"openbot/server/src/db/schema/approval-exact-input-objects.ts\",\"openbot/server/tests/recovery-ap2-parent-schema-reconcile.test.ts\",\"openbot/server/tests/recovery-approval-exact-input-objects.test.ts\",\"openbot/server/tests/recovery-approval-direct-execution-domains.test.ts\"]},{\"path\":\"archives/recovery-20261028/KNOWLEDGE-RESOURCE-RUNTIME-ADOPTED.json\",\"bytes\":4954,\"sha256\":\"947602e681a0ea87306aec11ef296cc961dd9ed75c323bad843a79de0f32f655\",\"formal_adoption\":true,\"ticket\":\"KNOWLEDGE-RESOURCE-RUNTIME-20261028\",\"source_paths\":[\"openbot/server/src/db/schema/knowledge-foundations.ts\",\"openbot/server/src/db/schema/knowledge-write-foundations.ts\",\"openbot/server/src/db/schema/resource-project-foundations.ts\",\"openbot/server/tests/recovery-knowledge-write-foundations.test.ts\",\"openbot/server/tests/recovery-resource-project-foundations.test.ts\"]},{\"path\":\"archives/recovery-20261028/AUTOMATION-FK-ASSERTION-ADOPTED.json\",\"bytes\":2467,\"sha256\":\"21cfd36110aed505088883686c6b793c31ec6ee08477e6c6c43bc382225125d2\",\"formal_adoption\":true,\"ticket\":\"AUTOMATION-FK-ASSERTION-20261028\",\"source_paths\":[\"openbot/server/tests/recovery-automation-run-records.test.ts\"]},{\"path\":\"archives/recovery-20261028/SECURITY-FK-ASSERTION-CANDIDATE.json\",\"bytes\":1914,\"sha256\":\"3fc869bd1d68e355196b44f89effd45d0024fcffc1fca811ca7ead9adf8bebf2\",\"formal_adoption\":false,\"ticket\":\"SECURITY-FK-ASSERTION-20261028\",\"source_paths\":[\"openbot/server/tests/recovery-security-policy-fences.test.ts\"]}]")
          records = {f["path"]: f for f in manifest["files"]}
          for specification in overlay_specs:
              overlay_raw = subprocess.run(["git", "-c", "core.deltaBaseCacheLimit=1m", "-c", "pack.threads=1",
                                            "show", target + ":" + specification["path"]],
                                           cwd=root, check=True, capture_output=True,
                                           env={**os.environ, "GIT_TERMINAL_PROMPT": "0"}).stdout
              assert len(overlay_raw) == specification["bytes"]
              assert hashlib.sha256(overlay_raw).hexdigest() == specification["sha256"]
              overlay = json.loads(overlay_raw)
              assert overlay["base_manifest_sha256"] == "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920"
              assert overlay["formal_adoption"] is specification["formal_adoption"]
              assert overlay["ticket"] == specification["ticket"]
              assert len(overlay["changes"]) == len(specification["source_paths"])
              assert {item["path"] for item in overlay["changes"]} == set(specification["source_paths"])
              for change in overlay["changes"]:
                  original = records[change["path"]]
                  assert original["bytes"] == change["before"]["bytes"] and original["sha256"] == change["before"]["sha256"]
                  assert original["mode"] == change["before"]["mode"] == change["after"]["mode"]
                  original["bytes"] = change["after"]["bytes"]
                  original["sha256"] = change["after"]["sha256"]
          command(["git", "sparse-checkout", "init", "--no-cone"], root)
          def sparse_literal(path):
              return "/" + "".join(("\\" + c) if c in "\\*?[]!#" else c for c in path)
          # Materialize only the small control first. Each following source batch is <=2MiB/32files.
          patterns = "/" + control_path + "\n"
          subprocess.run(["git", "sparse-checkout", "set", "--no-cone", "--stdin"], input=patterns,
                         cwd=root, check=True, text=True, capture_output=True)
          command(["git", "checkout", "--quiet", "--detach", target], root)
          tree_records = {}
          for row in command(["git", "ls-tree", "-r", "-z", target], root).split("\x00"):
              if not row:
                  continue
              metadata_part, path = row.split("\t", 1)
              mode, kind, oid = metadata_part.split(" ")
              assert kind == "blob" and len(oid) == 40
              tree_records[path] = oid
          synced_git_files = set()
          def flush_owned_regular(path):
              if not path.exists():
                  return
              named = os.stat(path, follow_symlinks=False)
              assert stat.S_ISREG(named.st_mode) and named.st_nlink == 1
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  assert metadata(os.fstat(fd)) == metadata(named)
                  os.fsync(fd)
              finally:
                  os.close(fd)
          def flush_git_transport():
              index = root / ".git" / "index"
              if index.exists():
                  flush_owned_regular(index)
              packs = root / ".git" / "objects" / "pack"
              for item in packs.iterdir():
                  if item.name.endswith((".pack", ".idx", ".rev")) and str(item) not in synced_git_files:
                      flush_owned_regular(item)
                      synced_git_files.add(str(item))
          flush_owned_regular(root / control_path)
          flush_git_transport()
          batch = []
          batch_bytes = 0
          batch_count = 0
          def materialize_batch(paths):
              oids = sorted({tree_records[path] for path in paths})
              command(["git", "fetch", "--quiet", "--no-tags", "--no-write-fetch-head",
                       "--no-auto-maintenance", "--filter=blob:none", "origin", *oids], root)
              flush_git_transport()
              command(["git", "checkout", "--quiet", "--ignore-skip-worktree-bits", target, "--", *paths], root)
              print("SOURCE_BATCH_COMPLETE " + json.dumps({"files": len(paths)}), flush=True)
              for path in paths:
                  flush_owned_regular(root / path)
              flush_git_transport()
          for item in manifest["files"]:
              part = Path(item["path"])
              assert not part.is_absolute() and ".." not in part.parts and part.parts[0] != ".git"
              assert "\\" not in item["path"] and "\x00" not in item["path"]
              if batch and (len(batch) == 32 or batch_bytes + item["bytes"] > 2097152):
                  materialize_batch(batch)
                  batch_count += 1
                  batch = []
                  batch_bytes = 0
              assert item["bytes"] <= 2097152
              batch.append(item["path"])
              batch_bytes += item["bytes"]
          if batch:
              materialize_batch(batch)
              batch_count += 1
          print("SOURCE_BATCH_MATERIALIZATION " + json.dumps({"batches": batch_count, "max_files": 32,
              "max_source_bytes": 2097152, "fsync_after_each_batch": True, "memory_limit": 67108864}), flush=True)
          assert command(["git", "rev-parse", "HEAD"], root) == target
          manifest_raw = verified_bytes(root, control_path, 419227,
              "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920", True)
          assert manifest_raw == shown
          assert manifest["file_count"] == len(manifest["files"]) == 2045
          assert len({f["path"] for f in manifest["files"]}) == 2045
          total = 0
          for item in manifest["files"]:
              total += verified_bytes(root, item["path"], item["bytes"], item["sha256"],
                                      expected_mode=item["mode"])
          assert total == 48463600
          tracked = set(command(["git", "ls-files", "-z"], root).split("\x00"))
          assert all(f["path"] in tracked for f in manifest["files"])
          assert not command(["git", "status", "--porcelain"], root)
          result = {"status": "CANDIDATE_SECURITY_FK_SOURCE_BYTES_VERIFIED_NOT_ADOPTED", "head": target,
                    "git_tree": command(["git", "rev-parse", "HEAD^{tree}"], root),
                    "formal_baseline": "V57 with explicit source overlays", "overlay_tickets": [x["ticket"] for x in overlay_specs], "verified_source_files": 2045, "verified_source_bytes": total,
                    "manifest_sha256": "81de447073617989a55883fbc9d07d02ac0f6de2f806c98f5702dd5bcdf7a920",
                    "source_mismatches": 0, "file_modes_verified": True, "fd_named_stability_verified": True,
                    "aggregate_memory_limit": 67108864, "project_upper_bound": 536870912, "swap_limit": 0,
                    "project_tests": "NOT_RUN", "postgres17": "PG_PENDING",
                    "commercial_acceptance": "NOT_DELIVERED", "windows_source_files_written": 0}
          print("SOURCE_RECOVERY_RESULT " + json.dumps(result, sort_keys=True), flush=True)
          
          PY
      - name: Install pinned official runtime and copy exact input component files
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, stat, sys, urllib.request, zipfile
          from pathlib import Path
          
          base = Path.cwd()
          cg = Path("/sys/fs/cgroup") / Path("/proc/self/cgroup").read_text().strip()[3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          tools = base / "xiongbaowork-bun-1.3.14"
          tools.mkdir(mode=0o700)
          archive = tools / "vendor.zip"
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen("https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip", timeout=60) as incoming, archive.open("xb") as out:
              while True:
                  block = incoming.read(65536)
                  if not block:
                      break
                  size += len(block)
                  assert size <= 35969274
                  digest.update(block)
                  out.write(block)
                  if size % 262144 < len(block):
                      out.flush()
                      os.fsync(out.fileno())
              out.flush()
              os.fsync(out.fileno())
          assert size == 35969274 and digest.hexdigest() == "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
          binary = tools / "bun"
          binary_hash = hashlib.sha256()
          binary_bytes = 0
          with zipfile.ZipFile(archive) as bundle:
              files = [i for i in bundle.infolist() if not i.is_dir()]
              assert len(files) == 1 and files[0].filename == "bun-linux-x64/bun"
              assert not files[0].flag_bits & 1
              assert stat.S_ISREG(files[0].external_attr >> 16)
              assert files[0].file_size <= 256 * 1024 * 1024
              with bundle.open(files[0]) as incoming, binary.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      binary_bytes += len(block)
                      assert binary_bytes <= files[0].file_size
                      binary_hash.update(block)
                      out.write(block)
                      if binary_bytes % 262144 < len(block):
                          out.flush()
                          os.fsync(out.fileno())
                  out.flush()
                  os.fsync(out.fileno())
              assert binary_bytes == files[0].file_size
          os.chmod(binary, 0o700)
          
          root = base / "xiongbaowork-verified-source" / "repo"
          harness = base / "xiongbaowork-schema-components"
          harness.mkdir(mode=0o700)
          identities = []
          for item in identities:
              source = root / item["path"]
              assert source.is_file() and not source.is_symlink() and source.stat().st_nlink == 1
              target = harness / item["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              raw_hash = hashlib.sha256()
              length = 0
              with source.open("rb") as incoming, target.open("xb") as out:
                  while True:
                      block = incoming.read(65536)
                      if not block:
                          break
                      length += len(block)
                      raw_hash.update(block)
                      out.write(block)
              assert length == item["bytes"] and raw_hash.hexdigest() == item["sha256"]
              assert target.stat().st_nlink == 1 and target.stat().st_ino != source.stat().st_ino
          assert len(identities) == 0
          print("RUNTIME_AND_HARNESS " + json.dumps({"bun_version": "1.3.14", "vendor_archive_bytes": size,
              "vendor_archive_sha256": digest.hexdigest(), "binary_bytes": binary_bytes,
              "binary_sha256": binary_hash.hexdigest(), "exact_component_files": len(identities),
              "data_job_memory_max": 67108864, "project_parent_memory_max": 536870912, "swap_max": 0}), flush=True)
          
          PY
      - name: Prepare one locked schema dependency under 64 MiB DATA cap
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import base64, gzip, hashlib, json, os, stat, tarfile, urllib.request
          from pathlib import Path
          
          base = Path.cwd()
          line = Path("/proc/self/cgroup").read_text().strip()
          cg = Path("/sys/fs/cgroup") / line[3:].lstrip("/")
          assert (cg / "memory.max").read_text().strip() == "67108864"
          assert (cg / "memory.swap.max").read_text().strip() == "0"
          assert cg.parent.name == "xiongbaowork.slice"
          assert (cg.parent / "memory.max").read_text().strip() == "536870912"
          assert (cg.parent / "memory.swap.max").read_text().strip() == "0"
          archive = base / "drizzle-orm-0.45.2.tgz"
          url = "https://registry.npmmirror.com/drizzle-orm/-/drizzle-orm-0.45.2.tgz"
          sri = "sha512-kY0BSaTNYWnoDMVoyY8uxmyHjpJW1geOmBMdSSicKo9CIIWkSxMIj2rkeSR51b8KAPB7m+qysjuHme5nKP+E5Q=="
          digest = hashlib.sha512()
          size = 0
          with urllib.request.urlopen(url, timeout=45) as response, archive.open("xb") as out:
              assert response.status == 200
              while True:
                  chunk = response.read(65536)
                  if not chunk:
                      break
                  size += len(chunk)
                  assert size <= 16777216
                  digest.update(chunk)
                  out.write(chunk)
                  if size % 262144 == 0:
                      out.flush()
                      os.fsync(out.fileno())
              out.flush()
              os.fsync(out.fileno())
          assert "sha512-" + base64.b64encode(digest.digest()).decode("ascii") == sri
          root = base / "xiongbaowork-verified-source" / "repo"
          modules = root / "openbot" / "node_modules"
          modules.mkdir(mode=0o700)
          package = modules / "drizzle-orm"
          package.mkdir(mode=0o700)
          seen = set()
          total = 0
          count = 0
          with archive.open("rb") as packed, gzip.GzipFile(fileobj=packed, mode="rb") as uncompressed:
              with tarfile.open(fileobj=uncompressed, mode="r|") as tar:
                  for member in tar:
                      name = member.name
                      parts = name.split("/")
                      assert parts[0] == "package" and not name.startswith("/") and "\\" not in name and "\x00" not in name
                      assert all(p not in (".", "..", ".git") for p in parts)
                      assert member.isfile() or member.isdir()
                      assert name not in seen
                      seen.add(name)
                      relative = Path(*parts[1:])
                      target = package / relative
                      assert target.resolve().is_relative_to(package)
                      if member.isdir():
                          target.mkdir(mode=0o700, parents=True, exist_ok=True)
                          continue
                      count += 1
                      total += member.size
                      assert count <= 6000 and member.size <= 8388608 and total <= 67108864
                      target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                      written = 0
                      incoming = tar.extractfile(member)
                      assert incoming is not None
                      with incoming, target.open("xb") as out:
                          while True:
                              block = incoming.read(65536)
                              if not block:
                                  break
                              written += len(block)
                              assert written <= member.size
                              out.write(block)
                              if written % 262144 == 0:
                                  out.flush()
                                  os.fsync(out.fileno())
                          out.flush()
                          os.fsync(out.fileno())
                      assert written == member.size
                      st = target.stat(follow_symlinks=False)
                      assert stat.S_ISREG(st.st_mode) and st.st_nlink == 1
              trailing = 0
              while True:
                  block = uncompressed.read(65536)
                  if not block:
                      break
                  trailing += len(block)
                  assert trailing <= 1048576 and not any(block)
          info = json.loads((package / "package.json").read_bytes())
          assert info["name"] == "drizzle-orm" and info["version"] == "0.45.2"
          assert not info.get("dependencies")
          assert not any(k in info.get("scripts", {}) for k in ("preinstall", "install", "postinstall"))
          print("LOCKED_COMPONENT_DEPENDENCY " + json.dumps({"name": info["name"], "version": info["version"],
              "archive_bytes": size, "integrity": sri, "files": count, "unpacked_bytes": total,
              "lifecycle_scripts_executed": 0, "hardlinks": 0, "full_workspace_install": "NOT_RUN",
              "data_copy_memory_limit": 67108864, "project_parent_memory_limit": 536870912,
              "swap_limit": 0}), flush=True)
          PY
      - name: Validate eight existing Flow source and security definition test files
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --slice=xiongbaowork.slice \
            --property=Type=exec --property=MemoryMax=512M \
            --property=MemorySwapMax=0 --property=OOMPolicy=kill \
            --uid="$(id -u)" --working-directory="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          base=Path.cwd()
          cg_line=Path("/proc/self/cgroup").read_text().strip()
          cg=Path("/sys/fs/cgroup")/cg_line[3:].lstrip("/")
          assert (cg/"memory.max").read_text().strip()=="536870912"
          assert (cg/"memory.swap.max").read_text().strip()=="0"
          assert (cg/"memory.oom.group").read_text().strip()=="1"
          assert cg.parent.name=="xiongbaowork.slice"
          assert (cg.parent/"memory.max").read_text().strip()=="536870912"
          assert (cg.parent/"memory.swap.max").read_text().strip()=="0"
          print("PROJECT_TEST_RESOURCE_GATE "+json.dumps({"cgroup":cg_line,"memory_limit":536870912,"swap":0}),flush=True)
          binary=base/"xiongbaowork-bun-1.3.14"/"bun"
          root=base/"xiongbaowork-verified-source"/"repo"/"openbot"
          harness=base/"xiongbaowork-schema-components"
          home=base/"xiongbaowork-foundation-group2-home"
          home.mkdir(mode=0o700)
          env={"PATH":str(binary.parent)+":/usr/bin:/bin","HOME":str(home),"NODE_ENV":"test","CI":"true","NO_COLOR":"1"}
          version=subprocess.run([str(binary),"--version"],env=env,check=True,capture_output=True,text=True).stdout.strip()
          assert version=="1.3.14"
          paths=json.loads("[\"server/tests/recovery-flow-source-foundations.test.ts\",\"server/tests/recovery-flow-source-original-records.test.ts\",\"server/tests/recovery-flow-source-run-records.test.ts\",\"server/tests/recovery-flow-source-runtime-records.test.ts\",\"server/tests/recovery-group-pipeline-start-receipts.test.ts\",\"server/tests/recovery-outbox-knowledge-heads.test.ts\",\"server/tests/recovery-role-foundations.test.ts\",\"server/tests/recovery-security-policy-fences.test.ts\"]")
          deadline=time.monotonic()+120
          results=[]
          overall=0
          for relative in paths:
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  overall=124
                  break
              print("COMPONENT_FILE_START "+json.dumps({"path":relative}),flush=True)
