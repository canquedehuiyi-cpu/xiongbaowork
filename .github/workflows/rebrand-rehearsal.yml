# The v0.2.16 rename upgrade rehearsed before the release: the published v0.2.15 image builds a
# database with the data v0.2.15 writes, then this tree's image takes it over by the upgrade sheet's
# own commands (docs/acceptance/HUMAN-STEPS.md section 21, run verbatim by
# xiongbao/scripts/ci/rebrand-rehearsal.sh): a failed attempt and rollback A, the upgrade, a second
# start, and rollback B (the backup restored onto v0.2.15). See that script for what it asserts.
#
# Runs on pull requests that touch what the upgrade runs, and by hand (Actions → this workflow → Run
# workflow) with the release to upgrade from. The v0.2.15 image is pulled from GHCR by the digest its
# release recorded, without logging in: the package is public (HUMAN-STEPS step 9).
#
# legacy-compat：introducedIn 0.2.16，removeIn 0.2.17，goes with the rename migration it rehearses.
name: 熊宝改名升级演练（v0.2.15 → 本分支）

on:
  pull_request:
    paths:
      - .github/workflows/rebrand-rehearsal.yml
      - docs/acceptance/HUMAN-STEPS.md
      - xiongbao/Dockerfile
      - xiongbao/docker/s6/**
      - xiongbao/scripts/ci/rebrand-rehearsal.sh
      - xiongbao/scripts/rebrand/*.sh
      - xiongbao/server/recovery/**
      - xiongbao/server/scripts/migrate.ts
      - xiongbao/server/src/credentials.ts
      - xiongbao/server/src/credentials-rekey.ts
      - xiongbao/server/src/db/apply-migrations.ts
  workflow_dispatch:
    inputs:
      from_tag:
        description: 从哪个已发布版本升级（它的镜像建库）
        type: string
        default: v0.2.15

permissions:
  contents: read

concurrency:
  group: rebrand-rehearsal-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: xiongbao

jobs:
  rehearsal:
    name: upgrade from ${{ inputs.from_tag || 'v0.2.15' }}, roll back both ways
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FROM_TAG: ${{ inputs.from_tag || 'v0.2.15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The image of the release upgraded from (its recorded GHCR digest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$FROM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Not a release tag: '$FROM_TAG'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/from" "$RUNNER_TEMP/rehearsal"
          gh release download "$FROM_TAG" -R "$GITHUB_REPOSITORY" --pattern container-images.json --dir "$RUNNER_TEMP/from"
          # The GHCR image the release built: `ghcr` from v0.2.16 on; before that the record's former key
          # (always GHCR), while `images.xiongbao` named our registry's copy once one was configured.
          # legacy-compat：introducedIn 0.2.16，removeIn 0.2.17
          reference="$(jq -er '(.ghcr // .images.openbot // .images.xiongbao).reference' "$RUNNER_TEMP/from/container-images.json")"
          if [[ ! "$reference" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$FROM_TAG's container-images.json has no GHCR digest: '$reference'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/docker-config"
          printf '{}\n' > "$RUNNER_TEMP/docker-config/config.json"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker pull "$reference"
          printf 'from_tag=%s\nfrom_image=%s\n' "$FROM_TAG" "$reference" | tee "$RUNNER_TEMP/rehearsal/images.txt"
          echo "OLD_IMAGE=$reference" >> "$GITHUB_ENV"
      - name: Build this tree's image
        run: docker build -f Dockerfile -t xiongbao:rehearsal .
      - name: The sheet's server directory
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/xiongbao
          sudo chown "$(id -u):$(id -g)" /opt/xiongbao
      - name: Rehearse the upgrade sheet
        run: bash scripts/ci/rebrand-rehearsal.sh "$OLD_IMAGE" xiongbao:rehearsal "$RUNNER_TEMP/rehearsal"
      - name: Print container logs (credentials masked)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/rehearsal/container-*.log "$RUNNER_TEMP"/rehearsal/failed-upgrade.log; do
            [ -f "$f" ] && bash scripts/ci/print-diagnostics.sh "$f" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rebrand-rehearsal-evidence
          path: ${{ runner.temp }}/rehearsal/
          if-no-files-found: error
