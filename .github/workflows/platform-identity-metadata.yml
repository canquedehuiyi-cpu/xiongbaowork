      - name: Always independent physical resource read only witness
        if: always()
        run: |
          set -euo pipefail
          script="/run/xb-platform-${{ github.run_id }}-${{ github.run_attempt }}/controller.py"
          if test -f "$script"; then
            sudo /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B "$script" witness "/run/xb-platform-${{ github.run_id }}-${{ github.run_attempt }}"
          else
            echo 'PLATFORM_RESOURCE_ALWAYS_UNKNOWN {"status":"FAILED_OR_UNKNOWN","resource_restored":false,"metadata_is_separate":true}'
            exit 1
          fi
