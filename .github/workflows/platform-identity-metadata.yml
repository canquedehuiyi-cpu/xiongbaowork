name: Bounded platform version identity metadata only
on:
  push:
    branches:
      - codex/platform-identity-run-20261030-a1
permissions:
  contents: read
concurrency:
  group: source-recovery-bytes
  cancel-in-progress: false
jobs:
  platform-metadata:
    if: github.repository == 'canquedehuiyi-cpu/xiongbaowork' && github.ref == 'refs/heads/codex/platform-identity-run-20261030-a1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: One bounded metadata admission and sustained control lifecycle
        env:
          PLATFORM_CONTROLLER_CODE_1: ''
          PLATFORM_CONTROLLER_CODE_2: ''
          PLATFORM_CONTROLLER_CODE_3: ''
          PLATFORM_CONTROLLER_CODE_4: ''
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B - "${{ github.run_id }}" "${{ github.run_attempt }}" "$(id -u)" "$(id -g)" "${{ github.sha }}" "$PLATFORM_CONTROLLER_CODE_1" "$PLATFORM_CONTROLLER_CODE_2" "$PLATFORM_CONTROLLER_CODE_3" "$PLATFORM_CONTROLLER_CODE_4" <<'PY'
          import base64,hashlib,json,os,stat,sys,time
          from pathlib import Path
          runid,attempt,uid,gid,target=sys.argv[1:6]
          parts=sys.argv[6:]
          assert os.geteuid()==0 and runid.isdecimal() and attempt.isdecimal() and int(uid)>0 and int(gid)>0
          assert len(target)==40 and all(c in "0123456789abcdef" for c in target)
          # First actual control action follows this sole immutable clock.
          started=time.monotonic()
          root=Path("/run")/("xb-platform-"+runid+"-"+attempt)
          root.mkdir(mode=0o755)
          assert len(parts)==4 and all(0<len(part)<=16000 for part in parts)
          assert sum(map(len,parts))==60364
          code=base64.b64decode("".join(parts).encode("ascii"),validate=True)
          assert hashlib.sha256(code).hexdigest()=="f6b252fa6c33c69ee750317da4cac0c8646fd5e150ada08b154277c142c7b75b"
          fd=os.open(root/"controller.py",os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o444)
          with os.fdopen(fd,"wb") as out:out.write(code)
          cfg={"admin":str(root),"stem":root.name,"runid":runid,"attempt":attempt,"uid":int(uid),"gid":int(gid),
               "target":target,"epoch":root.name+":"+str(started),"started":started,"inner":started+270,"outer":started+300}
          raw=(json.dumps(cfg,sort_keys=True)+"\n").encode()
          fd=os.open(root/"config.json",os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,"wb") as out:out.write(raw)
          assert time.monotonic()<cfg["outer"]
          os.execve("/usr/bin/python3",["/usr/bin/python3","-I","-B",str(root/"controller.py"),"bootstrap",str(root)],
                    {"PATH":"/usr/bin:/bin","LC_ALL":"C","PYTHONDONTWRITEBYTECODE":"1"})
          PY
      - name: Always independent physical resource read only witness
        if: always()
        run: |
          set -euo pipefail
          script="/run/xb-platform-${{ github.run_id }}-${{ github.run_attempt }}/controller.py"
          if test -f "$script"; then
            sudo /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B "$script" witness "/run/xb-platform-${{ github.run_id }}-${{ github.run_attempt }}"
          else
            echo 'PLATFORM_RESOURCE_ALWAYS_UNKNOWN {"status":"FAILED_OR_UNKNOWN","resource_restored":false,"metadata_is_separate":true}'
            exit 1
          fi
