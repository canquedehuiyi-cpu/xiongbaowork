run([node, \"--version\"], capture_output=True, check=True, text=True, timeout=10).stdout.strip()\n    major, minor = map(int, observed.lstrip(\"v\").split(\".\")[:2])\n    assert (major == 20 and minor >= 19) or (major == 22 and minor >= 12) or major >= 24\n    assert json.loads((ROOT / \"app/package.json\").read_text())[\"scripts\"][\"build\"] == \"bun --bun node_modules/vite/bin/vite.js build\"\n    bun = BASE / \"xiongbaowork-bun-1.3.14\" / \"bun\"\n    env = {\"PATH\": str(bun.parent) + \":/usr/local/bin:/usr/bin:/bin\",\n           \"HOME\": str(BASE / \"original-frontend-build-home\"), \"NODE_ENV\": \"production\",\n           \"CI\": \"true\", \"NO_COLOR\": \"1\", \"TENANT_PACKAGE_DIR\": \"../examples/qoderwake\",\n           \"MASTRA_TELEMETRY_DISABLED\": \"true\", \"DO_NOT_TRACK\": \"1\"}\n    command = [node, \"--max-old-space-size=3072\", \"node_modules/vite/bin/vite.js\", \"build\"]\n    print(\"ROUTE_REPRO_BUILD_START \" + json.dumps({\"phase\": phase, \"command\": command,\n          \"runtime\": observed, \"shared_inner_remaining_seconds\": remaining, \"aggregate_limit\": 4294967296,\n          \"swap\": 0, \"source_adopted\": False}), flush=True)\n    process = subprocess.Popen(command, cwd=ROOT / \"app\", env=env, stdout=subprocess.PIPE,\n                               stderr=subprocess.STDOUT, start_new_session=True)\n    selector = selectors.DefaultSelector()\n    selector.register(process.stdout, selectors.EVENT_READ)\n    pending = b\"\"\n    lines = 0\n    tail = []\n    timed_out = False\n    logfd = os.open(CONTROL / (\"build-\" + phase + \".log\"), os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n    with os.fdopen(logfd, \"wb\") as log:\n        while selector.get_map():\n            remaining = value[\"inner_deadline\"] - time.monotonic()\n            if remaining <= 0:\n                timed_out = True\n                break\n            events = selector.select(min(1.0, remaining))\n            for key, _ in events:\n                block = os.read(key.fileobj.fileno(), 65536)\n                if not block:\n                    selector.unregister(key.fileobj)\n                    continue\n                log.write(block)\n                pending += block\n            while b\"\\n\" in pending:\n                rawline, pending = pending.split(b\"\\n\", 1)\n                text = rawline.decode(\"utf-8\", \"replace\")[:2000]\n                lines += 1\n                tail = (tail + [text])[-30:]\n                if lines <= 60 or any(word in text.lower() for word in [\"warning\", \"error\", \"failed\", \"built in\"]):\n                    print(\"ROUTE_REPRO_BUILD_\" + phase.upper() + \" \" + text, flush=True)\n            if len(pending) > 1048576:\n                raise RuntimeError(\"bounded build log line exceeded\")\n    selector.close()\n    if timed_out:\n        os.killpg(process.pid, signal.SIGTERM)\n        try:\n            process.wait(timeout=5)\n        except subprocess.TimeoutExpired:\n            os.killpg(process.pid, signal.SIGKILL)\n            process.wait(timeout=5)\n    code = process.wait(timeout=max(1, min(5, value[\"outer_deadline\"] - time.monotonic())))\n    for line in tail:\n        print(\"ROUTE_REPRO_BUILD_TAIL_\" + phase.upper() + \" \" + line, flush=True)\n    result = {\"phase\": phase, \"exit_code\": code, \"timed_out\": timed_out, \"runtime\": observed,\n              \"argv\": command, \"project_and_descendants\": 4294967296, \"swap\": 0,\n              \"shared_inner_limit_seconds\": 270, \"shared_outer_limit_seconds\": 300,\n              \"elapsed_from_a_start\": time.monotonic() - value[\"started\"],\n              \"postgres17\": \"PG_PENDING\", \"commercial_acceptance\": \"NOT_DELIVERED\"}\n    save_json(\"build-\" + phase + \".json\", result)\n    print(\"ROUTE_REPRO_BUILD_RESULT \" + json.dumps(result), flush=True)\n    if timed_out:\n        raise SystemExit(124)\n    raise SystemExit(0 if code == 0 else 1)\n\ndef snapshot(phase):\n   