,\n                             ROOT / \"node_modules/@tanstack/router-generator/package.json\"]\n    versions = [plugin, package_version(\"@tanstack/router-generator\", generator_candidates, \"1.167.33\"),\n                package_version(\"vite\", [ROOT / \"app/node_modules/vite/package.json\",\n                                        ROOT / \"node_modules/vite/package.json\"], \"7.3.6\")]\n    state = {\"target\": target, \"source_content_commit\": \"668dd2238ff112bcff38ad2d0456dccd116874ed\",\n             \"administrative_base\": \"5c7ef397598edec073cc491972376f75d326a8bb\",\n             \"source_files\": 2065, \"source_bytes\": 50175181, \"before\": before, \"versions\": versions,\n             \"expected_manifest_sha256\": MANIFEST_SHA, \"control_helper_sha256\": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(), \"run_id\": os.environ[\"GITHUB_RUN_ID\"],\n             \"run_attempt\": os.environ[\"GITHUB_RUN_ATTEMPT\"], \"source_adopted\": False}\n    save_json(\"state.json\", state)\n    print(\"ROUTE_REPRO_INPUT_GATE \" + json.dumps(state), flush=True)\n\ndef brand():\n    gate(67108864)\n    value = stable(ROOT / \"app/src/lib/generated/application-config.ts\")\n    save_json(\"brand.json\", value)\n    print(\"ROUTE_REPRO_BRAND_INPUT \" + json.dumps(value), flush=True)\n\ndef budget(phase):\n    assert phase in (\"a\", \"b\")\n    gate(67108864)\n    now = time.monotonic()\n    if phase == \"a\":\n        save_json(\"budget.json\", {\"started\": now, \"inner_deadline\": now + 270, \"outer_deadline\": now + 300})\n    value = load_json(\"budget.json\")\n    before = stable(REPO / LEAF, cap=RAW_LIMIT)\n    assert {k: before[k] for k in BEFORE} == BEFORE\n    if phase == \"b\":\n        assert load_json(\"reset-before-b.json\")[\"status\"] == \"ONLY_LEAF_BYTES_RESET_TO_VERIFIED_BEFORE\"\n    save_json(\"before-build-\" + phase + \".json\", before)\n    now = time.monotonic()\n    if now >= value[\"inner_deadline\"] or now >= value[\"outer_deadline\"]:\n        print(\"ROUTE_REPRO_SHARED_BUDGET_INCOMPLETE\", file=sys.stderr, flush=True)\n        raise SystemExit(124)\n    print(max(1, min(300, math.floor(value[\"outer_deadline\"] - now))), flush=True)\n\ndef launch(phase, uid):\n    # DATA-only privileged controller; Node remains in a separate owned4GiB unit.\n    assert phase in (\"a\", \"b\") and uid.isdecimal() and int(uid) > 0\n    assert os.geteuid() == 0\n    gate(67108864)\n    value = load_json(\"budget.json\")\n    state = load_json(\"state.json\")\n    assert state[\"run_id\"].isdecimal() and state[\"run_attempt\"].isdecimal()\n    parent = Path(\"/sys/fs/cgroup/xiongbaowork.slice\")\n    own = Path(\"/sys/fs/cgroup\") / Path(\"/proc/self/cgroup\").read_text().strip()[3:].lstrip(\"/\")\n    unit = \"route-tree-build-\" + phase + \"-\" + state[\"run_id\"] + \"-\" + state[\"run_attempt\"] + \".service\"\n    unit_cgroup = parent / unit\n    # Five seconds belongs to hard-stop/512MiB restoration, never to Node runtime.\n    hard_stop_at = value[\"outer_deadline\"] - 5.0\n    assert time.monotonic() < min(value[\"inner_deadline\"], hard_stop_at)\n    for procs in parent.rglob(\"cgroup.procs\"):\n        observed = procs.read_text().split()\n        assert (procs.parent == own and observed == [str(os.getpid())]) or not observed\n    process = None\n    expired = False\n    code = 1\n    def hard_kill_owned_unit():\n        # cgroup.kill kills the complete descendant tree, including new process groups.\n        kill_file = unit_cgroup / \"cgroup.kill\"\n        if kill_file.exists():\n            kill_file.write_text(\"1\")\n    def direct_restore():\n        # Restore the actual aggregate cap before any possibly slow D-Bus cleanup.\n        (parent / \"memory.max\").write_text(\"536870912\")\n        (parent / \"memory.swap.max\").write_text(\"0\")\n        assert (parent / \"memory.max\").read_text().strip() == \"536870912\"\n        assert (parent / \"memory.swap.max\").read_text().strip() == \"0\"\n        print(\"ROUTE_REPRO_ABSOLUTE_RESTORE \" + json.dumps({\n            \"phase\": phase, \"restored_at\": time.monotonic(),\n            \"absolute_outer_deadline\": value[\"outer_deadline\"],\n            \"within_absolute_outer_deadline\": time.monotonic() < value[\"outer_deadline\"],\n            \"parent_memory_max\": 536870912, \"swap\": 0}), flush=True)\n    try:\n        # Raising this existing aggregate cap is the already-authorized build exception.\n        subprocess.run([\"systemctl\", \"set-property\", \"--runtime\", \"xiongbaowork.slice\",\n                        \"MemoryMax=4G\", \"MemorySwapMax=0\"], check=True, timeout=2)\n        assert (parent / \"memory.max\").read_text().strip() == \"4294967296\"\n        assert (parent / \"memory.swap.max\").read_text().strip() == \"0\"\n        # Recompute after raising the cap; activation/waiting is also timed absolutely below.\n        remaining = min(value[\"inner_deadline\"], hard_stop_at) - time.monotonic()\n        runtime_seconds = math.floor(remaining - 1.0)\n        if runtime_seconds < 1:\n            expired = True\n        else:\n            command = [\"systemd-run\", \"--wait\", \"--pipe\", \"--unit=\" + unit,\n                \"--slice=xiongbaowork.slice\", \"--property=Type=exec\",\n                \"--property=MemoryMax=4G\", \"--property=MemorySwapMax=0\",\n                \"--property=OOMPolicy=kill\", \"--property=KillMode=control-group\",\n                \"--property=KillSignal=SIGKILL\", \"--property=FinalKillSignal=SIGKILL\",\n                \"--property=SendSIGKILL=yes\", \"--property=TimeoutStartSec=1s\",\n                \"--property=TimeoutStartFailureMode=kill\", \"--property=TimeoutStopSec=1s\",\n                \"--property=TimeoutStopFailureMode=kill\",\n                \"--property=RuntimeMaxSec=\" + str(runtime_seconds),\n                \"--uid=\" + uid, \"--working-directory=\" + str(BASE),\n                \"/usr/bin/python3\", \"-I\", \"-B\", str(CONTROL / \"guard.py\"), 